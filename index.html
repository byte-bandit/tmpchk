  row('ΔV REQUIRED', fmtDV(Math.abs(dv)) + '  ' + DIRNAME[dir], 'key');
  if (Math.abs(dv) > dvRemaining()) say('INSUFFICIENT PROPELLANT for this maneuver.', 'err');

  let secs = impulsive;
  if (solved && solved.dur != null) {
    secs = solved.dur;
    row('BURN TIME', secs.toFixed(1) + ' s at full throttle');
    if (secs > impulsive * 1.03)
      say(`Solved by integration: ${(secs - impulsive).toFixed(1)} s longer than the impulsive figure.`, 'dim');
  } else if (solved && solved.dur == null && solved.short) {
    if (Math.abs(dv) > dvRemaining()) {
      S.solution = null;
      row('BURN TIME', 'not achievable — not enough propellant', 'err');
      say(`This needs ${fmtDV(Math.abs(dv))} and you are carrying ${fmtDV(dvRemaining())}. Choose a nearer target.`, 'err');
    } else {
      S.solution = null;
      row('BURN TIME', 'not achievable from this point in the orbit', 'err');
      say(`Propellant is not the limit — you have ${fmtDV(dvRemaining())} and this needs ${fmtDV(Math.abs(dv))}. A burn reshapes the orbit on the far side, so this target cannot be reached from where you are burning. Try the opposite apsis.`, 'err');
    }
    return null;
  } else {
    row('BURN TIME', secs.toFixed(1) + ' s at full throttle');
  }
  if (secs > 90) say('Time warp limited to 10× while the engine is lit.', 'dim');

  const node = whereLabel && whereLabel.includes('periapsis') ? 'PE'
             : whereLabel && whereLabel.includes('apoapsis') ? 'AP' : null;
  S.solution = { name: S.planName || 'MANEUVER', dir, secs, node, nodeLabel: whereLabel || 'immediate',
                 dv: Math.abs(dv), detail: S.planDetail || '',
                 prop: secs != null ? secs * (curFlow()) : null };
  if (whereLabel) {
    row('IGNITION', `${whereLabel}` + (isFinite(tt) ? `, T\u2212${fmtT(tt)}` : ''));
    say('');
    const at = whereLabel.includes('periapsis') ? 'PE' : whereLabel.includes('apoapsis') ? 'AP' : null;
    if (at) say(`  \u2192  BURN ${dir} ${secs.toFixed(1)} AT ${at}`, 'ok');
    else    say(`  \u2192  BURN ${dir} ${secs.toFixed(1)}`, 'ok');
    say('Ignition occurs half a burn early; impulse is centred on the node.', 'dim');
  }
  return secs;
}

/** Fly a finite burn forward without touching live state. */
function simBurn(r0, v0, mu, mode, dur, m0) {
  let r = {...r0}, v = {...v0}, m = m0, t = 0;
  const mdot = curFlow();
  const fuel = S.craft.fuel;
  while (t < dur - 1e-9) {
    const dt = Math.min(0.5, dur - t);
    if (m0 - m >= fuel) break;                       // tanks dry
    const dirv = mode === 'PRO'  ? V.unit(v)
               : mode === 'RET'  ? V.mul(V.unit(v), -1)
               : mode === 'ROUT' ? V.unit(r) : V.mul(V.unit(r), -1);
    const aT = curThrust() / m;
    const acc = (rv) => { const rr = V.len(rv);
      return V.add(V.mul(rv, -mu/(rr*rr*rr)), V.mul(dirv, aT)); };
    const k1r = v,                          k1v = acc(r);
    const k2r = V.add(v, V.mul(k1v,dt/2)),  k2v = acc(V.add(r, V.mul(k1r,dt/2)));
    const k3r = V.add(v, V.mul(k2v,dt/2)),  k3v = acc(V.add(r, V.mul(k2r,dt/2)));
    const k4r = V.add(v, V.mul(k3v,dt)),    k4v = acc(V.add(r, V.mul(k3r,dt)));
    r = V.add(r, V.mul(V.add(V.add(k1r,V.mul(k2r,2)), V.add(V.mul(k3r,2),k4r)), dt/6));
    v = V.add(v, V.mul(V.add(V.add(k1v,V.mul(k2v,2)), V.add(V.mul(k3v,2),k4v)), dt/6));
    m -= mdot*dt; t += dt;
  }
  return { r, v, m };
}

/** Seconds from now until the named node. */
function nodeTime(node, body) {
  const b = soiBody(), e = el();
  if (node === 'AP') return tToApo(e, b.mu);
  if (node === 'PE') return tToPeri(e, b.mu);
  if (node === 'XFER') { const w = transferWindow(body); return w ? w.wait : Infinity; }
  return 0;
}

/**
 * Solve for the burn duration that actually achieves `target`, by flying the
 * burn. An impulsive ΔV quote under-delivers badly on long burns — a 350 s TLI
 * leaves apoapsis ~50,000 km short — because the vehicle climbs and its thrust
 * vector swings while the engine runs.
 */
function solveBurn(node, mode, metric, target, body) {
  const b = soiBody(), mu = b.mu;
  const mdot = curFlow();
  const maxDur = S.craft.fuel / mdot;
  const t0 = nodeTime(node, body);
  if (!isFinite(t0)) return null;
  const f = (dur) => {
    const lead = Math.max(0, t0 - dur/2);
    const st = propagate(S.r, S.v, mu, lead);
    const o  = simBurn(st.r, st.v, mu, mode, dur, craftMass());
    const oe = elements(o.r, o.v, mu);
    return metric(oe);
  };
  let lo = 0, hi = maxDur;
  const flo = f(lo), fhi = f(hi);
  if (!isFinite(flo) || !isFinite(fhi)) return null;
  const rising = fhi > flo;
  if (rising ? (target > fhi || target < flo) : (target < fhi || target > flo))
    return { dur: null, best: fhi, short: rising ? target > fhi : target < fhi };
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi)/2, fm = f(mid);
    if (rising ? fm < target : fm > target) lo = mid; else hi = mid;
  }
  return { dur: (lo + hi)/2, best: f((lo+hi)/2) };
}

/**
 * Coast a trajectory forward through sphere-of-influence changes without
 * touching live state, reporting the encounter with `tk`.
 * Step size is governed by the closing rate on the target, so the integration
 * takes huge strides in cruise and tightens automatically near arrival.
 */
function coastEncounter(r0, v0, soi0, t0, tk, maxT) {
  const tb = BODIES[tk];
  let r = {...r0}, v = {...v0}, soi = soi0, t = t0, miss = Infinity;
  for (let n = 0; n < 20000; n++) {
    if (t - t0 > maxT) break;
    const b = BODIES[soi], e = elements(r, v, b.mu);
    let dt = Math.max(5, 0.03 * e.r / Math.max(e.v, 1e-9));
    if (BODIES[tk].parent === soi || soi === tk) {
      const ts = bodyStateIn(soi, tk, t);
      const rel = V.sub(r, ts.r), relv = V.sub(v, ts.v);
      const d = V.len(rel);
      miss = Math.min(miss, d);
      if (d < tb.soi) {                       // arrived
        const ae = elements(rel, relv, tb.mu);
        return { entered:true, periAlt:ae.rp - tb.R, ecc:ae.e, t, miss:d };
      }
      const closing = -V.dot(V.unit(rel), relv);
      if (closing > 1e-9) dt = Math.min(dt, Math.max(5, (d - tb.soi) * 0.45 / closing));
    }
    const o = propagate(r, v, b.mu, dt); r = o.r; v = o.v; t += dt;
    if (V.len(r) < b.R) return { entered:false, crashed:true, t, miss };
    if (b.parent && V.len(r) > b.soi) {
      const st = bodyStateInParent(soi, t);
      r = V.add(r, st.r); v = V.add(v, st.v); soi = b.parent;
    } else {
      for (const c of (CHILDREN[soi] || [])) {
        const st = bodyStateInParent(c, t), rel = V.sub(r, st.r);
        if (V.len(rel) < BODIES[c].soi) {
          r = rel; v = V.sub(v, st.v); soi = c;
          if (c === tk) {
            const ae = elements(r, v, BODIES[c].mu);
            return { entered:true, periAlt:ae.rp - BODIES[c].R, ecc:ae.e, t, miss:V.len(rel) };
          }
        }
      }
    }
  }
  return { entered:false, t, miss };
}

/* ---- leaving a moon for the planet it orbits -----------------------------
   `PLAN XFER` transfers between two bodies that orbit the same parent, and
   says so when asked for something else: EARTH does not orbit MOON. But a ship
   in lunar orbit that wants to go home is not asking for a transfer — it is
   asking to leave one sphere of influence with its excess velocity pointing
   the right way, which is a different problem with a different answer.

   Measured, and this is the whole reason the solver exists: from a 100 km
   lunar orbit a 750 m/s prograde escape leaves a geocentric perigee of 358,830
   km if you light it at one point in the orbit and 10,477 km if you light it
   140° later. `PLAN ESC` solves the size and fires at the lunar periapsis,
   which is an arbitrary point — flown, it throws the ship onto a 344,354 ×
   1,229,412 km orbit, apogee past Earth's own sphere of influence. WHERE you
   light it is the whole manoeuvre.                                          */

/** Coast until this state leaves `soi0` for its parent. State in the PARENT
 *  frame at the crossing, or null if it comes back down or never leaves. */
function escapeToParent(r0, v0, soi0, t0, maxT) {
  const b = BODIES[soi0];
  if (!b.parent) return null;
  let r = { ...r0 }, v = { ...v0 }, t = t0;
  for (let n = 0; n < 20000; n++) {
    if (t - t0 > maxT) return null;
    const e = elements(r, v, b.mu);
    const dt = Math.max(5, 0.03 * e.r / Math.max(e.v, 1e-9));
    const o = propagate(r, v, b.mu, dt);
    r = o.r; v = o.v; t += dt;
    if (V.len(r) < b.R) return null;                     // back onto the surface
    if (V.len(r) > b.soi) {
      const st = bodyStateInParent(soi0, t);
      return { r: V.add(r, st.r), v: V.add(v, st.v), t };
    }
  }
  return null;
}

/** Solve the departure: where in this orbit to light it, and for how long, so
 *  that the parent-frame periapsis comes out at `aimAlt`. */
function teiSolve(aimAlt) {
  const b = soiBody();
  if (!b.parent) return null;
  const pb = BODIES[b.parent], goal = pb.R + aimAlt;
  const e = el();
  if (!isFinite(e.period) || e.e >= 1) return null;
  const P = e.period, m0 = craftMass(), flow = curFlow();
  const durMax = Math.min(S.craft.fuel / Math.max(flow, 1e-9), 4 * P);
  // A burn centred at `tc`, of `dur` seconds, and what it leaves behind.
  const trial = (tc, dur) => {
    if (!(dur > 0) || dur > durMax) return null;
    const lead = Math.max(0, tc - dur / 2);
    const st = propagate(S.r, S.v, b.mu, lead);
    const o = simBurn(st.r, st.v, b.mu, 'PRO', dur, m0);
    const esc = escapeToParent(o.r, o.v, S.soi, S.t + lead + dur, 40 * 86400);
    if (!esc) return null;
    const pe = elements(esc.r, esc.v, pb.mu);
    return { rp: pe.rp, ra: pe.ra, ecc: pe.e, tExit: esc.t, dur, tc };
  };
  // Size a burn that escapes at all, then a little more: the excess velocity is
  // what steers, and with none of it every burn point lands in the same place.
  const vEsc = Math.sqrt(2 * b.mu / e.r);
  const dEsc = burnTimeFor(Math.max(1, (vEsc - e.v) * 1000));
  const dScan = Math.min(durMax, dEsc * 1.25);
  // 1. where in the orbit. One lap, coarsely, then tighten around the best.
  let best = null;
  const N = 24;
  for (let i = 0; i < N; i++) {
    const tc = P * i / N;
    const r = trial(tc, dScan);
    if (!r) continue;
    if (!best || Math.abs(r.rp - goal) < Math.abs(best.rp - goal)) best = r;
  }
  if (!best) return null;
  let span = P / N;
  for (let k = 0; k < 8; k++) {
    for (const tc of [best.tc - span, best.tc + span]) {
      if (tc < 0) continue;
      const r = trial(tc, dScan);
      if (r && Math.abs(r.rp - goal) < Math.abs(best.rp - goal)) best = r;
    }
    span /= 2;
  }
  // 2. how long, at that point. Perigee falls monotonically with burn time.
  let lo = dEsc * 0.85, hi = durMax, sol = null;
  const rpOf = (d) => { const r = trial(best.tc, d); return r ? r.rp : NaN; };
  let rlo = rpOf(lo), rhi = rpOf(hi);
  if (!isFinite(rlo) || !isFinite(rhi) || (rlo - goal) * (rhi - goal) > 0) {
    // No bracket: hand back the best point found rather than nothing, so the
    // page can say how far off it is instead of pretending there is no answer.
    sol = best;
  } else {
    for (let k = 0; k < 22; k++) {
      const mid = (lo + hi) / 2, rm = rpOf(mid);
      if (!isFinite(rm)) break;
      if ((rlo - goal) * (rm - goal) <= 0) { hi = mid; rhi = rm; } else { lo = mid; rlo = rm; }
    }
    sol = trial(best.tc, (lo + hi) / 2) || best;
  }
  if (!sol) return null;
  sol.dv = sol.dur * curThrust() * 1000 / m0;
  sol.aim = goal - pb.R;
  sol.parent = b.parent;
  return sol;
}

/**
 * Solve a real encounter, not just a Hohmann. A minimum-energy transfer aimed
 * at a body's orbital radius is a collision course; this searches ignition time
 * for a trajectory that arrives with a usable periapsis.
 */
function targetEncounter(tk, goalOverride) {
  const b = soiBody(), mu = b.mu, tb = BODIES[tk];
  const w = transferWindow(tk);
  if (!w || w.wait < 0 || !isFinite(w.wait)) return null;
  const mode = w.dv1 >= 0 ? 'PRO' : 'RET';
  const e = el();
  const tof = w.tof;
  // Which end of the transfer ellipse the burn is steering.
  //
  // OUTBOUND the burn is prograde and it raises APOAPSIS to the target's
  // orbit. INBOUND it is retrograde and it lowers PERIAPSIS to it — apoapsis
  // does not move at all. Measured from a circular orbit at Mars' distance:
  // 0, 300 and 900 s of retrograde all leave apoapsis at 1.5237 AU while
  // periapsis falls 1.5237 → 1.3357 → 0.8728 AU. Asking `solveBurn` to drive
  // apoapsis to 1 AU from there is asking for a number no burn duration can
  // reach, so `f(lo) === f(hi)`, the target is outside the bracket, and it
  // returns before the search for an ignition time has begun. That — not the
  // span, not the aim point, not the scan resolution — is why a transfer home
  // used to fall back to the analytic window with a shrug about a midcourse
  // trim the game had no way to fly.
  const inbound = w.r2 < w.r1;
  const metric = inbound ? ((oe) => oe.rp) : ((oe) => isFinite(oe.ra) ? oe.ra : 1e12);
  const goal = goalOverride != null ? goalOverride : Math.max(800, tb.R * 0.50);      // ~870 km over the Moon: clears the surface with room to spare
  // One departure period sweeps every transfer orientation. Note how steep this
  // is: shifting ignition by a minute rotates the transfer's apsidal line ~4°,
  // which moves the arrival point by tens of thousands of kilometres. So scan
  // for a bracket, then bisect — stepping toward the answer never converges.
  const Pc = isFinite(e.period) ? e.period : tof/6;
  const span = Math.min(1.1 * Pc, tof / 6);

  const trial = (tI, dur) => {
    if (tI < dur/2) return null;
    const lead = tI - dur/2;
    const st = propagate(S.r, S.v, mu, lead);
    const o  = simBurn(st.r, st.v, mu, mode, dur, craftMass());
    return coastEncounter(o.r, o.v, S.soi, S.t + lead + dur, tk, tof * 2.6);
  };
  /** Closest-approach altitude over the target — continuous across the SOI edge. */
  const qOf = (res) => !res ? Infinity : (res.entered ? res.periAlt : res.miss - tb.R);

  let best = null;
  // What disqualifies an arrival is hitting the body, not being low over it.
  // The old test rejected anything under 50 km, which was written when every
  // arrival was a capture from above — and which makes most of the published
  // entry corridor (−40 to +80 km) unreachable by construction. A periapsis
  // below the surface is an impact; a periapsis above it is an aim point.
  // When two candidates both land on the aim point, the cheaper one wins.
  // Without this the aim-point ladder can return a solution that reaches the
  // target by digging far deeper into the Sun's well than it needs to:
  // measured on the return from a Mars flyby, the k = 1.30 rung arrives just as
  // well as k = 1.00 and costs 5,077 m/s against 2,834. AIM_TIE is a few
  // kilometres over a body thousands of kilometres across — inside it, two
  // arrivals are the same arrival, and only the propellant separates them.
  // It applies only to the WIDE sweep below, never to the first one. The first
  // sweep is the code every shipped mission walks, and a tie-break there moves
  // M-08's arrival from 229 × 1080 km to 233 × 1089 km — measured. Nothing
  // that already works is allowed to change to make something else better.
  const AIM_TIE = 25;
  let tieBreak = false;
  const consider = (tI, dur, res) => {
    const q = qOf(res);
    if (!isFinite(q)) return;
    const sc = (q <= 0 ? 1e6 + Math.abs(q) : Math.abs(q - goal));
    const tie = tieBreak ? AIM_TIE : 0;
    if (!best || sc < best.sc - tie || (tie > 0 && sc < best.sc + tie && dur < best.dur))
      best = { tI, dur, res, sc, q };
  };

  /** One sweep of ignition time across `sp` seconds, at `N` samples. */
  const sweep = (sp, N) => {
    for (const k of [1.0, 1.12, 1.30]) {
      // Aim a little BEYOND the target's orbit going out, a little INSIDE it
      // coming in: either way the ladder walks the arrival away from a grazing
      // tangent, where the geometry is worst conditioned.
      const sk = solveBurn('XFER', mode, metric, inbound ? w.r2/k : w.r2*k, tk);
      if (!sk || sk.dur == null) continue;
      const dur = sk.dur;
      const ts = [], qs = [];
      for (let i = 0; i <= N; i++) {
        const tI = w.wait + (i/N - 0.5) * sp;
        const res = trial(tI, dur);
        ts.push(tI); qs.push(qOf(res)); consider(tI, dur, res);
      }
      // bisect every bracket that straddles the aim point
      for (let i = 0; i < N; i++) {
        const q0 = qs[i], q1 = qs[i+1];
        if (!isFinite(q0) || !isFinite(q1)) continue;
        if ((q0 - goal) * (q1 - goal) > 0) continue;
        let lo = ts[i], hi = ts[i+1], flo = q0;
        for (let n = 0; n < 40; n++) {
          const mid = (lo + hi)/2, res = trial(mid, dur), qm = qOf(res);
          consider(mid, dur, res);
          if (!isFinite(qm)) break;
          if ((flo - goal) * (qm - goal) <= 0) hi = mid; else { lo = mid; flo = qm; }
          if (Math.abs(qm - goal) < 5) break;
        }
      }
      if (best && best.sc < 30) break;
    }
  };
  sweep(span, 140);
  // A SECOND, WIDER SWEEP, and only when the first one did not find an
  // arrival worth having.
  //
  // `span` above reads "one departure period sweeps every transfer
  // orientation" and then takes the smaller of that and a sixth of the flight
  // time, which for anything slower than a lunar transfer is the sixth. From a
  // CIRCULAR departure orbit that is enough, because the analytic window is
  // already nearly right and the answer sits beside it — which is why every
  // mission that shipped before finds its encounter inside it and is left
  // exactly as it was. From an ECCENTRIC one it is not: `transferWindow`
  // computes its phase angle from wherever the vehicle happens to be on its
  // ellipse, so the good ignition time can be months from the analytic guess.
  // Measured on the orbit a Mars flyby leaves behind (1.240 × 1.602 AU,
  // e = 0.1274, period 619 d): the shipped 36.3-day span gets no closer than
  // 371,928 km, and a sweep of the full 619-day period lands on the aim point
  // exactly, in 935 trajectory evaluations.
  if (!best || !best.res || !best.res.entered || best.sc >= 30) {
    const wide = 1.1 * Pc;
    if (wide > span * 1.5) {
      // Start the wide sweep from nothing so the tie-break can pick a cheaper
      // arrival than the narrow one settled for — but never hand back less
      // than the narrow sweep already had.
      const narrow = best;
      best = null; tieBreak = true;
      sweep(wide, 300);
      const got = (c) => c && c.res && c.res.entered;
      if (!best || (got(narrow) && !got(best)) || (got(narrow) && got(best) && best.sc > narrow.sc + AIM_TIE))
        best = narrow;
    }
  }
  if (!best || !best.res || !best.res.entered) return best ? { dur:best.dur, mode, tIgn:best.tI, arrival:best.res, dv:w.dv1, tof, window:w } : null;
  const dur = best.dur;
  return { dur, mode, tIgn:best.tI, arrival:best.res, dv:w.dv1, tof, window:w };
}

/**
 * A midcourse trim.
 *
 * `targetEncounter` asks what burn would put you on a transfer. This asks what
 * burn fixes the approach you are already flying — the same machinery pointed
 * at the trajectory you are on rather than one you might fly.
 *
 * It answers two questions with one method, because they are the same question
 * at two ranges:
 *
 *   FAR  — the target is another body under the same primary, and the thing
 *          being moved is the closest approach on the coast to it.
 *   NEAR — the target IS the primary, you are on the hyperbola in toward it,
 *          and the thing being moved is your own periapsis. `PLAN PERI` cannot
 *          do this: it burns at apoapsis, and an incoming hyperbola has none.
 *
 * NEAR is not a nicety. Measured on the flight home from Mars: the transfer
 * solver predicts a 3,204 km arrival over Earth and the flight enters Earth's
 * sphere of influence at exactly 3,204 km — the solver is not drifting at all.
 * What then happens is that the vehicle passes through the MOON's sphere of
 * influence on the way in, and comes out the far side with its periapsis at
 * −2,205 km: an impact. `coastEncounter` stops at the target's SOI edge and
 * knows nothing about the target's own moons, so no transfer solver can see
 * that coming. The trim is how you fly out of it.
 *
 * Ignition is a fixed lead rather than a node, because on an approach there is
 * no node — the player fires when the console says to.
 */
const TRIM_LEAD = 300;                     // s of warning before a trim lights
function trimEncounter(tk, goalOverride, lead) {
  const b = soiBody(), mu = b.mu, tb = BODIES[tk];
  const near = (tk === S.soi);
  if (!tb || (!near && tb.parent !== S.soi)) return null;
  const L = lead != null ? lead : TRIM_LEAD;
  const goal = goalOverride != null ? goalOverride : Math.max(800, tb.R * 0.50);
  // Far enough ahead to find the approach, not so far that a second lap of the
  // target's orbit is searched as well.
  const horizon = (tb.period || 0) * 1.5;
  const qOf = (res) => !res ? Infinity
            : res.own ? res.periAlt
            : (res.entered ? res.periAlt : res.miss - tb.R);
  const trial = (mode, dur) => {
    const st = propagate(S.r, S.v, mu, L);
    const o = dur > 1e-9 ? simBurn(st.r, st.v, mu, mode, dur, craftMass())
                         : { r:st.r, v:st.v };
    if (near) {
      const oe = elements(o.r, o.v, mu);
      return { own:true, entered:true, periAlt: oe.rp - b.R, ecc: oe.e, t: S.t + L + dur };
    }
    return coastEncounter(o.r, o.v, S.soi, S.t + L + dur, tk, horizon);
  };
  const base = trial('PRO', 0);
  const q0 = qOf(base);
  // How much engine a trim may spend. Ten minutes, or the tank, whichever runs
  // out first — and the quote shows the ΔV, because what a trim costs is the
  // lesson. Measured on the return from Mars: the same correction is a few tens
  // of m/s a month out and 845 m/s fourteen hours out, because by then you are
  // inside the well and the lever arm is gone. Capping this tighter would hide
  // that by refusing to answer instead of answering expensively.
  const flow = curFlow();
  const dMax = Math.min(flow > 0 ? S.craft.fuel/flow : 0, 600);
  if (!(dMax > 0)) return { base, q0, goal, sol:null, reason:'no propellant' };
  let best = null;
  const consider = (mode, dur, res) => {
    const q = qOf(res);
    if (!isFinite(q) || q <= 0) return;
    const sc = Math.abs(q - goal);
    if (!best || sc < best.sc) best = { mode, dur, res, q, sc };
  };
  for (const mode of ['PRO', 'RET']) {
    const N = 36, ds = [], qs = [];
    for (let i = 0; i <= N; i++) {
      const dur = dMax * i/N;
      const res = trial(mode, dur);
      ds.push(dur); qs.push(qOf(res)); consider(mode, dur, res);
    }
    for (let i = 0; i < N; i++) {
      const a = qs[i], c = qs[i+1];
      if (!isFinite(a) || !isFinite(c)) continue;
      if ((a - goal) * (c - goal) > 0) continue;
      let lo = ds[i], hi = ds[i+1], flo = a;
      for (let n = 0; n < 32; n++) {
        const mid = (lo + hi)/2, res = trial(mode, mid), qm = qOf(res);
        consider(mode, mid, res);
        if (!isFinite(qm)) break;
        if ((flo - goal) * (qm - goal) <= 0) hi = mid; else { lo = mid; flo = qm; }
        if (Math.abs(qm - goal) < 1) break;
      }
    }
  }
  return { base, q0, goal, lead:L, sol:best };
}

/** Hohmann window to a satellite of the current primary. */
function transferWindow(tk) {
  const b = soiBody(), mu = b.mu, e = el(), tb = BODIES[tk];
  if (!tb || tb.parent !== S.soi) return null;
  const r1 = e.r, r2 = tb.a, at = (r1+r2)/2;
  const dv1 = (Math.sqrt(mu*(2/r1 - 1/at)) - e.v) * 1000;
  const tof = Math.PI*Math.sqrt(at*at*at/mu);
  const wt = TAU/tb.period;
  const wc = e.period < Infinity ? TAU/e.period*e.dir : 0;
  const phiReq = normAngle(Math.PI - wt*tof);
  const thC = Math.atan2(S.r.y, S.r.x);
  const st = bodyStateInParent(tk, S.t);
  const phiNow = normAngle(Math.atan2(st.r.y, st.r.x) - thC);
  const rel = wt - wc;
  let dphi = phiReq - phiNow;
  dphi = rel > 0 ? normAngle(dphi) : -normAngle(-dphi);
  const wait = Math.abs(rel) < 1e-14 ? Infinity : dphi/rel;
  return { r1, r2, at, dv1, tof, phiReq, phiNow, wait };
}

function cmdPlan(A) {
  // The solver IS the flight computer. No avionics, no solutions.
  if (!sysOn('AVIO')) return say('AVIONICS OFF — the flight computer is not running, so there is nothing to solve manoeuvres with. Bring AVIONICS up on the SYS page.', 'err');
  const b = D.b, mu = b.mu, e = D.e, sub = A[0] || '';

  if (sub === 'CIRC' || sub === 'CIRCULARIZE') {
    const at = A[1] === 'PE' ? 'PE' : 'AP';
    if (at === 'AP' && !isFinite(e.ra)) return say('No apoapsis on an escape trajectory. Try PLAN CIRC PE.', 'err');
    const r = at === 'AP' ? e.ra : e.rp;
    S.planName = 'CIRCULARIZE AT ' + (at === 'AP' ? 'APOAPSIS' : 'PERIAPSIS');
    S.planDetail = 'circular at ' + fmtDist(r - b.R);
    head('MANEUVER · ' + S.planName);
    row('AT RADIUS', fmtDist(r) + `   alt ${fmtDist(r - b.R)}`);
    row('CURRENT V', fmtVel(vAtR(mu, r, e.a)));
    row('CIRCULAR V', fmtVel(vCirc(mu, r)));
    const dvC = (vCirc(mu,r) - vAtR(mu,r,e.a))*1000;
    const solC = solveBurn(at, dvC >= 0 ? 'PRO' : 'RET',
      (oe) => at === 'AP' ? oe.rp : (isFinite(oe.ra) ? oe.ra : 1e12), r);
    return quoteBurn(dvC, at === 'AP' ? 'at apoapsis' : 'at periapsis',
      at === 'AP' ? D.tApo : D.tPeri, solC);
  }

  if (sub === 'APO' || sub === 'AP') {
    const alt = parseFloat(A[1]);
    if (!isFinite(alt)) return say('Usage: PLAN APO <target apoapsis altitude, km>', 'err');
    const r1 = e.rp, r2 = alt + b.R;
    if (r2 < r1) return say('Target apoapsis is below your periapsis. Use PLAN PERI instead.', 'err');
    S.planName = 'SET APOAPSIS'; S.planDetail = 'apoapsis → ' + fmtDist(alt);
    head('MANEUVER · RAISE APOAPSIS');
    row('BURN AT', 'periapsis, ' + fmtDist(r1 - b.R) + ' alt');
    row('NEW APOAPSIS', fmtDist(alt));
    const v1 = vAtR(mu, r1, e.a), v2 = Math.sqrt(mu*(2/r1 - 2/(r1+r2)));
    const solA = solveBurn('PE', v2 >= v1 ? 'PRO' : 'RET', (oe) => isFinite(oe.ra) ? oe.ra : 1e12, r2);
    return quoteBurn((v2-v1)*1000, 'at periapsis', D.tPeri, solA);
  }

  if (sub === 'PERI' || sub === 'PE') {
    const alt = parseFloat(A[1]);
    if (!isFinite(alt)) return say('Usage: PLAN PERI <target periapsis altitude, km>', 'err');
    if (!isFinite(e.ra)) return say('No apoapsis to burn at on an escape trajectory.', 'err');
    const r1 = e.ra, r2 = alt + b.R;
    if (r2 > r1) {
      S.planName = 'SET PERIAPSIS'; S.planDetail = 'periapsis → ' + fmtDist(alt);
      head('MANEUVER · CHANGE PERIAPSIS');
      row('YOUR APOAPSIS', fmtDist(r1 - b.R));
      row('TARGET PERI', fmtDist(alt));
      say('');
      say('A burn cannot lift the point you are burning at. Firing at apoapsis raises periapsis until it meets apoapsis — that is a circular orbit — and after that the extra thrust goes into raising apoapsis instead. Periapsis can never end up above it.', 'err');
      say('Propellant is not the limit here. No burn duration reaches this target.', 'dim');
      say('');
      say(`  →  PLAN CIRC AP`, 'ok');
      say(`     circularize where you are, at ${fmtDist(r1 - b.R)}`, 'dim');
      say(`  →  PLAN APO ${Math.round(alt)}`, 'ok');
      say('     raise apoapsis to that altitude first, then circularize there', 'dim');
      return;
    }
    head('MANEUVER · CHANGE PERIAPSIS');
    row('BURN AT', 'apoapsis, ' + fmtDist(r1 - b.R) + ' alt');
    row('NEW PERIAPSIS', fmtDist(alt));
    const v1 = vAtR(mu, r1, e.a), v2 = Math.sqrt(mu*(2/r1 - 2/(r1+r2)));
    const solP = solveBurn('AP', v2 >= v1 ? 'PRO' : 'RET', (oe) => oe.rp, r2);
    return quoteBurn((v2-v1)*1000, 'at apoapsis', D.tApo, solP);
  }

  if (sub === 'ESC' || sub === 'ESCAPE') {
    S.planName = 'ESCAPE ' + b.name; S.planDetail = 'leave ' + b.name + ' SOI';
    head('MANEUVER · ESCAPE ' + b.name);
    const vesc = Math.sqrt(2*mu/e.r);
    row('AT RADIUS', fmtDist(e.r));
    row('CURRENT V', fmtVel(e.v));
    row('ESCAPE V', fmtVel(vesc));
    if (e.e >= 1) { say('Already on an escape trajectory.', 'ok');
      row('SOI EXIT', fmtT(timeToSOIExit()) ); return; }
    row('CHEAPEST AT', 'periapsis — the Oberth effect makes speed there worth more');
    const vp = vAtR(mu, e.rp, e.a), vescp = Math.sqrt(2*mu/e.rp);
    const solE = solveBurn('PE', 'PRO', (oe) => oe.energy, 0);
    return quoteBurn((vescp - vp)*1000, 'at periapsis', D.tPeri, solE);
  }

  if (sub === 'XFER' || sub === 'TRANSFER') {
    const tk = A[1];
    if (!tk || !BODIES[tk]) return say('Usage: PLAN XFER <BODY>   e.g. PLAN XFER MOON', 'err');
    if (BODIES[tk].parent !== S.soi)
      return say(`${tk} does not orbit ${b.name}. Transfer from ${BODIES[tk].parent} instead — escape your current SOI first (PLAN ESC).`, 'err');
    const w = transferWindow(tk);
    head('MANEUVER · TRANSFER TO ' + tk);
    row('DEPART RADIUS', fmtDist(w.r1));
    row('ARRIVE RADIUS', fmtDist(w.r2));
    row('FLIGHT TIME', fmtT(w.tof));
    row('PHASE NOW', (w.phiNow*180/Math.PI).toFixed(1) + '°');
    row('PHASE NEEDED', (w.phiReq*180/Math.PI).toFixed(1) + '°  at ignition', 'key');
    row('WINDOW IN', isFinite(w.wait) ? fmtT(w.wait) : '——');
    if (e.e > 0.02) say('Your orbit is not circular — circularize first for a clean solution.', 'warn');
    say('');
    row('ΔV REQUIRED', fmtDV(Math.abs(w.dv1)) + '  ' + (w.dv1 >= 0 ? 'prograde' : 'retrograde'), 'key');
    if (Math.abs(w.dv1) > dvRemaining()) say('INSUFFICIENT PROPELLANT for this maneuver.', 'err');

    say('Solving the encounter…', 'dim');
    const sol = targetEncounter(tk);
    if (sol && sol.arrival && sol.arrival.entered && sol.arrival.periAlt > 0) {
      row('BURN TIME', sol.dur.toFixed(1) + ' s at full throttle');
      row('IGNITION', `T−${fmtT(sol.tIgn)}`);
      row('ARRIVAL', `${fmtT(sol.arrival.t - S.t)} from now`);
      row('ARRIVAL PERI', fmtDist(sol.arrival.periAlt) + ` over ${tk}`, 'ok');
      say('');
      S.solution = { name: 'TRANSFER TO ' + tk, dir: sol.mode, secs: sol.dur, node: 'T',
                     when: S.t + sol.tIgn, nodeLabel: `T+${sol.tIgn.toFixed(2)} s`,
                     dv: Math.abs(w.dv1), prop: sol.dur * (curFlow()),
                     detail: `arrive ${fmtDist(sol.arrival.periAlt)} over ${tk}` };
      say(`  →  BURN ${sol.mode} ${sol.dur.toFixed(2)} AT T+${sol.tIgn.toFixed(2)}`, 'ok');
      say(`Solution integrated through the sphere-of-influence change. Aim point is offset from ${tk}'s centre — an unbiased transfer to its orbital radius is an impact trajectory.`, 'dim');
      say('Ignition time is significant to 0.01 s — arrival shifts roughly 20,000 km per second of error.', 'warn');
    } else {
      const bs = burnTimeFor(Math.abs(w.dv1));
      row('BURN TIME', bs.toFixed(1) + ' s at full throttle');
      say('');
      say(`  →  BURN ${w.dv1 >= 0 ? 'PRO' : 'RET'} ${bs.toFixed(1)} AT XFER ${tk}`, 'ok');
      if (sol && sol.arrival && !sol.arrival.entered)
        say(`No intercept found from this orbit — closest approach ${fmtDist(sol.arrival.miss)}. Circularize, then try again.`, 'warn');
      else
        say('Falling back to the analytic window. Expect a midcourse trim — PLAN TRIM ' + tk + ' once you are under way.', 'warn');
    }
    return;
  }

  if (sub === 'TEI' || sub === 'HOME') {
    if (!b.parent) return say(`${b.name} has no parent body to fall back to.`, 'err');
    const pb = BODIES[b.parent];
    if (e.e >= 1) return say('Already on an escape trajectory — you are leaving whatever happens.', 'err');
    const aim = parseFloat(A[1]);
    const aimAlt = isFinite(aim) ? aim : 300;
    S.planName = 'INJECTION TO ' + pb.name;
    S.planDetail = `${pb.name} perigee → ${fmtDist(aimAlt)}`;
    head('MANEUVER · INJECTION TO ' + pb.name);
    row('FROM', `${fmtDist(e.rp - b.R)} × ${fmtDist(e.ra - b.R)} around ${b.name}`);
    row('AIM POINT', fmtDist(aimAlt) + ` perigee at ${pb.name}`, 'key');
    say('Searching the orbit for the departure point…', 'dim');
    const sol = teiSolve(aimAlt);
    if (!sol) return say(`No departure from this orbit reaches ${pb.name}. Circularise, or check the tank.`, 'err');
    const missed = Math.abs(sol.rp - pb.R - aimAlt) > Math.max(400, aimAlt);
    row('ARRIVES AT', fmtDist(sol.rp - pb.R) + ` perigee`, missed ? 'bad' : 'ok');
    row('ΔV REQUIRED', fmtDV(sol.dv) + '  PROGRADE', sol.dv <= dvRemaining() ? 'key' : 'bad');
    row('BURN TIME', sol.dur.toFixed(2) + ' s at full throttle');
    row('IGNITION', `T−${fmtT(Math.max(0, sol.tc - sol.dur/2))}`);
    row('LEAVES SOI', fmtT(sol.tExit - S.t) + ' after that');
    if (sol.dv > dvRemaining()) say('INSUFFICIENT PROPELLANT for this injection.', 'err');
    say('');
    S.solution = { name: S.planName, dir: 'PRO', secs: sol.dur, node: 'T',
                   when: S.t + sol.tc, nodeLabel: `T+${sol.tc.toFixed(0)} s`,
                   dv: sol.dv, prop: sol.dur * curFlow(),
                   detail: `${pb.name} perigee ${fmtDist(sol.rp - pb.R)}` };
    say(`  →  BURN PRO ${sol.dur.toFixed(2)} AT T+${sol.tc.toFixed(2)}`, 'ok');
    if (missed)
      say(`Closest this orbit gets is ${fmtDist(sol.rp - pb.R)}. Fly it and trim, or circularise first.`, 'warn');
    say(`WHERE this is lit is the manoeuvre, not how long: the same burn a fifth of an orbit later `
      + `leaves a perigee tens of thousands of kilometres out. Fire it on the clock above or solve it again.`, 'dim');
    return;
  }

  if (sub === 'TRIM' || sub === 'MCC') {
    const tk = A[1];
    if (!tk || !BODIES[tk]) return say('Usage: PLAN TRIM <BODY> [aim altitude, km]   e.g. PLAN TRIM EARTH', 'err');
    if (tk !== S.soi && BODIES[tk].parent !== S.soi)
      return say(`${tk} does not orbit ${b.name}, so there is no approach to trim from here.`, 'err');
    const aim = parseFloat(A[2]);
    S.planName = 'MIDCOURSE TRIM · ' + tk;
    head('MANEUVER · MIDCOURSE TRIM');
    say('Reading the approach you are on…', 'dim');
    const t = trimEncounter(tk, isFinite(aim) ? aim : undefined);
    if (!t) return say('No approach to trim.', 'err');
    const now = t.base && t.base.entered ? `${fmtDist(t.base.periAlt)} periapsis` : `${fmtDist(t.base ? t.base.miss : Infinity)} miss`;
    row(tk === S.soi ? 'PERIAPSIS NOW' : 'CLOSEST NOW',
        now + (t.base && t.base.entered ? ` over ${tk}` : ''), t.q0 > 0 ? '' : 'bad');
    row('AIM POINT', fmtDist(t.goal) + ` over ${tk}`, 'key');
    if (!t.sol) {
      say('');
      say(`No trim inside a tenth of the tank moves the approach onto ${fmtDist(t.goal)}. `
        + `The miss is ${fmtDist(Math.abs(t.q0))} and this is a course correction, not a transfer — `
        + `if the approach is this far out, solve the transfer again with PLAN XFER ${tk}.`, 'warn');
      return;
    }
    const moved = Math.abs(t.sol.q - t.q0);
    const tdv = t.sol.dur * curThrust() * 1000 / craftMass();
    row('AFTER TRIM', fmtDist(t.sol.q) + ` over ${tk}`, 'ok');
    row('MOVES BY', fmtDist(moved), 'ok');
    row('ΔV REQUIRED', fmtDV(tdv) + '  ' + DIRNAME[t.sol.mode], tdv <= dvRemaining() ? 'key' : 'bad');
    row('BURN TIME', t.sol.dur.toFixed(2) + ' s at full throttle');
    row('IGNITION', `T−${fmtT(t.lead)}`);
    if (tdv > dvRemaining()) say('INSUFFICIENT PROPELLANT for this trim.', 'err');
    say('');
    S.solution = { name: 'MIDCOURSE TRIM · ' + tk, dir: t.sol.mode, secs: t.sol.dur, node: 'T',
                   when: S.t + t.lead, nodeLabel: `T+${t.lead.toFixed(0)} s`,
                   dv: t.sol.dur * curThrust() * 1000 / craftMass(),
                   prop: t.sol.dur * curFlow(),
                   detail: `closest approach ${fmtDist(t.sol.q)} over ${tk}` };
    say(`  →  BURN ${t.sol.mode} ${t.sol.dur.toFixed(2)} AT T+${t.lead.toFixed(0)}`, 'ok');
    say('A trim is solved against the trajectory you are on, so it expires: fire it on the clock above or solve it again.', 'dim');
    return;
  }

  if (sub === 'RDV' || sub === 'RENDEZVOUS') {
    const o = S.objects.find(x => x.id === 'STATION' && x.soi === S.soi);
    if (!o) return say('No station to rendezvous with here.', 'err');
    const se = elements(o.r, o.v, mu);
    head('RENDEZVOUS SOLUTION · ' + (o.label || 'STATION'));
    row('YOUR ORBIT', `${fmtDist(e.rp-b.R)} × ${fmtDist(e.ra-b.R)}   T ${fmtT(e.period)}`);
    row((o.label || 'STATION') + ' ORBIT', `${fmtDist(se.rp-b.R)} × ${fmtDist(se.ra-b.R)}   T ${fmtT(se.period)}`);
    const thC = Math.atan2(S.r.y, S.r.x), thT = Math.atan2(o.r.y, o.r.x);
    const phi = normAngle((thT - thC) * e.dir);
    row('PHASE ANGLE', (phi*180/Math.PI).toFixed(1) + '°  ' + (o.label ? o.label + ' ahead of you' : 'station ahead of you'));
    row('RANGE', fmtDist(V.len(V.sub(o.r, S.r))));
    row('CLOSING', fmtVel(-V.dot(V.unit(V.sub(o.r,S.r)), V.sub(o.v,S.v))));

    if (V.len(V.sub(o.r, S.r)) < 30) {
      say('');
      say('Inside 30 km — you are in proximity ops. Use DOCK for the approach page and TRANS to close.', 'ok');
      return;
    }
    if (e.e > 0.03) {
      say('');
      say('Circularize first — this solution assumes a circular departure.  PLAN CIRC AP', 'warn');
      return;
    }

    // Hohmann phasing: the station must sit exactly this far ahead at ignition
    const r1 = e.r, r2 = se.a, at = (r1 + r2)/2;
    const tof = Math.PI*Math.sqrt(at*at*at/mu);
    const ws = Math.sqrt(mu/(r2*r2*r2)), wc = Math.sqrt(mu/(r1*r1*r1));
    const phiReq = normAngle(Math.PI - ws*tof);
    const rel = ws - wc;
    let dphi = phiReq - phi;
    dphi = rel > 0 ? normAngle(dphi) : -normAngle(-dphi);
    const wait = Math.abs(rel) < 1e-14 ? Infinity : dphi/rel;
    const dv1 = (Math.sqrt(mu*(2/r1 - 1/at)) - e.v)*1000;
    const secs = burnTimeFor(Math.abs(dv1));

    say('');
    row('TRANSFER TIME', fmtT(tof));
    row('PHASE NEEDED', (phiReq*180/Math.PI).toFixed(1) + '°  at ignition', 'key');
    row('WINDOW IN', isFinite(wait) ? fmtT(wait) : '——', wait < 120 ? 'ok' : 'out');
    row('ΔV', fmtDV(Math.abs(dv1)) + '  ' + (dv1 >= 0 ? 'prograde' : 'retrograde'));
    row('BURN TIME', secs.toFixed(1) + ' s');
    say('');
    S.solution = { name: 'RENDEZVOUS', dir: dv1 >= 0 ? 'PRO' : 'RET', secs, node: 'T',
                   when: S.t + wait, nodeLabel: `T+${wait.toFixed(2)} s`, dv: Math.abs(dv1),
                   prop: secs * (curFlow()),
                   detail: `transfer to ${fmtDist(se.a - b.R)}, then CIRC AP` };
    say(`  →  BURN ${dv1 >= 0 ? 'PRO' : 'RET'} ${secs.toFixed(2)} AT T+${wait.toFixed(2)}`, 'ok');
    say(`  then, half an orbit later:   PLAN CIRC AP`, 'ok');
    say('Phasing is flown from the lower orbit: shorter period, so the gap closes while coasting.', 'dim');
    return;
  }

  head('PLAN — onboard maneuver solver');
  say('PLAN CIRC AP|PE      circularize at an apsis', 'out');
  say('PLAN APO <km>        raise/lower apoapsis (burns at periapsis)', 'out');
  say('PLAN PERI <km>       raise/lower periapsis (burns at apoapsis)', 'out');
  say('PLAN ESC             escape the current sphere of influence', 'out');
  say('PLAN XFER <BODY>     Hohmann transfer + launch window', 'out');
  say('PLAN TRIM <BODY>     midcourse trim of the approach you are on', 'out');
  say('PLAN RDV             station rendezvous phasing', 'out');
  say('Each solution returns an executable BURN line.', 'dim');
}

function timeToSOIExit() {
  const b = soiBody(); if (!isFinite(b.soi)) return Infinity;
  let r = {...S.r}, v = {...S.v}, t = 0;
  for (let i = 0; i < 400; i++) {
    const out = propagate(r, v, b.mu, 60); r = out.r; v = out.v; t += 60;
    if (V.len(r) > b.soi) return t;
  }
  return Infinity;
}

/* ============================================================
   PROXIMITY OPS + RCS
   ============================================================ */
function rcsDV() {
  const m0 = craftMass(), m1 = m0 - S.craft.rcs;
  return m1 <= 0 ? 0 : S.craft.rcsIsp*G0*Math.log(m0/m1);
}

function cmdTrans(A) {
  const t = targetRel();
  const mode = A[0] || '';
  if (mode === 'ON' || mode === 'OFF') return say('RCS is always available while propellant remains. Use TRANS to translate.', 'sys');
  // Unpressurised tanks are true whether or not a target has been picked, so
  // this is said before the vehicle is asked what it is aiming at.
  if (!sysOn('PRESS')) return say('PROPULSION NOT PRESSURISED — the RCS thrusters have no propellant pressure. Bring PROPULSION up on the SYS page.', 'err');
  if (!t) return say('No target set. Try  TGT STATION.', 'err');
  if (S.dock.phase !== 'FREE') return say('MATED TO THE STATION — release the latches before translating.', 'err');
  // Inside the corridor the thruster frame is the docking axis, not the line
  // of sight to the station's centre: the two differ by the corridor angle,
  // and it is the axis that capture is judged against.
  const g = dockGeom();
  const onAxis = !!(g && g.ctrRange < 500);
  const los  = onAxis ? V.mul(g.axis, -1) : V.unit(t.r);
  const perp = onAxis ? g.lat : { x:-V.unit(t.r).y, y:V.unit(t.r).x };
  let dirv, dv;
  if (mode === 'NULL') { dirv = V.unit(t.v); dv = V.len(t.v)*1000; }
  else {
    dv = parseFloat(A[1]);
    if (!isFinite(dv) || dv <= 0) return say('Usage: TRANS <TGT|AWAY|PORT|STBD|PRO|RET> <m/s>', 'err');
    switch (mode) {
      case 'TGT': case 'FWD':  dirv = los; break;
      case 'AWAY': case 'AFT': dirv = V.mul(los,-1); break;
      case 'PORT': case 'LEFT':  dirv = perp; break;
      case 'STBD': case 'RIGHT': dirv = V.mul(perp,-1); break;
      case 'PRO': dirv = V.unit(S.v); break;
      case 'RET': dirv = V.mul(V.unit(S.v),-1); break;
      default: return say('Usage: TRANS <TGT|AWAY|PORT|STBD|PRO|RET|NULL> <m/s>', 'err');
    }
  }
  if (dv > rcsDV()) return say(`Only ${fmtDV(rcsDV())} of RCS remains.`, 'err');
  const used = rcsPulse(dirv, dv);
  say(`RCS pulse · ${fmtDV(dv)} ${mode.toLowerCase()}${onAxis ? ' (dock axis)' : ''}  (${used.toFixed(3)} kg)`, 'key');
  // A platform that has just been shaken has to re-settle, and most of that
  // cost is in the firing itself rather than in how big it was — hence the
  // fixed term. A trim pulse costs about half a minute of the three; leaning
  // on the thrusters costs a good deal more.
  disturbAlign(25 + dv * 50, 'thrusters fired');
  derive();
  const ng = dockGeom();
  if (ng && onAxis) say(`Axial ${fmtRange(ng.axial)}  closing ${fmtRate(ng.closing)}   lateral ${fmtRange(ng.lateral)} at ${fmtRate(ng.latRate)}`, 'out');
  else { const nt = targetRel();
    if (nt) say(`Range ${fmtDist(V.len(nt.r))}   closing ${fmtVel(-V.dot(V.unit(nt.r), nt.v))}`, 'out'); }
  checkObjectives();
}

/* ---- docking and the utility procedures ---------------------------------
   Every step below is one key with one precondition and one thing you can
   watch happen. The order is the real order: you cannot open a hatch onto
   vacuum, and the transfer pumps run off the station's bus.               */
/* ---- the surface --------------------------------------------------------
   Three steps and a readout. It exists so that landing somewhere means having
   been there. */
function cmdSurf(A) {
  const s = A[0] || '';
  const no = (m) => say(m, 'err');
  if (!s) return gotoPage('SURF');
  if (!S.landed || !S.pad || S.pad.lifted) return no('Not on the surface.');
  if (!S.surf) S.surf = freshSurf();
  const u = S.surf;
  switch (s) {
  case 'EVA': case 'OUT': {
    if (u.phase !== 'INSIDE') return no(`Already ${u.phase === 'PREP' ? 'depressurising' : 'outside'}.`);
    if (S.craft.crew <= 0) return no('Nobody aboard to go out.');
    u.phase = 'PREP'; u.t = 0;
    return say(`DEPRESSURISING · ${fmtT(SURF_CYCLE)} to vacuum and out of the hatch. `
      + `Outside, the crew are on their suits and the reserve moves at ${ECLSS_OPEN_RATE}× their own rate.`, 'key');
  }
  case 'SAMPLE': case 'COLLECT': {
    if (u.phase === 'COLLECT') { u.phase = 'OUT'; return say(`COLLECTION PAUSED · ${u.out.toFixed(0)} kg aboard.`, 'key'); }
    if (u.phase !== 'OUT') return no('The crew are not outside yet. SURF EVA first.');
    const want = S.manifest ? S.manifest.collect : 0;
    if (u.out >= want - 1e-9) return say('NOTHING LEFT ON THE MANIFEST · SURF IN when you are ready.', 'sys');
    u.phase = 'COLLECT';
    return say(`COLLECTING · ${SURF_RATE} kg/s into the hold, ${(want - u.out).toFixed(0)} kg to go. `
      + `Every kilogram is mass the ascent has to lift.`, 'ok');
  }
  case 'IN': case 'BACK': {
    if (u.phase === 'INSIDE') return no('The crew are already aboard.');
    if (u.phase === 'PREP') return no('Still depressurising.');
    u.phase = 'BACK'; u.t = 0;
    return say(`CLIMBING BACK IN · ${fmtT(SURF_CYCLE)} to hatch closed and cabin repressurised.`, 'key');
  }
  }
  return no('SURF takes EVA, SAMPLE or IN.');
}

/* ---- separation ---------------------------------------------------------
   Undocking is leaving something you visited. SEPARATION is leaving part of
   yourself behind, and what is left behind is a ship with your crew aboard.

   Mechanically the mothership becomes what CERES already is — an object in an
   orbit carrying a port — and everything that made it a vehicle is lifted into
   a bag that keeps running. The player flies the lander. Item 01's corridor,
   capture envelope, ring, latches and utilities all apply unchanged, which is
   the whole point of doing it this way.                                     */
function cmdSep(A) {
  const m = S.mission;
  const spec = m && m.lander;
  if (!spec) return say('This vehicle carries no lander to separate.', 'err');
  if (S.away) return say(`Already separated. ${S.away.label} is holding orbit ahead of you — TGT STATION and DOCK to go back aboard.`, 'err');
  if (S.dock.phase !== 'FREE') return say('Still mated to the station — release the latches before separating.', 'err');
  if (S.pad && !S.pad.lifted) return say('On the pad. The lander comes off in orbit, not on the ground.', 'err');
  if (S.burn || S.sched) return say('Not with a burn running or armed. CANCEL first.', 'err');
  if (spec.soi && S.soi !== spec.soi)
    return say(`The lander separates in orbit of ${spec.soi}, not here.`, 'err');
  if (!sysOn('GNC')) return say('GUIDANCE NOT ALIGNED — neither vehicle has an attitude reference. Bring GUIDANCE up first.', 'err');

  const label = S.craft.name;
  const bag = stashVehicle(label);
  // The crew split. Whoever goes down is no longer breathing up here.
  bag.craft.crew = Math.max(0, (bag.craft.crew || 0) - (spec.craft.crew || 0));
  // And the lander stops being mass the mothership is carrying. Whatever it
  // weighs on its own is exactly what comes out of the hold.
  const lc = spec.craft;
  const landerMass = (lc.stages || []).reduce((a, st) => a + st.dry + st.fuel, 0)
                   + lc.dry + (lc.fuel || 0) + (lc.rcs || 0);
  bag.craft.cargo = Math.max(0, (bag.craft.cargo || 0) - landerMass);
  const o = { id:'STATION', soi:S.soi, r:{ ...S.r }, v:{ ...S.v }, label };
  S.objects = S.objects.filter(x => !(x.id === 'STATION' && x.soi === S.soi)).concat([o]);
  S.away = { id:'STATION', label, bag, dead:false, t0:S.t };

  // Now wear the lander. Every field the bag holds is replaced, not merged:
  // a lander that inherited the mothership's battery charge would be wrong in
  // a way nobody could see.
  const hull = S.therm.hull;
  rig(spec.craft);
  S.power = { batt: spec.power.batt, battMax: spec.power.battMax, area: spec.power.area,
              eff: spec.power.eff != null ? spec.power.eff : 0.29, load: 0, gen: 0, tie: 0, ecl: false };
  S.therm = { hull };                       // it has been sitting in the same sunlight
  S.loads = { HEAT:true, SCI:false, COMM:true };
  S.dock = freshDock();
  S.shield = freshShield(); S.chute = freshChutes();
  S.throttle = 1; S.pad = null; S.fairing = false;
  S.manifest = spec.manifest ? { ...spec.manifest } : null;
  S.landingAllowed = true; S.landed = false; S.surf = null;
  S.thermLimit = spec.thermLimit || 800;
  sysBoot();                                 // it has been live on the mothership's bus
  S.att = { theta: 0, rate: 0, mode: 'PAXS', inertial: 0, slewing: false };

  // Placed exactly where a docked vehicle sits, and pushed off on springs —
  // the same 0.10 m/s an undocking gets, so the first thing the player sees is
  // a corridor they already know how to fly.
  const stTheta = Math.atan2(o.v.y, o.v.x);
  const axis = { x: Math.cos(stTheta + Math.PI), y: Math.sin(stTheta + Math.PI) };
  S.att.theta = normAngle(stTheta);
  const nose = { x: Math.cos(S.att.theta), y: Math.sin(S.att.theta) };
  S.r = V.sub(V.add(o.r, V.mul(axis, PORT_ARM_STN)), V.mul(nose, PORT_ARM));
  S.v = V.add(o.v, V.mul(axis, 0.10/1000));
  S.target = 'STATION';
  derive();
  say(`SEPARATION · ${S.craft.name} is away on springs at 0.10 m/s, ${spec.craft.crew} aboard. `
    + `${label} is now a docking target holding ${fmtDist(D.perAlt)} × ${fmtDist(D.apoAlt)} with `
    + `${bag.craft.crew} aboard — it keeps breathing and drawing power while you are gone.`, 'key');
  row('YOUR VEHICLE', `${S.craft.name}   ${fmtDV(dvRemaining())}   RCS ${fmtDV(rcsDV())}`, 'ok');
  checkObjectives();
}

function cmdDock(A) {
  const dk = S.dock, s = A[0] || '';
  const g = dockGeom();
  const no = (m) => say(m, 'err');

  switch (s) {
  case '': return gotoPage('DOCK');

  case 'AUTO': {
    if (dk.phase !== 'FREE') return no('Already captured.');
    if (!g) return no('No docking target. Try  TGT STATION.');
    // Matches the DOCK page's NOT FITTED and M-03's own briefing: AURIGA-3 does
    // not carry the equipment. It is a different vehicle, not a disabled key.
    if (S.mission && S.mission.noAuto) return no('AUTO DOCK is not fitted to this vehicle — fly the approach by hand.');
    if (!dk.auto && !sysOn('PRESS')) return no('PROPULSION NOT PRESSURISED — the autopilot has no thrusters to fly with. Bring PROPULSION up on the SYS page.');
    // The autopilot points the vehicle down the port axis, so it needs the
    // same aligned platform a hand-flown approach needs.
    if (!dk.auto && !sysOn('GNC')) return no('GUIDANCE NOT ALIGNED — the autopilot has no attitude reference to fly the corridor against.');
    dk.auto = !dk.auto; dk.autoT = 0;
    if (dk.auto) setAttMode('PAXS');
    return say(dk.auto ? 'AUTO DOCK ENGAGED · flying the corridor on RCS. Keep an eye on the budget.'
                       : 'AUTO DOCK DISENGAGED · manual translation.', dk.auto ? 'key' : 'sys');
  }

  case 'RETRACT': {
    if (dk.phase === 'RETRACT') return say('Ring already retracting.', 'sys');
    if (dk.phase !== 'SOFT') return no('Nothing captured to retract.');
    dk.phase = 'RETRACT';
    return say(`RING RETRACTING · pulling ${dk.misalign0.toFixed(1)}° of misalignment out of the interface.`, 'key');
  }

  case 'LATCH': {
    if (dk.phase === 'HARD') return say('Already hard docked.', 'sys');
    if (dk.phase !== 'RETRACTED') return no('The ring is not home — RETRACT first.');
    dk.phase = 'LATCHING'; dk.latching = true;
    return say('LATCHES DRIVING · 12 structural latches closing.', 'key');
  }

  case 'UNDOCK': case 'RELEASE': {
    if (dk.phase === 'FREE') return no('Not docked.');
    const o = dockTarget();
    const ax = o ? { x: Math.cos(Math.atan2(o.v.y,o.v.x) + Math.PI), y: Math.sin(Math.atan2(o.v.y,o.v.x) + Math.PI) } : null;
    S.dock = freshDock();
    S.att.mode = 'PAXS';
    if (ax) S.v = V.add(S.v, V.mul(ax, 0.1/1000));     // separation springs, 0.10 m/s
    say('UNDOCKED · hatch closed, utilities disconnected, latches open. Separation springs 0.10 m/s.', 'key');
    return;
  }

  /* --- vestibule and hatch --- */
  case 'EQUALISE': case 'EQ': case 'PRESS': {
    if (dk.phase !== 'HARD') return no('Hard dock required before the vestibule can be pressurised.');
    if (dk.vest.hatch) return no('The hatch is open — the vestibule is already at cabin pressure.');
    dk.vest.valve = !dk.vest.valve;
    // Aborting on the keypress, not a step later: the crew know at once.
    const killed = dk.vest.valve && dk.vest.check >= 0 && !dk.vest.leakOk;
    if (killed) dk.vest.check = -1;
    return say(dk.vest.valve
      ? 'EQUALISATION VALVE OPEN · vestibule pressurising, about 90 s to 101.3 kPa.' + (killed ? ' LEAK CHECK ABORTED.' : '')
      : 'EQUALISATION VALVE CLOSED.', killed ? 'warn' : 'key');
  }
  case 'LEAK': {
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (dk.vest.press < 100) return no(`Vestibule is at ${dk.vest.press.toFixed(1)} kPa — equalise to 100 kPa first.`);
    if (dk.vest.leakOk) return say('Leak check already passed.', 'sys');
    dk.vest.valve = false; dk.vest.check = 0; dk.vest.decay = 0; dk.vest.verdict = null;
    return say(`LEAK CHECK RUNNING · valve closed, holding ${LEAK_HOLD} s. Watch the decay: more than ${LEAK_LIMIT.toFixed(2)} kPa and the seal is rejected. You do not have to wait for the verdict if the trend is obvious.`, 'key');
  }
  case 'RESEAT': {
    if (dk.phase !== 'HARD') return no('Nothing to re-seat — the latches are not closed.');
    if (dk.vest.hatch) return no('Close the hatch before breaking the seal.');
    if (dk.pwr.umb || dk.prop.line) return no('Disconnect the umbilical and the transfer line before breaking the seal.');
    // Back out to the ring and drive it home again. This vents the vestibule —
    // breaking the latches opens it to vacuum — so pressurisation starts over.
    dk.reseats++;
    dk.phase = 'RETRACT'; dk.ring = 0; dk.latches = 0; dk.latching = false;
    dk.misalign0 = 0; dk.misalign = 0;
    dk.vest = { valve:false, press:0, check:-1, decay:0, leak:0, verdict:null, leakOk:false, hatch:false };
    return say('INTERFACE RE-SEATING · latches released, vestibule vented to vacuum, ring driving home again. Close the latches when it is home, then equalise and re-check.', 'key');
  }

  /* --- going back aboard the ship you left --------------------------------
     The mirror of SEP, and the moment control comes back. Everything the
     lander is carrying crosses with the crew; the lander itself does not. An
     ascent stage is left where Apollo left its own. */
  case 'CREW': case 'BOARD': {
    if (!S.away) return no('Nothing to go back aboard — this is the only vehicle in the scenario.');
    if (dk.phase !== 'HARD') return no('Hard dock required before the crew can cross.');
    if (!dk.vest.hatch) return no('The crew go through the hatch — open it first.');
    const o = dockTarget();
    if (!o) return no('No interface.');
    const lander = S.craft.name, crew = S.craft.crew || 0, load = S.craft.cargo || 0;
    const bag = S.away.bag, label = S.away.label;
    wearVehicle(bag);
    S.r = { ...o.r }; S.v = { ...o.v }; S.soi = o.soi;
    S.craft.crew = (S.craft.crew || 0) + crew;
    S.craft.cargo = (S.craft.cargo || 0) + load;
    S.objects = S.objects.filter(x => x !== o);
    S.away = null; S.target = null;
    S.burn = null; S.sched = null;
    derive();
    say(`CREW ABOARD ${label} · ${crew} across through the vestibule with ${load.toFixed(0)} kg of samples. `
      + `${lander} is released — an ascent stage has nowhere else to be. You have the ship again: `
      + `${fmtDV(dvRemaining())} in the tank, ${S.craft.crew} aboard.`, 'ok');
    checkObjectives();
    return;
  }

  case 'HATCH': {
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (dk.vest.hatch) { dk.vest.hatch = false; return say('HATCH CLOSED AND LOCKED.', 'key'); }
    if (!dk.vest.leakOk) return no('Leak check has not passed — that hatch stays shut.');
    dk.vest.hatch = true;
    return say('HATCH OPEN · the vestibule is yours. Air ducts can go through now.', 'ok');
  }

  /* --- electrical --- */
  case 'UMB': case 'UMBILICAL': {
    if (dk.phase !== 'HARD') return no('Hard dock required before the umbilical can be mated.');
    if (dk.pwr.tie) return no('Open the bus tie before demating the umbilical.');
    dk.pwr.umb = !dk.pwr.umb;
    return say(dk.pwr.umb ? 'UMBILICAL MATED · power and data connector engaged, tie open.'
                          : 'UMBILICAL DEMATED.', 'key');
  }
  case 'TIE': case 'BUS': {
    if (!dk.pwr.umb) return no('No umbilical — mate the connector first.');
    dk.pwr.tie = !dk.pwr.tie;
    derive();
    return say(dk.pwr.tie ? `BUS TIE CLOSED · station bus 120 V, ${(S.craft.stationSupply||2000)} W available. Data link up. Your battery is off the hook.`
                          : 'BUS TIE OPEN · back on internal power.', dk.pwr.tie ? 'ok' : 'warn');
  }

  /* --- ECLSS --- */
  case 'DUCT': {
    if (!dk.vest.hatch) return no('The air duct runs through the hatch — open it first.');
    if (dk.air.fan) return no('Stop the fan before pulling the duct.');
    dk.air.duct = !dk.air.duct;
    return say(dk.air.duct ? 'AIR DUCT INSTALLED · 200 mm trunk through the hatchway, fan off.'
                           : 'AIR DUCT REMOVED.', 'key');
  }
  case 'FAN': {
    if (!dk.air.duct) return no('No duct installed.');
    dk.air.fan = !dk.air.fan;
    return say(dk.air.fan ? 'CIRCULATION FAN RUNNING · 120 L/min. The station is breathing for you now.'
                          : 'CIRCULATION FAN STOPPED · back on your own O₂.', dk.air.fan ? 'ok' : 'warn');
  }

  /* --- propellant --- */
  case 'LINE': {
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (dk.prop.xfer) return no('Stop the transfer first.');
    dk.prop.line = !dk.prop.line;
    if (!dk.prop.line) { dk.prop.purge = 0; dk.prop.purged = false; }
    return say(dk.prop.line ? 'TRANSFER LINE CONNECTED · fluid coupling mated, purging (30 s).'
                            : 'TRANSFER LINE DISCONNECTED.', 'key');
  }
  case 'XFER': case 'TRANSFER': {
    if (!dk.prop.purged) return no('The line is not purged — connect it and let the purge finish.');
    if (!dk.pwr.tie) return no('The transfer pumps run off the station bus — close the bus tie first.');
    if (dk.prop.xfer) { dk.prop.xfer = false; dk.prop.done = true;
      say(`TRANSFER STOPPED · ${dk.prop.moved.toFixed(1)} kg aboard.`, 'key'); checkObjectives(); return; }
    if (S.craft.fuel >= S.craft.fuelMax - 0.01 && S.craft.rcs >= S.craft.rcsMax - 0.01) {
      dk.prop.done = true; checkObjectives();
      return say('TANKS ALREADY FULL · coupling verified, nothing to transfer.', 'ok');
    }
    dk.prop.xfer = true;
    return say('TRANSFER RUNNING · 0.5 kg/s into the main tank, then RCS.', 'ok');
  }

  /* --- cargo --- */
  case 'UNLOAD': case 'DELIVER': {
    const ck = dk.cargo, mf = S.manifest;
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (!dk.vest.hatch) return no('The cargo goes through the hatch — open it first.');
    if (ck.moving === 'OUT') { ck.moving = null; return say(`DELIVERY STOPPED · ${ck.out.toFixed(0)} kg off so far.`, 'key'); }
    if (ck.moving === 'IN') return no('Stop taking the return load on before unloading.');
    const left = Math.max(0, (mf ? mf.deliver : S.craft.cargo) - ck.out);
    if (left <= 1e-6) return say('NOTHING LEFT TO DELIVER · the manifest is off the vehicle.', 'sys');
    if (S.craft.cargo <= 1e-6) return no('The hold is empty.');
    ck.moving = 'OUT';
    return say(`DELIVERY RUNNING · ${CARGO_RATE} kg/s through the hatchway, ${left.toFixed(0)} kg to go. `
      + `Watch the mass come off — every burn after this is a different burn.`, 'ok');
  }
  case 'LOAD': case 'CARGO': {
    const ck = dk.cargo, mf = S.manifest;
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (!dk.vest.hatch) return no('The cargo goes through the hatch — open it first.');
    if (ck.moving === 'IN') { ck.moving = null; return say(`LOADING STOPPED · ${ck.in.toFixed(0)} kg aboard.`, 'key'); }
    if (ck.moving === 'OUT') return no('The delivery is still coming off — stop it first.');
    const want = Math.max(0, (mf ? mf.collect : 0) - ck.in);
    if (want <= 1e-6) return say('NO RETURN LOAD MANIFESTED.', 'sys');
    if ((S.craft.cargoMax || 0) - S.craft.cargo <= 1e-6) return no(`The hold is full at ${S.craft.cargoMax} kg.`);
    ck.moving = 'IN';
    return say(`LOADING RUNNING · ${CARGO_RATE} kg/s aboard, ${want.toFixed(0)} kg manifested. `
      + `This is mass you have to fly home and slow down again.`, 'ok');
  }

  default: return no('Usage: DOCK AUTO|RETRACT|LATCH|RESEAT|UNDOCK · EQUALISE|LEAK|HATCH · UMB|TIE · DUCT|FAN · LINE|XFER · UNLOAD|LOAD');
  }
}

<script>
/* ============================================================
   MISSIONS
   ============================================================ */
function setOrbit(soi, periAlt, apoAlt, nuDeg, argpDeg) {
  const b = BODIES[soi];
  const rp = b.R + periAlt, ra = b.R + apoAlt;
  const a = (rp+ra)/2, ecc = (ra-rp)/(ra+rp);
  const p = a*(1-ecc*ecc);
  const nu = (nuDeg||0)*Math.PI/180, argp = (argpDeg||0)*Math.PI/180;
  const r = p/(1+ecc*Math.cos(nu)), th = argp + nu;
  const h = Math.sqrt(b.mu*p);
  const rhat = {x:Math.cos(th), y:Math.sin(th)};
  const that = {x:-Math.sin(th), y:Math.cos(th)};
  S.soi = soi;
  S.r = V.mul(rhat, r);
  S.v = V.add(V.mul(rhat, b.mu/h*ecc*Math.sin(nu)), V.mul(that, h/r));
}
function setHelio(periAU, apoAU, nuDeg, argpDeg) {
  setOrbit('SUN', periAU*AU - BODIES.SUN.R, apoAU*AU - BODIES.SUN.R, nuDeg, argpDeg);
}
function makeStation(soi, altKm, phaseDeg) {
  const b = BODIES[soi], r = b.R + altKm, th = phaseDeg*Math.PI/180;
  const sp = Math.sqrt(b.mu/r);
  return { id:'STATION', soi, r:{x:r*Math.cos(th), y:r*Math.sin(th)},
           v:{x:-sp*Math.sin(th), y:sp*Math.cos(th)} };
}
function rig(o) {
  Object.assign(S.craft, { name:'—', dry:2200, fuel:0, fuelMax:0, thrust:30, isp:311,
                           rcs:0, rcsMax:0, rcsIsp:220, crew:0, o2:0,
                           // Capacity is a property of the vehicle, not a
                           // constant. Nothing that shipped before declares
                           // either, so both are zero and weigh nothing.
                           cargo:0, cargoMax:0,
                           slewRate: 4 * Math.PI/180,      // rad/s maximum
                           slewAccel: 2 * Math.PI/180,     // rad/s^2
                           slewPower: 90,                  // W drawn by the wheels while turning
                           // Drag area. Every vehicle has one — an orbiting
                           // spacecraft simply never meets air thick enough
                           // for it to matter, and the model says so by
                           // returning zero density above the interface.
                           cda: 12, qMax: Infinity,
                           thrustSL: null, ispSL: null,
                           stages: null, stageIx: null, stageName: null, payload: 0 }, o);
  // Capacity and contents are the same number for every vehicle that launches
  // with full tanks, which is every vehicle that shipped before this one. A
  // ship that is meant to be FILLED IN ORBIT is the exception: it lifts off
  // with what a launcher can lift and the tank it flies home on is bigger than
  // that. Declaring `fuelMax` says so; leaving it out is the old behaviour,
  // exactly, which is why nothing before this moved.
  S.craft.fuelMax = o.fuelMax != null ? o.fuelMax : o.fuel;
  S.craft.rcsMax = o.rcsMax != null ? o.rcsMax : (o.rcs || 0);
  S.craft.cdaPayload = S.craft.cda;
  // A stacked vehicle. The spacecraft itself is the LAST stage of its own
  // stack — its dry mass, its tanks and its engine — so that dropping the
  // spent upper stage hands the player exactly the vehicle `rig` describes,
  // with full tanks, and so that the propellant it is carrying is lifted
  // rather than conjured. Getting this wrong is worth 20 tonnes of launch
  // mass, which is 20 tonnes the first stage never has to lift.
  if (o.stages && o.stages.length) {
    S.craft.payload = 0;
    S.craft.stages = o.stages.map(st => ({ ...st })).concat([{
      name: o.name, dry: o.dry, fuel: o.fuel || 0, fuelMax: S.craft.fuelMax,
      thrust: o.thrust, isp: o.isp,
      cda: S.craft.cdaPayload, qMax: Infinity, spacecraft: true }]);
    loadStage(0);
  }
}

/* ---- the launch vehicle -------------------------------------------------
   Two stages under whatever is riding on top. The numbers are ordinary for a
   medium launcher: a first stage that is mostly propellant and loses a tenth
   of its specific impulse to back-pressure at sea level, and a vacuum second
   stage that finishes the job. `cda` is Cd·A in m², `qMax` the design dynamic
   pressure — 1.4× that and the stack comes apart, which is what the throttle
   is for.

   Both launch missions fly the same stack, so one ascent tuning serves both
   and the ΔV budget means the same thing in each.                          */
const ASCENT_STACK = () => [
  { name:'FIRST STAGE',  dry:23000, fuel:430000, thrust:9400, thrustSL:8300, isp:311, ispSL:282,
    cda:16, qMax:40000 },

];

    setOrbit('MOON', 100, 100, 0, 0);
    S.landingAllowed = true;

    setOrbit('EARTH', 200, 200, 0, 0);

},

},

  setup(){ rig({name:'HELIOS-4', dry:1400, fuel:2600, thrust:12, isp:318, rcs:20});

    { text:'Survive perihelion passage', check:(s,d)=> s.soi==='SUN' && s.flags.perihelionPassed && s.therm.hull < 180 },

},
{

  brief:[

    'After that it is yours. The upper stage puts you in orbit with {full tanks}: the Moon is three days away, and station {CERES} at {400 km} will take a docking — TGT STATION, PLAN RDV, then DOCK.'],

{
  id:10, code:'M-00', name:'LAUNCH', next:1,
  brief:[
    'Sea level, and everything above you. This vehicle is on the pad with a two-stage launcher underneath it and a {185 km} orbit to reach.',
    'Orbit costs about {7.8 km/s} of velocity. You will spend nearer {8.9 km/s} getting there: the difference is gravity — every second spent climbing is a second of thrust paid to hold the vehicle up — and the air, which is thick enough at sea level to matter and gone by {140 km}. The planet hands you {465 m/s} of it for free, because you are already moving.',
    'So you do not fly straight up. You pitch over: {90°} off the pad, then steadily flatter, trading altitude for the sideways speed that is what orbit actually is. The {pitch program} on the LAUNCH page is that plan — five altitudes and the pitch to hold at each. It comes filed; you may fly it or change it.',
    'Watch dynamic pressure through {13 km}. The filed profile peaks at {35 kPa} against a {40 kPa} design limit, and the stack comes apart at 56 — flatten the turn and you will find that out. THR throttles back.',
    'First stage runs dry near {T+02:20}: {STAGE} and the second lights itself. Shut down when apoapsis reaches {185 km}, coast up to it, and circularise with {PLAN CIRC AP} — which is the whole of M-01, flown from the ground up.'],
  hint:'COUNT GO → STAGE → MECO at 185 km apoapsis → PLAN CIRC AP',

{
  /* The first mission that goes somewhere and comes back. It declares PHASES

     checkpoint at every boundary — an hour of flying must not be lost to one
     mistake at phase nine.                                                  */
  id:11, code:'M-10', name:'CARGO RUN', next:12,
  brief:[
    'Cold and dark at {Cape Auriga} with {1,800 kg} in the hold and a two-stage launcher underneath you. Station {CERES} is at {400 km} and expects the delivery; you bring {1,200 kg} back.',
    'This is a whole flight, not a manoeuvre. Ten phases: wake the vehicle, launch, park, phase up to CERES, dock, swap the load, undock, deorbit, survive the entry, splash down. Each phase is {checkpointed} — RESTART offers the last one back, or the pad if you would rather start over.',
    'Cargo is mass. Every kilogram in the hold is lifted by the launcher, carried by every burn, and slowed down again by the air on the way home. Watch the ΔV remaining move while you unload.',
    'Coming down is the new part. The {ENTRY} page carries the corridor: put periapsis inside the published band before you commit. Too steep and the heating rate takes the shield off in one piece; too shallow and you skim, exit and come round again, spending more of the shield every lap.',
    'Then {DROGUE} below 25 km and {MAINS} below 6 km — in that order, because the drogue is what brings dynamic pressure down far enough for the mains to survive being streamed. Splashdown wants under {10 m/s}.'],
  hint:'BATT → PWR UP → LAUNCH → COUNT GO',
  sys: [],
  setup(){ rig({name:'AURIGA-10', dry:2400, fuel:1800, thrust:28, isp:311, rcs:120, rcsIsp:220,
                crew:2, o2:900, cargo:1800, cargoMax:2200,
                // A capsule built to come home is BLUNT: the heat shield is
                // the drag area. 26 m² of it against 5 tonnes is a ballistic
                // coefficient of 190 kg/m², which is what keeps the peak
                // heating rate inside what the shield is rated for. At 12 m²
                // — an ordinary spacecraft's figure — there is no surviving
                // corridor at all: measured, every aim point either burns the
                // budget through or overruns the rate. Only the spacecraft
                // carries this; the launcher stages have their own.

    // The same launcher M-00 flies, with the same turn through the air — but a
    // flatter finish above it. This payload is a third of M-00's, so the
    // filed program puts apoapsis through 185 km while the vehicle is still at
    // 132 km and doing 3.8 km/s, which is a ballistic arc, not an orbit. Only
    // the two entries above the atmosphere move: 26° → 22° at 40 km and
    // 10° → 7° at 130 km. Max Q is unchanged at 36.5 kPa because nothing about

    S.objects = [ makeStation('EARTH', 400, 25) ];
    S.manifest = { deliver: 1800, collect: 1200 };
    S.landingAllowed = true;
    // The shield and the corridor it implies. The band is measured for THIS
    // airframe — a heavier vehicle penetrates deeper and peaks harder, so the
    // numbers are not transferable and are not guessed.
    S.shield.fitted = true; S.shield.band = [CARGO_BAND[0], CARGO_BAND[1]];
    S.power.battMax = 2400; S.power.batt = 900; S.power.area = 40; },
  phases:[
    { name:'POWER UP', text:'Bring every system up. The battery is the only power there is until the fairing goes.',
      hint:'BATT → BUS → AVIO → ATT → GNC, or PWR UP',
      check:()=> SYSIDS.every(id => !sysFitted(id) || sysOn(id)) },
    { name:'LIFT OFF', text:'Release the count and fly the pitch program out of the atmosphere.',
      hint:'COUNT GO → STAGE when the first stage is dry',
      check:(s,d)=> d.alt > 140 },
    { name:'PARKING ORBIT', text:'Shut down at 185 km apoapsis, coast up and circularise.',

      check:(s,d)=> d.e.e < 0.02 && d.perAlt > 150 },
    { name:'RENDEZVOUS', text:'Phase up to CERES at 400 km and close to inside 30 km.',

    { name:'DOCK', text:'Fly the corridor up the station\'s velocity vector, capture, retract the ring and close the latches.',
      hint:'DOCK AUTO, or fly it — then DOCK RETRACT → DOCK LATCH',
      check:(s)=> s.dock.phase === 'HARD' },
    { name:'CARGO', text:'Equalise, prove the seal, open the hatch, deliver 1,800 kg and take 1,200 kg on.',
      hint:'DOCK EQUALISE → DOCK LEAK → DOCK HATCH → DOCK UNLOAD → DOCK LOAD',
      check:(s)=> s.dock.cargo.done },
    { name:'UNDOCK', text:'Release the latches and back clear of the station.',

      check:(s)=>{ if (s.dock.phase !== 'FREE') return false;
                   const t = targetRel(); return !!t && V.len(t.r) > 0.1; } },
    { name:'DEORBIT', text:'Put periapsis inside the corridor on the ENTRY page. It is about 100 m/s retrograde.',
      hint:'PLAN PERI <km> inside the band → ENTRY to check it',
      check:(s,d)=> s.soi === 'EARTH' && d.perAlt >= CARGO_BAND[0] && d.perAlt <= CARGO_BAND[1] },
    { name:'ENTRY', text:'Fly it down. Hold the shield forward and watch the rate against its limit.',
      hint:'ENTRY page · shield budget and heating rate',
      check:(s,d)=> d.alt < 25 && s.soi === 'EARTH' && !s.shield.gone },
    { name:'SPLASHDOWN', text:'Drogue below 25 km, mains below 6 km, and under 10 m/s into the water.',
      hint:'DROGUE → MAINS',
      check:(s)=> s.status === 'landed' },
  ]
},
{
  /* The longest flight in the game, and the one the refuelling leg exists for.
     ARES-2 lifts off with 600 kg aboard — all a launcher can carry under a
     five-tonne Mars ship — and everything past low Earth orbit is flown on
     propellant that was already in orbit before she was.                    */
  id:12, code:'M-11', name:'MARS ROUND TRIP',
  brief:[
    'Cold and dark at {Cape Auriga} with a {nuclear thermal} stage under the capsule and {600 kg} of hydrogen aboard — {964 m/s}, and not a metre more. That is deliberate. You are not launching a Mars ship; you are launching an empty one.',
    'Depot {CERES} at {400 km} holds {32,000 kg} and does not refill itself. Dock, tie the bus, and pump. What you take is gone, and what you leave behind is what a later flight will find.',
    'Then: escape Earth, throw the aphelion out to {1.52 AU}, and fly {259 days} to a Mars flyby. No capture — you pass, you look, and Mars bends your orbit for free.',
    'Coming home is the hard half. {PLAN XFER EARTH} finds the return, but a transfer solver stops at the edge of a sphere of influence and cannot see the {Moon} sitting inside Earth\'s. Fly {PLAN TRIM EARTH} while you are still months out — the same correction costs a hundredth out there of what it costs on the doorstep.',
    'An interplanetary arrival is {11 km/s} at the interface and no heat shield aboard survives that, so this flight does not come down. You arrive on a {hyperbola} and you stop: one hard {retrograde burn at periapsis}, enough to close it into an ellipse. Circularising out where you arrive costs more than the tank holds.',
    'The mission ends {in orbit}. Bringing this crew through the atmosphere is a later flight and a harder problem than it looks — the arc a flyby leaves you on is nothing like the circular one the transfer solver assumes.',
    'Three crew, {three and a half to four years}. The {regenerative} life support recycles the air and runs on the bus — the oxygen reserve is only there for when the power is not.'],
  hint:'BATT → PWR UP → LAUNCH → COUNT GO', next:13,
  sys: [],
  setup(){ rig({name:'ARES-2', dry:5200, fuel:600, fuelMax:32000,
                thrust:250, isp:900, rcs:260, rcsIsp:220,
                crew:3, o2:2000, cda:26, stages: ASCENT_STACK()});
    setPad('EARTH', 0, { count: 600, program: [[0,90],[2,84],[10,58],[40,22],[130,7]] });
    S.objects = [ makeStation('EARTH', 400, 25) ];
    // A depot is a quantity, not a tap. It is sized so the round trip closes
    // with a real margin and no more — and so that taking it all leaves CERES
    // empty for whoever comes next.
    // 32,000 kg, not 26,000. Sized against the WORST return this trajectory
    // produces, not the luckiest: a flyby that leaves the ship on a fast arc
    // arrives at e = 5.16 and needs 7.2 km/s to close the hyperbola into a
    // 20,000 km ellipse. At 26,000 kg the ship arrived with 6.5 and captured
    // into 46,000 km with a dry tank — a mission that depends on flying the
    // injection well is a mission that strands people who flew it adequately.
    S.depot = { name:'CERES', prop: 32000, rate: 12 };
    S.landingAllowed = true;
    S.shield.fitted = true; S.shield.band = [MARS_BAND[0], MARS_BAND[1]];
    S.power.battMax = 4000; S.power.batt = 1400; S.power.area = 90; },
  phases:[
    { name:'POWER UP', text:'Bring every system up. The battery is the only power there is until the fairing goes.',
      hint:'BATT → BUS → AVIO → ATT → GNC, or PWR UP',
      check:()=> SYSIDS.every(id => !sysFitted(id) || sysOn(id)) },
    { name:'LIFT OFF', text:'Release the count and fly the pitch program out of the atmosphere.',
      hint:'COUNT GO → STAGE when the first stage is dry',
      check:(s,d)=> d.alt > 140 },
    { name:'PARKING ORBIT', text:'Shut down at 185 km apoapsis, coast up and circularise.',
      hint:'MECO at 185 km apoapsis → PLAN CIRC AP',
      check:(s,d)=> d.e.e < 0.02 && d.perAlt > 150 },
    { name:'RENDEZVOUS', text:'Phase up to CERES at 400 km and close to inside 30 km. Under a kilometre a second in the tank — spend it carefully.',
      hint:'TGT STATION → PLAN RDV → PLAN CIRC AP',
      check:()=>{ const t = targetRel(); return !!t && V.len(t.r) < 30; } },
    { name:'DOCK AND FUEL', text:'Capture, latch, prove the seal, tie the bus and pump CERES dry.',
      hint:'DOCK AUTO → RETRACT → LATCH → EQUALISE → LEAK → UMB → TIE → LINE → XFER',
      check:(s)=> s.dock.phase === 'HARD' && s.craft.fuel > s.craft.fuelMax * 0.9 },
    { name:'TRANS-MARS INJECTION', text:'Undock, escape Earth, then throw aphelion out to Mars\' orbit.',
      hint:'DOCK UNDOCK → PLAN ESC → PLAN XFER MARS',
      check:(s,d)=> s.soi === 'SUN' && d.e.ra > BODIES.MARS.a * 0.97 },
    { name:'MARS FLYBY', text:'Cross into Mars\' sphere of influence and come out the other side. No capture burn — you are not staying.',
      hint:'WARP 1000000 and wait out the 259 days',
      check:(s)=> s.flags.marsSOI && s.soi === 'SUN' },
    { name:'RETURN', text:'Solve the transfer home and fly it. Trim the approach long before you get there.',
      hint:'PLAN XFER EARTH → then PLAN TRIM EARTH mid-cruise',
      check:(s)=> s.soi === 'EARTH' },
    // The last phase, and the mission ends here — in orbit, not in the water.
    //
    // Coming down from an interplanetary return is a separate problem and an
    // honest one: the ship arrives far faster than the shield M-10 carries, and
    // the trajectory that gets it home is planned by `transferWindow`, which
    // assumes a circular departure orbit and cannot describe the eccentric arc
    // a flyby leaves you on. Rather than pretend, the crew stop in Earth orbit
    // and a later flight brings them down.
    //
    // The hint matters. PLAN TRIM is a MIDCOURSE tool — inside Earth's sphere
    // of influence, on a hyperbola, there is no apoapsis for it or for PLAN
    // PERI to work at, and circularising at an 8,000 km periapsis costs 3.7
    // km/s and strands the ship. The move is a retrograde burn AT PERIAPSIS,

    { name:'EARTH CAPTURE', text:'You are falling past your own planet on a hyperbola. Burn retrograde at periapsis — hard — and let it close into an ellipse. Circularising out there costs more than you have.',
      hint:'BURN RET <seconds> AT PE, sized to leave an ellipse under 20,000 km',
