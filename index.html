<title>Delta-V Flight Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --void:#070A10;
  --panel:#0E141D;
  --panel-2:#131B26;
  --rule:#1E2937;
  --rule-soft:#161F2B;
  --amber:#F2A33C;
  --amber-dim:#9A6A2A;
  --cyan:#3FA9C9;
  --cyan-dim:#2B7A94;
  --cyan-deep:#1C4C5C;
  --slate:#7C8BA1;
  --slate-dim:#4A566A;
  --nominal:#4FD1A5;
  --caution:#E8C04A;
  --critical:#E4553C;
  --ink:#DCE4EE;
  --f-disp:'Chakra Petch','DIN Alternate','Helvetica Neue',sans-serif;
  --f-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);
  font-family:var(--f-mono);font-size:13px;line-height:1.45;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
#app{
  height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-left)) 6px max(10px,env(safe-area-inset-right));
  gap:8px;max-width:1400px;margin:0 auto;width:100%;
}

/* ---------- status rail ---------- */
.rail{
  display:flex;align-items:stretch;gap:0;
  border-bottom:1px solid var(--rule);
  padding-block:7px 6px;flex:0 0 auto;
  font-family:var(--f-disp);
}
.rail-cell{display:flex;flex-direction:column;justify-content:center;padding-right:11px;min-width:0;overflow:hidden}
.rail-cell + .rail-cell{padding-left:11px;border-left:1px solid var(--rule-soft)}
.rail-k{font-size:8.5px;letter-spacing:.14em;color:var(--slate-dim);text-transform:uppercase;white-space:nowrap}
.rail-v{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.rail-v.small{font-size:12px}
.rail-spacer{flex:1 1 auto;min-width:4px}
.lamp{
  align-self:center;flex:0 0 auto;max-width:42vw;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-disp);font-size:9px;font-weight:700;
  letter-spacing:.12em;padding:4px 8px;border:1px solid;border-radius:2px;white-space:nowrap;
}
.lamp.ok{color:var(--nominal);border-color:#1E5A48;background:#0B1F1A}
.lamp.caution{color:var(--caution);border-color:#5C4B15;background:#1F1A08;animation:pulse 1.4s ease-in-out infinite}
.lamp.crit{color:var(--critical);border-color:#6B2418;background:#1F0D0A;animation:pulse .7s steps(2,end) infinite}
.warprow{display:flex;align-items:center;gap:5px}
.wbtn{
  flex:0 0 auto;width:21px;height:21px;background:#0B121B;border:1px solid var(--rule);
  color:var(--slate);font-family:var(--f-mono);font-size:13px;line-height:1;border-radius:2px;
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
}
.wbtn:active{background:var(--panel-2);color:var(--amber)}
.railbtn{
  align-self:center;flex:0 0 auto;margin-left:7px;background:#0B121B;
  border:1px solid var(--rule);color:var(--slate);font-family:var(--f-disp);
  font-size:8.5px;font-weight:700;letter-spacing:.11em;padding:9px 9px;
  border-radius:2px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;
}
.railbtn:active,.railbtn:focus-visible{background:var(--panel-2);color:var(--amber);border-color:var(--amber-dim);outline:none}

@media (max-width:600px){
  .rail-cell{padding-right:7px}
  .rail-cell + .rail-cell{padding-left:7px}
  .rail-k{font-size:7.5px;letter-spacing:.1em}
  .rail-v{font-size:12px}
  .rail-v.small{font-size:11px}
  #cell-dv{display:none}
  .lamp{font-size:8px;padding:3px 6px;letter-spacing:.07em;max-width:30vw}
  #cell-ref{display:none}                 /* the CDU title already names the reference */
  .wbtn{width:19px;height:19px;font-size:12px}
  .railbtn{font-size:8px;padding:8px 7px;margin-left:5px;letter-spacing:.08em}
}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lamp{animation:none!important}}

/* ---------- main split ---------- */
.deck{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
@media (min-width:860px){
  .deck{flex-direction:row}
  .deck > .col-a{flex:1 1 52%;min-width:0;display:flex;flex-direction:column;gap:8px}
  .deck > .col-b{flex:1 1 48%;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
}
.col-a{display:flex;flex-direction:column;gap:8px;min-height:0;flex:0 0 auto}
.col-b{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1 1 auto}

/* ---------- plot ---------- */
.scope{
  position:relative;background:#060B12;border:1px solid var(--rule);
  flex:0 0 auto;height:34dvh;min-height:180px;overflow:hidden;
}
@media (min-width:860px){.scope{flex:1 1 auto;height:auto;min-height:280px}}
.scope canvas{display:block;width:100%;height:100%;touch-action:none}
.scope-tag{
  position:absolute;top:6px;left:8px;font-family:var(--f-disp);font-size:8.5px;
  letter-spacing:.16em;color:var(--cyan-deep);text-transform:uppercase;pointer-events:none;
}
.scope-scale{
  position:absolute;bottom:6px;right:8px;font-size:9px;color:var(--slate-dim);
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.scope-zoom{position:absolute;bottom:6px;left:8px;display:flex;gap:4px}
.zbtn{
  width:26px;height:26px;background:#0B121B;border:1px solid var(--rule);color:var(--slate);
  font-family:var(--f-mono);font-size:13px;line-height:1;cursor:pointer;border-radius:2px;padding:0;
}
.zbtn:active{background:var(--panel-2);color:var(--amber)}

/* ---------- readout grid ---------- */
.readout{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule);flex:0 0 auto;
}
.ro{background:var(--panel);padding:6px 8px 7px;min-width:0}
.ro-k{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.13em;color:var(--slate-dim);text-transform:uppercase}
  .ro-v{font-size:13.5px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.ro-u{font-size:9px;color:var(--slate-dim);font-weight:400;margin-left:2px}
.ro.warn .ro-v{color:var(--caution)}
.ro.bad .ro-v{color:var(--critical)}

/* ---------- CDU: paged control & display unit ----------
   Layout follows the Airbus MCDU: a title line carrying the page number, six
   label/data row pairs split left and right, line-select keys flanking each
   row, and a scratchpad line at the bottom that carries both typed entry and
   system messages. Small type for labels, large for data.                  */
.cdu{
  flex:1 1 auto;display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border:1px solid var(--rule);
}
.cdu-title{
  display:flex;align-items:center;gap:8px;padding:5px 8px;flex:0 0 auto;
  border-bottom:1px solid var(--rule-soft);
}
.cdu-t{
  font-family:var(--f-disp);font-size:10.5px;font-weight:600;letter-spacing:.15em;
  color:var(--cyan);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cdu-sub{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.1em;color:var(--slate-dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdu-pg{margin-left:auto;font-size:9px;color:var(--slate-dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.slew{
  flex:0 0 auto;width:24px;height:22px;background:#0B121B;border:1px solid var(--rule);
  color:var(--slate);font-size:12px;line-height:1;border-radius:2px;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;
}
.slew:disabled{opacity:.3;cursor:default}
.slew:active:not(:disabled){background:var(--panel-2);color:var(--amber)}

/* Flex rather than grid: a grid's 1fr column is measured at max-content while
   row heights are computed, so wrapped text reports one line and then overflows
   its track. Flex resolves the width first, so a wrapped row sizes correctly. */
.cdu-body{
  display:flex;flex-direction:column;gap:3px;padding:3px;
  flex:1 1 auto;min-height:150px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.rowgrp{display:flex;align-items:stretch;gap:3px;min-width:0}
.rowgrp > .crow{flex:1 1 auto;min-width:0}
.rowgrp > .lsk{flex:0 0 22px;align-self:stretch}
.cdu-body::-webkit-scrollbar{width:3px}
.cdu-body::-webkit-scrollbar-thumb{background:var(--rule)}
.lsk{
  width:22px;min-height:30px;
  background:#0C131C;border:1px solid var(--rule);border-radius:2px;
  color:#2B3444;font-size:10px;line-height:1;cursor:default;padding:0;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.lsk.on{color:var(--cyan);border-color:#25404E;background:#0E1A22;cursor:pointer}
.lsk.on:active{background:#15303C;color:var(--amber)}
.lsk.go{color:var(--caution);border-color:#4A3B12;background:#1A1608}
.lsk.go:active{background:#2A2410}

.crow{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0;min-height:30px;
  align-items:center;padding:3px 5px;border-bottom:1px solid #111925;
}
.crow.full{grid-template-columns:minmax(0,1fr)}
.crow.bare{border-bottom:0}
.fld{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.fld.right{text-align:right}
.flab{
  font-family:var(--f-disp);font-size:7.5px;letter-spacing:.13em;color:var(--slate-dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;
}
.fval{
  font-size:12.5px;font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;letter-spacing:-.01em;
}
/* free text: wraps over as many display lines as it needs */
.fval.wrap{
  white-space:pre-wrap;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;
  line-height:1.45;letter-spacing:0;font-variant-numeric:normal;
}
.fval.body{font-size:12px;color:var(--ink);font-weight:400}
.fval.sel{color:var(--cyan)}
.fval.go{color:var(--caution)}
.fval.ok{color:var(--nominal)}
.fval.bad{color:var(--critical)}
.fval.dim{color:var(--slate-dim)}
.fld.tap{cursor:pointer}

/* ---------- scratchpad line ---------- */
.entry{
  display:flex;align-items:center;flex:0 0 auto;position:relative;
  border-top:1px solid var(--rule);background:#0A101A;
}
.entry .caret{padding:0 6px 0 8px;color:var(--cyan);font-weight:700;flex:0 0 auto}
#cmd{
  flex:1 1 auto;min-width:0;background:transparent;border:0;outline:none;color:var(--amber);
  font-family:var(--f-mono);font-size:16px;font-weight:500;padding:10px 0;letter-spacing:.02em;
}
#cmd::placeholder{color:#313C4E;font-weight:400}
.spmsg{
  position:absolute;left:22px;right:96px;top:50%;transform:translateY(-50%);
  font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
}
.spmsg.info{color:var(--slate)}
.spmsg.ok{color:var(--nominal)}
.spmsg.warn{color:var(--caution)}
.spmsg.err{color:var(--critical)}
.entry button{
  flex:0 0 auto;background:transparent;border:0;border-left:1px solid var(--rule);
  font-family:var(--f-disp);font-size:10px;font-weight:700;letter-spacing:.12em;
  padding:12px 9px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#clr{color:var(--slate)}
#go{color:var(--cyan)}
.entry button:active{background:var(--panel-2);color:var(--amber)}

/* ---------- function keys: page selection only ---------- */
.pagekeys{
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.pk{
  min-width:0;background:#111925;border:1px solid var(--rule);color:var(--slate);
  font-family:var(--f-disp);font-size:9.5px;font-weight:600;letter-spacing:.06em;
  padding:7px 2px;border-radius:2px;cursor:pointer;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center;
  -webkit-tap-highlight-color:transparent;
}
.pk:active{background:#1B2534;color:var(--amber)}
.pk.cur{color:var(--amber);border-color:var(--amber-dim);background:#191A14}
button:focus-visible,input:focus-visible{outline:1px solid var(--amber);outline-offset:-1px}

/* ---------- boot veil ---------- */
#veil{
  position:fixed;inset:0;background:var(--void);z-index:30;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;
}
#veil h1{font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:.2em;
  color:var(--amber);margin:0;text-align:center;text-wrap:balance}
#veil p{color:var(--slate);font-size:12px;margin:0;text-align:center;max-width:34ch}
#veil button{
  background:#111925;border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--f-disp);
  font-size:13px;font-weight:700;letter-spacing:.16em;padding:12px 26px;border-radius:2px;cursor:pointer;
}
#veil button:active{background:#1B2534}
.hidden{display:none!important}
</style>

<div id="app">
  <div class="rail" id="rail">
    <div class="rail-cell"><span class="rail-k">MET</span><span class="rail-v" id="r-met">000:00:00:00</span></div>
    <div class="rail-cell"><span class="rail-k">Warp</span><span class="warprow"><button class="wbtn" id="w-dn" type="button" aria-label="Slower">−</button><span class="rail-v" id="r-warp">1×</span><button class="wbtn" id="w-up" type="button" aria-label="Faster">+</button></span></div>
    <div class="rail-cell" id="cell-ref"><span class="rail-k">Ref</span><span class="rail-v small" id="r-soi">EARTH</span></div>
    <div class="rail-cell" id="cell-dv"><span class="rail-k">ΔV Rem</span><span class="rail-v small" id="r-dv">0</span></div>
    <div class="rail-spacer"></div>
    <div class="lamp ok" id="r-lamp">NOMINAL</div>
    <button class="railbtn" id="fs" type="button" aria-label="Toggle fullscreen">FULL</button>
  </div>

  <div class="deck">
    <div class="col-a">
      <div class="scope">
        <canvas id="scope"></canvas>
        <div class="scope-tag" id="scope-tag">ORBITAL PLOT · EARTH</div>
        <div class="scope-zoom">
          <button class="zbtn" id="z-out" aria-label="Zoom out">−</button>
          <button class="zbtn" id="z-in" aria-label="Zoom in">+</button>
          <button class="zbtn" id="z-fit" aria-label="Fit view">⊡</button>
        </div>
        <div class="scope-scale" id="scope-scale">—</div>
      </div>
      <div class="readout" id="readout">
        <div class="ro"><div class="ro-k">Alt</div><div class="ro-v" id="d-alt">—</div></div>
        <div class="ro"><div class="ro-k">Vel</div><div class="ro-v" id="d-vel">—</div></div>
        <div class="ro"><div class="ro-k" id="k-apo">Apo</div><div class="ro-v" id="d-apo">—</div></div>
        <div class="ro"><div class="ro-k" id="k-tapo">T−Apo</div><div class="ro-v" id="d-tapo">—</div></div>
        <div class="ro"><div class="ro-k" id="k-per">Peri</div><div class="ro-v" id="d-per">—</div></div>
        <div class="ro"><div class="ro-k" id="k-tper">T−Peri</div><div class="ro-v" id="d-tper">—</div></div>
        <div class="ro"><div class="ro-k">Ecc</div><div class="ro-v" id="d-ecc">—</div></div>
        <div class="ro"><div class="ro-k">Period</div><div class="ro-v" id="d-prd">—</div></div>
      </div>
    </div>

    <div class="col-b">
      <div class="cdu">
        <div class="cdu-title">
          <span class="cdu-t" id="cdu-t">ORBIT</span>
          <span class="cdu-sub" id="cdu-sub"></span>
          <span class="cdu-pg" id="cdu-pg">1/1</span>
          <button class="slew" id="pg-prev" type="button" aria-label="Previous page">‹</button>
          <button class="slew" id="pg-next" type="button" aria-label="Next page">›</button>
        </div>
        <div class="cdu-body" id="cdu-body"></div>
        <form class="entry" id="entry" autocomplete="off">
          <span class="caret">›</span>
          <input id="cmd" name="cmd" type="text" placeholder="" autocomplete="off"
                 autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="send">
          <span class="spmsg info" id="spmsg"></span>
          <button id="clr" type="button">CLR</button>
          <button id="go" type="submit">EXEC</button>
        </form>
      </div>
      <div class="pagekeys" id="pagekeys"></div>
    </div>
  </div>
</div>

<div id="veil">
  <h1>DELTA-V</h1>
  <p>Orbital flight console. Patched-conic guidance, navigation and control.</p>
  <button id="boot" type="button">POWER ON</button>
</div>

<script>
"use strict";
/* ============================================================
   DELTA-V — orbital flight console
   Planar patched-conic simulation. Units: km, km/s, s, kg.
   ============================================================ */

const G0 = 9.80665;            // m/s^2
const TAU = Math.PI * 2;
const AU = 149597870.7;        // km

/* ---- celestial bodies -------------------------------------
   `a` / `period` describe a circular orbit about `parent`.
   `soi` is the sphere-of-influence radius used for conic patching. */
const BODIES = {
  SUN:   { name:'SUN',   mu:1.32712440018e11, R:696340, parent:null,   color:'#F2A33C', soi:Infinity },
  EARTH: { name:'EARTH', mu:398600.4418, R:6371,   parent:'SUN',   a:AU,          period:3.15581e7, phase0:1.10, soi:924000,  color:'#3FA9C9', atmo:140 },
  MOON:  { name:'MOON',  mu:4902.800,    R:1737.4, parent:'EARTH', a:384400,      period:2.360591e6, phase0:0.40, soi:66100,  color:'#8A93A3' },
  VENUS: { name:'VENUS', mu:324858.6,    R:6051.8, parent:'SUN',   a:0.72333*AU,  period:1.94141e7, phase0:4.10, soi:616000,  color:'#D8B26A', atmo:250 },
  MARS:  { name:'MARS',  mu:42828.37,    R:3389.5, parent:'SUN',   a:1.52366*AU,  period:5.93554e7, phase0:4.6407, soi:577000,  color:'#C2603F', atmo:110 },
};
const CHILDREN = {};
for (const k in BODIES) {
  const p = BODIES[k].parent;
  if (p) (CHILDREN[p] = CHILDREN[p] || []).push(k);
  else CHILDREN[k] = CHILDREN[k] || [];
}

/* ---- small vector helpers --------------------------------- */
const V = {
  add:(a,b)=>({x:a.x+b.x, y:a.y+b.y}),
  sub:(a,b)=>({x:a.x-b.x, y:a.y-b.y}),
  mul:(a,s)=>({x:a.x*s, y:a.y*s}),
  dot:(a,b)=>a.x*b.x + a.y*b.y,
  crs:(a,b)=>a.x*b.y - a.y*b.x,
  len:a=>Math.hypot(a.x,a.y),
  unit:a=>{const m=Math.hypot(a.x,a.y); return m<1e-12?{x:0,y:0}:{x:a.x/m,y:a.y/m};},
  rot:(a,t)=>({x:a.x*Math.cos(t)-a.y*Math.sin(t), y:a.x*Math.sin(t)+a.y*Math.cos(t)}),
};

/* ---- body ephemeris (circular, coplanar) ------------------- */
function bodyStateInParent(key, t) {
  const b = BODIES[key];
  if (!b.parent) return { r:{x:0,y:0}, v:{x:0,y:0} };
  const th = b.phase0 + TAU * t / b.period;
  const sp = TAU * b.a / b.period;
  return { r:{x:b.a*Math.cos(th), y:b.a*Math.sin(th)},
           v:{x:-sp*Math.sin(th),  y: sp*Math.cos(th)} };
}
/** State of `key` expressed in the frame centred on `frame`. */
function absState(k, t) {
  let r = {x:0,y:0}, v = {x:0,y:0}, c = k;
  while (BODIES[c].parent) {
    const s = bodyStateInParent(c, t);
    r = V.add(r, s.r); v = V.add(v, s.v);
    c = BODIES[c].parent;
  }
  return { r, v };
}
function bodyStateIn(frame, key, t) {
  if (frame === key) return { r:{x:0,y:0}, v:{x:0,y:0} };
  const A = absState(key, t), B = absState(frame, t);
  return { r:V.sub(A.r, B.r), v:V.sub(A.v, B.v) };
}

/* ---- Stumpff functions ------------------------------------- */
function stumpffC(z){
  if (z > 1e-8)  { const s=Math.sqrt(z);  return (1-Math.cos(s))/z; }
  if (z < -1e-8) { const s=Math.sqrt(-z); return (Math.cosh(s)-1)/(-z); }
  return 0.5 - z/24 + z*z/720;
}
function stumpffS(z){
  if (z > 1e-8)  { const s=Math.sqrt(z);  return (s-Math.sin(s))/(s*s*s); }
  if (z < -1e-8) { const s=Math.sqrt(-z); return (Math.sinh(s)-s)/(s*s*s); }
  return 1/6 - z/120 + z*z/5040;
}

/* ---- universal-variable two-body propagation ---------------
   Exact for ellipse, parabola and hyperbola alike, which is what
   lets time warp jump hours in a single step without drift.     */
function propagate(r0v, v0v, mu, dt) {
  if (dt === 0) return { r:{...r0v}, v:{...v0v} };
  const r0 = V.len(r0v), v0 = V.len(v0v);
  const vr0 = V.dot(r0v, v0v) / r0;
  const alpha = 2/r0 - v0*v0/mu;           // 1/a
  const sq = Math.sqrt(mu);

  let x;
  if (alpha > 1e-10) {                      // ellipse
    x = sq * dt * alpha;
  } else if (alpha < -1e-10) {              // hyperbola
    const a = 1/alpha;
    x = Math.sign(dt) * Math.sqrt(-a) * Math.log(
      (-2*mu*alpha*dt) /
      (V.dot(r0v,v0v) + Math.sign(dt)*Math.sqrt(-mu*a)*(1 - r0*alpha)) );
    if (!isFinite(x)) x = Math.sign(dt) * Math.sqrt(-a);
  } else {                                  // near-parabolic
    x = sq * dt / r0;
  }

  for (let i = 0; i < 80; i++) {
    const z = alpha*x*x, C = stumpffC(z), S = stumpffS(z);
    const F  = r0*vr0/sq*x*x*C + (1-alpha*r0)*x*x*x*S + r0*x - sq*dt;
    const dF = r0*vr0/sq*x*(1 - alpha*x*x*S) + (1-alpha*r0)*x*x*C + r0;
    if (Math.abs(dF) < 1e-14) break;
    const d = F/dF;
    x -= d;
    if (Math.abs(d) < 1e-9) break;
  }

  const z = alpha*x*x, C = stumpffC(z), S = stumpffS(z);
  const f = 1 - x*x/r0*C;
  const g = dt - x*x*x/sq*S;
  const R = V.add(V.mul(r0v,f), V.mul(v0v,g));
  const rm = V.len(R);
  const fd = sq/(rm*r0) * (alpha*x*x*x*S - x);
  const gd = 1 - x*x/rm*C;
  const Vv = V.add(V.mul(r0v,fd), V.mul(v0v,gd));
  if (!isFinite(R.x)||!isFinite(R.y)||!isFinite(Vv.x)||!isFinite(Vv.y))
    return { r:{...r0v}, v:{...v0v} };
  return { r:R, v:Vv };
}

/* ---- orbital elements from a state vector ------------------ */
function elements(r0v, v0v, mu) {
  const r = V.len(r0v), v = V.len(v0v);
  const h = V.crs(r0v, v0v);                       // scalar in-plane
  const en = v*v/2 - mu/r;
  const a  = Math.abs(en) < 1e-12 ? Infinity : -mu/(2*en);
  const evx = ((v*v - mu/r)*r0v.x - V.dot(r0v,v0v)*v0v.x)/mu;
  const evy = ((v*v - mu/r)*r0v.y - V.dot(r0v,v0v)*v0v.y)/mu;
  const e  = Math.hypot(evx, evy);
  const argp = Math.atan2(evy, evx);
  const dir = h >= 0 ? 1 : -1;
  // true anomaly: angle from the eccentricity vector to r, measured along motion
  const nu = normAngle(dir * (Math.atan2(r0v.y, r0v.x) - argp));
  const p  = h*h/mu;
  const rp = (e < 1) || a < 0 ? a*(1-e) : p/(1+e);
  const ra = e < 1 ? a*(1+e) : Infinity;
  const period = e < 1 && a > 0 ? TAU*Math.sqrt(a*a*a/mu) : Infinity;
  return { r, v, h, a, e, argp, dir, nu, rp, ra, period, energy:en, p,
           vr: V.dot(r0v,v0v)/r };
}
function normAngle(x){ x %= TAU; return x < 0 ? x + TAU : x; }

/* ---- time until next periapsis / apoapsis ------------------ */
function timeToAnomaly(el, mu, targetNu) {
  if (!(el.e < 1) || !(el.a > 0)) return Infinity;
  const M = (nu) => {
    const E = 2*Math.atan2(Math.sqrt(1-el.e)*Math.sin(nu/2), Math.sqrt(1+el.e)*Math.cos(nu/2));
    return E - el.e*Math.sin(E);
  };
  const n = Math.sqrt(mu/(el.a*el.a*el.a));
  let dM = normAngle(M(targetNu) - M(el.nu));
  return dM / n;
}
/**
 * Time to the next periapsis. Handles hyperbolic arcs too — which is the whole
 * point, because every interplanetary arrival is hyperbolic and the capture
 * burn has to be scheduled at its periapsis.
 */
function tToPeri(el, mu) {
  if (el.e < 1 && el.a > 0) return timeToAnomaly(el, mu, 0);
  if (el.e > 1) {
    let nu = el.nu > Math.PI ? el.nu - TAU : el.nu;      // signed, -π..π
    const k = Math.sqrt((el.e - 1)/(el.e + 1)) * Math.tan(nu/2);
    if (Math.abs(k) >= 1) return Infinity;               // beyond the asymptote
    const H = 2 * Math.atanh(k);
    const M = el.e * Math.sinh(H) - H;
    const n = Math.sqrt(mu / Math.pow(-el.a, 3));
    const dt = -M / n;                                   // M < 0 inbound
    return dt > 1e-9 ? dt : Infinity;
  }
  return Infinity;
}
const tToApo = (el,mu) => timeToAnomaly(el, mu, Math.PI);

/* ---- circular / escape speeds ------------------------------ */
const vCirc = (mu,r) => Math.sqrt(mu/r);
const vAtR  = (mu,r,a) => Math.sqrt(Math.max(0, mu*(2/r - 1/a)));
</script>

<script>

  warp: 1, paused: true,
  att: 'PRO', burn: null, sched: null,
  target: null, objects: [],
  mission: null, objectives: [], status: 'idle',

  power: { batt:100, battMax:100, area:14, eff:0.29, load:340, gen:0, tie:0, ecl:false },

    phase: 'FREE', leg: null,
    misalign: 0, misalign0: 0, sign: 1, offset: 0,
    ring: 0, latches: 0, latching: false,
    auto: false, autoT: 0, attempts: 0, bounces: 0, passed: false,

const craftMass = () => S.craft.dry + S.craft.fuel + S.craft.rcs;
const dvRemaining = () => {

};
const soiBody = () => BODIES[S.soi];
const el = () => elements(S.r, S.v, soiBody().mu);

/* ---- derived telemetry, recomputed each frame -------------- */
let D = {};

  const b = soiBody(), e = el();
  const alt = e.r - b.R;
  const sunR = absState(S.soi, S.t).r;                    // body position w.r.t. Sun
  const craftSun = V.add(sunR, S.r);
  const dSun = Math.max(1, V.len(craftSun));

  if (S.loads.COMM) load += 80;

    e, b, alt, dSun, flux, ecl, gen, load, tie,

/* ---- power / thermal integration --------------------------- */
function stepSystems(dt) {

  // Breathing is only free once the station's air is ducted through the hatch.
  if (S.craft.crew && !S.dock.air.fan)

/* ---- thrust ------------------------------------------------ */
/* ---- attitude ------------------------------------------------------------
   The vehicle no longer points wherever the trajectory says. `mode` names a
   reference the autopilot chases; the nose slews toward it at a finite rate and
   spends RCS propellant doing so. Thrust comes out of the nose, so a burn that
   is commanded before the vehicle has turned simply waits.            */

/** The inertial heading `mode` currently asks for, in radians. */
function commandedTheta(mode) {
  const m = mode || S.att.mode;
  const ang = (v) => Math.atan2(v.y, v.x);
  switch (m) {
    case 'PRO':  return ang(S.v);
    case 'RET':  return ang(S.v) + Math.PI;
    case 'ROUT': return ang(S.r);
    case 'RIN':  return ang(S.r) + Math.PI;
    case 'TGT':  { const t = targetRel(); return t ? ang(t.r) : S.att.theta; }
    case 'ATGT': { const t = targetRel(); return t ? ang(t.r) + Math.PI : S.att.theta; }
    // Down the station's docking axis, nose-first into its port. The station
    // holds an Earth-facing attitude, so this reference turns at orbital rate
    // — 0.065°/s, which the autopilot tracks without noticing.
    case 'PAXS': { const g = dockGeom(); return g ? g.axisAngle + Math.PI : S.att.theta; }

}
/** Signed shortest angle from a to b, in (-π, π]. */
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d <= -Math.PI) d += TAU; return d; }

const attError = () => Math.abs(angDiff(S.att.theta, commandedTheta()));
const ALIGN_TOL = 0.5 * Math.PI/180;      // 0.5° counts as pointed

/** Seconds to slew `ang` radians from rest under a trapezoidal rate profile. */
function slewTime(ang, maxRate, accel) {
  ang = Math.abs(ang);
  const dAcc = maxRate * maxRate / (2 * accel);
  return ang <= 2 * dAcc ? 2 * Math.sqrt(ang / accel)
                         : 2 * (maxRate / accel) + (ang - 2 * dAcc) / maxRate;
}

/** Slew the vehicle toward its commanded attitude, charging RCS for the turn.
 *
 *  Note the sub-stepping. advance() hands this the Kepler chunk, which is
 *  deliberately coarse while coasting — hundreds of seconds. Integrating a
 *  bang-bang controller at that step diverges rather than converges, so when
 *  the whole slew fits inside the chunk it is settled analytically, and only a
 *  slew that outlasts the chunk is integrated. */
function stepAttitude(dt) {
  const a = S.att, c = S.craft;
  // Mated to a station the vehicle has no attitude of its own — the interface
  // holds it. stepDock places it each step.
  if (S.dock.phase !== 'FREE') { a.rate = 0; a.slewing = false; return; }
  if (a.mode === 'FREE' || dt <= 0) { a.rate = 0; a.slewing = false; return; }
  const maxRate = c.slewRate || 4*Math.PI/180;
  const accel   = c.slewAccel || 2*Math.PI/180;
  // Turning is done on reaction wheels, which draw power rather than mass.
  // This is both what real spacecraft do and the only version that leaves the
  // vehicle's mass untouched: spending even 0.25 kg of propellant to turn
  // changes the injection by ~0.05 m/s, which over a 259-day transfer to Mars
  // is a 550,000 km miss.
  if (S.power.batt <= 0 && D.gen < D.load) { a.rate = 0; a.slewing = false; return; }

  const err0 = angDiff(a.theta, commandedTheta());
  const need = slewTime(err0, maxRate, accel) + Math.abs(a.rate) / accel;
  if (dt >= need) {                                    // settles within this chunk
    a.slewing = Math.abs(err0) > ALIGN_TOL;
    a.theta = commandedTheta();
    a.rate = 0;
    return;

  a.slewing = true;
  const h = Math.min(0.25, dt);
  for (let t = 0; t < dt - 1e-9; t += h) {
    const step = Math.min(h, dt - t);
    const err = angDiff(a.theta, commandedTheta());
    const brake = (a.rate * a.rate) / (2 * accel);
    const want = Math.abs(err) <= brake ? 0
      : Math.sign(err) * Math.min(maxRate, Math.sqrt(2 * accel * Math.abs(err)));
    const dvr = want - a.rate;
    a.rate += Math.sign(dvr) * Math.min(Math.abs(dvr), accel * step);
    a.theta = normAngle(a.theta + a.rate * step);

  // reference: a tracking lag would quietly shift every tested trajectory.
  if (Math.abs(angDiff(a.theta, commandedTheta())) < ALIGN_TOL) {

function thrustDir() {
  return { x: Math.cos(S.att.theta), y: Math.sin(S.att.theta) };
}

/* ---- docking ------------------------------------------------------------
   Both vehicles carry a port on a mast, so the nose angle and the port's
   position are coupled: a 10° misalignment swings this vehicle's port 0.43 m
   sideways. That coupling is the whole reason alignment matters — without a
   mast, pointing would be cosmetic.

   The station holds an Earth-facing attitude (nose along its velocity) and
   its port faces aft. So the approach runs up the velocity vector from
   behind, and a vehicle sitting on that line is in the SAME orbit as the
   station: it stays there for free. An inertially-fixed station would sweep
   its corridor a full turn every 92 minutes, which is not a corridor at all.  */

const PORT_ARM_STN = 0.006;     // km — the station's port, 6 m out from its centre
const DOCK_ENV = {
  closeClean: 0.10, closeMax: 0.15,       // m/s  closing at contact
  latClean:   0.10, latMax:   0.25,       // m    port-to-port miss distance
  rateClean:  0.02, rateMax:  0.05,       // m/s  lateral rate at contact
  alignClean: 4,    alignMax: 10,         // deg  nose vs the docking axis

 *  `lateral` is the signed miss distance across it. `align` is the one angle
 *  this flat world has: there is no separate roll. */

  // inertial velocity slides across it at wS × range — 0.013 m/s ten metres

  // and capture would be judged against a rate the interface never sees.

    axial: aKm * 1000, lateral: lKm * 1000,

    latRate:  (V.dot(dv, lat)  - wS * aKm) * 1000,

    corridor: Math.atan2(Math.abs(lKm), Math.max(aKm, 1e-12)) * 180/Math.PI,

function rcsPulse(dirUnit, dvMs) {

  const m0 = craftMass();
  const used = Math.min(S.craft.rcs, m0 * (1 - Math.exp(-dvMs/(S.craft.rcsIsp*G0))));

 *  own — the station's structure carries it, so it is placed, not propagated. */
function mateToPort() {
  const o = dockTarget(); if (!o) return;
  const dk = S.dock;
  const stTheta = Math.atan2(o.v.y, o.v.x);
  S.att.theta = normAngle(stTheta + dk.sign * dk.misalign * Math.PI/180);
  S.att.rate = 0; S.att.slewing = false;
  const axis = { x: Math.cos(stTheta + Math.PI), y: Math.sin(stTheta + Math.PI) };
  const nose = { x: Math.cos(S.att.theta), y: Math.sin(S.att.theta) };
  S.r = V.sub(V.add(o.r, V.mul(axis, PORT_ARM_STN)), V.mul(nose, PORT_ARM));

}

/** Come off the ring. Nothing is destroyed — the cost is propellant and time. */
function dockBounce(g, why) {
  S.dock.bounces++;
  S.v = V.add(S.v, V.mul(g.axis, g.closing * 1.5 / 1000));    // reflect at e = 0.5

/** Resolve a contact: clean capture, crooked capture, or a bounce. */
function dockContact(g) {
  const dk = S.dock;
  dk.attempts++;
  const al = Math.abs(g.align), off = Math.abs(g.lateral), lr = Math.abs(g.latRate);
  const why = g.closing > DOCK_ENV.closeMax ? `closing ${g.closing.toFixed(2)} m/s, limit ${DOCK_ENV.closeMax.toFixed(2)}`
    : lr  > DOCK_ENV.rateMax  ? `lateral rate ${lr.toFixed(3)} m/s, limit ${DOCK_ENV.rateMax.toFixed(2)}`
    : off > DOCK_ENV.latMax   ? `${off.toFixed(2)} m off centre, limit ${DOCK_ENV.latMax.toFixed(2)} m`
    : al  > DOCK_ENV.alignMax ? `${al.toFixed(1)}° off axis, limit ${DOCK_ENV.alignMax.toFixed(0)}°`
    : null;

  dk.sign = g.align >= 0 ? 1 : -1;
  dk.misalign = dk.misalign0 = al;

const utilitiesDone = () => {
  const d = S.dock;

  const dk = S.dock;

  if (dk.phase === 'FREE') {
    const g = dockGeom();
    if (!g) { dk.leg = null; return; }
