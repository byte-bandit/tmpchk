function dockLeg(g, leg) {
  const off = Math.abs(g.lateral);
  const corridor = () => g.axial > 100 ? 'CLOSING' : g.axial > 10 ? 'CORRIDOR' : 'CONTACT';
  switch (leg) {
    case 'CLEAR':  return off >= DOCK_STAND - 3 ? dockLeg(g, 'BEHIND') : 'CLEAR';
    case 'BEHIND': return g.axial >= DOCK_HOLD + 3 ? dockLeg(g, 'CENTRE') : 'BEHIND';
    case 'CENTRE': return (off <= 2 && g.axial >= DOCK_HOLD - 5) ? corridor() : 'CENTRE';
    case 'CLOSING': case 'CORRIDOR': case 'CONTACT':
      // Only fall back out of the corridor for a miss far wider than the one
      // that would have stopped us entering it.
      return off > Math.max(10, g.axial * 0.35) ? 'CENTRE' : corridor();
    default:
      if (onCorridor(g)) return corridor();
      if (g.axial >= DOCK_HOLD + 3) return 'CENTRE';
      if (off >= DOCK_STAND - 3) return 'BEHIND';
      return 'CLEAR';
  }
}

/** The commands the approach law would issue, given the relative state and the
 *  leg being flown. Pure: it reads nothing and changes nothing. */
function dockGuide(g, leg) {
  if (!g) return null;
  // A rendezvous does not leave you on the corridor — it leaves you beside the
  // station, usually ahead of its port. Getting onto the axis is a box: out to
  // the side, astern to the hold point, then in to the centreline. The route
  // never crosses the station's face.
  leg = dockLeg(g, leg);
  const sgn = g.lateral >= 0 ? 1 : -1;
  let want = {};
  if (leg === 'CLOSING' || leg === 'CORRIDOR' || leg === 'CONTACT') {
    const off = Math.abs(g.lateral);
    // Slow down as the port comes up: 0.30 m/s outside 20 m, easing to
    // 0.05 m/s at contact — inside the 0.10 m/s clean band with no final flare.
    const vProfile = Math.min(0.30, 0.05 + g.axial / 80);
    // Inside twelve metres, stop and centre rather than press on and bounce.
    // That is what a crew does, and holding range is far cheaper than a bounce.
    const tol = Math.max(DOCK_ENV.latClean * 0.8, g.axial * 0.06);
    const hold = off > tol && g.axial < 12;
    want.closing = hold ? 0 : vProfile;
    want.hold = hold;
    // Aim to be centred by half way to contact — but take the time from the
    // approach PROFILE, never from the held command, or holding range drives
    // the time-to-contact to infinity and the lateral command to nothing.
    // The cap and the deadband both shrink with range for the same reason:
    // a fixed pair leaves the last quarter metre permanently uncorrected,
    // which put every approach on the 0.25 m limit.
    const tc = g.axial / Math.max(vProfile, 0.02);
    const cap = Math.min(0.03, Math.max(0.005, g.axial * 0.004));
    const latCmd = hold ? -g.lateral * 0.05 : -g.lateral / Math.max(tc * 0.5, 10);
    want.latRate = Math.max(-cap, Math.min(cap, latCmd));
    want.latDead = Math.max(0.0008, Math.min(0.003, cap * 0.3));
  } else {
    let tAx, tLat, vmax = 0.8;
    if (leg === 'CLEAR')       { tAx = g.axial; tLat = sgn * DOCK_STAND; }
    else if (leg === 'BEHIND') { tAx = DOCK_HOLD + 6; tLat = g.lateral; }
    else                       { tAx = Math.max(g.axial, DOCK_HOLD); tLat = 0; vmax = 0.6; }
    const rate = (e) => Math.max(-vmax, Math.min(vmax, e * 0.03));
    want.closing = -rate(tAx - g.axial);
    want.latRate = rate(tLat - g.lateral);
    want.target = { axial: tAx, lateral: tLat };
  }
  const axErr = g.closing - want.closing, latErr = g.latRate - want.latRate;
  return {
    leg, name: LEGNAME[leg], theta: normAngle(g.stTheta),  // nose down the axis, into the port
    vWant: want.closing, latWant: want.latRate, target: want.target || null,
    hold: !!want.hold, axErr, latErr,
    axial:   Math.abs(axErr)  > 0.012 ? -axErr  : 0,       // + closes on the port
    lateral: Math.abs(latErr) > (want.latDead || 0.003) ? -latErr : 0,
  };
}

/** Fly one step of `dockGuide`'s output. Pulses are impulsive: a 0.05 m/s
 *  nudge on real thrusters lasts a fraction of a second, so there is no
 *  controller here to diverge at the coasting chunk size. */
function dockAutoStep(dt) {
  const dk = S.dock;
  if (!dk.auto || dk.phase !== 'FREE') return;
  const g = dockGeom();
  if (!g) { dk.auto = false; return; }
  // The autopilot flies on the same thrusters a hand does. No pressure, no
  // thrusters — and it says so rather than quietly coasting past the station.
  if (!sysOn('PRESS')) { dk.auto = false;
    say('AUTO DOCK DISENGAGED · propulsion is no longer pressurised.', 'err'); return; }
  dk.autoT = (dk.autoT || 0) + dt;
  if (dk.autoT < 2) return;                 // thrusters fire at most every 2 s
  dk.autoT = 0;
  if (S.att.mode !== 'PAXS') setAttMode('PAXS');
  if (attError() > 2*Math.PI/180) return;   // point first, then translate
  const cmd = dockGuide(g, dk.leg);
  dk.leg = cmd.leg;
  if (cmd.axial) rcsPulse(V.mul(g.axis, -Math.sign(cmd.axial)), Math.abs(cmd.axial));
  if (cmd.lateral) rcsPulse(V.mul(g.lat, Math.sign(cmd.lateral)), Math.abs(cmd.lateral));
  if (S.craft.rcs <= 0) { dk.auto = false; say('AUTO DOCK DISENGAGED — RCS propellant exhausted.', 'err'); }
}
/** Point the vehicle, without lighting anything. */
function setAttMode(mode, inertial) {
  S.att.mode = mode;
  if (mode === 'INRT' && inertial != null) S.att.inertial = inertial;
}

/** Numerically integrate one substep under thrust, drag, or both.
 *
 *  This is the non-conservative path. The engine has always needed it; drag
 *  needs it too, because a dissipative force breaks the exact two-body
 *  propagation the rest of the clock runs on. Outside an atmosphere the drag
 *  term is not merely small — `dragAcc` returns a shared zero vector and the
 *  addition is skipped entirely, so a vacuum burn is evaluated by the same
 *  arithmetic in the same order as before this existed.                     */
function burnStep(dt) {
  const b = soiBody(), mu = b.mu;
  const m = craftMass();
  // An engine does not fire until the vehicle is pointed. The burn clock stops
  // while it turns, so a commanded duration is always a duration of thrust.
  //
  // An ascent is the exception: a launch vehicle pitches over THROUGH the
  // burn, so the guidance is always a little ahead of the nose and thrust
  // simply comes out of wherever the nose currently is, as it does in life.
  //
  // Note what "the burn clock stops" must NOT mean: the VEHICLE stopping. It
  // is still in orbit while it turns, and a 180° slew takes 46 s — long enough
  // to carry it 358 km, 3.1° of phase, in low Earth orbit. Returning here
  // before the propagation froze the ship in space while the clock, the
  // station and every other object kept running, which is not a simplification
  // but a different universe. It coasts through the slew; only the engine, the
  // propellant and the burn clock wait.
  const waiting = !!S.burn && !S.burn.ascent && attError() > ALIGN_TOL;
  if (S.burn) S.aligning = waiting;
  const lit = !!S.burn && !waiting && S.craft.fuel > 0;
  const dirv = thrustDir();
  const aT = lit ? curThrust() / m : 0;   // km/s^2
  const acc = (rv, vv) => {
    const rr = V.len(rv);
    const g = V.add(V.mul(rv, -mu/(rr*rr*rr)), V.mul(dirv, aT));
    const d = dragAcc(rv, vv, m);
    return d === ZEROV ? g : V.add(g, d);
  };
  // RK4 on position/velocity
  const r0 = S.r, v0 = S.v;
  const k1r = v0,                       k1v = acc(r0, v0);
  const k2r = V.add(v0, V.mul(k1v,dt/2)), k2v = acc(V.add(r0, V.mul(k1r,dt/2)), k2r);
  const k3r = V.add(v0, V.mul(k2v,dt/2)), k3v = acc(V.add(r0, V.mul(k2r,dt/2)), k3r);
  const k4r = V.add(v0, V.mul(k3v,dt)),   k4v = acc(V.add(r0, V.mul(k3r,dt)),   k4r);
  S.r = V.add(r0, V.mul(V.add(V.add(k1r, V.mul(k2r,2)), V.add(V.mul(k3r,2), k4r)), dt/6));
  S.v = V.add(v0, V.mul(V.add(V.add(k1v, V.mul(k2v,2)), V.add(V.mul(k3v,2), k4v)), dt/6));

  if (lit) {
    const mdot = curFlow();   // kg/s
    const used = Math.min(S.craft.fuel, mdot * dt);
    S.craft.fuel -= used;
    S.ledger.dvUsed += aT * 1000 * dt;
    if (S.craft.fuel <= 0) {
      S.craft.fuel = 0;
      endBurn((S.craft.stages && S.craft.stageIx < S.craft.stages.length - 1)
        ? 'CUTOFF — stage propellant exhausted. STAGE, then re-ignite.'
        : 'MAIN ENGINE CUTOFF — propellant exhausted', 'warn');
    }
  }
  if (!S.burn || waiting) return;   // cutoff cleared the burn, or the nose is still coming round
  S.burn.left -= dt;
  if (S.burn && S.burn.left <= 1e-9) endBurn('MECO — burn complete', 'ok');
}

function endBurn(msg, cls) {
  if (!S.burn) return;
  const spent = S.burn.total - Math.max(0, S.burn.left);
  S.burn = null;
  S.ledger.burns++;
  say(msg + (isFinite(spent) ? ` · ${spent.toFixed(1)} s` : ''), cls || 'ok');
  if (S.warp !== S.preBurnWarp && S.preBurnWarp) { S.warp = S.preBurnWarp; S.preBurnWarp = null; }
  if (S.pauseAfterBurn) { S.warp = 0; S.pauseAfterBurn = false; say('CLOCK HOLD', 'sys'); }
}

/* ============================================================
   LAUNCH — the pad, the count and the pitch program

   A vehicle on the pad is not being propagated: it is standing on a rotating
   planet, and the only thing moving it is the planet. It is still `status:
   'flight'` for the same reason cold start is — anything else stops the clock,
   and the clock is what runs the warm-ups, the countdown and the battery.

   The pitch program is flown against the LOCAL HORIZON: each row is an
   altitude and the pitch the vehicle should hold when it gets there, 90° being
   straight up and 0° being flat along the direction of flight. Guidance
   interpolates between the rows and rewrites the INRT reference every step,
   which is exactly what INRT was built for — an angle somebody else decides.
   ============================================================ */
// The filed profile. Measured, not guessed: it puts this stack into a 185 km
// orbit for 8,884 m/s with 4.5 t of second-stage propellant left and a peak
// dynamic pressure of 35 kPa against the stack's 40 kPa design limit. There is
// deliberately not much room in that last number — flatten the turn and you
// will meet the limit.
const PITCH_DEFAULT = [[0, 90], [2, 84], [10, 58], [40, 26], [130, 10]];
const TOWER = 0.06;                 // km — clear of the pad, and of the impact check
const COUNT_DEFAULT = 600;          // s of count a fresh pad starts with

/** Put the vehicle on the pad of `body`, at surface angle `theta` radians. */
function setPad(body, thetaDeg, opts) {
  const o = opts || {};
  S.soi = body;
  S.pad = {
    body, theta: normAngle((thetaDeg || 0) * Math.PI/180),
    held: true, lifted: false, hold: true, T: -(o.count != null ? o.count : COUNT_DEFAULT),
    program: (o.program || PITCH_DEFAULT).map(p => [p[0], p[1]]),
    ignited: false, maxQ: 0, maxQalt: 0, liftT: null, meco: null, site: o.site || 'PAD',
    // What the ascent this pad files actually costs, for the phasing readout.
    // Omitted means the filed Earth ascent, measured in tests/launch.test.js,
    // which is what every pad that shipped before this one flies.
    ascent: o.ascent || null,
  };
  // A pad on an airless body has no fairing to hide the arrays behind, and a
  // lander that came down with them deployed does not fold them to go home.
  S.fairing = o.fairing !== undefined ? o.fairing : true;
  padPlace(0);
}
/** Stand the vehicle on the ground and let the planet carry it. */
function padPlace(dt) {
  const p = S.pad, b = BODIES[p.body], w = b.rot || 0;
  p.theta = normAngle(p.theta + w * dt);
  const R = b.R;
  S.r = { x: R * Math.cos(p.theta), y: R * Math.sin(p.theta) };
  S.v = { x: -w * R * Math.sin(p.theta), y: w * R * Math.cos(p.theta) };
}
/** Commanded pitch from the program, degrees above the local horizon. */
function pitchCommand(altKm) {
  const pr = S.pad && S.pad.program;
  if (!pr || !pr.length) return 90;
  if (altKm <= pr[0][0]) return pr[0][1];
  for (let i = 1; i < pr.length; i++) {
    if (altKm <= pr[i][0]) {
      const f = (altKm - pr[i-1][0]) / Math.max(1e-9, pr[i][0] - pr[i-1][0]);
      return pr[i-1][1] + f * (pr[i][1] - pr[i-1][1]);
    }
  }
  return pr[pr.length-1][1];
}
/** The inertial heading a given pitch means where the vehicle is right now. */
function pitchToTheta(pitchDeg) {
  // The horizon in the direction of flight is 90° round from straight up; the
  // launch runs with the planet's rotation, which is the direction everything
  // in this simulation orbits.
  return normAngle(Math.atan2(S.r.y, S.r.x) + Math.PI/2 - pitchDeg * Math.PI/180);
}
/** The vehicle's actual pitch above the local horizon, degrees. */
function currentPitch() {
  return angDiff(Math.atan2(S.r.y, S.r.x) + Math.PI/2, S.att.theta) * -180/Math.PI;
}

/** Light the first stage. Returns a refusal, or null. */
function ignite() {
  const p = S.pad;
  if (!p) return 'This vehicle is not on a pad.';
  if (p.ignited) return 'The engine is already lit.';
  if (!sysOn('PRESS')) return 'PROPULSION NOT PRESSURISED — the engine will not light on unpressurised tanks.';
  if (!sysOn('GNC')) return sysState('GNC') === 'START'
    ? `GUIDANCE ALIGNING — ${fmtT(alignLeft())} to go. There is no pitch reference to fly until the platform is aligned.`
    : 'GUIDANCE NOT ALIGNED — the ascent has no attitude reference. Bring GUIDANCE up on the SYS page.';
  if (S.craft.fuel <= 0) return 'No propellant in the lit stage.';
  // WHICH GRAVITY. A vehicle lifts off against the weight it has WHERE IT IS
  // STANDING, and this gate used to weigh every stack at Earth's 9.80665 m/s².
  // On the Moon that is a factor of six wrong in the direction that refuses
  // flights which would fly: measured, a 15 kN engine under a 2,560 kg lander —
  // a lunar thrust-to-weight of 3.62, four times what it needs — was turned
  // away as "15 kN against 25 kN of vehicle". Every Earth launch that shipped
  // is unchanged by construction: at the Cape this is 9.8196 m/s² against
  // 9.80665, a difference of a tenth of a percent on a stack that lifts at 1.73.
  const gLocal = surfaceG(BODIES[p.body]);
  const twr = curThrust() * 1000 / (craftMass() * gLocal);
  if (twr <= 1) return `THRUST DOES NOT EXCEED WEIGHT — ${(curThrust()*1000/1000).toFixed(0)} kN against `
    + `${(craftMass()*gLocal/1000).toFixed(0)} kN of vehicle on ${BODIES[p.body].name}. `
    + `This stack cannot lift off at ${(S.throttle*100).toFixed(0)}% throttle.`;
  p.ignited = true; p.held = false; p.lifted = true; p.liftT = S.t; p.liftTheta = p.theta;
  p.hold = false; p.T = 0;
  S.preBurnWarp = S.warp;
  if (S.warp > 10) S.warp = 10;
  setAttMode('INRT', pitchToTheta(pitchCommand(0)));
  S.burn = { dir: 'INRT', left: Infinity, total: Infinity, ascent: true };
  say(`LIFTOFF · ${S.craft.stageName || S.craft.name} at ${(curThrust()*1000).toFixed(0)} N, `
    + `thrust-to-weight ${twr.toFixed(2)}. Guidance has the pitch program.`, 'key');
  return null;
}

/** Run the count. Called with the clock, AFTER the step it belongs to: T−0 and
 *  the MET of ignition have to be the same instant, or the count lies by a
 *  whole chunk — which at ten seconds a chunk on the pad is a visible lie. */
function stepCount(dt) {
  const p = S.pad;
  if (!p || p.lifted) return;
  padPlace(dt);
  if (p.hold) return;
  p.T += dt;
  for (const mark of [-300, -60, -30, -10]) {
    if (p.T >= mark && p.T - dt < mark) say(`T${fmtCount(mark)} and counting.`, 'sys');
  }
  if (p.T >= 0) {
    const bad = ignite();
    if (bad) { p.hold = true; p.T = Math.min(p.T, -10); say('COUNT HELD AT T−00:10 · ' + bad, 'err'); }
  }
}

/** Ascent guidance: the pitch program, max Q and the fairing. Called BEFORE
 *  the attitude step, because it is what the attitude step is chasing. */
function stepLaunch(dt) {
  const p = S.pad;
  if (!p || !p.lifted) return;
  // Flying. Guidance owns the attitude until the program runs out or the
  // player takes it back with any other HOLD.
  if (S.att.mode === 'INRT' && !p.meco) {
    const alt = V.len(S.r) - BODIES[p.body].R;
    S.att.inertial = pitchToTheta(pitchCommand(alt));
  }
  if (!p.cleared && V.len(S.r) - BODIES[p.body].R > TOWER) {
    p.cleared = true;
    say(`TOWER CLEARED · ${(curThrust()*1000/(craftMass()*G0)).toFixed(2)} g and climbing.`, 'ok');
  }
  const q = dynPressure();
  if (q > p.maxQ) { p.maxQ = q; p.maxQalt = V.len(S.r) - BODIES[p.body].R; }
  if (!p.qCalled && q > 0 && p.maxQ > 0 && q < p.maxQ * 0.9 && p.maxQ > 5000) {
    p.qCalled = true;
    say(`MAX Q PASSED · ${(p.maxQ/1000).toFixed(1)} kPa at ${p.maxQalt.toFixed(0)} km. The vehicle is through the worst of the air.`, 'ok');
  }
  // The fairing is what the arrays are folded behind. It goes when there is no
  // longer any air to justify carrying it, and that is when they can deploy.
  if (S.fairing && !inAtmosphere()) {
    S.fairing = false;
    say(`FAIRING JETTISON · ${(V.len(S.r) - BODIES[p.body].R).toFixed(0)} km. The solar arrays can be deployed from here.`, 'ok');
  }
}
/* ---- the launch window --------------------------------------------------
   There is no plane to match in a planar world, so an inclination launch
   window does not exist here. A PHASING window does, and it is the real
   constraint anyway: lift off when the station is the right distance ahead and
   the transfer from the parking orbit meets it; lift off at any other moment
   and the difference is paid back in laps around the planet.

   ASCENT_TIME and ASCENT_ARC are measured, not assumed — they come from flying
   the filed pitch program on the standard stack and reading the clock and the
   downrange angle at insertion (see tests/launch.test.js, which re-measures
   them and fails if the profile drifts away from these).                    */
const ASCENT_TIME = 515;                 // s, pad to insertion
const ASCENT_ARC  = 18.0 * Math.PI/180;  // rad of downrange travel in that time
const PARK_ALT    = 185;                 // km, the orbit the filed program aims at
/* The window belongs to the PAD, not to Earth. A pad declares what its filed
   ascent costs in time and downrange arc, and where it inserts; a pad that
   declares nothing flies the measured Earth ascent above, which is every pad
   that shipped before the Moon had one. The lunar numbers are the lander's
   own, measured the same way: 611 s and 23.0° to a 100 km orbit.

   This matters more on the Moon than it ever did at the Cape. At Earth a
   missed window costs laps of phasing with a big tank behind you; on the Moon
   the ascent stage has about 220 m/s of RCS and the mothership comes round
   every 118 minutes. Measured, lifting off on the window is 2.7 hours to a
   hard dock and 11 kg of propellant; ninety degrees out it is 23.7 hours and
   33 kg; a hundred and eighty degrees out, it does not close at all.        */
function launchWindow() {
  const p = S.pad;
  if (!p) return null;
  const o = S.objects.find(x => x.id === 'STATION' && x.soi === p.body);
  if (!o) return null;
  const b = BODIES[p.body], mu = b.mu;
  const asc = p.ascent || null;
  const park = asc && asc.park != null ? asc.park : PARK_ALT;
  const aTime = asc && asc.time != null ? asc.time : ASCENT_TIME;
  const aArc = asc && asc.arc != null ? asc.arc : ASCENT_ARC;
  const r1 = b.R + park, r2 = V.len(o.r);
  const at = (r1 + r2) / 2;
  const tof = Math.PI * Math.sqrt(at*at*at/mu);          // half the transfer ellipse
  const ws = Math.sqrt(mu/(r2*r2*r2));                   // station's angular rate
  const wp = b.rot || 0;                                 // the pad's
  // Where the station has to be, relative to the pad, at the moment of liftoff:
  // the Hohmann phase requirement, plus the arc the ascent itself covers, less
  // what the station travels while the vehicle is climbing.
  const want = normAngle(Math.PI - ws*tof + aArc - ws*aTime);
  const lead = normAngle(Math.atan2(o.r.y, o.r.x) - p.theta);
  const rel = ws - wp;
  const wait = rel > 1e-14 ? normAngle(want - lead) / rel : Infinity;
  return { want, lead, wait, tof, alt: r2 - b.R, park,
           label: o.label || 'CERES', period: 2*Math.PI/Math.max(rel, 1e-14) };
}

/* ---- two vehicles, one simulation ---------------------------------------
   The game flies ONE vehicle. A mission that separates a lander would normally
   mean two of them — the largest change in the backlog — so it does something
   cheaper and truer to what the player is doing: the vehicle that is not being
   flown becomes what station CERES already is, an object carrying a port, and
   everything it owns is lifted off into a bag.

   What belongs to a VEHICLE rather than to the world is listed once, here.
   Getting this list wrong is the failure mode the item warned about: a lander
   that inherited the mothership's battery charge would be invisible and wrong,
   which is why `tests/lunar.test.js` asserts every one of these moves.        */
const VEHICLE_KEYS = ['craft', 'sys', 'power', 'therm', 'dock', 'att', 'loads', 'shield',
                      'chute', 'pad', 'throttle', 'fairing', 'aligning', 'pwrUp',
                      'landingAllowed', 'manifest', 'thermLimit', 'surf', 'landed'];
const cloneVal = (x) => x === undefined ? null : JSON.parse(JSON.stringify(x));
/** Lift everything vehicle-owned out of `S` into plain data. */
function stashVehicle(label) {
  const bag = { label };
  for (const k of VEHICLE_KEYS) bag[k] = cloneVal(S[k]);
  return bag;
}
/** Put a bag back on. The inverse, key for key. */
function wearVehicle(bag) {
  for (const k of VEHICLE_KEYS) S[k] = cloneVal(bag[k]);
}

/* The vehicle that is not being flown is not in stasis. It holds an orbit, it
   crosses the same shadows, its bus draws the same watts and its crew breathe.
   Rather than write a second power model that could drift away from the first,
   this WEARS the other vehicle for one step and takes it off again — one code
   path, so the ship you left behind is simulated by exactly the code that
   simulates the one you are flying. */
function stepAway(dt) {
  const a = S.away;
  if (!a || !a.bag) return;
  const o = S.objects.find(x => x.id === a.id);
  if (!o) return;
  const mine = stashVehicle('active');
  const kr = S.r, kv = S.v, ksoi = S.soi;
  wearVehicle(a.bag);
  S.r = { ...o.r }; S.v = { ...o.v }; S.soi = o.soi;
  S.awayTick = true;
  derive();
  // What it is doing out there, kept for the readouts: whether it is in
  // shadow, what it is generating and what it is drawing. Nothing reads these
  // to decide anything — the bag itself is the state.
  a.ecl = D.ecl; a.gen = D.gen; a.load = D.load; a.alt = D.alt;
  stepSystems(dt);
  // Crew left aboard a ship whose loop has stopped are on the tank, at the
  // same rate they would be on the one you are flying.
  if (S.craft.crew > 0 && S.craft.o2 <= 0 && o2Rate() > 0) a.dead = true;
  S.awayTick = false;
  a.bag = stashVehicle(a.bag.label);
  wearVehicle(mine);
  S.r = kr; S.v = kv; S.soi = ksoi;
  derive();
}

/* ---- work on the surface ------------------------------------------------
   Short, and in item 01's shape: a procedure with steps that take real time
   and cost a real consumable. Outside, the crew are on their suits — which is
   the open loop, at the open loop's rate — so an hour of collecting is an hour
   off the reserve rather than a free animation.                             */
const SURF_CYCLE = 300;        // s — depressurise and climb out, or the reverse
const SURF_RATE  = 0.35;       // kg/s of samples into the hold
function freshSurf() { return { phase:'INSIDE', t:0, out:0, done:false }; }
function stepSurf(dt) {
  const u = S.surf;
  if (!u || !S.pad || S.pad.lifted) return;
  if (u.phase === 'PREP' || u.phase === 'BACK') {
    u.t += dt;
    if (u.t >= SURF_CYCLE) {
      u.t = 0;
      if (u.phase === 'PREP') { u.phase = 'OUT'; say('CREW ON THE SURFACE · suits sealed, hatch open. SURF SAMPLE to start collecting.', 'ok'); }
      else { u.phase = 'INSIDE'; say(`CREW ABOARD · cabin repressurised, ${u.out.toFixed(0)} kg of samples struck down. The ascent is yours whenever the window is.`, 'ok'); }
    }
  }
  if (u.phase === 'COLLECT') {
    const want = S.manifest ? S.manifest.collect : 0;
    const room = Math.max(0, (S.craft.cargoMax || 0) - S.craft.cargo);
    const take = Math.min(SURF_RATE * dt, Math.max(0, want - u.out), room);
    S.craft.cargo += take; u.out += take;
    if (take <= 1e-9) {
      u.phase = 'OUT'; u.done = u.out > 0;
      say(`COLLECTION COMPLETE · ${u.out.toFixed(0)} kg aboard. SURF IN to climb back in.`, 'ok');
    }
  }
  // Outside, the loop is behind them and the suits are the tank.
  if ((u.phase === 'OUT' || u.phase === 'COLLECT') && S.craft.crew > 0)
    S.craft.o2 = Math.max(0, S.craft.o2 - S.craft.crew * ECLSS_OPEN_RATE * dt / 3600);
}

/** T−/T+ as a count reads it. */
function fmtCount(sec) {
  const s = Math.abs(Math.floor(sec));
  return (sec < 0 ? '−' : '+') + String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

/* ---- sphere-of-influence patching -------------------------- */
function patchSOI() {
  const b = soiBody();
  // escape upward
  if (b.parent && V.len(S.r) > b.soi) {
    const st = bodyStateInParent(S.soi, S.t);
    S.r = V.add(S.r, st.r); S.v = V.add(S.v, st.v);
    S.soi = b.parent;
    say(`SOI TRANSITION · now referenced to ${S.soi}`, 'key');
    fitView(); return true;
  }
  // capture downward
  for (const c of (CHILDREN[S.soi] || [])) {
    const st = bodyStateInParent(c, S.t);
    const rel = V.sub(S.r, st.r);
    if (V.len(rel) < BODIES[c].soi) {
      S.r = rel; S.v = V.sub(S.v, st.v);
      S.soi = c;
      say(`SOI TRANSITION · now referenced to ${c}`, 'key');
      fitView(); return true;
    }
  }
  return false;
}

/* ---- the clock --------------------------------------------- */
/** True while the vehicle is close enough that the clock must run near real time. */
function inProxOps() {
  if (S.dock.phase !== 'FREE') return false;
  const g = dockGeom();
  return !!(g && g.ctrRange < 500);
}

function advance(dtSim) {
  if (S.status !== 'flight') return;
  // Nobody time-warps a docking, and the step could not resolve it if they did.
  if (inProxOps() && S.warp > 10) {
    S.warp = 10;
    if (!S.warnedProx) { S.warnedProx = true; say('Warp limited to 10× inside 500 m — this is flown in something close to real time.', 'warn'); }
  } else if (!inProxOps()) S.warnedProx = false;
  // An entry is the same problem as a docking and needs the same answer. The
  // trajectory itself is warp-proof — the chunk is already pinned at half a
  // second inside the air, and flying the same entry at 1× and at 1,000,000×
  // moves the arrival by 196 m — but the WALL CLOCK is not. Measured, at
  // 1,000× an entry from the interface to the sea is eight frames and 0.13 s,
  // and the CDU refreshes once a second, so the player sees no page at all
  // between the deorbit burn and the water. Ten times over is six minutes.
  const entering = inAtmosphere() && !(S.pad && !S.pad.lifted);
  if (entering && S.warp > 10) {
    S.warp = 10;
    if (!S.warnedEntryWarp) { S.warnedEntryWarp = true;
      say('Warp limited to 10× inside the atmosphere — an entry is flown, not skipped. '
        + 'The canopies have a few tens of seconds of envelope and you have to be there for them.', 'warn'); }
  } else if (!entering) S.warnedEntryWarp = false;
  let left = dtSim, guard = 0;
  while (left > 1e-9 && guard++ < 220) {
    let dt;
    if (S.pad && !S.pad.lifted) {
      // Standing on the pad. The clock runs — warm-ups, the battery and the
      // count all live on it — but nothing is being propagated, and the count
      // is an ignition, so the chunk must never step over T−0.
      dt = Math.min(left, 10);
      if (!S.pad.hold && S.pad.T < 0) dt = Math.min(dt, Math.max(0.25, -S.pad.T));
    } else if (S.burn) {
      dt = Math.min(left, 0.5, S.burn.left);
    } else if (inAtmosphere()) {
      // Inside the air the trajectory is integrated, not propagated, and the
      // density it is integrated through doubles every six kilometres. Half a
      // second is the same chunk a burn gets and for the same reason.
      dt = Math.min(left, 0.5);
    } else {
      const e = el(), b = soiBody();
      // Move at most ~2% of the current radius per chunk. Bounding by a fraction
      // of the period instead would sample a fast perihelion pass far too coarsely.
      let cap = Math.max(0.5, 0.02 * e.r / Math.max(e.v, 1e-6));
      if (e.r - b.R < 200) cap = Math.min(cap, 5);
      // Tighten the step as a sphere-of-influence boundary approaches. Without
      // this, a coarse step at high warp carries the vehicle thousands of km
      // INSIDE a moon's SOI while still being propagated as if that moon were
      // not there — the trajectory that comes out is simply wrong.
      for (const c of (CHILDREN[S.soi] || [])) {
        const st = bodyStateInParent(c, S.t);
        const rel = V.sub(S.r, st.r), relv = V.sub(S.v, st.v);
        const d = V.len(rel);
        if (d <= BODIES[c].soi) continue;
        const closing = -V.dot(V.unit(rel), relv);
        if (closing > 1e-9) cap = Math.min(cap, Math.max(1, (d - BODIES[c].soi) * 0.4 / closing));
      }
      if (b.parent && isFinite(b.soi)) {
        const out = b.soi - e.r, rate = e.vr;
        if (rate > 1e-9 && out > 0) cap = Math.min(cap, Math.max(1, out * 0.4 / rate));
      }
      // never step past an armed burn's ignition point, however fast the clock runs
      const ti = timeToIgnition();
      if (isFinite(ti) && ti > 0) cap = Math.min(cap, Math.max(0.25, ti));
      // A warm-up is a countdown, not a controller, so it settles inside any
      // chunk — but charging a 45 s start-up a 300 s chunk of draw would make
      // the power budget nonsense, and a 200 s chunk would step clean over the
      // whole guidance alignment. Bound the chunk while anything is starting.
      // A warm mission never has anything starting, so this never touches one.
      if (sysStarting()) cap = Math.min(cap, 10);
      // The atmospheric interface is an event exactly like a sphere of
      // influence, and it is a hundred times thinner. A decaying orbit stepped
      // at 17 s a chunk arrives two hundred kilometres deep into air that
      // should have caught it at the top, so bound the chunk by the time left
      // to the interface whenever the vehicle is falling toward one.
      if (b.rho0) {
        const out = (e.r - b.R) - b.atmo, rate = -e.vr;
        if (out > 0 && rate > 1e-9) cap = Math.min(cap, Math.max(0.5, out * 0.4 / rate));
      }
      // Docking is centimetre work and the coasting chunk is sized for orbits:
      // 17 s at station altitude, nearly two metres of travel at a docking
      // closing rate. That steps straight over a capture envelope measured in
      // tenths of a metre, so near a port the chunk is bounded by travel.
      if (S.dock.phase === 'FREE') {
        const pg = dockGeom();
        if (pg && pg.ctrRange < 500) {
          const travel = Math.max(0.02, Math.min(2, Math.abs(pg.axial) * 0.02));     // m per chunk
          const rel = Math.hypot(pg.closing, pg.latRate);                            // m/s
          cap = rel > 1e-6 ? Math.min(cap, Math.max(0.05, travel / rel)) : Math.min(cap, 5);
        }
      }
      dt = Math.min(left, cap);
    }
    // Point before thrusting. Running the slew after the burn step would make
    // the engine use the previous step's attitude, and the solver — which
    // assumes the vehicle is pointed — would no longer predict the flight. Over
    // an 800 s injection that lag is enough to miss a sphere of influence.
    // Guidance leads attitude leads thrust. The pitch program is what the
    // autopilot is chasing, so it has to be written before the autopilot runs.
    if (S.pad) stepLaunch(dt);
    stepAttitude(dt);
    if (S.pad && !S.pad.lifted) { /* held down: the planet is the only thing moving it */ }
    else if (S.burn) burnStep(dt);
    else if (S.dock.phase === 'FREE') {
      if (inAtmosphere()) burnStep(dt);          // drag is not conservative: integrate
      else {
        const b = soiBody();
        const out = propagate(S.r, S.v, b.mu, dt);
        S.r = out.r; S.v = out.v;
      }
    }
    S.t += dt; left -= dt;
    // The count belongs to the clock, not to the step before it.
    if (S.pad && !S.pad.lifted) stepCount(dt);
    for (const o of S.objects) stepObject(o, dt);
    // Attitude leads thrust; docking follows the world. Contact can only be
    // judged once both vehicles have been moved.
    stepDock(dt);
    if (S.surf) stepSurf(dt);
    dockAutoStep(dt);
    derive();
    stepSystems(dt);
    // The ship you are not flying gets the same second you just spent.
    if (S.away) stepAway(dt);
    if (patchSOI()) { derive(); }
    if (checkHazards()) return;
    fireSchedule();
    if (S.status !== 'flight') return;
  }
  checkObjectives();
}

function stepObject(o, dt) {
  const out = propagate(o.r, o.v, BODIES[o.soi].mu, dt);
  o.r = out.r; o.v = out.v;
}

/* ---- hazards ----------------------------------------------- */
/** How far past its design dynamic pressure a stage survives. */
const Q_BREAK = 1.4;
function checkHazards() {
  const b = soiBody(), rr = V.len(S.r), alt = rr - b.R;
  if (S.power.batt <= 0 && S.power.gen < S.power.load) {
    if (!S.warnedPower) { S.warnedPower = true; say('CAUTION · BUS UNDERVOLT — battery depleted, shed load (PWR)', 'err'); }
  } else S.warnedPower = false;

  // Nobody should meet the bus trip without being told it is coming. Called
  // when there is less than a quarter of an hour of bus left on the battery.
  if (sysOn('BUS') && D.gen + D.tie < D.load && D.load > 0) {
    const mins = S.power.batt / (D.load - D.gen - D.tie) * 60;
    if (mins < 15 && !S.warnedBus) {
      S.warnedBus = true;
      say(`CAUTION · ${mins.toFixed(0)} MIN OF BUS LEFT on the battery.`
        + (sysOn('ARRAY') ? ' Shed load or wait for sunlight.' : ' The arrays are still stowed — deploy them, or shed load.')
        + ' At zero the bus trips and everything downstream of the battery drops, alignment included.', 'warn');
    } else if (mins > 25) S.warnedBus = false;
  } else S.warnedBus = false;

  // Air. The reserve only moves while the loop is down, so the warnings are
  // about the loop being down — which is the thing the crew can act on. A
  // closed loop is not warned about at all, because there is nothing to say.
  if (S.craft.crew > 0) {
    const rate = o2Rate();
    const hrs = rate > 0 ? S.craft.o2 / (S.craft.crew * rate) : Infinity;
    if (S.craft.o2 <= 0 && rate > 0)
      return loseMission(`CREW LOST — oxygen reserve exhausted after ${fmtMET(S.t)}. `
        + `${S.craft.crew} aboard, the regenerative loop was not running, and the tanks are dry.`);
    if (hrs < 4 && S.o2Warn < 2) { S.o2Warn = 2;
      say(`WARNING · OXYGEN RESERVE ${fmtT(hrs*3600)} REMAINING — the regenerative loop is not running and the crew are on the tank at ${ECLSS_OPEN_RATE}× their own rate. Bring ECLSS up, get onto a station's air, or end the flight.`, 'err'); }
    else if (hrs < 24 && S.o2Warn < 1) { S.o2Warn = 1;
      say(`CAUTION · OXYGEN RESERVE ${fmtT(hrs*3600)} REMAINING for ${S.craft.crew} crew. Life support is not closing the loop — bring ECLSS up and the reserve stops moving altogether.`, 'warn'); }
    else if (hrs >= 24 && S.o2Warn) S.o2Warn = 0;
  }

  // The ship you left behind can be lost while you are away, and it is lost
  // for the same reason any ship is: the power stopped and then the air did.
  if (S.away && S.away.dead)
    return loseMission(`CREW LOST — ${S.away.label} ran out of air in orbit while you were away. `
      + `Its loop stopped when its bus did, and nobody was aboard to bring either back.`);

  const tl = S.thermLimit || 800;
  if (S.therm.hull > tl*0.8 && !S.warnedTherm) { S.warnedTherm = true; say(`CAUTION · HULL ${S.therm.hull.toFixed(0)} °C — limit is ${tl} °C`, 'warn'); }
  if (S.therm.hull > tl) return loseMission(`VEHICLE LOST — thermal failure. Hull exceeded ${tl} °C.`);

  // The heat shield. Two limits, and they are the two sides of the corridor:
  // come in too steep and the rate takes the ablator off in one piece; come in
  // too shallow and you spend the budget a lap at a time until there is none.
  const sh = S.shield;
  if (sh.fitted && !sh.gone) {
    if (sh.rate > sh.rateLimit)
      return loseMission(`VEHICLE LOST — heat shield failed at ${(sh.rate/1000).toFixed(0)} kW/m², `
        + `${(sh.rate/sh.rateLimit).toFixed(2)}× the ${(sh.rateLimit/1000).toFixed(0)} kW/m² it is rated for. `
        + `That entry was too steep. Aim the periapsis higher and the peak comes down.`);
    if (sh.load >= sh.cap) {
      sh.gone = true;
      say(`HEAT SHIELD BURNED THROUGH · ${(sh.load/1e6).toFixed(1)} MJ/m² absorbed of ${(sh.cap/1e6).toFixed(0)}. `
        + `There is nothing between the hull and the air now.`, 'err');
    } else {
      const f = sh.load / sh.cap;
      if (f > 0.85 && sh.warned < 2) { sh.warned = 2;
        say(`WARNING · HEAT SHIELD ${(f*100).toFixed(0)}% SPENT — ${((sh.cap-sh.load)/1e6).toFixed(1)} MJ/m² left. `
          + `Another skimming pass will not fit inside it.`, 'err'); }
      else if (f > 0.6 && sh.warned < 1) { sh.warned = 1;
        say(`CAUTION · HEAT SHIELD ${(f*100).toFixed(0)}% SPENT. Every pass through the air costs more of it.`, 'warn'); }
    }
  }

  // Dynamic pressure. A stage is built for a design q and will fly through it
  // all day; there is a margin above it, and past that the vehicle comes apart.
  // Throttling back is what the margin is for.
  const qLim = S.craft.qMax;
  if (isFinite(qLim) && qLim > 0 && D.q > 0) {
    if (D.q > qLim * Q_BREAK)
      return loseMission(`VEHICLE LOST — structural failure at ${(D.q/1000).toFixed(1)} kPa dynamic pressure, `
        + `${(D.q/qLim).toFixed(2)}× the design limit of ${(qLim/1000).toFixed(0)} kPa. Throttle back through max Q.`);
    if (D.q > qLim && !S.warnedQ) { S.warnedQ = true;
      say(`CAUTION · DYNAMIC PRESSURE ${(D.q/1000).toFixed(1)} kPa — over the ${(qLim/1000).toFixed(0)} kPa design limit. `
        + `Throttle back: the vehicle breaks up at ${(qLim*Q_BREAK/1000).toFixed(0)} kPa.`, 'warn'); }
    else if (D.q < qLim * 0.9) S.warnedQ = false;
  }

  // A vehicle on the pad is at zero altitude and is not falling — and it is
  // still at zero altitude for the instant after the engine lights, which the
  // impact check would otherwise read as a 465 m/s crash into the ground it is
  // standing on. It stops being a pad and starts being a trajectory when it
  // has cleared the tower.
  if (S.pad && !S.pad.cleared) return false;

  if (alt <= 0) {
    // WHICH FRAME. A vehicle hanging under a parachute is moving with the air,
    // and the air turns with the planet: over Earth that reads 464.58 m/s of
    // lateral drift in the inertial frame against a 3 m/s gate, so no
    // splashdown could ever be judged a landing. Where there is air, the
    // ground is what you arrive on and the ground is what you measure against.
    //
    // Where there is NO air, nothing changes — and that is deliberate. The
    // Moon's surface moves at 4.62 m/s, so a ground-relative gate would make
    // M-06's landing, which arrives at 0.00 m/s inertial, unflyable. An
    // airless body keeps the inertial check it has always had, bit for bit.
    const vRef = b.rho0 ? airRelative(S.r, S.v, b) : S.v;
    const vv = Math.abs(V.dot(vRef, V.unit(S.r))) * 1000;      // m/s vertical
    const hv = Math.abs(V.crs(V.unit(S.r), vRef)) * 1000;      // m/s horizontal
    // Water is soft. A capsule that splashes down is taking the arrival on an
    // ocean rather than on rock, which is why a real one comes in at nine
    // metres a second under a canopy no larger than it has to be.
    const sea = !!b.ocean;
    const vLim = sea ? 10 : 4, hLim = sea ? 8 : 3;
    if (S.landingAllowed && vv < vLim && hv < hLim) {
      S.v = {x:0,y:0};
      S.r = V.mul(V.unit(S.r), b.R);
      S.landed = true;
      // A vehicle that declares an ascent program came down meaning to go back
      // up, so touchdown builds it a pad where it stopped and the clock keeps
      // running: the ship in orbit above is still going round, and the window
      // home is a thing you wait for rather than a thing you are given. Any
      // other vehicle — which is every one that shipped before this — takes the
      // status it always took and the simulation stops, bit for bit.
      if (S.craft.ascent && !b.rho0) {
        setPad(S.soi, Math.atan2(S.r.y, S.r.x) * 180/Math.PI,
               { count: S.craft.ascent.count != null ? S.craft.ascent.count : 600,
                 program: S.craft.ascent.program, ascent: S.craft.ascent,
                 fairing: false, site: S.craft.ascent.site || 'SURFACE' });
        S.burn = null; S.sched = null;
      } else {
        S.status = 'landed';
      }
      say(`${sea ? 'SPLASHDOWN' : 'TOUCHDOWN'} on ${b.name} · ${vv.toFixed(2)} m/s vertical, ${hv.toFixed(2)} m/s lateral`
        + (sea ? ` — limits ${vLim} / ${hLim}. Recovery is on its way.` : ''), 'ok');
      checkObjectives(true); return true;
    }
    return loseMission(`VEHICLE LOST — ${sea ? 'impact with the sea' : 'surface impact'} on ${b.name} `
      + `at ${Math.hypot(vv,hv).toFixed(0)} m/s${sea ? ` against a ${vLim} m/s limit` : ''}.`);
  }
  // The interface is no longer only a caution: below it the air is real, it
  // takes energy out of the orbit every second, and it does not give it back.
  if (b.atmo && alt < b.atmo && !S.landingAllowed && !(S.pad && !S.pad.lifted)) {
    if (!S.warnedAtmo) { S.warnedAtmo = true;
      say(`CAUTION · ATMOSPHERIC INTERFACE — ${alt.toFixed(0)} km and inside the air. `
        + `Drag is taking energy out of this orbit; ${D.q > 200 ? 'this vehicle has no heat shield' : 'raise periapsis'}.`, 'warn'); }
  } else if (alt > b.atmo * 1.2) S.warnedAtmo = false;
  return false;
}

function loseMission(msg) {
  S.status = 'lost'; S.warp = 0; S.burn = null; S.sched = null;
  say(msg, 'err');
  row('AVAILABLE', 'RESTART · MIS', 'dim');
  return true;
}

/* ---- scheduled burns --------------------------------------- */
/** Seconds until an armed burn should light, or Infinity if none. */
function timeToIgnition() {
  if (!S.sched || S.burn) return Infinity;
  const b = soiBody(), e = el();
  let tt;
  if (S.sched.at === 'PE') tt = tToPeri(e, b.mu);
  else if (S.sched.at === 'AP') tt = tToApo(e, b.mu);
  else if (S.sched.at === 'XFER') {
    const w = transferWindow(S.sched.body);
    tt = w ? w.wait : Infinity;
  }
  else tt = S.sched.when - S.t;
  return tt - S.sched.dur/2;
}

function fireSchedule() {
  if (!S.sched || S.burn) return;
  const b = soiBody(), e = el();
  const ti = timeToIgnition();
  if (ti <= 0.5) {
    const sc = S.sched; S.sched = null;
    startBurn(sc.dir, sc.dur, true);
  }
}
</script>

<script>
/* ============================================================
   SCOPE — orbital plot
   ============================================================ */
const cv = document.getElementById('scope');
const cx2 = cv.getContext('2d');
const view = { km:80, auto:true };      // km per CSS pixel
let W = 300, H = 200, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const b = cv.parentElement.getBoundingClientRect();
  W = Math.max(1, b.width); H = Math.max(1, b.height);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx2.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', () => { resize(); if (view.auto) fitView(); });

function fitView() {
  const b = soiBody(), e = el();
  let extent = b.R * 3;
  if (isFinite(e.ra)) extent = Math.max(extent, e.ra * 1.12);
  else extent = Math.max(extent, e.r * 1.6);
  if (S.soi !== 'SUN' && CHILDREN[S.soi]) {
    for (const c of CHILDREN[S.soi]) if (e.ra > BODIES[c].a * 0.6) extent = Math.max(extent, BODIES[c].a*1.15);
  }
  if (b.parent) extent = Math.min(extent, b.soi * 1.1);
  view.km = extent / (Math.min(W,H) * 0.44);
  view.auto = true;
}
const PX = (kmv) => kmv / view.km;

/* proximity target (station or body) resolved to this frame */
function targetRel() {
  if (!S.target) return null;
  if (S.target === 'STATION') {
    // A flight can leave one port behind and acquire another — the depot at
    // Earth, then your own mothership at the Moon. The one in the sphere you
    // are actually in is the one you are flying to. With a single station, as
    // in every mission that shipped before this, these are the same object.
    const o = S.objects.find(o => o.id === 'STATION' && o.soi === S.soi)
           || S.objects.find(o => o.id === 'STATION');
    if (!o || o.soi !== S.soi) return null;
    return { r:V.sub(o.r, S.r), v:V.sub(o.v, S.v), name: o.label || 'STATION', obj:o };
  }
  if (BODIES[S.target]) {
    const st = bodyStateIn(S.soi, S.target, S.t);
    return { r:V.sub(st.r, S.r), v:V.sub(st.v, S.v), name:S.target, body:BODIES[S.target] };
  }
  return null;
}

function conicPath(e, mu, maxR) {
  const pts = [];
  if (e.e < 1) {
    for (let i = 0; i <= 180; i++) {
      const nu = i/180*TAU;
      const rr = e.p/(1 + e.e*Math.cos(nu));
      const th = e.argp + e.dir*nu;
      pts.push({ x:rr*Math.cos(th), y:rr*Math.sin(th) });
    }
  } else {
    const nuMax = Math.acos(-1/e.e) * 0.995;
    for (let i = 0; i <= 160; i++) {
      const nu = -nuMax + (i/160)*2*nuMax;
      const rr = e.p/(1 + e.e*Math.cos(nu));
      if (rr > maxR) continue;
      const th = e.argp + e.dir*nu;
      pts.push({ x:rr*Math.cos(th), y:rr*Math.sin(th) });
    }
  }
  return pts;
}

function stroke(pts, color, dash, width) {
  if (pts.length < 2) return;
  cx2.save();
  cx2.setLineDash(dash || []);
  cx2.strokeStyle = color; cx2.lineWidth = width || 1;
  cx2.beginPath();
  pts.forEach((p,i) => { const X = W/2 + PX(p.x), Y = H/2 - PX(p.y);
    i ? cx2.lineTo(X,Y) : cx2.moveTo(X,Y); });
  cx2.stroke(); cx2.restore();
}
function disc(p, rpx, fill, stroked) {
  cx2.beginPath();
  cx2.arc(W/2 + PX(p.x), H/2 - PX(p.y), Math.max(rpx, 0.5), 0, TAU);
  if (fill) { cx2.fillStyle = fill; cx2.fill(); }
  if (stroked) { cx2.strokeStyle = stroked; cx2.lineWidth = 1; cx2.stroke(); }
}
function tag(p, text, color, dy) {
  cx2.save();
  cx2.font = '600 9px "Chakra Petch", sans-serif';
  cx2.fillStyle = color; cx2.textAlign = 'center';
  cx2.fillText(text, W/2 + PX(p.x), H/2 - PX(p.y) + (dy || -7));
  cx2.restore();
}

let proxMode = false;
function draw() {
  if (!W) return;
  cx2.clearRect(0,0,W,H);
  cx2.fillStyle = '#060B12'; cx2.fillRect(0,0,W,H);
  const b = soiBody(), e = D.e || el();
  const tgt = targetRel();
  proxMode = !!(tgt && V.len(tgt.r) < 30 && S.target === 'STATION');

  if (proxMode) { drawProximity(tgt); return; }

  // range rings
  cx2.save(); cx2.strokeStyle = '#111C28'; cx2.lineWidth = 1;
  const ringStep = niceStep(view.km * Math.min(W,H) * 0.18);
  for (let k = 1; k <= 8; k++) {
    const rr = PX(ringStep*k);
    if (rr > Math.hypot(W,H)) break;
    cx2.beginPath(); cx2.arc(W/2, H/2, rr, 0, TAU); cx2.stroke();
  }
  cx2.restore();

  // sphere of influence
  if (b.parent && isFinite(b.soi)) {
    cx2.save(); cx2.setLineDash([2,5]); cx2.strokeStyle = '#17323C'; cx2.lineWidth = 1;
    cx2.beginPath(); cx2.arc(W/2, H/2, PX(b.soi), 0, TAU); cx2.stroke(); cx2.restore();
  }

  // satellites of the current primary
  for (const c of (CHILDREN[S.soi] || [])) {
    const cb = BODIES[c], st = bodyStateInParent(c, S.t);
    if (PX(cb.a) < Math.hypot(W,H)) {
      cx2.save(); cx2.setLineDash([1,4]); cx2.strokeStyle = '#1B2B38'; cx2.lineWidth = 1;
      cx2.beginPath(); cx2.arc(W/2, H/2, PX(cb.a), 0, TAU); cx2.stroke(); cx2.restore();
    }
    const rp = PX(cb.R);
    disc(st.r, Math.max(rp, 2), cb.color + '55', cb.color);
    if (isFinite(cb.soi)) {
      cx2.save(); cx2.setLineDash([2,4]); cx2.strokeStyle = '#1B3A44';
      cx2.beginPath(); cx2.arc(W/2+PX(st.r.x), H/2-PX(st.r.y), PX(cb.soi), 0, TAU); cx2.stroke(); cx2.restore();
    }
    if (Math.abs(PX(st.r.x)) < W && Math.abs(PX(st.r.y)) < H) tag(st.r, c, '#4A566A', -Math.max(rp,2)-4);
  }

  // primary
  const bp = Math.max(PX(b.R), 2.5);
  const g = cx2.createRadialGradient(W/2,H/2,0, W/2,H/2,bp);
  g.addColorStop(0, b.color + '30'); g.addColorStop(1, b.color + '10');
  cx2.beginPath(); cx2.arc(W/2,H/2,bp,0,TAU); cx2.fillStyle = g; cx2.fill();
  cx2.strokeStyle = b.color + 'AA'; cx2.lineWidth = 1.2; cx2.stroke();
  if (b.atmo) {
    cx2.beginPath(); cx2.arc(W/2,H/2,PX(b.R + b.atmo),0,TAU);
    cx2.strokeStyle = b.color + '2E'; cx2.setLineDash([]); cx2.lineWidth = 1; cx2.stroke();
  }

  // station orbit
  const stn = S.objects.find(o => o.id === 'STATION' && o.soi === S.soi);
  if (stn) {
    const se = elements(stn.r, stn.v, b.mu);
    stroke(conicPath(se, b.mu, b.soi), '#5C4B15', [3,4], 1);
    disc(stn.r, 3, '#E8C04A', '#E8C04A');
    tag(stn.r, 'STN', '#E8C04A', -7);
  }

  // own trajectory
  stroke(conicPath(e, b.mu, isFinite(b.soi)?b.soi:e.r*4), '#3FA9C9', [], 1.3);

  // apsides
  if (e.e < 1 && isFinite(e.ra)) {
    const ap = { x:e.ra*Math.cos(e.argp+Math.PI), y:e.ra*Math.sin(e.argp+Math.PI) };
    disc(ap, 2.5, '#F2A33C', null); tag(ap, 'AP', '#9A6A2A', -6);
  }
  const pe = { x:e.rp*Math.cos(e.argp), y:e.rp*Math.sin(e.argp) };
  disc(pe, 2.5, '#F2A33C', null); tag(pe, 'PE', '#9A6A2A', -6);

  // vehicle
  const CX = W/2 + PX(S.r.x), CY = H/2 - PX(S.r.y);
  // a tick showing where the autopilot is asking the nose to go, while it turns
  if (S.att.slewing) {
    const cmd = commandedTheta();
    cx2.save(); cx2.translate(CX, CY); cx2.rotate(-cmd);
    cx2.beginPath(); cx2.moveTo(9,0); cx2.lineTo(15,0);
    cx2.strokeStyle = '#3FA9C9'; cx2.lineWidth = 1.2; cx2.stroke();
    cx2.restore();
  }
  cx2.save(); cx2.translate(CX, CY); cx2.rotate(-S.att.theta);
  if (S.burn && !S.aligning) {
    // thrust leaves the back of the nose, wherever the nose is pointing
    cx2.beginPath(); cx2.moveTo(-5,0);
    const fl = 9 + Math.random()*5;
    cx2.lineTo(-fl, -2.6); cx2.lineTo(-fl, 2.6); cx2.closePath();
    cx2.fillStyle = '#F2A33Ccc'; cx2.fill();
  }
  cx2.beginPath(); cx2.moveTo(6,0); cx2.lineTo(-4,-3.6); cx2.lineTo(-4,3.6); cx2.closePath();
  cx2.fillStyle = '#F2A33C'; cx2.fill();
  cx2.restore();

  document.getElementById('scope-tag').textContent =
    `ORBITAL PLOT · ${b.name}` + (S.target ? `  ▸ TGT ${S.target}` : '');
  document.getElementById('scope-scale').textContent = `⟷ ${fmtDist(ringStep)}/ring`;
}

function drawProximity(tgt) {
  const range = V.len(tgt.r);
  const span = Math.max(range * 2.6, 0.06);
  const kmpx = span / (Math.min(W,H) * 0.44);
  const P = (v) => v / kmpx;
  cx2.save();
  cx2.strokeStyle = '#111C28'; cx2.lineWidth = 1;
  for (let k = 1; k <= 5; k++) { cx2.beginPath(); cx2.arc(W/2,H/2, P(span/5*k), 0, TAU); cx2.stroke(); }
  cx2.beginPath(); cx2.moveTo(W/2-8,H/2); cx2.lineTo(W/2+8,H/2);
  cx2.moveTo(W/2,H/2-8); cx2.lineTo(W/2,H/2+8); cx2.strokeStyle='#1E5A48'; cx2.stroke();

  const TX = W/2 + P(tgt.r.x), TY = H/2 - P(tgt.r.y);
  // The docking corridor: the port's axis out of the station, and the cone the
  // approach has to stay inside. Drawn from the port, not the station's centre.
  const g = dockGeom();
  if (g) {
    const PX_ = W/2 + P(tgt.r.x + g.axis.x*PORT_ARM_STN), PY_ = H/2 - P(tgt.r.y + g.axis.y*PORT_ARM_STN);
    const L = P(Math.max(range*1.6, 0.05));
    const half = Math.atan2(DOCK_ENV.latMax/1000, Math.max(g.axial,1)/1000);
    const a0 = Math.atan2(g.axis.y, g.axis.x);
    cx2.save(); cx2.translate(PX_, PY_);
    for (const s of [-1, 1]) {
      cx2.beginPath(); cx2.moveTo(0,0);
      cx2.lineTo(Math.cos(a0 + s*Math.min(half, 0.5))*L, -Math.sin(a0 + s*Math.min(half, 0.5))*L);
      cx2.strokeStyle = '#1B3A44'; cx2.setLineDash([2,4]); cx2.lineWidth = 1; cx2.stroke();
    }
    cx2.setLineDash([]);
    cx2.beginPath(); cx2.moveTo(0,0); cx2.lineTo(Math.cos(a0)*L, -Math.sin(a0)*L);
    cx2.strokeStyle = '#1E5A48'; cx2.lineWidth = 1; cx2.stroke();
    // the port itself
    cx2.beginPath(); cx2.arc(0,0,3.2,0,TAU);
    cx2.strokeStyle = S.dock.phase === 'FREE' ? '#E8C04A' : '#57C08A'; cx2.lineWidth = 1.6; cx2.stroke();
    cx2.restore();
  }

  // relative velocity vector (scaled for legibility)
  const rv = tgt.v, rvm = V.len(rv);
  if (rvm > 1e-7) {
    const s = Math.min(P(range)*0.8, P(rvm*120));
    const u = V.unit(rv);
    cx2.beginPath(); cx2.moveTo(W/2,H/2);
    cx2.lineTo(W/2 + u.x*s, H/2 - u.y*s);
    cx2.strokeStyle = '#E4553C'; cx2.lineWidth = 1.4; cx2.stroke();
  }
  cx2.beginPath(); cx2.arc(TX,TY,5,0,TAU); cx2.strokeStyle='#E8C04A'; cx2.lineWidth=1.4; cx2.stroke();
  cx2.beginPath(); cx2.arc(TX,TY,1.6,0,TAU); cx2.fillStyle='#E8C04A'; cx2.fill();
  // own vehicle, pointing where the nose points
  cx2.save(); cx2.translate(W/2, H/2); cx2.rotate(-S.att.theta);
  cx2.beginPath(); cx2.moveTo(7,0); cx2.lineTo(-4,-3.4); cx2.lineTo(-4,3.4); cx2.closePath();
  cx2.fillStyle = '#F2A33C'; cx2.fill();
  cx2.restore();
  cx2.restore();
  // The port you are flying to is not always CERES: on M-12 it is your own
  // ship. The object carries the name; the geometry does not care.
  document.getElementById('scope-tag').textContent = 'PROXIMITY OPS · '
    + ((g && g.obj && g.obj.label) || 'STATION')
    + (g && S.dock.phase !== 'FREE' ? '  ▸ ' + S.dock.phase : g ? `  ▸ ${g.axial.toFixed(1)} m` : '');
  document.getElementById('scope-scale').textContent = `⟷ ${(span/5*1000).toFixed(0)} m/ring`;
}

function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x,1e-6))));
  const n = x/p;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p;
}
</script>

<script>
/* ============================================================
   FORMATTING + SCRATCHPAD
   ============================================================ */
function fmtDist(km) {
  if (!isFinite(km)) return '∞';
  const s = km < 0 ? '-' : ''; km = Math.abs(km);
  if (km < 1)    return s + (km*1000).toFixed(0) + ' m';
  if (km < 100)  return s + km.toFixed(2) + ' km';
  if (km < 1e6)  return s + Math.round(km).toLocaleString('en-US') + ' km';
  if (km < 1e9)  return s + (km/1e6).toFixed(3) + '×10⁶ km';
  return s + (km/AU).toFixed(4) + ' AU';
}
function fmtVel(kms) {
  if (!isFinite(kms)) return '—';
  return Math.abs(kms) < 1 ? (kms*1000).toFixed(1) + ' m/s' : kms.toFixed(3) + ' km/s';
}
function fmtDV(ms) { return (ms >= 1000 ? (ms/1000).toFixed(3)+' km/s' : ms.toFixed(1)+' m/s'); }
/* Proximity operations are worked in centimetres and hundredths of a metre per
   second. fmtDist renders both 0.15 m and 0.25 m as "0 m" and fmtVel renders
   0.03 m/s as "0.0 m/s" — at docking scale those are the difference between a
   clean capture and a bounce, so the corridor gets its own two formatters. */
function fmtRange(m) {
  if (!isFinite(m)) return '——';
  const s = m < 0 ? '−' : ''; m = Math.abs(m);
  if (m < 10)   return s + m.toFixed(2) + ' m';
  if (m < 1000) return s + m.toFixed(1) + ' m';
  return s + (m/1000).toFixed(2) + ' km';
}
function fmtRate(ms) {
  if (!isFinite(ms)) return '——';
  return (Math.abs(ms) < 10 ? ms.toFixed(3) : ms.toFixed(1)) + ' m/s';
}
function fmtT(sec) {
  if (!isFinite(sec)) return '——';
  const neg = sec < 0 ? '-' : ''; sec = Math.abs(Math.round(sec));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600),
        m = Math.floor(sec%3600/60), s = sec%60;
  const p = (n,w=2) => String(n).padStart(w,'0');
  return neg + (d ? `${p(d,3)}:` : '') + `${p(h)}:${p(m)}:${p(s)}`;
}
function fmtMET(sec) {
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600),
        m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  const p = (n,w=2) => String(n).padStart(w,'0');
  return `${p(d,3)}:${p(h)}:${p(m)}:${p(s)}`;
}
const pad = (s,n) => String(s).padEnd(n,' ');

const logEl = document.createElement('div');   // detached: the MSG page renders MSGS
const MSGS = [];
const SEVERITY = { err:'err', warn:'warn', ok:'ok', key:'info', hd:'info', sys:'info', dim:'info', out:'info' };
function say(text, cls) {
  // Anything said while the OTHER vehicle is being stepped is said about that
  // vehicle, and has to arrive labelled — "BUS TRIP" means something very
  // different when it is the ship you are not aboard.
  if (S.awayTick) text = `${(S.away && S.away.label) || 'THE OTHER VEHICLE'} · ${text}`;
  const plain = String(text).replace(/\{|\}/g, '');
  MSGS.push({ t: S.t, text: plain, cls: cls || 'out' });
  while (MSGS.length > 300) MSGS.shift();
  if (plain.trim() && cls !== 'dim' && cls !== 'hd') postMessage_(plain, SEVERITY[cls || 'out'] || 'info');
  const p = document.createElement('p');
  p.className = 'ln ' + (cls || 'out');
  p.innerHTML = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\{([^}]*)\}/g, '<span class="v">$1</span>');
  logEl.appendChild(p);
  while (logEl.childElementCount > 400) logEl.removeChild(logEl.firstChild);
}

/** The scratchpad carries the newest message until it is cleared, as on an MCDU.
 *  A lower-severity advisory does not wipe a standing caution or warning: on a
 *  real annunciator the more serious message holds the line. */
let spMessage = null;
const SEV_RANK = { info:0, ok:1, warn:2, err:3 };
function postMessage_(text, sev) {
  const now = Date.now();
  if (spMessage && SEV_RANK[sev] < SEV_RANK[spMessage.sev] && now - spMessage.at < 6000) return;
  spMessage = { text, sev, at: now };
  syncScratchpad();
}
function clearMessage() { spMessage = null; syncScratchpad(); }
function row(k, v, cls) { say(pad(k,14) + v, cls || 'out'); }
function head(t) { say(t, 'hd'); }

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const d = D, b = d.b || soiBody();
  const set = (id, v) => { const n = document.getElementById(id); if (n.textContent !== v) n.textContent = v; };
  set('r-met', fmtMET(S.t));
  set('r-warp', S.warp === 0 ? 'HOLD' : S.warp.toLocaleString('en-US') + '×');
  set('r-soi', b.name);
  set('r-dv', fmtDV(d.dv || 0));
  // No avionics, no navigation. The vehicle is still out there doing exactly
  // what it was doing; you simply cannot see any of it.
  if (!sysOn('AVIO')) {
    for (const id of ['d-alt','d-vel','d-apo','d-tapo','d-per','d-tper','d-ecc','d-prd']) set(id, '——');
    set('k-apo', 'Apo'); set('k-tapo', 'T−Apo'); set('k-per', 'Peri'); set('k-tper', 'T−Peri');
    for (const id of ['d-apo','d-tapo','d-per']) document.getElementById(id).parentElement.className = 'ro';
    const lamp0 = document.getElementById('r-lamp');
    const dead = !sysOn('BATT');
    lamp0.textContent = dead ? 'DARK' : 'NO NAV DATA';
    lamp0.className = 'lamp ' + (dead ? 'crit' : 'caution');
    return;
  }
  set('d-alt', fmtDist(d.alt));
  set('d-vel', Math.abs(d.e.v) < 1 ? (d.e.v*1000).toFixed(0)+' m/s' : d.e.v.toFixed(2)+' km/s');
  // Below 60 km on a landing, apsides stop meaning anything and the two numbers
  // that decide whether you survive are descent rate and lateral drift.
  // Below 60 km on a landing, apoapsis and its countdown stop meaning anything;
  // descent rate and lateral drift are what decide whether you survive.
  const descent = S.landingAllowed && d.alt < 60 && S.status === 'flight';
  // Same frame the touchdown gate judges in. Reporting these inertially while
  // the gate reads ground-relative put 464.6 m/s of lateral drift on the
  // descent readout, in red, for a capsule hanging dead still under its
  // canopies — the one instrument the player is watching all the way down.
  const vRefH = d.b.rho0 ? airRelative(S.r, S.v, d.b) : S.v;
  const vspd = -V.dot(vRefH, V.unit(S.r)), hspd = Math.abs(V.crs(V.unit(S.r), vRefH));
  set('k-apo',  descent ? 'V-Speed' : 'Apo');
  set('d-apo',  descent ? fmtVel(vspd) : (d.escape ? 'ESCAPE' : fmtDist(d.apoAlt)));
  set('k-tapo', descent ? 'Lateral' : 'T−Apo');
  set('d-tapo', descent ? fmtVel(hspd) : (isFinite(d.tApo) ? fmtT(d.tApo) : '——'));
  set('d-per',  fmtDist(d.perAlt));
  set('d-tper', isFinite(d.tPeri) ? fmtT(d.tPeri) : '——');
  set('d-ecc', (d.e.e).toFixed(4));
  set('d-prd', d.e.period === Infinity ? '——' : fmtT(d.e.period));

  const apoRO  = document.getElementById('d-apo').parentElement;
  const tapoRO = document.getElementById('d-tapo').parentElement;
  const perRO  = document.getElementById('d-per').parentElement;
  if (descent) {
    apoRO.className  = 'ro' + (vspd*1000 > 12 ? ' bad' : vspd*1000 > 4 ? ' warn' : '');
    tapoRO.className = 'ro' + (hspd*1000 > 8 ? ' bad' : hspd*1000 > 3 ? ' warn' : '');
  } else {
    apoRO.className = 'ro'; tapoRO.className = 'ro';
  }
  perRO.className = 'ro' + (d.perAlt < 0 ? ' bad' : (b.atmo && d.perAlt < b.atmo ? ' warn' : ''));

  const lamp = document.getElementById('r-lamp');
  let txt = 'NOMINAL', cls = 'ok';
  if (S.status === 'lost')      { txt = 'VEHICLE LOST'; cls = 'crit'; }
  else if (S.completed)         { txt = 'OBJECTIVES MET'; cls = 'ok'; }
  else if (S.status === 'landed')   { txt = 'LANDED'; cls = 'ok'; }
  else if (S.aligning)          { txt = 'ALIGNING'; cls = 'caution'; }
  else if (S.burn)              { txt = 'ENGINE ' + S.burn.dir; cls = 'caution'; }
  else if (S.power.batt <= 0.1) { txt = 'BUS UNDERVOLT'; cls = 'crit'; }
  else if (d.perAlt < 0)        { txt = 'IMPACT TRAJ'; cls = 'crit'; }
  else if (S.craft.crew > 0 && S.craft.o2 / S.craft.crew < 4) { txt = 'OXYGEN LOW'; cls = 'crit'; }
  else if (S.therm.hull > (S.thermLimit||800)*0.8) { txt = 'THERMAL'; cls = 'caution'; }
  else if (S.craft.crew > 0 && S.craft.o2 / S.craft.crew < 24) { txt = 'OXYGEN'; cls = 'caution'; }
  else if (S.power.batt < S.power.battMax*0.2) { txt = 'LOW POWER'; cls = 'caution'; }
  else if (S.sched)             { txt = 'BURN ARMED'; cls = 'caution'; }
  if (lamp.textContent !== txt) lamp.textContent = txt;
  lamp.className = 'lamp ' + cls;

}
</script>

<script>
/* ============================================================
   COMMANDS
   ============================================================ */
const DIRS = {
  PRO:'PRO', PROGRADE:'PRO', P:'PRO',
  RET:'RET', RETROGRADE:'RET', R:'RET',
  ROUT:'ROUT', RADOUT:'ROUT', OUT:'ROUT', UP:'ROUT',
  RIN:'RIN', RADIN:'RIN', IN:'RIN', DOWN:'RIN',
};
const DIRNAME = { PRO:'prograde', RET:'retrograde', ROUT:'radial out', RIN:'radial in' };
const ATTNAME = { PRO:'PROGRADE', RET:'RETROGRADE', ROUT:'RADIAL OUT', RIN:'RADIAL IN',
                  TGT:'TARGET', ATGT:'ANTI-TARGET', INRT:'INERTIAL', FREE:'FREE DRIFT',
                  PAXS:'DOCK AXIS' };
/** What the ORB page should call the current attitude. */
const attLabel = () => S.dock.phase !== 'FREE' ? 'MATED' : (ATTNAME[S.att.mode] || S.att.mode);

function startBurn(dir, dur, scheduled) {
  if (S.status !== 'flight') return say('Vehicle is not in flight.', 'err');
  if (S.dock.phase !== 'FREE') return say('MATED TO THE STATION — the main engine is inhibited. UNDOCK first.', 'err');
  if (S.craft.fuel <= 0) return say('No main propellant remaining.', 'err');
  if (S.burn) return say('Engine already lit. CANCEL first.', 'err');
  if (!sysOn('PRESS')) return say('PROPULSION NOT PRESSURISED — the main engine will not light on unpressurised tanks. Bring PROPULSION up on the SYS page.', 'err');
  if (!sysOn('GNC')) return say(sysState('GNC') === 'START'
    ? `GUIDANCE ALIGNING — ${fmtT(alignLeft())} to go. The engine has no attitude reference until the platform is aligned.`
    : 'GUIDANCE NOT ALIGNED — without an aligned platform there is no attitude reference and the engine will not light. Bring GUIDANCE up on the SYS page.', 'err');
  S.preBurnWarp = S.warp;
  if (S.warp > 10) S.warp = 10;
  setAttMode(dir);
  S.burn = { dir, left:dur, total:dur };
  const est = burnDV(dur);
  say(`IGNITION · ${DIRNAME[dir]} for {${dur.toFixed(1)} s}  ≈ {${fmtDV(est)}}`
      + (scheduled ? '  (scheduled)' : ''), 'key');
}
function burnDV(dur) {
  const m0 = craftMass();
  const mdot = curFlow();
  const m1 = Math.max(m0 - Math.min(S.craft.fuel, mdot*dur), 1);
  return curIsp()*G0*Math.log(m0/m1);
}
/** seconds of burn needed for a given ΔV (m/s) */
function burnTimeFor(dv) {
  const m0 = craftMass();
  const m1 = m0 / Math.exp(dv/(curIsp()*G0));
  const mdot = curFlow();
  return (m0 - m1)/mdot;
}

const WARPS = [0,1,5,10,50,100,1000,10000,100000,1000000];

function exec(raw) {
  const line = raw.trim();
  if (!line) return;
  say(line, 'cmd');
  const tok = line.toUpperCase().split(/\s+/);
  const c = tok[0], A = tok.slice(1);
  const num = (i, def) => { const n = parseFloat(A[i]); return isFinite(n) ? n : def; };

  switch (c) {

  case 'HELP': case '?': case 'MAN': return gotoPage('HELP');

  case 'STAT': case 'PFD': case 'ORB': return gotoPage('ORB');
  case 'NAV': case 'ORBIT': return gotoPage('ORB', 1);
  case 'MSG': case 'MESSAGES': return gotoPage('MSG');
  case 'MENU': case 'INDEX': case 'STATUS': return gotoPage('MENU');
  case 'SYS': case 'SYSTEMS': return cmdSys(A, false);
  case 'START': return cmdSys(A, false);
  case 'STOP': case 'SHED': return cmdSys(A, true);
  case 'BATT': case 'BATTERY': return cmdSys(['BATT'], A[0] === 'OFF');
  case 'TIME': case 'CLK': {
    say(`MET ${fmtMET(S.t)} · WARP ${S.warp === 0 ? 'HOLD' : S.warp + '×'}`, 'sys');
    return gotoPage('ORB');
  }

  case 'BURN': case 'B': {
    const dir = DIRS[A[0]];
    if (!dir) return say('Usage: BURN <PRO|RET|RIN|ROUT> <seconds> [AT PE|AP|T+<s>]', 'err');
    const dur = num(1, NaN);
    if (!isFinite(dur) || dur <= 0) return say('Burn duration in seconds is required. e.g. BURN PRO 42', 'err');
    const atIx = A.indexOf('AT');
    if (atIx >= 0) {
      const w = A[atIx+1] || '';
      if (w === 'PE' || w === 'AP') {
        S.sched = { dir, dur, at:w }; setAttMode(dir);
        const tt = w === 'PE' ? D.tPeri : D.tApo;
        return say(`BURN ARMED · ${DIRNAME[dir]} ${dur.toFixed(1)} s at ${w === 'PE' ? 'periapsis' : 'apoapsis'}, T−{${fmtT(tt)}}. Ignition starts {${(dur/2).toFixed(1)} s} early to centre the burn.`, 'key');
      }
      if (w === 'XFER' || w === 'WINDOW') {
        const tk = A[atIx+2];
        if (!tk || !BODIES[tk]) return say('Usage: BURN <DIR> <SEC> AT XFER <BODY>', 'err');
        if (BODIES[tk].parent !== S.soi) return say(`${tk} does not orbit ${soiBody().name}.`, 'err');
        S.sched = { dir, dur, at:'XFER', body:tk }; setAttMode(dir);
        const win = transferWindow(tk);
        return say(`BURN ARMED · ${DIRNAME[dir]} ${dur.toFixed(1)} s at the ${tk} transfer window, T−{${fmtT(win.wait)}}. Wind the clock up — the console will hold the node.`, 'key');
      }
      const m = w.match(/^T\+?(\d+(\.\d+)?)$/);
      if (m) { S.sched = { dir, dur, at:'T', when:S.t + parseFloat(m[1]) }; setAttMode(dir);
        return say(`BURN ARMED · ${DIRNAME[dir]} ${dur.toFixed(1)} s in {${fmtT(parseFloat(m[1]))}}.`, 'key'); }
      return say('AT takes PE, AP, or T+<seconds>.', 'err');
    }
    return startBurn(dir, dur);
  }

  case 'CANCEL': case 'ABORT': case 'MECO': {
    if (S.burn) { endBurn(S.burn.ascent ? 'MECO — main engine cutoff' : 'BURN ABORTED',
                          S.burn.ascent ? 'ok' : 'warn'); if (S.pad) S.pad.meco = S.t; return; }
    if (S.sched) { S.sched = null; return say('Armed burn cleared.', 'sys'); }
    return say('Nothing to cancel.', 'sys');
  }

  /* ---- launch: the count, the program, the stack, the throttle ---- */
  case 'LAUNCH': case 'PAD': case 'ASCENT': {
    if (!S.pad) return say('This vehicle is not on a pad. The launch page is live only before liftoff.', 'err');
    return gotoPage('LNCH');
  }
  case 'COUNT': case 'CTDN': case 'CLOCK': {
    if (!S.pad) return say('No countdown — this vehicle is not on a pad.', 'err');
    const p = S.pad;
    if (p.lifted) return say('Lifted off at ' + fmtMET(p.liftT) + '. The count is done.', 'sys');
    const w = A[0] || '';
    if (w === 'HOLD' || w === 'STOP') { p.hold = true;
      return say(`COUNT HELD at T${fmtCount(p.T)}. RESUME when you are ready — nothing else stops.`, 'warn'); }
    if (w === 'GO' || w === 'RESUME' || w === 'START') { p.hold = false;
      return say(`COUNT RESUMED · T${fmtCount(p.T)} and counting.`, 'ok'); }
    if (w === 'SET') { const v = num(1, NaN);
      if (!isFinite(v) || v < 0) return say('Usage: COUNT SET <seconds before liftoff>', 'err');
      p.T = -v; return say(`COUNT RESET to T${fmtCount(p.T)}${p.hold ? ', still holding' : ''}.`, 'sys'); }
    return say(`T${fmtCount(p.T)}${p.hold ? '  HOLDING' : ' and counting'}.  COUNT HOLD | GO | SET <s>`, 'sys');
  }
  case 'PITCH': {
    if (!S.pad) return say('The pitch program belongs to a vehicle on the pad.', 'err');
    if (A[0] === 'DEFAULT' || A[0] === 'RESET') {
      S.pad.program = PITCH_DEFAULT.map(r => [r[0], r[1]]);
      return say('PITCH PROGRAM RESET to the filed profile.', 'sys');
    }
    if (!A.length) {
      head('PITCH PROGRAM');
      S.pad.program.forEach((r,i) => row(`ROW ${i+1}`, `${r[0].toFixed(1)} km   ${r[1].toFixed(0)}°`));
      say('PITCH <row> <altitude km> <pitch deg>   ·   PITCH DEFAULT', 'out');
      return;
    }
    const ix = num(0, NaN), alt = num(1, NaN), pit = num(2, NaN);
    if (!isFinite(ix) || ix < 1 || ix > S.pad.program.length)
      return say(`Row must be 1 to ${S.pad.program.length}.`, 'err');
    if (!isFinite(alt) || alt < 0 || !isFinite(pit) || pit < -10 || pit > 90)
      return say('Usage: PITCH <row> <altitude km> <pitch 0-90°>. 90° is straight up, 0° is along the horizon.', 'err');
    S.pad.program[ix-1] = [alt, pit];
    S.pad.program.sort((a,b) => a[0] - b[0]);
    return say(`PITCH PROGRAM · ${alt.toFixed(1)} km at ${pit.toFixed(0)}° above the horizon.`, 'ok');
  }
  case 'IGNITE': {
    if (!S.pad) return say('Nothing to ignite — this vehicle is not on a pad.', 'err');
    if (!S.pad.lifted) { const bad = ignite(); return bad ? say(bad, 'err') : undefined; }
    // Relighting a stage in flight, still under the pitch program.
    if (S.burn) return say('The engine is already lit.', 'err');
    if (S.craft.fuel <= 0) return say('This stage is dry. STAGE first.', 'err');
    if (!sysOn('PRESS')) return say('PROPULSION NOT PRESSURISED.', 'err');
    S.pad.meco = null;
    S.burn = { dir: 'INRT', left: Infinity, total: Infinity, ascent: true };
    setAttMode('INRT', pitchToTheta(pitchCommand(Math.max(0, D.alt))));
    return say(`IGNITION · ${S.craft.stageName || S.craft.name}, guidance on the pitch program.`, 'key');
  }
  // SEP used to be a second name for STAGE. It is not any more: dropping a
  // spent stage and separating a crewed lander are different enough acts that
  // sharing a word would eventually cost somebody a vehicle. STAGE drops a
  // stage; SEP lets go of a ship.
  case 'STAGE': case 'JETT': {
    const bad = jettisonStage();
    return bad ? say(bad, 'err') : undefined;
  }
  case 'THR': case 'THROTTLE': {
    if (!A.length) return say(`Throttle ${(S.throttle*100).toFixed(0)}%.  THR <5-100>`, 'sys');
    let v = num(0, NaN);
    if (!isFinite(v)) return say('Usage: THR <percent>, 5 to 100.', 'err');
    if (v > 1 && v <= 100) v /= 100;
    if (!(v >= 0.05 && v <= 1)) return say('Throttle runs from 5% to 100% — below that the engine will not stay lit.', 'err');
    S.throttle = v;
    return say(`THROTTLE ${(v*100).toFixed(0)}% · ${(curThrust()*1000).toFixed(0)} N`
      + (S.burn ? '' : '. The solver plans at whatever the throttle is set to.'), 'sys');
  }

  case 'HOLD': case 'ATT': {
    const extra = { TGT:'TGT', TARGET:'TGT', ATGT:'ATGT', FREE:'FREE', INRT:'INRT',
                    DOCK:'PAXS', AXIS:'PAXS', PAXS:'PAXS' };
    const dir = DIRS[A[0]] || extra[A[0]];
    if (!dir) return say('Usage: HOLD <PRO|RET|RIN|ROUT|TGT|ATGT|DOCK|FREE>', 'err');
    if (S.dock.phase !== 'FREE') return say('MATED — the interface holds the attitude.', 'err');
    if (!sysOn('ATT')) return say('ATTITUDE CONTROL IS OFF — the reaction wheels are not running. Bring ATTITUDE up on the SYS page.', 'err');
    // FREE is always available: it is how you stop the vehicle turning, which
    // is the remedy when a slew is fouling an alignment.
    if (dir !== 'FREE' && !sysOn('GNC')) return say(sysState('GNC') === 'START'
      ? `GUIDANCE ALIGNING — ${fmtT(alignLeft())} to go. There is no attitude reference to hold against until it finishes.`
      : 'GUIDANCE NOT ALIGNED — the platform has no attitude reference. Bring GUIDANCE up on the SYS page.', 'err');
    if (dir === 'PAXS' && !dockGeom()) return say('No docking target. Try  TGT STATION.', 'err');
    setAttMode(dir);
    return say(`ATTITUDE HOLD · ${ATTNAME[dir]}`, 'sys');
  }

  case 'WARP': case 'W': {
    if (!A[0]) return say(`Warp is ${S.warp}×. Available: ${WARPS.join(', ')}`, 'sys');
    if (A[0] === 'UP' || A[0] === '+') { const i = WARPS.indexOf(S.warp); S.warp = WARPS[Math.min(i+1, WARPS.length-1)]; }
    else if (A[0] === 'DOWN' || A[0] === '-') { const i = WARPS.indexOf(S.warp); S.warp = WARPS[Math.max(i-1,0)]; }
    else { const n = num(0, NaN);
      if (!isFinite(n)) return say('Usage: WARP <rate>  (0 holds the clock)', 'err');
      S.warp = WARPS.reduce((a,b) => Math.abs(b-n) < Math.abs(a-n) ? b : a); }
    if (S.burn && S.warp > 10) { S.warp = 10; say('Warp limited to 10× with the engine lit.', 'warn'); }
    if (inProxOps() && S.warp > 10) { S.warp = 10; say('Warp limited to 10× inside 500 m.', 'warn'); }
    return say(S.warp === 0 ? 'Clock HOLD.' : `Time warp ${S.warp}×.`, 'sys');
  }
  case 'GO': case 'RUN': { S.warp = Math.max(1, S.warp); return say('Clock running.', 'sys'); }

  case 'TGT': case 'TARGET': {
    if (!A[0]) { S.target = null; return say('Target cleared.', 'sys'); }
    const t = A[0];
    if (t === 'STATION' || t === 'STN') {
      if (!S.objects.some(o => o.id === 'STATION')) return say('No station in this scenario.', 'err');
      S.target = 'STATION';
    } else if (BODIES[t]) S.target = t;
    else return say(`Unknown target "${A[0]}". Try a body name or STATION.`, 'err');
    return say(`Target set: {${S.target}}.`, 'sys');
  }

  case 'PLAN': {
    if (!A.length) return gotoPage('PLAN');
    cmdPlan(A);
    if (S.solution) gotoPage('PLANR');
    return;
  }
  case 'DOCK': case 'PROX': return cmdDock(A);
  case 'SEP': case 'SEPARATE': return cmdSep(A);
  case 'SURF': case 'SURFACE': return cmdSurf(A);
  case 'UTIL': case 'UTILITIES': return gotoPage('UTIL');
  case 'ENTRY': case 'EDL': case 'REENTRY': return gotoPage('ENTR');
  case 'CHUTE': case 'CHUTES': {
    const a = (A && A[0]) || '';
    if (a === 'DROGUE' || a === 'D') { const m = deployChute('DROGUE'); return m ? say(m, 'err') : undefined; }
    if (a === 'MAIN' || a === 'MAINS' || a === 'M') { const m = deployChute('MAIN'); return m ? say(m, 'err') : undefined; }
    return gotoPage('ENTR', 1);
  }
  case 'DROGUE': { const m = deployChute('DROGUE'); return m ? say(m, 'err') : undefined; }
  case 'MAINS': { const m = deployChute('MAIN'); return m ? say(m, 'err') : undefined; }
  case 'TRANS': case 'RCS': return cmdTrans(A);

  case 'PWR': case 'POWER': case 'EPS': return cmdPwr(A);
  case 'FUEL': case 'PROP': return gotoPage('FUEL');
  case 'COMM': case 'DSN': return gotoPage('COMM');
  case 'THERM': case 'TEMP': return gotoPage('THRM');
  case 'LIFE': case 'ECLSS': return gotoPage('LIFE');


  case 'MIS': case 'MISSION': case 'MISSIONS': return cmdMis(A);
  case 'LOG': case 'OBJ': return gotoPage('MSN');
  case 'RESTART': case 'RESET': {
    if (!S.mission) return say('NO MISSION LOADED', 'err');
    const what = (A && A[0]) || '';
    if (what === 'PAD' || what === 'START' || what === 'TOP') return loadMission(S.mission.id);
    if (what === 'PHASE' || what === 'CHECKPOINT' || what === 'CP') {
      const m = restoreCheckpoint();
      return m ? say(m, 'err') : undefined;
    }
    // On a flat mission RESTART means what it has always meant. On an ordered
    // one there are two honest answers and picking one silently would throw
    // away either an hour of flying or the fresh start the player asked for.
    if (!S.phases || !lastCheckpoint()) return loadMission(S.mission.id);
    const cp = lastCheckpoint();
    head('RESTART · ' + S.mission.code);
    row('LAST CHECKPOINT', `${cp.name} at ${fmtMET(cp.t)}`, 'ok');
    row('RESUME IT', 'RESTART PHASE', 'key');
    row('START OVER', 'RESTART PAD', 'key');
    say('Both are on the MISSION page as keys.', 'sys');
    return;
  }
  case 'FULL': case 'FS': { toggleFullscreen(); return; }
  case 'CLS': case 'CLEAR': { MSGS.length = 0; clearMessage(); return; }
  case 'LAND': {
    S.landingAllowed = !S.landingAllowed;
    return say(`Landing mode ${S.landingAllowed ? 'ARMED — touchdown will be attempted' : 'SAFED'}.`, 'sys');
  }
  default:
    return say(`Unrecognised command "${c}". Type HELP for the command list.`, 'err');
  }
}

/* ---- readout pages ---------------------------------------- */
function cmdPwr(A) {
  const a = (A && A[0]) || '';
  // The three switched loads keep their old meaning and their old draws.
  if (['HEAT','SCI','COMM'].includes(a)) {
    const on = A[1] !== 'OFF';
    S.loads[a] = on;
    const eq = { HEAT:'THERM', COMM:'COMM', SCI:'BUS' }[a];
    if (on && !sysOn(eq))
      return say(`${a} LOAD SWITCHED ON — but ${SYSDEF[eq].name} is not running, so it is drawing nothing and doing nothing.`, 'warn');
    return say(`${a} LOAD ${on ? 'ON' : 'OFF'}`, 'sys');
  }
  if (a === 'UP' || a === 'SEQ') {
    if (SYSIDS.every(id => !sysFitted(id) || sysOn(id))) return say('Everything is already running.', 'sys');
    sysStart('BATT');
    S.pwrUp = true;
    say(`AUTO POWER-UP RUNNING · each system started the moment its prerequisites are up. It takes the same ${Math.round(ALIGN_TIME/60)+' to '+Math.round((ALIGN_TIME+120)/60)} minutes it takes by hand — the alignment is the long pole either way. Hold the attitude steady while it runs.`, 'key');
    return gotoPage('SYS');
  }
  if (a === 'DOWN' || a === 'DARK' || a === 'COLD') {
    S.pwrUp = false; sysBoot([]); setAttMode('FREE');
    say('VEHICLE POWERED DOWN · every system off and the console with them. The battery tie is the way back.', 'warn');
    return gotoPage('SYS');
  }
  gotoPage('PWR');
}

/** START / STOP a single system, and the SYS page's line-select keys. */
const SYSALIAS = { BATTERY:'BATT', BUSS:'BUS', AVIONICS:'AVIO', ARRAYS:'ARRAY', SOLAR:'ARRAY',
                   THERMAL:'THERM', HEAT:'THERM', LIFE:'ECLSS', AIR:'ECLSS', O2:'ECLSS',
                   ATTITUDE:'ATT', RCS:'PRESS', PROP:'PRESS', PROPULSION:'PRESS',
                   GUIDANCE:'GNC', IMU:'GNC', ALIGN:'GNC', TX:'COMM', RADIO:'COMM' };
function cmdSys(A, stop) {
  const a = (A && A[0]) || '';
  if (!a) return gotoPage('SYS');
  const id = SYSDEF[a] ? a : SYSALIAS[a];
  if (!id || !SYSDEF[id])
    return say(`No system "${a}". SYS lists them: ${SYSIDS.join(' · ')}.`, 'err');
  if (stop) {
    if (!sysFitted(id)) return say(`${SYSDEF[id].name} is not fitted to this vehicle.`, 'err');
    if (sysState(id) === 'OFF') return say(`${SYSDEF[id].name} is already off.`, 'sys');
    const downstream = SYSIDS.filter(x => x !== id && sysState(x) !== 'OFF' && SYSDEF[x].needs.includes(id));
    sysStop(id);
    return say(`${SYSDEF[id].name} OFF.`
      + (downstream.length ? ` ${downstream.map(x => SYSDEF[x].name).join(' and ')} went with it.` : ''), 'warn');
  }
  const refusal = sysStart(id);
  if (refusal) return say(refusal, 'err');
  const d = SYSDEF[id];
  if (id === 'GNC')
    return say(`PLATFORM ALIGNMENT RUNNING · ${ALIGN_TIME} s, and only while the vehicle is held steady. Watch the residual drift fall — it has to reach ${ALIGN_OK.toFixed(2)} °/h. Turning the vehicle pushes it back.`, 'key');
  return say(d.warm > 0 ? `${d.name} STARTING · ${d.warm} s.` : `${d.name} ON LINE.`, d.warm > 0 ? 'key' : 'ok');
}
</script>

<script>
/* ============================================================
   PLAN — onboard maneuver solver
   ============================================================ */
function quoteBurn(dv, whereLabel, tt, solved) {
  const dir = dv >= 0 ? 'PRO' : 'RET';
  const impulsive = burnTimeFor(Math.abs(dv));
