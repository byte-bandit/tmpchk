function loadMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m) return say('No such mission.', 'err');
  S.t = 0; S.warp = 0; S.burn = null; S.sched = null; S.objects = [];
  S.target = null; S.status = 'flight'; S.att = 'PRO';
  S.completed = false; S.pauseAfterBurn = false;
  S.solution = null; S.burnSel = { dir:'PRO', at:'AP', dur:0 };
  S.landingAllowed = false; S.thermLimit = 800;
  S.therm.hull = 20; S.ledger = { dvUsed:0, burns:0 };
  S.loads = { HEAT:true, SCI:false, COMM:true };
  S.flags = { lunarSOI:false, perihelionPassed:false };
  S.warnedPower = S.warnedTherm = S.warnedAtmo = false;
  m.setup();
  S.mission = m;
  S.objectives = m.obj.map(o => ({ ...o, done:false }));
  derive(); fitView();
  logEl.innerHTML = '';
  head(`${m.code} · ${m.name}`);
  m.brief.forEach(b => { say(b, 'out'); say(''); });
  if (S.objectives.length) {
    say('OBJECTIVES', 'hd');
    S.objectives.forEach((o,i) => say(`  ${i+1}. ${o.text}`, 'out'));
  }
  say('');
  if (m.hint) row('PROCEDURE', m.hint, 'ok');
  row('CLOCK', 'HOLD', 'sys');
  if (typeof gotoPage === 'function') gotoPage('MSN');
  saveProgress();
}

/* ---- objectives -------------------------------------------- */
function checkObjectives() {
  if (S.status === 'lost' || S.completed || !S.objectives.length) return;
  if (S.soi === 'MOON') S.flags.lunarSOI = true;
  if (S.soi === 'SUN' && D.e && D.e.r < D.e.rp*1.02 && D.e.e > 0.05) S.flags.perihelionPassed = true;
  let changed = false;
  for (const o of S.objectives) {
    if (o.done) continue;
    let ok = false;
    try { ok = !!o.check(S, D); } catch (err) { ok = false; }
    if (ok) { o.done = true; changed = true; say(`OBJECTIVE MET · ${o.text}`, 'ok'); }
  }
  if (changed && S.objectives.every(o => o.done) && !S.completed) {
    S.completed = true;
    // let a running burn finish — cutting the engine here would strand the vehicle
    // mid-maneuver on the very burn that met the objective
    if (S.burn) S.pauseAfterBurn = true; else S.warp = 0;
    say('', 'out');
    head('MISSION COMPLETE · ' + S.mission.code);
    row('ELAPSED', fmtMET(S.t));
    row('ΔV EXPENDED', fmtDV(S.ledger.dvUsed));
    row('BURNS', String(S.ledger.burns));
    row('PROP LEFT', S.craft.fuel.toFixed(1) + ' kg');
    say('');
    const nxt = MISSIONS.find(m => m.id === S.mission.id + 1);
    if (nxt) row('NEXT', `MIS ${nxt.id}   ${nxt.code} ${nxt.name}`, 'sys');
    else row('ROSTER', 'all scripted missions flown', 'sys');
    say('MISSION COMPLETE · ' + S.mission.code, 'ok');
    markComplete(S.mission.id);
  }
}
function cmdMis(A) {
  if (A[0] !== undefined && A[0] !== '') {
    const n = parseInt(A[0], 10);
    if (!isNaN(n) && MISSIONS.some(m => m.id === n)) { loadMission(n); gotoPage('MSN'); return; }
    return say('USAGE   MIS <number>', 'err');
  }
  gotoPage('ROSTER');
}

<script>
/* ============================================================
   HELP
   ============================================================ */

/* ============================================================
   PERSISTENCE
   ============================================================ */
const KEY = 'deltav.progress.v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}
function markComplete(id) {
  try {
    const d = loadProgress();
    if (!d.includes(id)) { d.push(id); localStorage.setItem(KEY, JSON.stringify(d)); }
  } catch (e) { /* private browsing — progress is just not remembered */ }
}
function saveProgress() { /* roster state only; flight state is not resumed across loads */ }

/* ============================================================
   SCRATCHPAD INPUT
   ============================================================ */
const input = document.getElementById('cmd');
const spEl  = document.getElementById('spmsg');
const history = []; let hIx = -1;

function syncScratchpad() {
  const typing = input.value.length > 0;
  spEl.textContent = (!typing && spMessage) ? spMessage.text : '';
  spEl.className = 'spmsg ' + (spMessage ? spMessage.sev : 'info');
}
input.addEventListener('input', syncScratchpad);

document.getElementById('entry').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const v = input.value;
  if (!v.trim()) return;
  history.push(v); hIx = history.length;
  input.value = '';
  try { exec(v); } catch (err) { say('CONSOLE FAULT: ' + err.message, 'err'); }
  derive(); updateHUD(); renderCDU(); syncScratchpad();
});
input.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowUp')   { ev.preventDefault(); if (hIx > 0) input.value = history[--hIx]; syncScratchpad(); }
  if (ev.key === 'ArrowDown') { ev.preventDefault();
    if (hIx < history.length-1) input.value = history[++hIx]; else { hIx = history.length; input.value = ''; }
    syncScratchpad(); }
});
// CLR clears the pending message first, then the typed entry — MCDU behaviour
document.getElementById('clr').addEventListener('pointerdown', (ev) => {
  if (ev.pointerType !== 'mouse') ev.preventDefault();
});
document.getElementById('clr').addEventListener('click', () => {
  if (spMessage && !input.value) { clearMessage(); return; }
  input.value = '';
  syncScratchpad();
});
for (const [id, dir] of [['w-dn',-1],['w-up',1]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
  b.addEventListener('click', () => {
    const i = WARPS.indexOf(S.warp);
    S.warp = WARPS[Math.max(0, Math.min(WARPS.length-1, (i < 0 ? 1 : i) + dir))];
    if (S.burn && S.warp > 10) S.warp = 10;
    clearMessage(); updateHUD();
  });
}
document.getElementById('z-in').addEventListener('click',  () => { view.km /= 1.6; view.auto = false; });
document.getElementById('z-out').addEventListener('click', () => { view.km *= 1.6; view.auto = false; });
document.getElementById('z-fit').addEventListener('click', () => fitView());

/* ============================================================
   FULLSCREEN
   The page runs inside an artifact frame, so the Fullscreen API is only
   available when that frame permits it (document.fullscreenEnabled reports
   this). iPhone Safari has no page fullscreen at all. Where it cannot work,
   say what does instead rather than failing silently.
   ============================================================ */
const fsBtn = document.getElementById('fs');
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsAllowed = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

function fsAdvice() {
  say('FULLSCREEN NOT PERMITTED IN THIS FRAME — SEE MSG', 'warn');
  say('Open this console in its own browser tab and press FULL again.', 'dim');
  say('On iPhone, Safari has no fullscreen mode for web pages at all. Share → Add to Home Screen, then launch it from that icon: it opens without browser chrome, which is the same result.', 'dim');
}

async function toggleFullscreen() {
  const root = document.documentElement;
  try {
    if (fsElement()) {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    if (!fsAllowed()) return fsAdvice();
    if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' });
    else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    else return fsAdvice();
  } catch (err) {
    fsAdvice();
  }
}

function syncFullscreen() {
  const on = !!fsElement();
  fsBtn.textContent = on ? 'EXIT' : 'FULL';
  fsBtn.setAttribute('aria-label', on ? 'Leave fullscreen' : 'Enter fullscreen');
  resize(); if (view.auto) fitView();
  setTimeout(() => { resize(); if (view.auto) fitView(); }, 120);
}
for (const ev of ['fullscreenchange', 'webkitfullscreenchange'])
  document.addEventListener(ev, syncFullscreen);
fsBtn.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
fsBtn.addEventListener('click', toggleFullscreen);


/* ============================================================
   CDU — paged control & display unit

   Modelled on the Airbus MCDU: a title line carrying the page number, six
   label/data row pairs split left and right, line-select keys (1L-6L, 1R-6R)
   adjacent to each row, and a scratchpad line that carries typed entry and
   system messages. Conventions borrowed from the real thing:

     <TEXT / TEXT>   a line-select key is live for that field
     TEXT*           the key commits an action
     small label above large data value
     cyan  = selectable      amber = data
     green = computed/active yellow = action required

   Data refreshes once per second, as on a real flight management computer.
   ============================================================ */
const CDU = { page: 'ORB', sub: 0 };
const F = (lab, val, cls, act) => ({ lab: lab || '', val: val == null ? '' : String(val), cls: cls || '', act: act || null });
const NAV = (text, page) => F('', text, 'sel', page);
const takeScratch = () => { const v = input.value.trim(); return v; };
const eatScratch  = () => { const v = input.value.trim(); input.value = ''; syncScratchpad(); return v; };

/* ---- DOM, built once and only updated thereafter ---- */
const crowsEl = document.getElementById('crows');
const lskLEl  = document.getElementById('lsk-l');
const lskREl  = document.getElementById('lsk-r');
const ROWS = [], LSK = { l: [], r: [] };
for (let i = 0; i < 6; i++) {
  const row = document.createElement('div'); row.className = 'crow';
  const mk = (side) => {
    const f = document.createElement('div'); f.className = 'fld' + (side === 'r' ? ' right' : '');
    const lab = document.createElement('div'); lab.className = 'flab';
    const val = document.createElement('div'); val.className = 'fval';
    f.appendChild(lab); f.appendChild(val);
    f.addEventListener('click', () => fire(i, side));
    return { f, lab, val };
  };
  const L = mk('l'), R = mk('r');
  row.appendChild(L.f); row.appendChild(R.f);
  crowsEl.appendChild(row);
  ROWS.push({ row, L, R });
  for (const side of ['l', 'r']) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lsk';
    b.textContent = side === 'l' ? '‹' : '›';
    b.setAttribute('aria-label', `Line select ${i+1}${side.toUpperCase()}`);
    b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
    b.addEventListener('click', () => fire(i, side));
    (side === 'l' ? lskLEl : lskREl).appendChild(b);
    LSK[side].push(b);
  }
}

let CURRENT = [];                       // rows as last rendered, for hit-testing
function fire(i, side) {
  const row = CURRENT[i]; if (!row) return;
  const fld = row.full ? (side === 'l' ? row.full : null) : row[side];
  if (!fld || !fld.act) return;
  clearMessage();
  if (typeof fld.act === 'string') gotoPage(fld.act);
  else { fld.act(); }
  derive(); updateHUD(); renderCDU();
}

function gotoPage(id, sub) {
  if (!PAGES[id]) return;
  CDU.page = id; CDU.sub = sub || 0;
  renderCDU();
}

function renderCDU() {
  const def = PAGES[CDU.page] || PAGES.ORB;
  derive();
  const count = def.count ? Math.max(1, def.count()) : 1;
  if (CDU.sub >= count) CDU.sub = count - 1;
  if (CDU.sub < 0) CDU.sub = 0;
  let rows = [];
  try { rows = def.build(CDU.sub) || []; }
  catch (err) { rows = [{ full: F('FAULT', String(err.message).slice(0, 40), 'bad') }]; }

  document.getElementById('cdu-t').textContent = def.title(CDU.sub);
  document.getElementById('cdu-sub').textContent = def.sub ? def.sub() : '';
  document.getElementById('cdu-pg').textContent = count > 1 ? `${CDU.sub+1}/${count}` : '';
  document.getElementById('pg-prev').disabled = count < 2;
  document.getElementById('pg-next').disabled = count < 2;

  CURRENT = rows;
  for (let i = 0; i < 6; i++) {
    const r = rows[i], node = ROWS[i];
    node.row.classList.toggle('full', !!(r && r.full));
    const put = (cell, fld) => {
      cell.lab.textContent = fld ? fld.lab : '';
      cell.val.textContent = fld ? fld.val : '';
      cell.val.className = 'fval ' + (fld ? fld.cls : '');
      cell.f.classList.toggle('tap', !!(fld && fld.act));
      cell.f.style.display = '';
    };
    if (r && r.full) {
      put(node.L, r.full); put(node.R, null); node.R.f.style.display = 'none';
    } else {
      put(node.L, r ? r.l : null); put(node.R, r ? r.r : null);
    }
    const mark = (btn, fld, side) => {
      const on = !!(fld && fld.act);
      const go = on && /\*$/.test(fld.val);
      btn.className = 'lsk' + (go ? ' go' : on ? ' on' : '');
      btn.textContent = on ? (side === 'l' ? '‹' : '›') : '·';
      btn.disabled = !on;
    };
    mark(LSK.l[i], r ? (r.full ? r.full : r.l) : null, 'l');
    mark(LSK.r[i], r && !r.full ? r.r : null, 'r');
  }
  markPageKey();
}

/* ---- function keys: page selection only, never an action ---- */
const PAGEKEYS = [['ORB','ORB'],['PLAN','PLAN'],['BURN','BURN'],['TGT','TGT'],['DOCK','DOCK'],['MSN','MSN'],
                  ['PWR','PWR'],['FUEL','FUEL'],['THRM','THRM'],['COMM','COMM'],['LIFE','LIFE'],['MENU','MENU']];
const pkBar = document.getElementById('pagekeys');
const PKBTN = {};
for (const [label, id] of PAGEKEYS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'pk'; b.textContent = label;
  b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
  b.addEventListener('click', () => { clearMessage(); gotoPage(id); });
  pkBar.appendChild(b); PKBTN[id] = b;
}
function markPageKey() {
  for (const id in PKBTN) PKBTN[id].classList.toggle('cur', CDU.page === id);
}
for (const [id, dir] of [['pg-prev',-1],['pg-next',1]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
  b.addEventListener('click', () => { CDU.sub += dir; renderCDU(); });
}

const dv = () => fmtDV(dvRemaining());

/* ---- solution → armed burn ---- */
function armSolution() {
  const sol = S.solution;
  if (!sol) return say('NO SOLUTION COMPUTED', 'warn');
  if (sol.secs == null || !isFinite(sol.secs) || sol.secs <= 0) return say('SOLUTION NOT EXECUTABLE', 'err');
  if (sol.node === 'PE' || sol.node === 'AP') {
    S.sched = { dir: sol.dir, dur: sol.secs, at: sol.node };
    say(`BURN ARMED · ${DIRNAME[sol.dir]} ${sol.secs.toFixed(1)} s at ${sol.node === 'PE' ? 'periapsis' : 'apoapsis'}`, 'ok');
  } else if (sol.node === 'T') {
    S.sched = { dir: sol.dir, dur: sol.secs, at: 'T', when: sol.when };
    say(`BURN ARMED · ${DIRNAME[sol.dir]} ${sol.secs.toFixed(1)} s at T+${(sol.when - S.t).toFixed(0)} s`, 'ok');
  } else {
    startBurn(sol.dir, sol.secs);
  }
  S.burnSel.dir = sol.dir; S.burnSel.dur = sol.secs;
  if (sol.node) S.burnSel.at = sol.node;
  gotoPage('BURN');
}
function planThen(fn) { return () => { fn(); if (S.solution) gotoPage('PLANR'); }; }
function numFromScratch(what) {
  const v = eatScratch();
  const n = parseFloat(v);
  if (!v) { say(`ENTER ${what} IN THE SCRATCHPAD FIRST`, 'warn'); return null; }
  if (!isFinite(n)) { say('ENTRY OUT OF RANGE', 'err'); return null; }
  return n;
}

    return [
      { full: F('Mission', S.mission.name, 'ok') },
      o[0] ? { full: F(o[0].done ? 'MET' : 'OPEN', (o[0].done ? '✔ ' : '○ ') + o[0].text, o[0].done ? 'ok' : '') } : {},
      o[1] ? { full: F(o[1].done ? 'MET' : 'OPEN', (o[1].done ? '✔ ' : '○ ') + o[1].text, o[1].done ? 'ok' : '') } : {},
      o[2] ? { full: F(o[2].done ? 'MET' : 'OPEN', (o[2].done ? '✔ ' : '○ ') + o[2].text, o[2].done ? 'ok' : '') } : {},
      { l: F('Elapsed', fmtMET(S.t)), r: F('ΔV expended', fmtDV(S.ledger.dvUsed)) },
      { l: NAV('<ROSTER', 'ROSTER'), r: F('', 'RESTART*', 'go', () => exec('RESTART')) },
    ];
  } },

ROSTER: { count: () => Math.ceil(MISSIONS.length / 5), title: () => 'MISSION ROSTER',
  sub: () => '', build: (pg) => {
    const done = loadProgress();
    const slice = MISSIONS.slice(pg*5, pg*5 + 5);
    const rows = slice.map(m => ({ full: F(done.includes(m.id) ? 'FLOWN' : '',
      `<${m.code}  ${m.name}`, S.mission && S.mission.id === m.id ? 'ok' : 'sel',
      () => { loadMission(m.id); gotoPage('MSN'); }) }));
    while (rows.length < 5) rows.push({});
    rows.push({ l: NAV('<MISSION', 'MSN'), r: NAV('MENU>', 'MENU') });
    return rows;
  } },

MSG: { count: () => Math.max(1, Math.ceil(MSGS.length / 5)), title: () => 'MESSAGES',
  sub: () => MSGS.length + ' LOGGED', build: (pg) => {
    const rev = MSGS.slice().reverse();
    const slice = rev.slice(pg*5, pg*5 + 5);
    const rows = slice.map(m => ({ full: F(fmtMET(m.t).slice(4),
      m.text.length > 46 ? m.text.slice(0, 45) + '…' : m.text,
      m.cls === 'err' ? 'bad' : m.cls === 'warn' ? 'go' : m.cls === 'ok' ? 'ok' : m.cls === 'dim' ? 'dim' : '') }));
    while (rows.length < 5) rows.push({});
    rows.push({ l: NAV('<MENU', 'MENU'), r: F('', 'CLEAR ALL*', 'go', () => { MSGS.length = 0; clearMessage(); }) });
    return rows;
  } },

MENU: { count: () => 2, title: () => 'INDEX', sub: () => '', build: (pg) => pg === 0 ? [
    { l: NAV('<ORBIT', 'ORB'), r: NAV('MANEUVER>', 'PLAN') },
    { l: NAV('<BURN', 'BURN'), r: NAV('TARGET>', 'TGT') },
    { l: NAV('<PROXIMITY OPS', 'DOCK'), r: NAV('MISSION>', 'MSN') },
    { l: NAV('<MESSAGES', 'MSG'), r: NAV('HELP>', 'HELP') },
    { l: F('Reference', soiBody().name), r: F('MET', fmtMET(S.t)) },
    { l: F('', '', 'dim'), r: F('', '', 'dim') },
  ] : [
    { l: NAV('<ELECTRICAL', 'PWR'), r: NAV('PROPULSION>', 'FUEL') },
    { l: NAV('<THERMAL', 'THRM'), r: NAV('COMMUNICATIONS>', 'COMM') },
    { l: NAV('<LIFE SUPPORT', 'LIFE'), r: NAV('ROSTER>', 'ROSTER') },
    {}, {},
    { l: NAV('<ORBIT', 'ORB'), r: F('', '', 'dim') },
  ] },

HELP: { count: () => HELP_PAGES.length, title: () => 'REFERENCE', sub: () => HELP_PAGES[CDU.sub].t,
  build: (pg) => {
    const rows = HELP_PAGES[pg].rows.map(r => ({ full: F(r[0], r[1], r[2] || '') }));
    while (rows.length < 5) rows.push({});
    rows.push({ l: NAV('<MENU', 'MENU'), r: NAV('ORBIT>', 'ORB') });
    return rows;
  } },
};

const HELP_PAGES = [
  { t: 'HOW ORBITS BEHAVE', rows: [
    ['RULE', 'A burn changes the FAR side of the orbit', 'ok'],
    ['', 'PRO at periapsis  → apoapsis rises'],
    ['', 'PRO at apoapsis   → periapsis rises'],
    ['', 'RET at apoapsis   → periapsis falls'],
    ['CATCH-UP', 'Burn RET to catch something ahead', 'go'],
  ] },
  { t: 'LINE SELECT KEYS', rows: [
    ['', 'Keys beside each row act on that row.'],
    ['<TEXT', 'left key is live for that field', 'sel'],
    ['TEXT>', 'right key is live', 'sel'],
    ['TEXT*', 'key commits an action', 'go'],
    ['ENTRY', 'Type a value, then press its key.'],
  ] },
  { t: 'TYPED COMMANDS', rows: [
    ['BURN', 'BURN <DIR> <SEC> [AT PE|AP|T+n]'],
    ['WARP', 'WARP <rate>   or the rail arrows'],
    ['PLAN', 'PLAN CIRC AP · APO <km> · XFER <BODY>'],
    ['TRANS', 'TRANS TGT|AWAY|PORT|STBD <m/s>'],
    ['PAGES', 'Function keys below, or type the name.'],
  ] },
];

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  const dtReal = Math.min((ts - last)/1000, 0.1);
  last = ts;
  if (S.status === 'flight' && S.warp > 0) advance(dtReal * S.warp);
  derive();
  updateHUD();
  draw();
  // pages refresh at 1 Hz, as a flight management computer does
  if (ts - lastCDU >= 1000) { lastCDU = ts; renderCDU(); markPageKey(); }
}
let lastCDU = 0;

/* ============================================================
   BOOT
   ============================================================ */
function boot(restored) {
  document.getElementById('veil').classList.add('hidden');
  resize();
  if (!S.mission) {
    loadMission(1);
    const done = loadProgress();
    if (done.length) row('FLIGHT RECORD', `${done.length} mission${done.length>1?'s':''} flown`, 'sys');
  }
  renderCDU(); markPageKey(); syncScratchpad();
  requestAnimationFrame(frame);
  if (window.matchMedia('(min-width: 860px)').matches &&
      window.matchMedia('(pointer: fine)').matches) input.focus({preventScroll:true});
}
document.getElementById('boot').addEventListener('click', () => boot());

/* keep open viewers' flight state across a republish */
try {
  window.claude?.hot?.snapshot?.(() => ({
    t:S.t, soi:S.soi, r:S.r, v:S.v, mission:S.mission?.id, craft:S.craft,
    power:S.power, therm:S.therm, objectives:S.objectives.map(o=>o.done), booted:!document.getElementById('veil').classList.contains('hidden'),
  }));
} catch (e) {}

resize();
derive();
updateHUD();
draw();
</script>
