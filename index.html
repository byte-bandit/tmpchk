    'Cross into the Moon\'s sphere of influence, then let its gravity bend you back toward Earth.'],
  hint:'PLAN XFER MOON',
  setup(){ rig({name:'SELENE-1', dry:3400, fuel:8600, thrust:90, isp:315, rcs:30});
    setOrbit('EARTH', 200, 200, 0, 200);
    S.power.battMax = 1400; S.power.batt = 1400; S.power.area = 22; },
  obj:[
    { text:'Reach the Moon — enter lunar sphere of influence', check:(s)=> s.soi === 'MOON' },
    { text:'Return to Earth reference after the flyby', check:(s)=> s.soi === 'EARTH' && s.flags.lunarSOI },
  ]
},
{
  id:5, code:'M-05', name:'LUNAR ORBIT',
  brief:[
    'Same transfer as the flyby, but this time you stay.',
    'Arriving inside the Moon\'s sphere of influence you will be on a {hyperbolic} pass — faster than lunar escape velocity. Burn {retrograde} near closest approach to bleed off enough speed for the Moon to keep you.',
    'That is lunar orbit insertion. Miss it and you sail straight back out.'],
  hint:'PLAN XFER MOON  →  PLAN CIRC PE after capture',
  setup(){ rig({name:'SELENE-2', dry:3600, fuel:16000, thrust:110, isp:315, rcs:30, crew:3, o2:900});
    setOrbit('EARTH', 200, 200, 0, 200);
    S.power.battMax = 1800; S.power.batt = 1800; S.power.area = 26; },
  obj:[
    { text:'Enter the Moon\'s sphere of influence', check:(s)=> s.soi === 'MOON' },
    { text:'Capture into lunar orbit (closed, periapsis above 20 km)',

{

    'As horizontal speed dies the retrograde vector swings upward on its own, and the same command becomes your brake. Below 60 km the console swaps the apsis readouts for {descent rate} and {lateral drift} — those are the two numbers that matter now.',

    'Push past escape and you stop orbiting Earth. You start orbiting the Sun.'],

},
{
  id:8, code:'M-08', name:'RED PLANET',

    'You are already in solar orbit at Earth\'s distance, {1 AU} from the Sun. Mars sits at 1.52 AU.',

},

  brief:[

    'You are near aphelion, which is exactly where a periapsis change is cheapest. Raise perihelion above {0.24 AU} — that brings you in near 155 °C, with margin.'],
  hint:'PLAN PERI 35903489   (0.24 AU)',

    'Everything the missions teach works here. PLAN will solve any maneuver you ask it for.'],

    setOrbit('EARTH', 200, 200, 0, 0);

function loadMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m) return say('No such mission.', 'err');
  S.t = 0; S.warp = 0; S.burn = null; S.sched = null; S.objects = [];
  S.target = null; S.status = 'flight';
  S.att = { theta: 0, rate: 0, mode: 'PRO', inertial: 0, slewing: false };
  S.dock = freshDock();
  S.power.tie = 0;
  S.aligning = false; S.warnedProx = false;
  S.completed = false; S.pauseAfterBurn = false;
  S.solution = null; S.burnSel = { dir:'PRO', at:'AP', dur:0 };
  S.landingAllowed = false; S.thermLimit = 800;
  S.therm.hull = 20; S.ledger = { dvUsed:0, burns:0 };
  S.loads = { HEAT:true, SCI:false, COMM:true };
  S.flags = { lunarSOI:false, perihelionPassed:false };
  S.warnedPower = S.warnedTherm = S.warnedAtmo = false;
  m.setup();
  S.att.theta = commandedTheta('PRO');   // vehicles start pointed prograde
  S.mission = m;
  S.objectives = m.obj.map(o => ({ ...o, done:false }));
  derive(); fitView();
  logEl.innerHTML = '';
  head(`${m.code} · ${m.name}`);
  m.brief.forEach(b => { say(b, 'out'); say(''); });
  if (S.objectives.length) {
    say('OBJECTIVES', 'hd');
    S.objectives.forEach((o,i) => say(`  ${i+1}. ${o.text}`, 'out'));
  }
  say('');
  if (m.hint) row('PROCEDURE', m.hint, 'ok');
  row('CLOCK', 'HOLD', 'sys');
  if (typeof gotoPage === 'function') gotoPage('MSN');
  saveProgress();
}

/* ---- objectives -------------------------------------------- */
function checkObjectives() {
  if (S.status === 'lost' || S.completed || !S.objectives.length) return;
  if (S.soi === 'MOON') S.flags.lunarSOI = true;
  if (S.soi === 'SUN' && D.e && D.e.r < D.e.rp*1.02 && D.e.e > 0.05) S.flags.perihelionPassed = true;
  let changed = false;
  for (const o of S.objectives) {
    if (o.done) continue;
    let ok = false;
    try { ok = !!o.check(S, D); } catch (err) { ok = false; }
    if (ok) { o.done = true; changed = true; say(`OBJECTIVE MET · ${o.text}`, 'ok'); }
  }
  if (changed && S.objectives.every(o => o.done) && !S.completed) {
    S.completed = true;
    // let a running burn finish — cutting the engine here would strand the vehicle
    // mid-maneuver on the very burn that met the objective
    if (S.burn) S.pauseAfterBurn = true; else S.warp = 0;
    say('', 'out');
    head('MISSION COMPLETE · ' + S.mission.code);
    row('ELAPSED', fmtMET(S.t));
    row('ΔV EXPENDED', fmtDV(S.ledger.dvUsed));
    row('BURNS', String(S.ledger.burns));
    row('PROP LEFT', S.craft.fuel.toFixed(1) + ' kg');
    say('');
    const nxt = MISSIONS.find(m => m.id === S.mission.id + 1);
    if (nxt) row('NEXT', `MIS ${nxt.id}   ${nxt.code} ${nxt.name}`, 'sys');
    else row('ROSTER', 'all scripted missions flown', 'sys');
    say('MISSION COMPLETE · ' + S.mission.code, 'ok');
    markComplete(S.mission.id);
  }
}
function cmdMis(A) {
  if (A[0] !== undefined && A[0] !== '') {
    const n = parseInt(A[0], 10);
    if (!isNaN(n) && MISSIONS.some(m => m.id === n)) { loadMission(n); gotoPage('MSN'); return; }
    return say('USAGE   MIS <number>', 'err');
  }
  gotoPage('ROSTER');
}
</script>

<script>
/* ============================================================
   HELP
   ============================================================ */

/* ============================================================
   PERSISTENCE
   ============================================================ */
const KEY = 'deltav.progress.v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}
function markComplete(id) {
  try {
    const d = loadProgress();
    if (!d.includes(id)) { d.push(id); localStorage.setItem(KEY, JSON.stringify(d)); }
  } catch (e) { /* private browsing — progress is just not remembered */ }
}
function saveProgress() { /* roster state only; flight state is not resumed across loads */ }

/* ============================================================
   SCRATCHPAD INPUT
   ============================================================ */
const input = document.getElementById('cmd');
const spEl  = document.getElementById('spmsg');
const history = []; let hIx = -1;

function syncScratchpad() {
  const typing = input.value.length > 0;
  spEl.textContent = (!typing && spMessage) ? spMessage.text : '';
  spEl.className = 'spmsg ' + (spMessage ? spMessage.sev : 'info');
}
input.addEventListener('input', syncScratchpad);

document.getElementById('entry').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const v = input.value;
  if (!v.trim()) return;
  history.push(v); hIx = history.length;
  input.value = '';
  try { exec(v); } catch (err) { say('CONSOLE FAULT: ' + err.message, 'err'); }
  derive(); updateHUD(); renderCDU(); syncScratchpad();
});
input.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowUp')   { ev.preventDefault(); if (hIx > 0) input.value = history[--hIx]; syncScratchpad(); }
  if (ev.key === 'ArrowDown') { ev.preventDefault();
    if (hIx < history.length-1) input.value = history[++hIx]; else { hIx = history.length; input.value = ''; }
    syncScratchpad(); }
});
// CLR clears the pending message first, then the typed entry — MCDU behaviour
document.getElementById('clr').addEventListener('pointerdown', (ev) => {
  if (ev.pointerType !== 'mouse') ev.preventDefault();
});
document.getElementById('clr').addEventListener('click', () => {
  if (spMessage && !input.value) { clearMessage(); return; }
  input.value = '';
  syncScratchpad();
});
for (const [id, dir] of [['w-dn',-1],['w-up',1]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
  b.addEventListener('click', () => {
    const i = WARPS.indexOf(S.warp);
    S.warp = WARPS[Math.max(0, Math.min(WARPS.length-1, (i < 0 ? 1 : i) + dir))];
    if (S.burn && S.warp > 10) S.warp = 10;
    clearMessage(); updateHUD();
  });
}
document.getElementById('z-in').addEventListener('click',  () => { view.km /= 1.6; view.auto = false; });
document.getElementById('z-out').addEventListener('click', () => { view.km *= 1.6; view.auto = false; });
document.getElementById('z-fit').addEventListener('click', () => fitView());

/* ============================================================
   FULLSCREEN
   The page runs inside an artifact frame, so the Fullscreen API is only
   available when that frame permits it (document.fullscreenEnabled reports
   this). iPhone Safari has no page fullscreen at all. Where it cannot work,
   say what does instead rather than failing silently.
   ============================================================ */
const fsBtn = document.getElementById('fs');
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsAllowed = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

function fsAdvice() {
  say('FULLSCREEN NOT PERMITTED IN THIS FRAME — SEE MSG', 'warn');
  say('Open this console in its own browser tab and press FULL again.', 'dim');
  say('On iPhone, Safari has no fullscreen mode for web pages at all. Share → Add to Home Screen, then launch it from that icon: it opens without browser chrome, which is the same result.', 'dim');
}

async function toggleFullscreen() {
  const root = document.documentElement;
  try {
    if (fsElement()) {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    if (!fsAllowed()) return fsAdvice();
    if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' });
    else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
    else return fsAdvice();
  } catch (err) {
    fsAdvice();
  }
}

function syncFullscreen() {
  const on = !!fsElement();
  fsBtn.textContent = on ? 'EXIT' : 'FULL';
  fsBtn.setAttribute('aria-label', on ? 'Leave fullscreen' : 'Enter fullscreen');
  resize(); if (view.auto) fitView();
  setTimeout(() => { resize(); if (view.auto) fitView(); }, 120);
}
for (const ev of ['fullscreenchange', 'webkitfullscreenchange'])
  document.addEventListener(ev, syncFullscreen);
fsBtn.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
fsBtn.addEventListener('click', toggleFullscreen);


/* ============================================================
   CDU — paged control & display unit

   Modelled on the Airbus MCDU: a title line carrying the page number, six
   label/data row pairs split left and right, line-select keys (1L-6L, 1R-6R)
   adjacent to each row, and a scratchpad line that carries typed entry and
   system messages. Conventions borrowed from the real thing:

     <TEXT / TEXT>   a line-select key is live for that field
     TEXT*           the key commits an action
     small label above large data value
     cyan  = selectable      amber = data
     green = computed/active yellow = action required

   Data refreshes once per second, as on a real flight management computer.
   ============================================================ */
const CDU = { page: 'ORB', sub: 0 };
const F = (lab, val, cls, act) => ({ lab: lab || '', val: val == null ? '' : String(val), cls: cls || '', act: act || null });
const NAV = (text, page) => F('', text, 'sel', page);
const takeScratch = () => { const v = input.value.trim(); return v; };
const eatScratch  = () => { const v = input.value.trim(); input.value = ''; syncScratchpad(); return v; };

/* ---- DOM: row groups are created on demand, so a page may be as long as its
   content needs. Each group is one grid row spanning key / content / key, so a
   row that wraps to several lines keeps its line-select keys aligned. ---- */
const bodyEl = document.getElementById('cdu-body');
const GROUPS = [];
function ensureRows(n) {
  while (GROUPS.length < n) {
    const i = GROUPS.length;
    const mkKey = (side) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lsk';
      b.textContent = side === 'l' ? '‹' : '›';
      b.setAttribute('aria-label', `Line select ${i+1}${side.toUpperCase()}`);
      b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
      b.addEventListener('click', () => fire(i, side));
      return b;
    };
    const mkFld = (side) => {
      const f = document.createElement('div'); f.className = 'fld' + (side === 'r' ? ' right' : '');
      const lab = document.createElement('div'); lab.className = 'flab';
      const val = document.createElement('div'); val.className = 'fval';
      f.appendChild(lab); f.appendChild(val);
      f.addEventListener('click', () => fire(i, side));
      return { f, lab, val };
    };
    const kl = mkKey('l'), kr = mkKey('r');
    const row = document.createElement('div'); row.className = 'crow';
    const L = mkFld('l'), R = mkFld('r');
    row.appendChild(L.f); row.appendChild(R.f);
    const grp = document.createElement('div'); grp.className = 'rowgrp';
    grp.appendChild(kl); grp.appendChild(row); grp.appendChild(kr);
    bodyEl.appendChild(grp);
    GROUPS.push({ grp, kl, kr, row, L, R });
  }
}
ensureRows(6);

let CURRENT = [];                       // rows as last rendered, for hit-testing
function fire(i, side) {
  const row = CURRENT[i]; if (!row) return;
  const fld = row.full ? (side === 'l' ? row.full : null) : row[side];
  if (!fld || !fld.act) return;
  clearMessage();
  if (typeof fld.act === 'string') gotoPage(fld.act);
  else { fld.act(); }
  derive(); updateHUD(); renderCDU();
}

function gotoPage(id, sub) {
  if (!PAGES[id]) return;
  CDU.page = id; CDU.sub = sub || 0;
  renderCDU();
}

function renderCDU() {
  const def = PAGES[CDU.page] || PAGES.ORB;
  derive();
  const count = def.count ? Math.max(1, def.count()) : 1;
  if (CDU.sub >= count) CDU.sub = count - 1;
  if (CDU.sub < 0) CDU.sub = 0;
  let rows = [];
  try { rows = def.build(CDU.sub) || []; }
  catch (err) { rows = [{ full: F('FAULT', String(err.message).slice(0, 40), 'bad') }]; }

  document.getElementById('cdu-t').textContent = def.title(CDU.sub);
  document.getElementById('cdu-sub').textContent = def.sub ? def.sub() : '';
  document.getElementById('cdu-pg').textContent = count > 1 ? `${CDU.sub+1}/${count}` : '';
  document.getElementById('pg-prev').disabled = count < 2;
  document.getElementById('pg-next').disabled = count < 2;

  CURRENT = rows;
  const n = Math.max(6, rows.length);
  ensureRows(n);
  for (let i = 0; i < GROUPS.length; i++) {
    const r = rows[i], g = GROUPS[i];
    const used = i < n;
    g.grp.style.display = used ? '' : 'none';
    if (!used) continue;
    const isFull = !!(r && r.full);
    g.row.classList.toggle('full', isFull);
    g.row.classList.toggle('bare', !r || (!r.l && !r.r && !r.full));
    const put = (cell, fld, wrap) => {
      cell.lab.textContent = fld ? fld.lab : '';
      cell.val.textContent = fld ? fld.val : '';
      cell.val.className = 'fval ' + (fld ? fld.cls : '') + (wrap ? ' wrap' : '');
      cell.f.classList.toggle('tap', !!(fld && fld.act));
      cell.f.style.display = '';
    };
    if (isFull) { put(g.L, r.full, !!r.wrap); g.R.f.style.display = 'none'; }
    else { put(g.L, r ? r.l : null, !!r && !!r.wrap); put(g.R, r ? r.r : null, !!r && !!r.wrap); }
    const mark = (btn, fld, side) => {
      const on = !!(fld && fld.act);
      const go = on && /\*$/.test(fld.val);
      btn.className = 'lsk' + (go ? ' go' : on ? ' on' : '');
      btn.textContent = on ? (side === 'l' ? '‹' : '›') : '·';
      btn.disabled = !on;
    };
    mark(g.kl, r ? (r.full ? r.full : r.l) : null, 'l');
    mark(g.kr, r && !r.full ? r.r : null, 'r');
  }
  markPageKey();
}

/* ---- function keys: page selection only, never an action ---- */
const PAGEKEYS = [['ORB','ORB'],['PLAN','PLAN'],['BURN','BURN'],['TGT','TGT'],['DOCK','DOCK'],['MSN','MSN'],
                  ['PWR','PWR'],['FUEL','FUEL'],['THRM','THRM'],['COMM','COMM'],['LIFE','LIFE'],['MENU','MENU']];
const pkBar = document.getElementById('pagekeys');
const PKBTN = {};
for (const [label, id] of PAGEKEYS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'pk'; b.textContent = label;
  b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
  b.addEventListener('click', () => { clearMessage(); gotoPage(id); });
  pkBar.appendChild(b); PKBTN[id] = b;
}
function markPageKey() {
  for (const id in PKBTN) PKBTN[id].classList.toggle('cur', CDU.page === id);
}
for (const [id, dir] of [['pg-prev',-1],['pg-next',1]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', (ev) => { if (ev.pointerType !== 'mouse') ev.preventDefault(); });
  b.addEventListener('click', () => { CDU.sub += dir; renderCDU(); });
}

/* ---- shared row helpers ---- */
const one = (t) => ({ count: () => 1, title: () => t });
const menuRow = (rightText, rightPage) => ({ l: NAV('<MENU', 'MENU'),
  r: rightPage ? NAV(rightText, rightPage) : null });
const dv = () => fmtDV(dvRemaining());

/* ---- solution → armed burn ---- */
function armSolution() {
  const sol = S.solution;
  if (!sol) return say('NO SOLUTION COMPUTED', 'warn');
  if (sol.secs == null || !isFinite(sol.secs) || sol.secs <= 0) return say('SOLUTION NOT EXECUTABLE', 'err');
  if (sol.node === 'PE' || sol.node === 'AP') {
    S.sched = { dir: sol.dir, dur: sol.secs, at: sol.node };
    say(`BURN ARMED · ${DIRNAME[sol.dir]} ${sol.secs.toFixed(1)} s at ${sol.node === 'PE' ? 'periapsis' : 'apoapsis'}`, 'ok');
  } else if (sol.node === 'T') {
    S.sched = { dir: sol.dir, dur: sol.secs, at: 'T', when: sol.when };
    say(`BURN ARMED · ${DIRNAME[sol.dir]} ${sol.secs.toFixed(1)} s at T+${(sol.when - S.t).toFixed(0)} s`, 'ok');
  } else {
    startBurn(sol.dir, sol.secs);
  }
  S.burnSel.dir = sol.dir; S.burnSel.dur = sol.secs;
  if (sol.node) S.burnSel.at = sol.node;
  gotoPage('BURN');
}
function planThen(fn) { return () => { fn(); if (S.solution) gotoPage('PLANR'); }; }

/* ---- docking display helpers ---- */
const DPHASE = { FREE:'FREE FLIGHT', SOFT:'SOFT CAPTURE', RETRACT:'RING RETRACTING',
                 RETRACTED:'RING HOME', LATCHING:'LATCHES DRIVING', HARD:'HARD DOCK' };
/** A ten-segment bar. Narrow characters only — this has to fit a 375 px phone. */
const gauge = (f) => { const n = Math.max(0, Math.min(10, Math.round((f || 0)*10)));
  return '[' + '='.repeat(n) + '·'.repeat(10-n) + ']'; };
/** ok inside the clean band, amber in the marginal one, red past the limit. */
const band = (v, clean, max) => v <= clean ? 'ok' : v <= max ? 'go' : 'bad';
function numFromScratch(what) {
  const v = eatScratch();
  const n = parseFloat(v);
  if (!v) { say(`ENTER ${what} IN THE SCRATCHPAD FIRST`, 'warn'); return null; }
  if (!isFinite(n)) { say('ENTRY OUT OF RANGE', 'err'); return null; }
  return n;
}

const PAGES = {

ORB: { count: () => 2, title: (i) => i ? 'ORBIT' : 'ORBIT',
  sub: () => soiBody().name,
  build: (i) => i === 0 ? [
    { l: F('Apoapsis', D.escape ? 'ESCAPE' : fmtDist(D.apoAlt)),
      r: F('T−Apo', isFinite(D.tApo) ? fmtT(D.tApo) : '——', '', null) },
    { l: F('Periapsis', fmtDist(D.perAlt), D.perAlt < 0 ? 'bad' : ''),
      r: F('T−Peri', isFinite(D.tPeri) ? fmtT(D.tPeri) : '——') },

    { l: F('Vertical rate', fmtVel(D.e.vr)), r: F('Direction', D.e.dir > 0 ? 'PROGRADE' : 'RETROGRADE') },
    { l: F('Attitude hold', attLabel(), 'ok'),
      r: F('Pointing error', (attError()*180/Math.PI).toFixed(2) + '°' + (S.att.slewing ? '  SLEWING' : ''),
           S.att.slewing ? 'go' : 'ok') },
    { l: F('SOI radius', isFinite(soiBody().soi) ? fmtDist(soiBody().soi) : '——'),

PLAN: Object.assign(one('MANEUVER'), { sub: () => 'SOLVER', build: () => [

    r: F('km into scratchpad', 'SET PERIAPSIS>', 'sel', planThen(() => { const n = numFromScratch('PERIAPSIS ALTITUDE'); if (n != null) cmdPlan(['PERI', String(n)]); })) },

PLANR: Object.assign(one('SOLUTION'), {
  sub: () => S.solution ? S.solution.name : '',
  build: () => {
    const s0 = S.solution;
    if (!s0) return [{ full: F('', 'NO SOLUTION — RETURN TO PLAN', 'dim') }, {}, {}, {}, {},
                     { l: NAV('<PLAN', 'PLAN') }];
    const tt = s0.node === 'AP' ? D.tApo : s0.node === 'PE' ? D.tPeri
             : s0.node === 'T' ? s0.when - S.t : NaN;
    const affordable = s0.dv <= dvRemaining();
    return [
      { l: F('ΔV required', fmtDV(s0.dv), affordable ? 'ok' : 'bad'),
        r: F('Burn time', s0.secs != null ? s0.secs.toFixed(1) + ' s' : 'N/A', s0.secs != null ? '' : 'bad') },
      { l: F('Direction', DIRNAME[s0.dir].toUpperCase()),
        r: F('Ignition at', s0.nodeLabel || '—') },
      { l: F('Time to ignition', isFinite(tt) ? fmtT(tt) : '——', 'go'),
        r: F('ΔV remaining', dv(), 'ok') },
      { full: F('Predicted', s0.detail || '—', 'ok'), wrap: true },
      { l: F('Prop required', s0.prop != null ? s0.prop.toFixed(1) + ' kg' : '—'),
        r: F('Prop aboard', S.craft.fuel.toFixed(1) + ' kg') },
      { l: NAV('<PLAN', 'PLAN'),
        r: s0.secs != null ? F('', 'ARM BURN*', 'go', armSolution) : F('', 'NOT EXECUTABLE', 'bad') },
    ];
  } }),

BURN: Object.assign(one('BURN'), {
  sub: () => S.burn ? 'ENGINE RUNNING' : S.sched ? 'ARMED' : 'STANDBY',
  build: () => {
    const dirs = ['PRO','RET','RIN','ROUT'], nodes = ['AP','PE','NOW'];
    const cycle = (arr, cur, set) => () => set(arr[(arr.indexOf(cur) + 1) % arr.length]);
    const sel = S.burnSel;
    const prev = sel.dur > 0 ? fmtDV(burnDV(sel.dur)) : '—';
    return [
      { l: F('Direction', sel.dir, 'sel', cycle(dirs, sel.dir, (v) => sel.dir = v)),
        r: F('Ignition node', sel.at, 'sel', cycle(nodes, sel.at, (v) => sel.at = v)) },
      { l: F('Duration  s ⇦ scratchpad', sel.dur ? sel.dur.toFixed(1) + ' s' : '□□□', sel.dur ? 'sel' : 'go',
            () => { const n = numFromScratch('BURN DURATION, SECONDS'); if (n != null && n > 0) sel.dur = n; }),
        r: F('ΔV this burn', prev) },
      { l: F('Attitude', ATTNAME[S.att.mode] || S.att.mode, 'sel',
            cycle(['PRO','RET','RIN','ROUT','TGT','ATGT','FREE'], S.att.mode, (v) => setAttMode(v))),
        r: F('Pointing error', (attError()*180/Math.PI).toFixed(2) + '°',
             attError() > ALIGN_TOL ? 'go' : 'ok') },
      { l: F('Engine', S.aligning ? 'WAITING ON ATTITUDE'
                     : S.burn ? DIRNAME[S.burn.dir].toUpperCase() + ' ' + S.burn.left.toFixed(1) + ' s' : 'OFF',
            S.aligning ? 'go' : S.burn ? 'go' : 'dim'),
        r: F('ΔV remaining', dv(), 'ok') },
      { l: F('Armed', S.sched ? `${DIRNAME[S.sched.dir]} ${S.sched.dur.toFixed(1)} s` : 'NONE', S.sched ? 'go' : 'dim'),
        r: F('Time to ignition', S.sched ? fmtT(timeToIgnition()) : '——', S.sched ? 'go' : 'dim') },
      { l: F('Prop aboard', S.craft.fuel.toFixed(1) + ' kg'),
        r: F('Full throttle left', fmtT(S.craft.fuel / (S.craft.thrust*1000/(S.craft.isp*G0)))) },
      { l: NAV('<MENU', 'MENU'),
        r: (S.burn || S.sched) ? F('', 'CANCEL*', 'go', () => exec('CANCEL'))
           : F('', 'ARM*', 'go', () => {
               if (!sel.dur) return say('SET A BURN DURATION FIRST', 'warn');
               if (sel.at === 'NOW') startBurn(sel.dir, sel.dur);
               else exec(`BURN ${sel.dir} ${sel.dur} AT ${sel.at}`); }) },
    ];
  } }),

      { l: F('Target', S.target || 'NONE', S.target ? 'ok' : 'dim'),
        r: F('Range', t ? fmtDist(V.len(t.r)) : '——') },
      { l: F('Relative velocity', t ? fmtVel(V.len(t.v)) : '——'),
        r: F('Closing rate', t ? fmtVel(-V.dot(V.unit(t.r), t.v)) : '——') },

/* ---- proximity and docking -------------------------------------------- */
DOCK: Object.assign({ count: () => 2, title: (i) => i ? 'CAPTURE' : 'PROXIMITY OPS' }, {
  sub: () => S.dock.phase !== 'FREE' ? DPHASE[S.dock.phase] : (S.target || 'NO TARGET'),
  build: (pg) => {
    const dk = S.dock, g = dockGeom(), t = targetRel();
    const foot = { l: NAV('<MENU', 'MENU'), r: NAV('UTILITIES>', 'UTIL') };

    if (pg === 1) {
      if (dk.phase === 'FREE') return [
        { l: F('Interface', 'NOT CAPTURED', 'dim'), r: F('Attempts', String(dk.attempts)) },
        { l: F('Bounces', String(dk.bounces), dk.bounces ? 'go' : ''), r: F('', '') },
        { full: F('Capture envelope',
            `Closing under ${DOCK_ENV.closeMax.toFixed(2)} m/s · within ${DOCK_ENV.latMax.toFixed(2)} m of centre · lateral rate under ${DOCK_ENV.rateMax.toFixed(2)} m/s · nose within ${DOCK_ENV.alignMax}°. Inside ${DOCK_ENV.alignClean}° and ${DOCK_ENV.latClean.toFixed(2)} m it is a clean capture; outside that it latches crooked and the ring has to pull it straight.`, 'body'), wrap: true },
        {}, {}, foot,
      ];
      const soft = dk.phase === 'SOFT';
      return [
        { l: F('Interface', DPHASE[dk.phase], dk.phase === 'HARD' ? 'ok' : 'go'),
          r: F('Misalignment', dk.misalign.toFixed(1) + '°', dk.misalign > 0.5 ? 'go' : 'ok') },
        { l: F('Capture ring', gauge(dk.ring) + ' ' + (dk.ring*100).toFixed(0) + '%', dk.ring >= 1 ? 'ok' : 'go'),
          r: F('Structural latches', Math.floor(dk.latches) + ' / 12', dk.latches >= 12 ? 'ok' : 'go') },
        { l: soft ? F('', '<RETRACT RING*', 'go', () => exec('DOCK RETRACT'))
                  : F('Ring', dk.phase === 'RETRACT' ? 'RETRACTING' : 'HOME', 'ok'),
          r: dk.phase === 'RETRACTED' ? F('', 'CLOSE LATCHES*', 'go', () => exec('DOCK LATCH'))
                                      : F('Latches', dk.phase === 'HARD' ? 'CLOSED' : 'OPEN', dk.phase === 'HARD' ? 'ok' : 'dim') },
        { l: F('Captured at', dk.offset.toFixed(2) + ' m off centre'),
          r: F('Attempts', `${dk.attempts}  ${dk.bounces} bounce${dk.bounces === 1 ? '' : 's'}`) },
        { l: F('', '<UNDOCK*', 'go', () => exec('DOCK UNDOCK')),
          r: dk.phase === 'HARD' ? NAV('UTILITIES>', 'UTIL') : F('Utilities', 'HARD DOCK FIRST', 'dim') },
        foot,
      ];
    }

    if (dk.phase !== 'FREE') return [
      { l: F('Interface', DPHASE[dk.phase], 'ok'), r: F('Relative motion', 'MATED', 'ok') },
      { full: F('', 'The vehicle is on the station. Proximity controls are inhibited — see the CAPTURE page.', 'body'), wrap: true },
      {}, {},
      { l: F('', '<CAPTURE PAGE', 'sel', () => { CDU.sub = 1; }), r: NAV('UTILITIES>', 'UTIL') },
      foot,
    ];
    if (!g) return [
      { full: F('', t ? 'TARGET IS NOT A DOCKING PORT' : 'NO TARGET SELECTED', 'dim') },
      { full: F('', 'Select STATION on the TARGET page.', 'body'), wrap: true },
      {}, {},
      { l: NAV('<TARGET', 'TGT'), r: F('', '', 'dim') },
      foot,
    ];

    const pulse = (mode, amt) => () => exec(`TRANS ${mode} ${amt}`);
    const off = Math.abs(g.lateral), al = Math.abs(g.align);
    const eta = g.closing > 1e-6 ? g.axial/g.closing : Infinity;
    const cmd = dockGuide(g, dk.leg);
    const far = g.ctrRange > 500;
    const rows = [
      { l: F('Axial range', fmtRange(g.axial), g.axial < 0.5 ? 'ok' : ''),
        r: F('Closing rate', fmtRate(g.closing), g.closing < 0 ? 'go' : band(g.closing, DOCK_ENV.closeClean, DOCK_ENV.closeMax)) },
      { l: F('Off centre', fmtRange(g.lateral), band(off, DOCK_ENV.latClean, DOCK_ENV.latMax)),
        r: F('Lateral rate', fmtRate(g.latRate), band(Math.abs(g.latRate), DOCK_ENV.rateClean, DOCK_ENV.rateMax)) },
      { l: F('Nose off axis', g.align.toFixed(1) + '°', band(al, DOCK_ENV.alignClean, DOCK_ENV.alignMax)),
        r: F('Contact in', isFinite(eta) && eta > 0 ? fmtT(eta) : '——') },
      { l: F('0.05 m/s', '<TOWARD', 'sel', pulse('TGT', 0.05)),
        r: F('0.05 m/s', 'AWAY>', 'sel', pulse('AWAY', 0.05)) },
      { l: F('0.01 m/s', '<PORT', 'sel', pulse('PORT', 0.01)),
        r: F('0.01 m/s', 'STBD>', 'sel', pulse('STBD', 0.01)) },
      { l: F('', '<NULL RELATIVE*', 'go', () => exec('TRANS NULL')),
        r: F('RCS ΔV', fmtDV(rcsDV()), rcsDV() < 2 ? 'bad' : 'ok') },
      { l: S.att.mode === 'PAXS' ? F('Attitude', 'ON DOCK AXIS', 'ok')
                                 : F('', '<HOLD DOCK AXIS', 'sel', () => exec('HOLD DOCK')),
        r: (S.mission && S.mission.noAuto) ? F('Auto dock', 'NOT FITTED', 'dim')
           : F('', dk.auto ? 'AUTO DOCK ON*' : 'AUTO DOCK*', dk.auto ? 'go' : 'sel', () => exec('DOCK AUTO')) },
      { l: F('Approach leg', far ? 'RENDEZVOUS' : cmd.name, 'ok'),
        r: F('Commanded', far ? '——' : `${cmd.vWant >= 0 ? 'close' : 'back off'} ${Math.abs(cmd.vWant).toFixed(2)}  lat ${cmd.latWant >= 0 ? '+' : ''}${cmd.latWant.toFixed(2)}`) },
      { full: F('Flight director', far
          ? `Station ${fmtRange(g.ctrRange)} out. Close to inside 500 m, then come onto the docking axis — it runs aft from the station, up its velocity vector. On that line you share its orbit and stay put for free.`
          : cmd.target
            ? `${cmd.name}: you are off the corridor, so work round to the hold point rather than across the station's face. Fly to ${fmtRange(cmd.target.axial)} astern and ${fmtRange(cmd.target.lateral)} across — ${Math.abs(cmd.vWant) < 0.005 ? 'hold the axial range' : (cmd.vWant > 0 ? 'close' : 'back off') + ' at ' + Math.abs(cmd.vWant).toFixed(2) + ' m/s'}, lateral ${cmd.latWant >= 0 ? '+' : ''}${cmd.latWant.toFixed(2)} m/s.`
            : `${cmd.name}: hold ${cmd.vWant.toFixed(2)} m/s closing and keep it centred — ${fmtRange(off)} off at ${fmtRate(g.latRate)}, ${g.corridor.toFixed(1)}° off the axis. Capture needs under ${DOCK_ENV.closeMax.toFixed(2)} m/s, inside ${DOCK_ENV.latMax.toFixed(2)} m, nose within ${DOCK_ENV.alignMax}°.`, 'body'), wrap: true },
      foot,
    ];
    return rows;
  } }),

UTIL: { count: () => 4, title: () => 'UTILITIES',
  sub: () => ['VESTIBULE', 'ELECTRICAL', 'ECLSS', 'PROPELLANT'][CDU.sub] || '',
  build: (pg) => {
    const dk = S.dock, foot = { l: NAV('<DOCK', 'DOCK'), r: NAV('MENU>', 'MENU') };
    if (dk.phase !== 'HARD') return [
      { l: F('Interface', DPHASE[dk.phase], dk.phase === 'FREE' ? 'dim' : 'go'), r: F('Utilities', 'INHIBITED', 'dim') },
      { full: F('', 'Nothing connects until the latches are closed. Fly the approach, retract the ring, then drive the latches.', 'body'), wrap: true },
      {}, {}, {},
      { l: NAV('<DOCK', 'DOCK'), r: NAV('MENU>', 'MENU') },
    ];
    const K = (txt, cls, cmd) => F('', txt, cls, () => exec('DOCK ' + cmd));

    if (pg === 0) {
      const ve = dk.vest, p = ve.press;
      return [
        { l: F('Vestibule pressure', gauge(p/101.3) + ' ' + p.toFixed(1) + ' kPa', p >= 100 ? 'ok' : 'go'),
          r: F('Equalisation valve', ve.valve ? 'OPEN' : 'CLOSED', ve.valve ? 'go' : 'dim') },
        { l: F('Leak check', ve.leakOk ? 'PASSED' : ve.check >= 0 ? `${ve.check.toFixed(0)} / 60 s  Δ 0.0 kPa` : 'NOT RUN',
               ve.leakOk ? 'ok' : ve.check >= 0 ? 'go' : 'dim'),
          r: F('Hatch', ve.hatch ? 'OPEN' : 'CLOSED', ve.hatch ? 'ok' : 'dim') },
        { l: K(ve.valve ? '<CLOSE VALVE*' : '<EQUALISE*', ve.hatch ? 'dim' : 'go', 'EQUALISE'),
          r: ve.leakOk ? F('', '', 'dim') : K('LEAK CHECK*', p >= 100 ? 'go' : 'dim', 'LEAK') },
        { l: K(ve.hatch ? '<CLOSE HATCH*' : '<OPEN HATCH*', ve.leakOk ? 'go' : 'dim', 'HATCH'),
          r: F('Step', ve.hatch ? '3 of 3 COMPLETE' : ve.leakOk ? '3 of 3' : p >= 100 ? '2 of 3' : '1 of 3', ve.hatch ? 'ok' : '') },
        { full: F('Procedure', 'Equalise to 101.3 kPa, close the valve and hold sixty seconds to prove the seal, then open the hatch. The vestibule starts at hard vacuum — the hatch will not unlock onto it.', 'body'), wrap: true },
        foot,
      ];
    }
    if (pg === 1) {
      const pw = dk.pwr, net = D.gen + D.tie - D.load;
      return [
        { l: F('Umbilical', pw.umb ? 'MATED' : 'DEMATED', pw.umb ? 'ok' : 'dim'),
          r: F('Bus tie', pw.tie ? 'CLOSED · 120 V' : 'OPEN', pw.tie ? 'ok' : 'dim') },
        { l: F('Station supply', D.tie.toFixed(0) + ' W', D.tie ? 'ok' : 'dim'),
          r: F('Data link', pw.tie ? 'UP' : 'DOWN', pw.tie ? 'ok' : 'dim') },
        { l: F('Bus net', (net >= 0 ? '+' : '') + net.toFixed(0) + ' W', net < 0 ? 'go' : 'ok'),
          r: F('Battery', (S.power.batt/S.power.battMax*100).toFixed(0) + '%', net < 0 ? 'go' : 'ok') },
        { l: K(pw.umb ? '<DEMATE UMBILICAL*' : '<MATE UMBILICAL*', 'go', 'UMB'),
          r: K(pw.tie ? 'OPEN BUS TIE*' : 'CLOSE BUS TIE*', pw.umb ? 'go' : 'dim', 'TIE') },
        { full: F('Procedure', pw.tie
            ? 'The station is carrying the load. Your battery is charging and stays charged through eclipse for as long as the tie is closed.'
            : 'Mate the connector, then close the tie contactor. The station bus then carries the vehicle and the battery stops working for its living.', 'body'), wrap: true },
        foot,
      ];
    }
    if (pg === 2) {
      const ai = dk.air, hrs = S.craft.crew ? S.craft.o2 / S.craft.crew : Infinity;
      return [
        { l: F('Air duct', ai.duct ? 'INSTALLED' : 'STOWED', ai.duct ? 'ok' : 'dim'),
          r: F('Circulation fan', ai.fan ? 'RUNNING · 120 L/min' : 'OFF', ai.fan ? 'ok' : 'dim') },
        { l: F('O₂ source', ai.fan ? 'STATION' : 'ONBOARD', ai.fan ? 'ok' : 'go'),
          r: F('Onboard O₂', S.craft.crew ? fmtT(hrs*3600) : 'UNCREWED', hrs < 24 ? 'go' : 'ok') },
        { l: K(ai.duct ? '<REMOVE DUCT*' : '<INSTALL DUCT*', dk.vest.hatch ? 'go' : 'dim', 'DUCT'),
          r: K(ai.fan ? 'STOP FAN*' : 'START FAN*', ai.duct ? 'go' : 'dim', 'FAN') },
        { l: F('Step', ai.fan ? '2 of 2 COMPLETE' : ai.duct ? '2 of 2' : '1 of 2', ai.fan ? 'ok' : ''),
          r: F('Crew', S.craft.crew ? String(S.craft.crew) : 'NONE') },
        { full: F('Procedure', dk.vest.hatch
            ? 'The trunk runs through the open hatchway. With the fan running the station scrubs and supplies your air, and your own O₂ stops going down.'
            : 'The duct runs through the hatch, so the hatch has to be open first — see the VESTIBULE page.', 'body'), wrap: true },
        foot,
      ];
    }
    const pr = dk.prop;
    const fpct = S.craft.fuelMax ? S.craft.fuel/S.craft.fuelMax*100 : 0;
    return [
      { l: F('Transfer line', pr.line ? 'CONNECTED' : 'DISCONNECTED', pr.line ? 'ok' : 'dim'),
        r: F('Line purge', pr.purged ? 'COMPLETE' : pr.line ? gauge(pr.purge/30) + ' ' + (pr.purge/30*100).toFixed(0) + '%' : 'NOT STARTED',
             pr.purged ? 'ok' : pr.line ? 'go' : 'dim') },
      { l: F('Flow', pr.xfer ? '0.500 kg/s' : '0.000 kg/s', pr.xfer ? 'ok' : 'dim'),
        r: F('Transferred', pr.moved.toFixed(1) + ' kg', pr.done ? 'ok' : '') },
      { l: F('Main tank', gauge(fpct/100) + ' ' + fpct.toFixed(0) + '%', fpct > 95 ? 'ok' : ''),
        r: F('RCS', S.craft.rcs.toFixed(1) + ' / ' + S.craft.rcsMax.toFixed(0) + ' kg') },
      { l: K(pr.line ? '<DISCONNECT LINE*' : '<CONNECT LINE*', 'go', 'LINE'),
        r: K(pr.xfer ? 'STOP TRANSFER*' : 'START TRANSFER*', pr.purged && dk.pwr.tie ? 'go' : 'dim', 'XFER') },
      { full: F('Procedure', pr.purged && !dk.pwr.tie
          ? 'The transfer pumps run off the station bus — close the bus tie on the ELECTRICAL page before starting the flow.'
          : 'Connect the coupling, let the thirty-second purge finish, then start the flow. It fills the main tank first, then RCS, and stops itself when both are full.', 'body'), wrap: true },
      foot,
    ];
  } },

PWR: Object.assign(one('ELECTRICAL'), {

        r: F('Battery', `${pct.toFixed(0)}%`, pct < 20 ? 'bad' : pct < 50 ? 'go' : 'ok') },
      { l: F('Charge', `${S.power.batt.toFixed(0)} / ${S.power.battMax} Wh`),
        r: F('Endurance', net < 0 ? fmtT(S.power.batt / -net * 3600) : '——', net < 0 ? 'go' : '') },
      { l: F('Heaters', S.loads.HEAT ? 'ON' : 'OFF', S.loads.HEAT ? 'sel' : 'dim', tog('HEAT')),

      { l: F('Science', S.loads.SCI ? 'ON' : 'OFF', S.loads.SCI ? 'sel' : 'dim', tog('SCI')),

      menuRow('FUEL>', 'FUEL'),

FUEL: Object.assign(one('PROPULSION'), { sub: () => S.craft.name, build: () => {
  const pct = S.craft.fuelMax ? S.craft.fuel/S.craft.fuelMax*100 : 0;
  const mdot = S.craft.thrust*1000/(S.craft.isp*G0);
  return [
    { l: F('Main propellant', `${S.craft.fuel.toFixed(1)} kg`, pct < 15 ? 'go' : ''),
      r: F('Remaining', `${pct.toFixed(1)}%`, pct < 15 ? 'go' : 'ok') },
    { l: F('ΔV remaining', dv(), 'ok'), r: F('ΔV expended', fmtDV(S.ledger.dvUsed)) },
    { l: F('Engine thrust', (S.craft.thrust*1000).toFixed(0) + ' N'), r: F('Specific impulse', S.craft.isp + ' s') },
    { l: F('Flow rate', mdot.toFixed(3) + ' kg/s'), r: F('Full throttle left', fmtT(S.craft.fuel/mdot)) },
    { l: F('Dry mass', S.craft.dry.toFixed(0) + ' kg'), r: F('RCS propellant', S.craft.rcs.toFixed(2) + ' kg') },
    menuRow('BURN>', 'BURN'),
  ]; } }),

THRM: Object.assign(one('THERMAL'), { sub: () => D.ecl ? 'ECLIPSE' : 'SUNLIT', build: () => {
  const tl = S.thermLimit || 800, h = S.therm.hull;
  return [
    { l: F('Hull temperature', h.toFixed(1) + ' °C', h > tl*0.8 ? 'bad' : h > tl*0.4 ? 'go' : 'ok'),
      r: F('Structural limit', tl + ' °C') },
    { l: F('Solar flux', D.flux.toFixed(0) + ' W/m²'), r: F('Relative to Earth', (D.flux/1361).toFixed(2) + '×') },
    { l: F('Solar distance', (D.dSun/AU).toFixed(4) + ' AU'), r: F('Illumination', D.ecl ? 'ECLIPSE' : 'SUNLIT') },
    h > tl*0.55
      ? { full: F('Caution', `Hull at ${h.toFixed(0)} °C against a ${tl} °C limit. Heat load rises with the inverse square of solar distance, so raising perihelion is the only real remedy.`, 'go'), wrap: true }
      : {},
    menuRow('POWER>', 'PWR'),
  ]; } }),

COMM: Object.assign(one('COMMUNICATIONS'), { sub: () => S.loads.COMM ? 'TX ON' : 'TX OFF', build: () => {
  const sig = 1e6 / Math.max(D.dEarth, 1)**2 * 1e6;
  return [
    { l: F('Range to Earth', fmtDist(D.dEarth)),
      r: F('One-way delay', D.lightTime < 1 ? (D.lightTime*1000).toFixed(0)+' ms' : fmtT(D.lightTime)) },
    { l: F('Round trip', D.lightTime < 1 ? (D.lightTime*2000).toFixed(0)+' ms' : fmtT(D.lightTime*2)),
      r: F('Signal', S.loads.COMM ? (sig > 1 ? 'STRONG' : sig > 0.02 ? 'USABLE' : 'MARGINAL') : 'TX OFF',
           S.loads.COMM ? 'ok' : 'go') },
    { l: F('Data rate', S.loads.COMM ? Math.max(0.1, Math.min(2048, sig*40)).toFixed(1) + ' kbps' : '—'),
      r: F('Transmitter', S.loads.COMM ? 'ON' : 'OFF', S.loads.COMM ? 'sel' : 'dim',
           () => exec(`PWR COMM ${S.loads.COMM ? 'OFF' : 'ON'}`)) },
    D.lightTime > 1
      ? { full: F('Uplink latency', `A command sent now reaches the vehicle ${fmtT(D.lightTime)} later, and any reply takes the same again. Real crews plan around this; the console still responds at once.`, 'body'), wrap: true }
      : { full: F('Uplink latency', 'Negligible at this range.', 'body'), wrap: true },
    menuRow('POWER>', 'PWR'),
  ]; } }),

LIFE: Object.assign(one('LIFE SUPPORT'), { sub: () => S.craft.crew ? S.craft.crew + ' CREW' : 'UNCREWED', build: () => {
  if (!S.craft.crew) return [{ full: F('', 'UNCREWED VEHICLE', 'dim') }, {}, {}, {}, {}, menuRow('POWER>', 'PWR')];
  const hrs = S.craft.o2 / S.craft.crew;
  return [
    { l: F('Crew', String(S.craft.crew)), r: F('O₂ remaining', fmtT(hrs*3600), hrs < 24 ? 'go' : 'ok') },
    { l: F('Cabin pressure', S.power.batt > 0 ? '101.3 kPa' : 'LOST', S.power.batt > 0 ? 'ok' : 'bad'),
      r: F('Cabin temperature', S.power.batt > 0 ? '21.1 °C' : '—') },
    { l: F('CO₂ scrubber', S.loads.HEAT ? 'NOMINAL' : 'OFFLINE', S.loads.HEAT ? 'ok' : 'bad'),
      r: F('Crew-hours', S.craft.o2.toFixed(0)) },
    { l: F('O₂ source', S.dock.air.fan ? 'STATION ECLSS' : 'ONBOARD', S.dock.air.fan ? 'ok' : ''),
      r: S.dock.phase === 'HARD' ? NAV('UTILITIES>', 'UTIL') : F('', '', 'dim') },
    {},
    menuRow('POWER>', 'PWR'),
  ]; } }),

MSN: {
  count: () => S.mission ? 2 : 1,
  title: () => 'MISSION',
  sub: () => S.mission ? S.mission.code : 'NONE',
  build: (pg) => {
    if (!S.mission) return [{ full: F('', 'NO MISSION LOADED', 'dim') },
                            { l: NAV('<ROSTER', 'ROSTER'), r: NAV('MENU>', 'MENU') }];
    if (pg === 1) {
      // the briefing: free text, as many lines as it takes
      const rows = S.mission.brief.map(t => ({ full: F('', t.replace(/[{}]/g, ''), 'body'), wrap: true }));
      rows.push({ full: F('Procedure', S.mission.hint || '—', 'ok'), wrap: true });
      rows.push({ l: NAV('<OBJECTIVES', 'MSN'), r: NAV('ROSTER>', 'ROSTER') });
      return rows;
    }
    const rows = [{ full: F('Mission', S.mission.name, 'ok') }];
    S.objectives.forEach((o, i) => rows.push({
      full: F(`Objective ${i+1} · ${o.done ? 'MET' : 'OPEN'}`,
              (o.done ? '✔ ' : '○ ') + o.text, o.done ? 'ok' : ''), wrap: true }));
    rows.push({ l: F('Elapsed', fmtMET(S.t)), r: F('ΔV expended', fmtDV(S.ledger.dvUsed)) });
    rows.push({ full: F('Procedure', S.mission.hint || '—', 'ok'), wrap: true });
    rows.push({ l: NAV('<ROSTER', 'ROSTER'), r: F('', 'RESTART*', 'go', () => exec('RESTART')) });
    return rows;
  } },

ROSTER: { count: () => Math.ceil(MISSIONS.length / 5), title: () => 'MISSION ROSTER',
  sub: () => '', build: (pg) => {
    const done = loadProgress();
    const slice = MISSIONS.slice(pg*5, pg*5 + 5);
    const rows = slice.map(m => ({ full: F(done.includes(m.id) ? 'FLOWN' : '',
      `<${m.code}  ${m.name}`, S.mission && S.mission.id === m.id ? 'ok' : 'sel',
      () => { loadMission(m.id); gotoPage('MSN'); }) }));
    rows.push({ l: NAV('<MISSION', 'MSN'), r: NAV('MENU>', 'MENU') });
    return rows;
  } },

MSG: { count: () => Math.max(1, Math.ceil(MSGS.length / 6)), title: () => 'MESSAGES',
  sub: () => MSGS.length + ' LOGGED', build: (pg) => {
    const rev = MSGS.slice().reverse().filter(m => m.text.trim());
    const slice = rev.slice(pg*6, pg*6 + 6);
    const rows = slice.map(m => ({ full: F(fmtMET(m.t).slice(4), m.text,
      m.cls === 'err' ? 'bad' : m.cls === 'warn' ? 'go' : m.cls === 'ok' ? 'ok' : 'body'), wrap: true }));
    if (!rows.length) rows.push({ full: F('', 'NO MESSAGES', 'dim') });
    rows.push({ l: NAV('<MENU', 'MENU'), r: F('', 'CLEAR ALL*', 'go', () => { MSGS.length = 0; clearMessage(); }) });
    return rows;
  } },

MENU: { count: () => 2, title: () => 'INDEX', sub: () => '', build: (pg) => pg === 0 ? [
    { l: NAV('<ORBIT', 'ORB'), r: NAV('MANEUVER>', 'PLAN') },
    { l: NAV('<BURN', 'BURN'), r: NAV('TARGET>', 'TGT') },
    { l: NAV('<PROXIMITY OPS', 'DOCK'), r: NAV('MISSION>', 'MSN') },
    { l: NAV('<MESSAGES', 'MSG'), r: NAV('HELP>', 'HELP') },
    { l: F('Reference', soiBody().name), r: F('MET', fmtMET(S.t)) },
    { l: F('', '', 'dim'), r: F('', '', 'dim') },
  ] : [
    { l: NAV('<ELECTRICAL', 'PWR'), r: NAV('PROPULSION>', 'FUEL') },
    { l: NAV('<THERMAL', 'THRM'), r: NAV('COMMUNICATIONS>', 'COMM') },
    { l: NAV('<LIFE SUPPORT', 'LIFE'), r: NAV('ROSTER>', 'ROSTER') },
    {}, {},
    { l: NAV('<ORBIT', 'ORB'), r: F('', '', 'dim') },
  ] },

HELP: { count: () => HELP_PAGES.length, title: () => 'REFERENCE', sub: () => HELP_PAGES[CDU.sub].t,
  build: (pg) => {
    const rows = HELP_PAGES[pg].rows.map(r => ({ full: F(r[0], r[1], r[2] || 'body'), wrap: true }));
    rows.push({ l: NAV('<MENU', 'MENU'), r: NAV('ORBIT>', 'ORB') });
    return rows;
  } },
};

const HELP_PAGES = [
  { t: 'HOW ORBITS BEHAVE', rows: [
    ['RULE', 'A burn changes the FAR side of the orbit', 'ok'],
    ['', 'PRO at periapsis  → apoapsis rises'],
    ['', 'PRO at apoapsis   → periapsis rises'],
    ['', 'RET at apoapsis   → periapsis falls'],
    ['CATCH-UP', 'Burn RET to catch something ahead', 'go'],
  ] },
  { t: 'LINE SELECT KEYS', rows: [
    ['', 'Keys beside each row act on that row.'],
    ['<TEXT', 'left key is live for that field', 'sel'],
    ['TEXT>', 'right key is live', 'sel'],
    ['TEXT*', 'key commits an action', 'go'],
    ['ENTRY', 'Type a value, then press its key.'],
  ] },
  { t: 'TYPED COMMANDS', rows: [
    ['BURN', 'BURN <DIR> <SEC> [AT PE|AP|T+n]'],
    ['WARP', 'WARP <rate>   or the rail arrows'],
    ['PLAN', 'PLAN CIRC AP · APO <km> · XFER <BODY>'],
    ['TRANS', 'TRANS TGT|AWAY|PORT|STBD <m/s>'],
    ['DOCK', 'DOCK AUTO|RETRACT|LATCH|UNDOCK'],
    ['PAGES', 'Function keys below, or type the name.'],
  ] },
  { t: 'FLYING AN APPROACH', rows: [
    ['CORRIDOR', 'The port faces aft. Approach up the velocity vector, from behind.', 'ok'],
    ['WHY', 'On that line you are in the station\'s own orbit, so you hold position for free. Off it you drift.'],
    ['RATES', 'The corridor turns with the station: sitting still in space slides you sideways across it.', 'go'],
    ['GATE', 'Under 0.15 m/s, inside 0.25 m, nose within 10°. Half of that is a clean capture.'],
    ['THEN', 'RETRACT the ring, close the LATCHES, then the four utility procedures on UTIL.'],
  ] },
];

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  const dtReal = Math.min((ts - last)/1000, 0.1);
  last = ts;
  if (S.status === 'flight' && S.warp > 0) advance(dtReal * S.warp);
  derive();
  updateHUD();
  draw();
  // pages refresh at 1 Hz, as a flight management computer does
  if (ts - lastCDU >= 1000) { lastCDU = ts; renderCDU(); markPageKey(); }
}
let lastCDU = 0;

/* ============================================================
   BOOT
   ============================================================ */
function boot(restored) {
  document.getElementById('veil').classList.add('hidden');
  resize();
  if (!S.mission) {
    loadMission(1);
    const done = loadProgress();
    if (done.length) row('FLIGHT RECORD', `${done.length} mission${done.length>1?'s':''} flown`, 'sys');
  }
  renderCDU(); markPageKey(); syncScratchpad();
  requestAnimationFrame(frame);
  if (window.matchMedia('(min-width: 860px)').matches &&
      window.matchMedia('(pointer: fine)').matches) input.focus({preventScroll:true});
}
document.getElementById('boot').addEventListener('click', () => boot());

/* keep open viewers' flight state across a republish */
try {
  window.claude?.hot?.snapshot?.(() => ({
    t:S.t, soi:S.soi, r:S.r, v:S.v, mission:S.mission?.id, craft:S.craft,
    power:S.power, therm:S.therm, att:S.att, dock:S.dock,
    objectives:S.objectives.map(o=>o.done), booted:!document.getElementById('veil').classList.contains('hidden'),
  }));
} catch (e) {}

resize();
derive();
updateHUD();
draw();
</script>
