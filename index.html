    // flying, so a hand-flown approach gets the same call on the DOCK page.
    if (g.ctrRange < 500) dk.leg = dockLeg(g, dk.leg); else dk.leg = null;
    if (g.axial > 0.5) dk.passed = false;
    // Only judge a contact when the vehicle has actually gone by the port.
    // Without the range guard, a rendezvous that arrives ahead of the station
    // crosses the port PLANE tens of kilometres out and is told it flew past.
    if (g.axial <= 0 && g.closing > 0 && !dk.passed && g.ctrRange < 20) {
      if (Math.abs(g.lateral) > DOCK_ENV.structure) {
        dk.passed = true;
        say(`PAST THE PORT — ${Math.abs(g.lateral).toFixed(2)} m wide of the ring, no contact. Back off along the axis and re-centre.`, 'warn');
      } else dockContact(g);
    }
    return;
  }

  // Mated. The interface carries the vehicle; place it on the station.
  mateToPort();

  if (dk.phase === 'RETRACT') {
    // A crooked interface takes longer to pull straight — that is the cost of
    // a sloppy capture, and it is paid in time, not in wreckage.
    dk.ring = Math.min(1, dk.ring + dt / (20 + dk.misalign0 * 6));
    dk.misalign = dk.misalign0 * (1 - dk.ring);
    if (dk.ring >= 1) {
      dk.misalign = 0; dk.phase = 'RETRACTED';
      say('RING RETRACTED · interface aligned 0.0°, hard-dock ready. Close the latches.', 'ok');
    }
  } else if (dk.phase === 'LATCHING') {
    dk.latches = Math.min(12, dk.latches + dt * 0.5);
    if (dk.latches >= 12) {
      dk.latches = 12; dk.latching = false; dk.phase = 'HARD';
      say('HARD DOCK · 12 of 12 structural latches closed. The vestibule is sealed but empty — equalise it before opening a hatch.', 'ok');
      checkObjectives();
    }
  }

  if (dk.phase !== 'HARD') return;

  const ve = dk.vest;
  if (ve.valve && ve.press < 101.3) ve.press = Math.min(101.3, ve.press + 101.3 * dt / 90);
  if (ve.check >= 0 && !ve.leakOk) {
    if (ve.valve) { ve.check = -1; say('LEAK CHECK ABORTED — the equalisation valve reopened.', 'warn'); }
    else {
      ve.check += dt;
      if (ve.check >= 60) { ve.leakOk = true; say('LEAK CHECK COMPLETE · 60 s, no measurable decay. The hatch may be opened.', 'ok'); }
    }
  }
  const pr = dk.prop;
  if (pr.line && !pr.purged) {
    pr.purge = Math.min(30, pr.purge + dt);
    if (pr.purge >= 30) { pr.purged = true; say('TRANSFER LINE PURGED · ready to flow.', 'ok'); }
  }
  if (pr.xfer) {
    if (!dk.pwr.tie) { pr.xfer = false; say('TRANSFER STOPPED — the pumps lost the station bus.', 'warn'); }
    else {
      let q = 0.5 * dt;                                 // kg/s through the coupling
      const mainRoom = Math.max(0, S.craft.fuelMax - S.craft.fuel);
      const take = Math.min(q, mainRoom); S.craft.fuel += take; q -= take;
      const rcsRoom = Math.max(0, S.craft.rcsMax - S.craft.rcs);
      const take2 = Math.min(q, rcsRoom); S.craft.rcs += take2; q -= take2;
      pr.moved += take + take2;
      if (q > 0) { pr.xfer = false; pr.done = true; say(`TRANSFER COMPLETE · ${pr.moved.toFixed(1)} kg aboard, tanks full.`, 'ok'); }
    }
  }
  if (utilitiesDone()) checkObjectives();
}

/* ---- approach guidance --------------------------------------------------
   Exposed as a plain function of the relative state so the same law can fly
   the vehicle (AUTO DOCK) and be driven step by step by a test. It returns
   the commands it would issue; it changes nothing itself.                  */
const DOCK_HOLD = 35;      // m — the hold point on the axis, where the approach starts
const DOCK_STAND = 40;     // m — how far to the side to sit while repositioning
const LEGNAME = { CLEAR:'MOVE CLEAR', BEHIND:'GO ASTERN', CENTRE:'CENTRE UP',
                  CLOSING:'CLOSE IN', CORRIDOR:'IN THE CORRIDOR', CONTACT:'FINAL' };

/** Is the vehicle on the corridor well enough to just fly it in?
 *  The hold point matters for ACQUIRING the axis, not for being on it: a
 *  vehicle already centred ten metres out is in the corridor, not out of it. */
const onCorridor = (g) => g.axial > 1 && Math.abs(g.lateral) <= Math.max(6, g.axial * 0.25);

/** Which leg of the approach applies, given the leg already being flown.
 *
 *  The sequence latches. Deciding afresh every step chatters: a leg's exit
 *  test and the next leg's target disagree by a metre or two, orbital drift
 *  carries the vehicle back across the boundary, and the controller flips
 *  between a 0.8 m/s command and a 0 m/s command until the tanks are dry.
 *  Once a leg is entered it is flown until its own target is reached. */
function dockLeg(g, leg) {
  const off = Math.abs(g.lateral);
  const corridor = () => g.axial > 100 ? 'CLOSING' : g.axial > 10 ? 'CORRIDOR' : 'CONTACT';
  switch (leg) {
    case 'CLEAR':  return off >= DOCK_STAND - 3 ? dockLeg(g, 'BEHIND') : 'CLEAR';
    case 'BEHIND': return g.axial >= DOCK_HOLD + 3 ? dockLeg(g, 'CENTRE') : 'BEHIND';
    case 'CENTRE': return (off <= 2 && g.axial >= DOCK_HOLD - 5) ? corridor() : 'CENTRE';
    case 'CLOSING': case 'CORRIDOR': case 'CONTACT':
      // Only fall back out of the corridor for a miss far wider than the one
      // that would have stopped us entering it.
      return off > Math.max(10, g.axial * 0.35) ? 'CENTRE' : corridor();
    default:
      if (onCorridor(g)) return corridor();
      if (g.axial >= DOCK_HOLD + 3) return 'CENTRE';
      if (off >= DOCK_STAND - 3) return 'BEHIND';
      return 'CLEAR';
  }
}

/** The commands the approach law would issue, given the relative state and the
 *  leg being flown. Pure: it reads nothing and changes nothing. */
function dockGuide(g, leg) {
  if (!g) return null;
  // A rendezvous does not leave you on the corridor — it leaves you beside the
  // station, usually ahead of its port. Getting onto the axis is a box: out to
  // the side, astern to the hold point, then in to the centreline. The route
  // never crosses the station's face.
  leg = dockLeg(g, leg);
  const sgn = g.lateral >= 0 ? 1 : -1;
  let want = {};
  if (leg === 'CLOSING' || leg === 'CORRIDOR' || leg === 'CONTACT') {
    const off = Math.abs(g.lateral);
    // Slow down as the port comes up: 0.30 m/s outside 20 m, easing to
    // 0.05 m/s at contact — inside the 0.10 m/s clean band with no final flare.
    const vProfile = Math.min(0.30, 0.05 + g.axial / 80);
    // Inside twelve metres, stop and centre rather than press on and bounce.
    // That is what a crew does, and holding range is far cheaper than a bounce.
    const tol = Math.max(DOCK_ENV.latClean * 0.8, g.axial * 0.06);
    const hold = off > tol && g.axial < 12;
    want.closing = hold ? 0 : vProfile;
    want.hold = hold;
    // Aim to be centred by half way to contact — but take the time from the
    // approach PROFILE, never from the held command, or holding range drives
    // the time-to-contact to infinity and the lateral command to nothing.
    // The cap and the deadband both shrink with range for the same reason:
    // a fixed pair leaves the last quarter metre permanently uncorrected,
    // which put every approach on the 0.25 m limit.
    const tc = g.axial / Math.max(vProfile, 0.02);
    const cap = Math.min(0.03, Math.max(0.005, g.axial * 0.004));
    const latCmd = hold ? -g.lateral * 0.05 : -g.lateral / Math.max(tc * 0.5, 10);
    want.latRate = Math.max(-cap, Math.min(cap, latCmd));
    want.latDead = Math.max(0.0008, Math.min(0.003, cap * 0.3));
  } else {
    let tAx, tLat, vmax = 0.8;
    if (leg === 'CLEAR')       { tAx = g.axial; tLat = sgn * DOCK_STAND; }
    else if (leg === 'BEHIND') { tAx = DOCK_HOLD + 6; tLat = g.lateral; }
    else                       { tAx = Math.max(g.axial, DOCK_HOLD); tLat = 0; vmax = 0.6; }
    const rate = (e) => Math.max(-vmax, Math.min(vmax, e * 0.03));
    want.closing = -rate(tAx - g.axial);
    want.latRate = rate(tLat - g.lateral);
    want.target = { axial: tAx, lateral: tLat };
  }
  const axErr = g.closing - want.closing, latErr = g.latRate - want.latRate;
  return {
    leg, name: LEGNAME[leg], theta: normAngle(g.stTheta),  // nose down the axis, into the port
    vWant: want.closing, latWant: want.latRate, target: want.target || null,
    hold: !!want.hold, axErr, latErr,
    axial:   Math.abs(axErr)  > 0.012 ? -axErr  : 0,       // + closes on the port
    lateral: Math.abs(latErr) > (want.latDead || 0.003) ? -latErr : 0,
  };
}

/** Fly one step of `dockGuide`'s output. Pulses are impulsive: a 0.05 m/s
 *  nudge on real thrusters lasts a fraction of a second, so there is no
 *  controller here to diverge at the coasting chunk size. */
function dockAutoStep(dt) {
  const dk = S.dock;
  if (!dk.auto || dk.phase !== 'FREE') return;
  const g = dockGeom();
  if (!g) { dk.auto = false; return; }
  dk.autoT = (dk.autoT || 0) + dt;
  if (dk.autoT < 2) return;                 // thrusters fire at most every 2 s
  dk.autoT = 0;
  if (S.att.mode !== 'PAXS') setAttMode('PAXS');
  if (attError() > 2*Math.PI/180) return;   // point first, then translate
  const cmd = dockGuide(g, dk.leg);
  dk.leg = cmd.leg;
  if (cmd.axial) rcsPulse(V.mul(g.axis, -Math.sign(cmd.axial)), Math.abs(cmd.axial));
  if (cmd.lateral) rcsPulse(V.mul(g.lat, Math.sign(cmd.lateral)), Math.abs(cmd.lateral));
  if (S.craft.rcs <= 0) { dk.auto = false; say('AUTO DOCK DISENGAGED — RCS propellant exhausted.', 'err'); }
}
/** Point the vehicle, without lighting anything. */
function setAttMode(mode, inertial) {
  S.att.mode = mode;
  if (mode === 'INRT' && inertial != null) S.att.inertial = inertial;
}

/** Numerically integrate one substep while the main engine is lit. */
function burnStep(dt) {
  const b = soiBody(), mu = b.mu;
  const m = craftMass();
  // An engine does not fire until the vehicle is pointed. The burn clock stops
  // while it turns, so a commanded duration is always a duration of thrust.
  if (attError() > ALIGN_TOL) { S.aligning = true; return; }
  S.aligning = false;
  const dirv = thrustDir();
  const aT = S.craft.fuel > 0 ? S.craft.thrust / m : 0;   // km/s^2
  const acc = (rv) => {
    const rr = V.len(rv);
    return V.add(V.mul(rv, -mu/(rr*rr*rr)), V.mul(dirv, aT));
  };
  // RK4 on position/velocity
  const r0 = S.r, v0 = S.v;
  const k1r = v0,                       k1v = acc(r0);
  const k2r = V.add(v0, V.mul(k1v,dt/2)), k2v = acc(V.add(r0, V.mul(k1r,dt/2)));
  const k3r = V.add(v0, V.mul(k2v,dt/2)), k3v = acc(V.add(r0, V.mul(k2r,dt/2)));
  const k4r = V.add(v0, V.mul(k3v,dt)),   k4v = acc(V.add(r0, V.mul(k3r,dt)));
  S.r = V.add(r0, V.mul(V.add(V.add(k1r, V.mul(k2r,2)), V.add(V.mul(k3r,2), k4r)), dt/6));
  S.v = V.add(v0, V.mul(V.add(V.add(k1v, V.mul(k2v,2)), V.add(V.mul(k3v,2), k4v)), dt/6));

  if (S.craft.fuel > 0) {
    const mdot = S.craft.thrust * 1000 / (S.craft.isp * G0);   // kg/s
    const used = Math.min(S.craft.fuel, mdot * dt);
    S.craft.fuel -= used;
    S.ledger.dvUsed += aT * 1000 * dt;
    if (S.craft.fuel <= 0) {
      S.craft.fuel = 0;
      endBurn('MAIN ENGINE CUTOFF — propellant exhausted', 'warn');
    }
  }
  if (!S.burn) return;              // cutoff above already cleared the burn
  S.burn.left -= dt;
  if (S.burn && S.burn.left <= 1e-9) endBurn('MECO — burn complete', 'ok');
}

function endBurn(msg, cls) {
  if (!S.burn) return;
  const spent = S.burn.total - Math.max(0, S.burn.left);
  S.burn = null;
  S.ledger.burns++;
  say(msg + ` · ${spent.toFixed(1)} s`, cls || 'ok');
  if (S.warp !== S.preBurnWarp && S.preBurnWarp) { S.warp = S.preBurnWarp; S.preBurnWarp = null; }
  if (S.pauseAfterBurn) { S.warp = 0; S.pauseAfterBurn = false; say('CLOCK HOLD', 'sys'); }
}

/* ---- sphere-of-influence patching -------------------------- */
function patchSOI() {
  const b = soiBody();
  // escape upward
  if (b.parent && V.len(S.r) > b.soi) {
    const st = bodyStateInParent(S.soi, S.t);
    S.r = V.add(S.r, st.r); S.v = V.add(S.v, st.v);
    S.soi = b.parent;
    say(`SOI TRANSITION · now referenced to ${S.soi}`, 'key');
    fitView(); return true;
  }
  // capture downward
  for (const c of (CHILDREN[S.soi] || [])) {
    const st = bodyStateInParent(c, S.t);
    const rel = V.sub(S.r, st.r);
    if (V.len(rel) < BODIES[c].soi) {
      S.r = rel; S.v = V.sub(S.v, st.v);
      S.soi = c;
      say(`SOI TRANSITION · now referenced to ${c}`, 'key');
      fitView(); return true;
    }
  }
  return false;
}

/* ---- the clock --------------------------------------------- */
/** True while the vehicle is close enough that the clock must run near real time. */
function inProxOps() {
  if (S.dock.phase !== 'FREE') return false;
  const g = dockGeom();
  return !!(g && g.ctrRange < 500);
}

function advance(dtSim) {
  if (S.status !== 'flight') return;
  // Nobody time-warps a docking, and the step could not resolve it if they did.
  if (inProxOps() && S.warp > 10) {
    S.warp = 10;
    if (!S.warnedProx) { S.warnedProx = true; say('Warp limited to 10× inside 500 m — this is flown in something close to real time.', 'warn'); }
  } else if (!inProxOps()) S.warnedProx = false;
  let left = dtSim, guard = 0;
  while (left > 1e-9 && guard++ < 220) {
    let dt;
    if (S.burn) {
      dt = Math.min(left, 0.5, S.burn.left);
    } else {
      const e = el(), b = soiBody();
      // Move at most ~2% of the current radius per chunk. Bounding by a fraction
      // of the period instead would sample a fast perihelion pass far too coarsely.
      let cap = Math.max(0.5, 0.02 * e.r / Math.max(e.v, 1e-6));
      if (e.r - b.R < 200) cap = Math.min(cap, 5);
      // Tighten the step as a sphere-of-influence boundary approaches. Without
      // this, a coarse step at high warp carries the vehicle thousands of km
      // INSIDE a moon's SOI while still being propagated as if that moon were
      // not there — the trajectory that comes out is simply wrong.
      for (const c of (CHILDREN[S.soi] || [])) {
        const st = bodyStateInParent(c, S.t);
        const rel = V.sub(S.r, st.r), relv = V.sub(S.v, st.v);
        const d = V.len(rel);
        if (d <= BODIES[c].soi) continue;
        const closing = -V.dot(V.unit(rel), relv);
        if (closing > 1e-9) cap = Math.min(cap, Math.max(1, (d - BODIES[c].soi) * 0.4 / closing));
      }
      if (b.parent && isFinite(b.soi)) {
        const out = b.soi - e.r, rate = e.vr;
        if (rate > 1e-9 && out > 0) cap = Math.min(cap, Math.max(1, out * 0.4 / rate));
      }
      // never step past an armed burn's ignition point, however fast the clock runs
      const ti = timeToIgnition();
      if (isFinite(ti) && ti > 0) cap = Math.min(cap, Math.max(0.25, ti));
      // Docking is centimetre work and the coasting chunk is sized for orbits:
      // 17 s at station altitude, nearly two metres of travel at a docking
      // closing rate. That steps straight over a capture envelope measured in
      // tenths of a metre, so near a port the chunk is bounded by travel.
      if (S.dock.phase === 'FREE') {
        const pg = dockGeom();
        if (pg && pg.ctrRange < 500) {
          const travel = Math.max(0.02, Math.min(2, Math.abs(pg.axial) * 0.02));     // m per chunk
          const rel = Math.hypot(pg.closing, pg.latRate);                            // m/s
          cap = rel > 1e-6 ? Math.min(cap, Math.max(0.05, travel / rel)) : Math.min(cap, 5);
        }
      }
      dt = Math.min(left, cap);
    }
    // Point before thrusting. Running the slew after the burn step would make
    // the engine use the previous step's attitude, and the solver — which
    // assumes the vehicle is pointed — would no longer predict the flight. Over
    // an 800 s injection that lag is enough to miss a sphere of influence.
    stepAttitude(dt);
    if (S.burn) burnStep(dt); else if (S.dock.phase === 'FREE') {
      const b = soiBody();
      const out = propagate(S.r, S.v, b.mu, dt);
      S.r = out.r; S.v = out.v;
    }
    S.t += dt; left -= dt;
    for (const o of S.objects) stepObject(o, dt);
    // Attitude leads thrust; docking follows the world. Contact can only be
    // judged once both vehicles have been moved.
    stepDock(dt);
    dockAutoStep(dt);
    derive();
    stepSystems(dt);
    if (patchSOI()) { derive(); }
    if (checkHazards()) return;
    fireSchedule();
    if (S.status !== 'flight') return;
  }
  checkObjectives();
}

function stepObject(o, dt) {
  const out = propagate(o.r, o.v, BODIES[o.soi].mu, dt);
  o.r = out.r; o.v = out.v;
}

/* ---- hazards ----------------------------------------------- */
function checkHazards() {
  const b = soiBody(), rr = V.len(S.r), alt = rr - b.R;
  if (S.power.batt <= 0 && S.power.gen < S.power.load) {
    if (!S.warnedPower) { S.warnedPower = true; say('CAUTION · BUS UNDERVOLT — battery depleted, shed load (PWR)', 'err'); }
  } else S.warnedPower = false;

  const tl = S.thermLimit || 800;
  if (S.therm.hull > tl*0.8 && !S.warnedTherm) { S.warnedTherm = true; say(`CAUTION · HULL ${S.therm.hull.toFixed(0)} °C — limit is ${tl} °C`, 'warn'); }
  if (S.therm.hull > tl) return loseMission(`VEHICLE LOST — thermal failure. Hull exceeded ${tl} °C.`);

  if (alt <= 0) {
    const vv = Math.abs(V.dot(S.v, V.unit(S.r))) * 1000;      // m/s vertical
    const hv = Math.abs(V.crs(V.unit(S.r), S.v)) * 1000;      // m/s horizontal
    if (S.landingAllowed && vv < 4 && hv < 3) {
      S.status = 'landed'; S.v = {x:0,y:0};
      S.r = V.mul(V.unit(S.r), b.R);
      say(`TOUCHDOWN on ${b.name} · ${vv.toFixed(2)} m/s vertical, ${hv.toFixed(2)} m/s lateral`, 'ok');
      checkObjectives(true); return true;
    }
    return loseMission(`VEHICLE LOST — surface impact on ${b.name} at ${Math.hypot(vv,hv).toFixed(0)} m/s.`);
  }
  if (b.atmo && alt < b.atmo * 0.5 && !S.landingAllowed) {
    if (!S.warnedAtmo) { S.warnedAtmo = true; say(`CAUTION · ATMOSPHERIC INTERFACE — ${alt.toFixed(0)} km, raise periapsis`, 'warn'); }
  }
  return false;
}

function loseMission(msg) {
  S.status = 'lost'; S.warp = 0; S.burn = null; S.sched = null;
  say(msg, 'err');
  row('AVAILABLE', 'RESTART · MIS', 'dim');
  return true;
}

/* ---- scheduled burns --------------------------------------- */
/** Seconds until an armed burn should light, or Infinity if none. */
function timeToIgnition() {
  if (!S.sched || S.burn) return Infinity;
  const b = soiBody(), e = el();
  let tt;
  if (S.sched.at === 'PE') tt = tToPeri(e, b.mu);
  else if (S.sched.at === 'AP') tt = tToApo(e, b.mu);
  else if (S.sched.at === 'XFER') {
    const w = transferWindow(S.sched.body);
    tt = w ? w.wait : Infinity;
  }
  else tt = S.sched.when - S.t;
  return tt - S.sched.dur/2;
}

function fireSchedule() {
  if (!S.sched || S.burn) return;
  const b = soiBody(), e = el();
  const ti = timeToIgnition();
  if (ti <= 0.5) {
    const sc = S.sched; S.sched = null;
    startBurn(sc.dir, sc.dur, true);
  }
}
</script>

<script>
/* ============================================================
   SCOPE — orbital plot
   ============================================================ */
const cv = document.getElementById('scope');
const cx2 = cv.getContext('2d');
const view = { km:80, auto:true };      // km per CSS pixel
let W = 300, H = 200, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const b = cv.parentElement.getBoundingClientRect();
  W = Math.max(1, b.width); H = Math.max(1, b.height);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx2.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', () => { resize(); if (view.auto) fitView(); });

function fitView() {
  const b = soiBody(), e = el();
  let extent = b.R * 3;
  if (isFinite(e.ra)) extent = Math.max(extent, e.ra * 1.12);
  else extent = Math.max(extent, e.r * 1.6);
  if (S.soi !== 'SUN' && CHILDREN[S.soi]) {
    for (const c of CHILDREN[S.soi]) if (e.ra > BODIES[c].a * 0.6) extent = Math.max(extent, BODIES[c].a*1.15);
  }
  if (b.parent) extent = Math.min(extent, b.soi * 1.1);
  view.km = extent / (Math.min(W,H) * 0.44);
  view.auto = true;
}
const PX = (kmv) => kmv / view.km;

/* proximity target (station or body) resolved to this frame */
function targetRel() {
  if (!S.target) return null;
  if (S.target === 'STATION') {
    const o = S.objects.find(o => o.id === 'STATION');
    if (!o || o.soi !== S.soi) return null;
    return { r:V.sub(o.r, S.r), v:V.sub(o.v, S.v), name:'STATION', obj:o };
  }
  if (BODIES[S.target]) {
    const st = bodyStateIn(S.soi, S.target, S.t);
    return { r:V.sub(st.r, S.r), v:V.sub(st.v, S.v), name:S.target, body:BODIES[S.target] };
  }
  return null;
}

function conicPath(e, mu, maxR) {
  const pts = [];
  if (e.e < 1) {
    for (let i = 0; i <= 180; i++) {
      const nu = i/180*TAU;
      const rr = e.p/(1 + e.e*Math.cos(nu));
      const th = e.argp + e.dir*nu;
      pts.push({ x:rr*Math.cos(th), y:rr*Math.sin(th) });
    }
  } else {
    const nuMax = Math.acos(-1/e.e) * 0.995;
    for (let i = 0; i <= 160; i++) {
      const nu = -nuMax + (i/160)*2*nuMax;
      const rr = e.p/(1 + e.e*Math.cos(nu));
      if (rr > maxR) continue;
      const th = e.argp + e.dir*nu;
      pts.push({ x:rr*Math.cos(th), y:rr*Math.sin(th) });
    }
  }
  return pts;
}

function stroke(pts, color, dash, width) {
  if (pts.length < 2) return;
  cx2.save();
  cx2.setLineDash(dash || []);
  cx2.strokeStyle = color; cx2.lineWidth = width || 1;
  cx2.beginPath();
  pts.forEach((p,i) => { const X = W/2 + PX(p.x), Y = H/2 - PX(p.y);
    i ? cx2.lineTo(X,Y) : cx2.moveTo(X,Y); });
  cx2.stroke(); cx2.restore();
}
function disc(p, rpx, fill, stroked) {
  cx2.beginPath();
  cx2.arc(W/2 + PX(p.x), H/2 - PX(p.y), Math.max(rpx, 0.5), 0, TAU);
  if (fill) { cx2.fillStyle = fill; cx2.fill(); }
  if (stroked) { cx2.strokeStyle = stroked; cx2.lineWidth = 1; cx2.stroke(); }
}
function tag(p, text, color, dy) {
  cx2.save();
  cx2.font = '600 9px "Chakra Petch", sans-serif';
  cx2.fillStyle = color; cx2.textAlign = 'center';
  cx2.fillText(text, W/2 + PX(p.x), H/2 - PX(p.y) + (dy || -7));
  cx2.restore();
}

let proxMode = false;
function draw() {
  if (!W) return;
  cx2.clearRect(0,0,W,H);
  cx2.fillStyle = '#060B12'; cx2.fillRect(0,0,W,H);
  const b = soiBody(), e = D.e || el();
  const tgt = targetRel();
  proxMode = !!(tgt && V.len(tgt.r) < 30 && S.target === 'STATION');

  if (proxMode) { drawProximity(tgt); return; }

  // range rings
  cx2.save(); cx2.strokeStyle = '#111C28'; cx2.lineWidth = 1;
  const ringStep = niceStep(view.km * Math.min(W,H) * 0.18);
  for (let k = 1; k <= 8; k++) {
    const rr = PX(ringStep*k);
    if (rr > Math.hypot(W,H)) break;
    cx2.beginPath(); cx2.arc(W/2, H/2, rr, 0, TAU); cx2.stroke();
  }
  cx2.restore();

  // sphere of influence
  if (b.parent && isFinite(b.soi)) {
    cx2.save(); cx2.setLineDash([2,5]); cx2.strokeStyle = '#17323C'; cx2.lineWidth = 1;
    cx2.beginPath(); cx2.arc(W/2, H/2, PX(b.soi), 0, TAU); cx2.stroke(); cx2.restore();
  }

  // satellites of the current primary
  for (const c of (CHILDREN[S.soi] || [])) {
    const cb = BODIES[c], st = bodyStateInParent(c, S.t);
    if (PX(cb.a) < Math.hypot(W,H)) {
      cx2.save(); cx2.setLineDash([1,4]); cx2.strokeStyle = '#1B2B38'; cx2.lineWidth = 1;
      cx2.beginPath(); cx2.arc(W/2, H/2, PX(cb.a), 0, TAU); cx2.stroke(); cx2.restore();
    }
    const rp = PX(cb.R);
    disc(st.r, Math.max(rp, 2), cb.color + '55', cb.color);
    if (isFinite(cb.soi)) {
      cx2.save(); cx2.setLineDash([2,4]); cx2.strokeStyle = '#1B3A44';
      cx2.beginPath(); cx2.arc(W/2+PX(st.r.x), H/2-PX(st.r.y), PX(cb.soi), 0, TAU); cx2.stroke(); cx2.restore();
    }
    if (Math.abs(PX(st.r.x)) < W && Math.abs(PX(st.r.y)) < H) tag(st.r, c, '#4A566A', -Math.max(rp,2)-4);
  }

  // primary
  const bp = Math.max(PX(b.R), 2.5);
  const g = cx2.createRadialGradient(W/2,H/2,0, W/2,H/2,bp);
  g.addColorStop(0, b.color + '30'); g.addColorStop(1, b.color + '10');
  cx2.beginPath(); cx2.arc(W/2,H/2,bp,0,TAU); cx2.fillStyle = g; cx2.fill();
  cx2.strokeStyle = b.color + 'AA'; cx2.lineWidth = 1.2; cx2.stroke();
  if (b.atmo) {
    cx2.beginPath(); cx2.arc(W/2,H/2,PX(b.R + b.atmo),0,TAU);
    cx2.strokeStyle = b.color + '2E'; cx2.setLineDash([]); cx2.lineWidth = 1; cx2.stroke();
  }

  // station orbit
  const stn = S.objects.find(o => o.id === 'STATION' && o.soi === S.soi);
  if (stn) {
    const se = elements(stn.r, stn.v, b.mu);
    stroke(conicPath(se, b.mu, b.soi), '#5C4B15', [3,4], 1);
    disc(stn.r, 3, '#E8C04A', '#E8C04A');
    tag(stn.r, 'STN', '#E8C04A', -7);
  }

  // own trajectory
  stroke(conicPath(e, b.mu, isFinite(b.soi)?b.soi:e.r*4), '#3FA9C9', [], 1.3);

  // apsides
  if (e.e < 1 && isFinite(e.ra)) {
    const ap = { x:e.ra*Math.cos(e.argp+Math.PI), y:e.ra*Math.sin(e.argp+Math.PI) };
    disc(ap, 2.5, '#F2A33C', null); tag(ap, 'AP', '#9A6A2A', -6);
  }
  const pe = { x:e.rp*Math.cos(e.argp), y:e.rp*Math.sin(e.argp) };
  disc(pe, 2.5, '#F2A33C', null); tag(pe, 'PE', '#9A6A2A', -6);

  // vehicle
  const CX = W/2 + PX(S.r.x), CY = H/2 - PX(S.r.y);
  // a tick showing where the autopilot is asking the nose to go, while it turns
  if (S.att.slewing) {
    const cmd = commandedTheta();
    cx2.save(); cx2.translate(CX, CY); cx2.rotate(-cmd);
    cx2.beginPath(); cx2.moveTo(9,0); cx2.lineTo(15,0);
    cx2.strokeStyle = '#3FA9C9'; cx2.lineWidth = 1.2; cx2.stroke();
    cx2.restore();
  }
  cx2.save(); cx2.translate(CX, CY); cx2.rotate(-S.att.theta);
  if (S.burn && !S.aligning) {
    // thrust leaves the back of the nose, wherever the nose is pointing
    cx2.beginPath(); cx2.moveTo(-5,0);
    const fl = 9 + Math.random()*5;
    cx2.lineTo(-fl, -2.6); cx2.lineTo(-fl, 2.6); cx2.closePath();
    cx2.fillStyle = '#F2A33Ccc'; cx2.fill();
  }
  cx2.beginPath(); cx2.moveTo(6,0); cx2.lineTo(-4,-3.6); cx2.lineTo(-4,3.6); cx2.closePath();
  cx2.fillStyle = '#F2A33C'; cx2.fill();
  cx2.restore();

  document.getElementById('scope-tag').textContent =
    `ORBITAL PLOT · ${b.name}` + (S.target ? `  ▸ TGT ${S.target}` : '');
  document.getElementById('scope-scale').textContent = `⟷ ${fmtDist(ringStep)}/ring`;
}

function drawProximity(tgt) {
  const range = V.len(tgt.r);
  const span = Math.max(range * 2.6, 0.06);
  const kmpx = span / (Math.min(W,H) * 0.44);
  const P = (v) => v / kmpx;
  cx2.save();
  cx2.strokeStyle = '#111C28'; cx2.lineWidth = 1;
  for (let k = 1; k <= 5; k++) { cx2.beginPath(); cx2.arc(W/2,H/2, P(span/5*k), 0, TAU); cx2.stroke(); }
  cx2.beginPath(); cx2.moveTo(W/2-8,H/2); cx2.lineTo(W/2+8,H/2);
  cx2.moveTo(W/2,H/2-8); cx2.lineTo(W/2,H/2+8); cx2.strokeStyle='#1E5A48'; cx2.stroke();

  const TX = W/2 + P(tgt.r.x), TY = H/2 - P(tgt.r.y);
  // The docking corridor: the port's axis out of the station, and the cone the
  // approach has to stay inside. Drawn from the port, not the station's centre.
  const g = dockGeom();
  if (g) {
    const PX_ = W/2 + P(tgt.r.x + g.axis.x*PORT_ARM_STN), PY_ = H/2 - P(tgt.r.y + g.axis.y*PORT_ARM_STN);
    const L = P(Math.max(range*1.6, 0.05));
    const half = Math.atan2(DOCK_ENV.latMax/1000, Math.max(g.axial,1)/1000);
    const a0 = Math.atan2(g.axis.y, g.axis.x);
    cx2.save(); cx2.translate(PX_, PY_);
    for (const s of [-1, 1]) {
      cx2.beginPath(); cx2.moveTo(0,0);
      cx2.lineTo(Math.cos(a0 + s*Math.min(half, 0.5))*L, -Math.sin(a0 + s*Math.min(half, 0.5))*L);
      cx2.strokeStyle = '#1B3A44'; cx2.setLineDash([2,4]); cx2.lineWidth = 1; cx2.stroke();
    }
    cx2.setLineDash([]);
    cx2.beginPath(); cx2.moveTo(0,0); cx2.lineTo(Math.cos(a0)*L, -Math.sin(a0)*L);
    cx2.strokeStyle = '#1E5A48'; cx2.lineWidth = 1; cx2.stroke();
    // the port itself
    cx2.beginPath(); cx2.arc(0,0,3.2,0,TAU);
    cx2.strokeStyle = S.dock.phase === 'FREE' ? '#E8C04A' : '#57C08A'; cx2.lineWidth = 1.6; cx2.stroke();
    cx2.restore();
  }

  // relative velocity vector (scaled for legibility)
  const rv = tgt.v, rvm = V.len(rv);
  if (rvm > 1e-7) {
    const s = Math.min(P(range)*0.8, P(rvm*120));
    const u = V.unit(rv);
    cx2.beginPath(); cx2.moveTo(W/2,H/2);
    cx2.lineTo(W/2 + u.x*s, H/2 - u.y*s);
    cx2.strokeStyle = '#E4553C'; cx2.lineWidth = 1.4; cx2.stroke();
  }
  cx2.beginPath(); cx2.arc(TX,TY,5,0,TAU); cx2.strokeStyle='#E8C04A'; cx2.lineWidth=1.4; cx2.stroke();
  cx2.beginPath(); cx2.arc(TX,TY,1.6,0,TAU); cx2.fillStyle='#E8C04A'; cx2.fill();
  // own vehicle, pointing where the nose points
  cx2.save(); cx2.translate(W/2, H/2); cx2.rotate(-S.att.theta);
  cx2.beginPath(); cx2.moveTo(7,0); cx2.lineTo(-4,-3.4); cx2.lineTo(-4,3.4); cx2.closePath();
  cx2.fillStyle = '#F2A33C'; cx2.fill();
  cx2.restore();
  cx2.restore();
  document.getElementById('scope-tag').textContent = 'PROXIMITY OPS · STATION'
    + (g && S.dock.phase !== 'FREE' ? '  ▸ ' + S.dock.phase : g ? `  ▸ ${g.axial.toFixed(1)} m` : '');
  document.getElementById('scope-scale').textContent = `⟷ ${(span/5*1000).toFixed(0)} m/ring`;
}

function niceStep(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x,1e-6))));
  const n = x/p;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p;
}
</script>

<script>
/* ============================================================
   FORMATTING + SCRATCHPAD
   ============================================================ */
function fmtDist(km) {
  if (!isFinite(km)) return '∞';
  const s = km < 0 ? '-' : ''; km = Math.abs(km);
  if (km < 1)    return s + (km*1000).toFixed(0) + ' m';
  if (km < 100)  return s + km.toFixed(2) + ' km';
  if (km < 1e6)  return s + Math.round(km).toLocaleString('en-US') + ' km';
  if (km < 1e9)  return s + (km/1e6).toFixed(3) + '×10⁶ km';
  return s + (km/AU).toFixed(4) + ' AU';
}
function fmtVel(kms) {
  if (!isFinite(kms)) return '—';
  return Math.abs(kms) < 1 ? (kms*1000).toFixed(1) + ' m/s' : kms.toFixed(3) + ' km/s';
}
function fmtDV(ms) { return (ms >= 1000 ? (ms/1000).toFixed(3)+' km/s' : ms.toFixed(1)+' m/s'); }
/* Proximity operations are worked in centimetres and hundredths of a metre per
   second. fmtDist renders both 0.15 m and 0.25 m as "0 m" and fmtVel renders
   0.03 m/s as "0.0 m/s" — at docking scale those are the difference between a
   clean capture and a bounce, so the corridor gets its own two formatters. */
function fmtRange(m) {
  if (!isFinite(m)) return '——';
  const s = m < 0 ? '−' : ''; m = Math.abs(m);
  if (m < 10)   return s + m.toFixed(2) + ' m';
  if (m < 1000) return s + m.toFixed(1) + ' m';
  return s + (m/1000).toFixed(2) + ' km';
}
function fmtRate(ms) {
  if (!isFinite(ms)) return '——';
  return (Math.abs(ms) < 10 ? ms.toFixed(3) : ms.toFixed(1)) + ' m/s';
}
function fmtT(sec) {
  if (!isFinite(sec)) return '——';
  const neg = sec < 0 ? '-' : ''; sec = Math.abs(Math.round(sec));
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600),
        m = Math.floor(sec%3600/60), s = sec%60;
  const p = (n,w=2) => String(n).padStart(w,'0');
  return neg + (d ? `${p(d,3)}:` : '') + `${p(h)}:${p(m)}:${p(s)}`;
}
function fmtMET(sec) {
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600),
        m = Math.floor(sec%3600/60), s = Math.floor(sec%60);
  const p = (n,w=2) => String(n).padStart(w,'0');
  return `${p(d,3)}:${p(h)}:${p(m)}:${p(s)}`;
}
const pad = (s,n) => String(s).padEnd(n,' ');

const logEl = document.createElement('div');   // detached: the MSG page renders MSGS
const MSGS = [];
const SEVERITY = { err:'err', warn:'warn', ok:'ok', key:'info', hd:'info', sys:'info', dim:'info', out:'info' };
function say(text, cls) {
  const plain = String(text).replace(/\{|\}/g, '');
  MSGS.push({ t: S.t, text: plain, cls: cls || 'out' });
  while (MSGS.length > 300) MSGS.shift();
  if (plain.trim() && cls !== 'dim' && cls !== 'hd') postMessage_(plain, SEVERITY[cls || 'out'] || 'info');
  const p = document.createElement('p');
  p.className = 'ln ' + (cls || 'out');
  p.innerHTML = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\{([^}]*)\}/g, '<span class="v">$1</span>');
  logEl.appendChild(p);
  while (logEl.childElementCount > 400) logEl.removeChild(logEl.firstChild);
}

/** The scratchpad carries the newest message until it is cleared, as on an MCDU.
 *  A lower-severity advisory does not wipe a standing caution or warning: on a
 *  real annunciator the more serious message holds the line. */
let spMessage = null;
const SEV_RANK = { info:0, ok:1, warn:2, err:3 };
function postMessage_(text, sev) {
  const now = Date.now();
  if (spMessage && SEV_RANK[sev] < SEV_RANK[spMessage.sev] && now - spMessage.at < 6000) return;
  spMessage = { text, sev, at: now };
  syncScratchpad();
}
function clearMessage() { spMessage = null; syncScratchpad(); }
function row(k, v, cls) { say(pad(k,14) + v, cls || 'out'); }
function head(t) { say(t, 'hd'); }

/* ============================================================
   HUD
   ============================================================ */
function updateHUD() {
  const d = D, b = d.b || soiBody();
  const set = (id, v) => { const n = document.getElementById(id); if (n.textContent !== v) n.textContent = v; };
  set('r-met', fmtMET(S.t));
  set('r-warp', S.warp === 0 ? 'HOLD' : S.warp.toLocaleString('en-US') + '×');
  set('r-soi', b.name);
  set('r-dv', fmtDV(d.dv || 0));
  set('d-alt', fmtDist(d.alt));
  set('d-vel', Math.abs(d.e.v) < 1 ? (d.e.v*1000).toFixed(0)+' m/s' : d.e.v.toFixed(2)+' km/s');
  // Below 60 km on a landing, apsides stop meaning anything and the two numbers
  // that decide whether you survive are descent rate and lateral drift.
  // Below 60 km on a landing, apoapsis and its countdown stop meaning anything;
  // descent rate and lateral drift are what decide whether you survive.
  const descent = S.landingAllowed && d.alt < 60 && S.status === 'flight';
  const vspd = -d.e.vr, hspd = Math.abs(V.crs(V.unit(S.r), S.v));
  set('k-apo',  descent ? 'V-Speed' : 'Apo');
  set('d-apo',  descent ? fmtVel(vspd) : (d.escape ? 'ESCAPE' : fmtDist(d.apoAlt)));
  set('k-tapo', descent ? 'Lateral' : 'T−Apo');
  set('d-tapo', descent ? fmtVel(hspd) : (isFinite(d.tApo) ? fmtT(d.tApo) : '——'));
  set('d-per',  fmtDist(d.perAlt));
  set('d-tper', isFinite(d.tPeri) ? fmtT(d.tPeri) : '——');
  set('d-ecc', (d.e.e).toFixed(4));
  set('d-prd', d.e.period === Infinity ? '——' : fmtT(d.e.period));

  const apoRO  = document.getElementById('d-apo').parentElement;
  const tapoRO = document.getElementById('d-tapo').parentElement;
  const perRO  = document.getElementById('d-per').parentElement;
  if (descent) {
    apoRO.className  = 'ro' + (vspd*1000 > 12 ? ' bad' : vspd*1000 > 4 ? ' warn' : '');
    tapoRO.className = 'ro' + (hspd*1000 > 8 ? ' bad' : hspd*1000 > 3 ? ' warn' : '');
  } else {
    apoRO.className = 'ro'; tapoRO.className = 'ro';
  }
  perRO.className = 'ro' + (d.perAlt < 0 ? ' bad' : (b.atmo && d.perAlt < b.atmo ? ' warn' : ''));

  const lamp = document.getElementById('r-lamp');
  let txt = 'NOMINAL', cls = 'ok';
  if (S.status === 'lost')      { txt = 'VEHICLE LOST'; cls = 'crit'; }
  else if (S.completed)         { txt = 'OBJECTIVES MET'; cls = 'ok'; }
  else if (S.status === 'landed')   { txt = 'LANDED'; cls = 'ok'; }
  else if (S.aligning)          { txt = 'ALIGNING'; cls = 'caution'; }
  else if (S.burn)              { txt = 'ENGINE ' + S.burn.dir; cls = 'caution'; }
  else if (S.power.batt <= 0.1) { txt = 'BUS UNDERVOLT'; cls = 'crit'; }
  else if (d.perAlt < 0)        { txt = 'IMPACT TRAJ'; cls = 'crit'; }
  else if (S.therm.hull > (S.thermLimit||800)*0.8) { txt = 'THERMAL'; cls = 'caution'; }
  else if (S.power.batt < S.power.battMax*0.2) { txt = 'LOW POWER'; cls = 'caution'; }
  else if (S.sched)             { txt = 'BURN ARMED'; cls = 'caution'; }
  if (lamp.textContent !== txt) lamp.textContent = txt;
  lamp.className = 'lamp ' + cls;

}
</script>

<script>
/* ============================================================
   COMMANDS
   ============================================================ */
const DIRS = {
  PRO:'PRO', PROGRADE:'PRO', P:'PRO',
  RET:'RET', RETROGRADE:'RET', R:'RET',
  ROUT:'ROUT', RADOUT:'ROUT', OUT:'ROUT', UP:'ROUT',
  RIN:'RIN', RADIN:'RIN', IN:'RIN', DOWN:'RIN',
};
const DIRNAME = { PRO:'prograde', RET:'retrograde', ROUT:'radial out', RIN:'radial in' };
const ATTNAME = { PRO:'PROGRADE', RET:'RETROGRADE', ROUT:'RADIAL OUT', RIN:'RADIAL IN',
                  TGT:'TARGET', ATGT:'ANTI-TARGET', INRT:'INERTIAL', FREE:'FREE DRIFT',
                  PAXS:'DOCK AXIS' };
/** What the ORB page should call the current attitude. */
const attLabel = () => S.dock.phase !== 'FREE' ? 'MATED' : (ATTNAME[S.att.mode] || S.att.mode);

function startBurn(dir, dur, scheduled) {
  if (S.status !== 'flight') return say('Vehicle is not in flight.', 'err');
  if (S.dock.phase !== 'FREE') return say('MATED TO THE STATION — the main engine is inhibited. UNDOCK first.', 'err');
  if (S.craft.fuel <= 0) return say('No main propellant remaining.', 'err');
  if (S.burn) return say('Engine already lit. CANCEL first.', 'err');
  S.preBurnWarp = S.warp;
  if (S.warp > 10) S.warp = 10;
  setAttMode(dir);
  S.burn = { dir, left:dur, total:dur };
  const est = burnDV(dur);
  say(`IGNITION · ${DIRNAME[dir]} for {${dur.toFixed(1)} s}  ≈ {${fmtDV(est)}}`
      + (scheduled ? '  (scheduled)' : ''), 'key');
}
function burnDV(dur) {
  const m0 = craftMass();
  const mdot = S.craft.thrust*1000/(S.craft.isp*G0);
  const m1 = Math.max(m0 - Math.min(S.craft.fuel, mdot*dur), 1);
  return S.craft.isp*G0*Math.log(m0/m1);
}
/** seconds of burn needed for a given ΔV (m/s) */
function burnTimeFor(dv) {
  const m0 = craftMass();
  const m1 = m0 / Math.exp(dv/(S.craft.isp*G0));
  const mdot = S.craft.thrust*1000/(S.craft.isp*G0);
  return (m0 - m1)/mdot;
}

const WARPS = [0,1,5,10,50,100,1000,10000,100000,1000000];

function exec(raw) {
  const line = raw.trim();
  if (!line) return;
  say(line, 'cmd');
  const tok = line.toUpperCase().split(/\s+/);
  const c = tok[0], A = tok.slice(1);
  const num = (i, def) => { const n = parseFloat(A[i]); return isFinite(n) ? n : def; };

  switch (c) {

  case 'HELP': case '?': case 'MAN': return gotoPage('HELP');

  case 'STAT': case 'PFD': case 'ORB': return gotoPage('ORB');
  case 'NAV': case 'ORBIT': return gotoPage('ORB', 1);
  case 'MSG': case 'MESSAGES': return gotoPage('MSG');
  case 'MENU': case 'INDEX': case 'SYS': case 'STATUS': return gotoPage('MENU');
  case 'TIME': case 'CLK': {
    say(`MET ${fmtMET(S.t)} · WARP ${S.warp === 0 ? 'HOLD' : S.warp + '×'}`, 'sys');
    return gotoPage('ORB');
  }

  case 'BURN': case 'B': {
    const dir = DIRS[A[0]];
    if (!dir) return say('Usage: BURN <PRO|RET|RIN|ROUT> <seconds> [AT PE|AP|T+<s>]', 'err');
    const dur = num(1, NaN);
    if (!isFinite(dur) || dur <= 0) return say('Burn duration in seconds is required. e.g. BURN PRO 42', 'err');
    const atIx = A.indexOf('AT');
    if (atIx >= 0) {
      const w = A[atIx+1] || '';
      if (w === 'PE' || w === 'AP') {
        S.sched = { dir, dur, at:w }; setAttMode(dir);
        const tt = w === 'PE' ? D.tPeri : D.tApo;
        return say(`BURN ARMED · ${DIRNAME[dir]} ${dur.toFixed(1)} s at ${w === 'PE' ? 'periapsis' : 'apoapsis'}, T−{${fmtT(tt)}}. Ignition starts {${(dur/2).toFixed(1)} s} early to centre the burn.`, 'key');
      }
      if (w === 'XFER' || w === 'WINDOW') {
        const tk = A[atIx+2];
        if (!tk || !BODIES[tk]) return say('Usage: BURN <DIR> <SEC> AT XFER <BODY>', 'err');
        if (BODIES[tk].parent !== S.soi) return say(`${tk} does not orbit ${soiBody().name}.`, 'err');
        S.sched = { dir, dur, at:'XFER', body:tk }; setAttMode(dir);
        const win = transferWindow(tk);
        return say(`BURN ARMED · ${DIRNAME[dir]} ${dur.toFixed(1)} s at the ${tk} transfer window, T−{${fmtT(win.wait)}}. Wind the clock up — the console will hold the node.`, 'key');
      }
      const m = w.match(/^T\+?(\d+(\.\d+)?)$/);
      if (m) { S.sched = { dir, dur, at:'T', when:S.t + parseFloat(m[1]) }; setAttMode(dir);
        return say(`BURN ARMED · ${DIRNAME[dir]} ${dur.toFixed(1)} s in {${fmtT(parseFloat(m[1]))}}.`, 'key'); }
      return say('AT takes PE, AP, or T+<seconds>.', 'err');
    }
    return startBurn(dir, dur);
  }

  case 'CANCEL': case 'ABORT': {
    if (S.burn) { endBurn('BURN ABORTED', 'warn'); return; }
    if (S.sched) { S.sched = null; return say('Armed burn cleared.', 'sys'); }
    return say('Nothing to cancel.', 'sys');
  }

  case 'HOLD': case 'ATT': {
    const extra = { TGT:'TGT', TARGET:'TGT', ATGT:'ATGT', FREE:'FREE', INRT:'INRT',
                    DOCK:'PAXS', AXIS:'PAXS', PAXS:'PAXS' };
    const dir = DIRS[A[0]] || extra[A[0]];
    if (!dir) return say('Usage: HOLD <PRO|RET|RIN|ROUT|TGT|ATGT|DOCK|FREE>', 'err');
    if (S.dock.phase !== 'FREE') return say('MATED — the interface holds the attitude.', 'err');
    if (dir === 'PAXS' && !dockGeom()) return say('No docking target. Try  TGT STATION.', 'err');
    setAttMode(dir);
    return say(`ATTITUDE HOLD · ${ATTNAME[dir]}`, 'sys');
  }

  case 'WARP': case 'W': {
    if (!A[0]) return say(`Warp is ${S.warp}×. Available: ${WARPS.join(', ')}`, 'sys');
    if (A[0] === 'UP' || A[0] === '+') { const i = WARPS.indexOf(S.warp); S.warp = WARPS[Math.min(i+1, WARPS.length-1)]; }
    else if (A[0] === 'DOWN' || A[0] === '-') { const i = WARPS.indexOf(S.warp); S.warp = WARPS[Math.max(i-1,0)]; }
    else { const n = num(0, NaN);
      if (!isFinite(n)) return say('Usage: WARP <rate>  (0 holds the clock)', 'err');
      S.warp = WARPS.reduce((a,b) => Math.abs(b-n) < Math.abs(a-n) ? b : a); }
    if (S.burn && S.warp > 10) { S.warp = 10; say('Warp limited to 10× with the engine lit.', 'warn'); }
    if (inProxOps() && S.warp > 10) { S.warp = 10; say('Warp limited to 10× inside 500 m.', 'warn'); }
    return say(S.warp === 0 ? 'Clock HOLD.' : `Time warp ${S.warp}×.`, 'sys');
  }
  case 'GO': case 'RUN': { S.warp = Math.max(1, S.warp); return say('Clock running.', 'sys'); }

  case 'TGT': case 'TARGET': {
    if (!A[0]) { S.target = null; return say('Target cleared.', 'sys'); }
    const t = A[0];
    if (t === 'STATION' || t === 'STN') {
      if (!S.objects.some(o => o.id === 'STATION')) return say('No station in this scenario.', 'err');
      S.target = 'STATION';
    } else if (BODIES[t]) S.target = t;
    else return say(`Unknown target "${A[0]}". Try a body name or STATION.`, 'err');
    return say(`Target set: {${S.target}}.`, 'sys');
  }

  case 'PLAN': {
    if (!A.length) return gotoPage('PLAN');
    cmdPlan(A);
    if (S.solution) gotoPage('PLANR');
    return;
  }
  case 'DOCK': case 'PROX': return cmdDock(A);
  case 'UTIL': case 'UTILITIES': return gotoPage('UTIL');
  case 'TRANS': case 'RCS': return cmdTrans(A);

  case 'PWR': case 'POWER': case 'EPS': return cmdPwr(A);
  case 'FUEL': case 'PROP': return gotoPage('FUEL');
  case 'COMM': case 'DSN': return gotoPage('COMM');
  case 'THERM': case 'TEMP': return gotoPage('THRM');
  case 'LIFE': case 'ECLSS': return gotoPage('LIFE');


  case 'MIS': case 'MISSION': case 'MISSIONS': return cmdMis(A);
  case 'LOG': case 'OBJ': return gotoPage('MSN');
  case 'RESTART': case 'RESET': {
    if (!S.mission) return say('NO MISSION LOADED', 'err');
    return loadMission(S.mission.id);
  }
  case 'FULL': case 'FS': { toggleFullscreen(); return; }
  case 'CLS': case 'CLEAR': { MSGS.length = 0; clearMessage(); return; }
  case 'LAND': {
    S.landingAllowed = !S.landingAllowed;
    return say(`Landing mode ${S.landingAllowed ? 'ARMED — touchdown will be attempted' : 'SAFED'}.`, 'sys');
  }
  default:
    return say(`Unrecognised command "${c}". Type HELP for the command list.`, 'err');
  }
}

/* ---- readout pages ---------------------------------------- */
function cmdPwr(A) {
  if (A && A[0] && ['HEAT','SCI','COMM'].includes(A[0])) {
    const on = A[1] !== 'OFF';
    S.loads[A[0]] = on;
    return say(`${A[0]} LOAD ${on ? 'ON' : 'OFF'}`, 'sys');
  }
  gotoPage('PWR');
}
</script>

<script>
/* ============================================================
   PLAN — onboard maneuver solver
   ============================================================ */
function quoteBurn(dv, whereLabel, tt, solved) {
  const dir = dv >= 0 ? 'PRO' : 'RET';
  const impulsive = burnTimeFor(Math.abs(dv));
  row('ΔV REQUIRED', fmtDV(Math.abs(dv)) + '  ' + DIRNAME[dir], 'key');
  if (Math.abs(dv) > dvRemaining()) say('INSUFFICIENT PROPELLANT for this maneuver.', 'err');

  let secs = impulsive;
  if (solved && solved.dur != null) {
    secs = solved.dur;
    row('BURN TIME', secs.toFixed(1) + ' s at full throttle');
    if (secs > impulsive * 1.03)
      say(`Solved by integration: ${(secs - impulsive).toFixed(1)} s longer than the impulsive figure.`, 'dim');
  } else if (solved && solved.dur == null && solved.short) {
    if (Math.abs(dv) > dvRemaining()) {
      S.solution = null;
      row('BURN TIME', 'not achievable — not enough propellant', 'err');
      say(`This needs ${fmtDV(Math.abs(dv))} and you are carrying ${fmtDV(dvRemaining())}. Choose a nearer target.`, 'err');
    } else {
      S.solution = null;
      row('BURN TIME', 'not achievable from this point in the orbit', 'err');
      say(`Propellant is not the limit — you have ${fmtDV(dvRemaining())} and this needs ${fmtDV(Math.abs(dv))}. A burn reshapes the orbit on the far side, so this target cannot be reached from where you are burning. Try the opposite apsis.`, 'err');
    }
    return null;
  } else {
    row('BURN TIME', secs.toFixed(1) + ' s at full throttle');
  }
  if (secs > 90) say('Time warp limited to 10× while the engine is lit.', 'dim');

  const node = whereLabel && whereLabel.includes('periapsis') ? 'PE'
             : whereLabel && whereLabel.includes('apoapsis') ? 'AP' : null;
  S.solution = { name: S.planName || 'MANEUVER', dir, secs, node, nodeLabel: whereLabel || 'immediate',
                 dv: Math.abs(dv), detail: S.planDetail || '',
                 prop: secs != null ? secs * (S.craft.thrust*1000/(S.craft.isp*G0)) : null };
  if (whereLabel) {
    row('IGNITION', `${whereLabel}` + (isFinite(tt) ? `, T\u2212${fmtT(tt)}` : ''));
    say('');
    const at = whereLabel.includes('periapsis') ? 'PE' : whereLabel.includes('apoapsis') ? 'AP' : null;
    if (at) say(`  \u2192  BURN ${dir} ${secs.toFixed(1)} AT ${at}`, 'ok');
    else    say(`  \u2192  BURN ${dir} ${secs.toFixed(1)}`, 'ok');
    say('Ignition occurs half a burn early; impulse is centred on the node.', 'dim');
  }
  return secs;
}

/** Fly a finite burn forward without touching live state. */
function simBurn(r0, v0, mu, mode, dur, m0) {
  let r = {...r0}, v = {...v0}, m = m0, t = 0;
  const mdot = S.craft.thrust*1000/(S.craft.isp*G0);
  const fuel = S.craft.fuel;
  while (t < dur - 1e-9) {
    const dt = Math.min(0.5, dur - t);
    if (m0 - m >= fuel) break;                       // tanks dry
    const dirv = mode === 'PRO'  ? V.unit(v)
               : mode === 'RET'  ? V.mul(V.unit(v), -1)
               : mode === 'ROUT' ? V.unit(r) : V.mul(V.unit(r), -1);
    const aT = S.craft.thrust / m;
    const acc = (rv) => { const rr = V.len(rv);
      return V.add(V.mul(rv, -mu/(rr*rr*rr)), V.mul(dirv, aT)); };
    const k1r = v,                          k1v = acc(r);
    const k2r = V.add(v, V.mul(k1v,dt/2)),  k2v = acc(V.add(r, V.mul(k1r,dt/2)));
    const k3r = V.add(v, V.mul(k2v,dt/2)),  k3v = acc(V.add(r, V.mul(k2r,dt/2)));
    const k4r = V.add(v, V.mul(k3v,dt)),    k4v = acc(V.add(r, V.mul(k3r,dt)));
    r = V.add(r, V.mul(V.add(V.add(k1r,V.mul(k2r,2)), V.add(V.mul(k3r,2),k4r)), dt/6));
    v = V.add(v, V.mul(V.add(V.add(k1v,V.mul(k2v,2)), V.add(V.mul(k3v,2),k4v)), dt/6));
    m -= mdot*dt; t += dt;
  }
  return { r, v, m };
}

/** Seconds from now until the named node. */
function nodeTime(node, body) {
  const b = soiBody(), e = el();
  if (node === 'AP') return tToApo(e, b.mu);
  if (node === 'PE') return tToPeri(e, b.mu);
  if (node === 'XFER') { const w = transferWindow(body); return w ? w.wait : Infinity; }
  return 0;
}

/**
 * Solve for the burn duration that actually achieves `target`, by flying the
 * burn. An impulsive ΔV quote under-delivers badly on long burns — a 350 s TLI
 * leaves apoapsis ~50,000 km short — because the vehicle climbs and its thrust
 * vector swings while the engine runs.
 */
function solveBurn(node, mode, metric, target, body) {
  const b = soiBody(), mu = b.mu;
  const mdot = S.craft.thrust*1000/(S.craft.isp*G0);
  const maxDur = S.craft.fuel / mdot;
  const t0 = nodeTime(node, body);
  if (!isFinite(t0)) return null;
  const f = (dur) => {
    const lead = Math.max(0, t0 - dur/2);
    const st = propagate(S.r, S.v, mu, lead);
    const o  = simBurn(st.r, st.v, mu, mode, dur, craftMass());
    const oe = elements(o.r, o.v, mu);
    return metric(oe);
  };
  let lo = 0, hi = maxDur;
  const flo = f(lo), fhi = f(hi);
  if (!isFinite(flo) || !isFinite(fhi)) return null;
  const rising = fhi > flo;
  if (rising ? (target > fhi || target < flo) : (target < fhi || target > flo))
    return { dur: null, best: fhi, short: rising ? target > fhi : target < fhi };
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi)/2, fm = f(mid);
    if (rising ? fm < target : fm > target) lo = mid; else hi = mid;
  }
  return { dur: (lo + hi)/2, best: f((lo+hi)/2) };
}

/**
 * Coast a trajectory forward through sphere-of-influence changes without
 * touching live state, reporting the encounter with `tk`.
 * Step size is governed by the closing rate on the target, so the integration
 * takes huge strides in cruise and tightens automatically near arrival.
 */
function coastEncounter(r0, v0, soi0, t0, tk, maxT) {
  const tb = BODIES[tk];
  let r = {...r0}, v = {...v0}, soi = soi0, t = t0, miss = Infinity;
  for (let n = 0; n < 20000; n++) {
    if (t - t0 > maxT) break;
    const b = BODIES[soi], e = elements(r, v, b.mu);
    let dt = Math.max(5, 0.03 * e.r / Math.max(e.v, 1e-9));
    if (BODIES[tk].parent === soi || soi === tk) {
      const ts = bodyStateIn(soi, tk, t);
      const rel = V.sub(r, ts.r), relv = V.sub(v, ts.v);
      const d = V.len(rel);
      miss = Math.min(miss, d);
      if (d < tb.soi) {                       // arrived
        const ae = elements(rel, relv, tb.mu);
        return { entered:true, periAlt:ae.rp - tb.R, ecc:ae.e, t, miss:d };
      }
      const closing = -V.dot(V.unit(rel), relv);
      if (closing > 1e-9) dt = Math.min(dt, Math.max(5, (d - tb.soi) * 0.45 / closing));
    }
    const o = propagate(r, v, b.mu, dt); r = o.r; v = o.v; t += dt;
    if (V.len(r) < b.R) return { entered:false, crashed:true, t, miss };
    if (b.parent && V.len(r) > b.soi) {
      const st = bodyStateInParent(soi, t);
      r = V.add(r, st.r); v = V.add(v, st.v); soi = b.parent;
    } else {
      for (const c of (CHILDREN[soi] || [])) {
        const st = bodyStateInParent(c, t), rel = V.sub(r, st.r);
        if (V.len(rel) < BODIES[c].soi) {
          r = rel; v = V.sub(v, st.v); soi = c;
          if (c === tk) {
            const ae = elements(r, v, BODIES[c].mu);
            return { entered:true, periAlt:ae.rp - BODIES[c].R, ecc:ae.e, t, miss:V.len(rel) };
          }
        }
      }
    }
  }
  return { entered:false, t, miss };
}

/**
 * Solve a real encounter, not just a Hohmann. A minimum-energy transfer aimed
 * at a body's orbital radius is a collision course; this searches ignition time
 * for a trajectory that arrives with a usable periapsis.
 */
function targetEncounter(tk) {
  const b = soiBody(), mu = b.mu, tb = BODIES[tk];
  const w = transferWindow(tk);
  if (!w || w.wait < 0 || !isFinite(w.wait)) return null;
  const mode = w.dv1 >= 0 ? 'PRO' : 'RET';
  const e = el();
  const tof = w.tof;
  const goal = Math.max(800, tb.R * 0.50);      // ~870 km over the Moon: clears the surface with room to spare
  // One departure period sweeps every transfer orientation. Note how steep this
  // is: shifting ignition by a minute rotates the transfer's apsidal line ~4°,
  // which moves the arrival point by tens of thousands of kilometres. So scan
  // for a bracket, then bisect — stepping toward the answer never converges.
  const Pc = isFinite(e.period) ? e.period : tof/6;
  const span = Math.min(1.1 * Pc, tof / 6);

  const trial = (tI, dur) => {
    if (tI < dur/2) return null;
    const lead = tI - dur/2;
    const st = propagate(S.r, S.v, mu, lead);
    const o  = simBurn(st.r, st.v, mu, mode, dur, craftMass());
    return coastEncounter(o.r, o.v, S.soi, S.t + lead + dur, tk, tof * 2.6);
  };
  /** Closest-approach altitude over the target — continuous across the SOI edge. */
  const qOf = (res) => !res ? Infinity : (res.entered ? res.periAlt : res.miss - tb.R);

  let best = null;
  const consider = (tI, dur, res) => {
    const q = qOf(res);
    if (!isFinite(q)) return;
    const sc = (q < 50 ? 1e6 + Math.abs(q) : Math.abs(q - goal));
    if (!best || sc < best.sc) best = { tI, dur, res, sc, q };
  };

  for (const k of [1.0, 1.12, 1.30]) {
    const sk = solveBurn('XFER', mode, (oe) => isFinite(oe.ra) ? oe.ra : 1e12, w.r2*k, tk);
    if (!sk || sk.dur == null) continue;
    const dur = sk.dur, N = 140;
    const ts = [], qs = [];
    for (let i = 0; i <= N; i++) {
      const tI = w.wait + (i/N - 0.5) * span;
      const res = trial(tI, dur);
      ts.push(tI); qs.push(qOf(res)); consider(tI, dur, res);
    }
    // bisect every bracket that straddles the aim point
    for (let i = 0; i < N; i++) {
      const q0 = qs[i], q1 = qs[i+1];
      if (!isFinite(q0) || !isFinite(q1)) continue;
      if ((q0 - goal) * (q1 - goal) > 0) continue;
      let lo = ts[i], hi = ts[i+1], flo = q0;
      for (let n = 0; n < 40; n++) {
        const mid = (lo + hi)/2, res = trial(mid, dur), qm = qOf(res);
        consider(mid, dur, res);
        if (!isFinite(qm)) break;
        if ((flo - goal) * (qm - goal) <= 0) hi = mid; else { lo = mid; flo = qm; }
        if (Math.abs(qm - goal) < 5) break;
      }
    }
    if (best && best.sc < 30) break;
  }
  if (!best || !best.res || !best.res.entered) return best ? { dur:best.dur, mode, tIgn:best.tI, arrival:best.res, dv:w.dv1, tof, window:w } : null;
  const dur = best.dur;
  return { dur, mode, tIgn:best.tI, arrival:best.res, dv:w.dv1, tof, window:w };
}

/** Hohmann window to a satellite of the current primary. */
function transferWindow(tk) {
  const b = soiBody(), mu = b.mu, e = el(), tb = BODIES[tk];
  if (!tb || tb.parent !== S.soi) return null;
  const r1 = e.r, r2 = tb.a, at = (r1+r2)/2;
  const dv1 = (Math.sqrt(mu*(2/r1 - 1/at)) - e.v) * 1000;
  const tof = Math.PI*Math.sqrt(at*at*at/mu);
  const wt = TAU/tb.period;
  const wc = e.period < Infinity ? TAU/e.period*e.dir : 0;
  const phiReq = normAngle(Math.PI - wt*tof);
  const thC = Math.atan2(S.r.y, S.r.x);
  const st = bodyStateInParent(tk, S.t);
  const phiNow = normAngle(Math.atan2(st.r.y, st.r.x) - thC);
  const rel = wt - wc;
  let dphi = phiReq - phiNow;
  dphi = rel > 0 ? normAngle(dphi) : -normAngle(-dphi);
  const wait = Math.abs(rel) < 1e-14 ? Infinity : dphi/rel;
  return { r1, r2, at, dv1, tof, phiReq, phiNow, wait };
}

function cmdPlan(A) {
  const b = D.b, mu = b.mu, e = D.e, sub = A[0] || '';

  if (sub === 'CIRC' || sub === 'CIRCULARIZE') {
    const at = A[1] === 'PE' ? 'PE' : 'AP';
    if (at === 'AP' && !isFinite(e.ra)) return say('No apoapsis on an escape trajectory. Try PLAN CIRC PE.', 'err');
    const r = at === 'AP' ? e.ra : e.rp;
    S.planName = 'CIRCULARIZE AT ' + (at === 'AP' ? 'APOAPSIS' : 'PERIAPSIS');
    S.planDetail = 'circular at ' + fmtDist(r - b.R);
    head('MANEUVER · ' + S.planName);
    row('AT RADIUS', fmtDist(r) + `   alt ${fmtDist(r - b.R)}`);
    row('CURRENT V', fmtVel(vAtR(mu, r, e.a)));
    row('CIRCULAR V', fmtVel(vCirc(mu, r)));
    const dvC = (vCirc(mu,r) - vAtR(mu,r,e.a))*1000;
    const solC = solveBurn(at, dvC >= 0 ? 'PRO' : 'RET',
      (oe) => at === 'AP' ? oe.rp : (isFinite(oe.ra) ? oe.ra : 1e12), r);
    return quoteBurn(dvC, at === 'AP' ? 'at apoapsis' : 'at periapsis',
      at === 'AP' ? D.tApo : D.tPeri, solC);
  }

  if (sub === 'APO' || sub === 'AP') {
    const alt = parseFloat(A[1]);
    if (!isFinite(alt)) return say('Usage: PLAN APO <target apoapsis altitude, km>', 'err');
    const r1 = e.rp, r2 = alt + b.R;
    if (r2 < r1) return say('Target apoapsis is below your periapsis. Use PLAN PERI instead.', 'err');
    S.planName = 'SET APOAPSIS'; S.planDetail = 'apoapsis → ' + fmtDist(alt);
    head('MANEUVER · RAISE APOAPSIS');
    row('BURN AT', 'periapsis, ' + fmtDist(r1 - b.R) + ' alt');
    row('NEW APOAPSIS', fmtDist(alt));
    const v1 = vAtR(mu, r1, e.a), v2 = Math.sqrt(mu*(2/r1 - 2/(r1+r2)));
    const solA = solveBurn('PE', v2 >= v1 ? 'PRO' : 'RET', (oe) => isFinite(oe.ra) ? oe.ra : 1e12, r2);
    return quoteBurn((v2-v1)*1000, 'at periapsis', D.tPeri, solA);
  }

  if (sub === 'PERI' || sub === 'PE') {
    const alt = parseFloat(A[1]);
    if (!isFinite(alt)) return say('Usage: PLAN PERI <target periapsis altitude, km>', 'err');
    if (!isFinite(e.ra)) return say('No apoapsis to burn at on an escape trajectory.', 'err');
    const r1 = e.ra, r2 = alt + b.R;
    if (r2 > r1) {
      S.planName = 'SET PERIAPSIS'; S.planDetail = 'periapsis → ' + fmtDist(alt);
      head('MANEUVER · CHANGE PERIAPSIS');
      row('YOUR APOAPSIS', fmtDist(r1 - b.R));
      row('TARGET PERI', fmtDist(alt));
      say('');
      say('A burn cannot lift the point you are burning at. Firing at apoapsis raises periapsis until it meets apoapsis — that is a circular orbit — and after that the extra thrust goes into raising apoapsis instead. Periapsis can never end up above it.', 'err');
      say('Propellant is not the limit here. No burn duration reaches this target.', 'dim');
      say('');
      say(`  →  PLAN CIRC AP`, 'ok');
      say(`     circularize where you are, at ${fmtDist(r1 - b.R)}`, 'dim');
      say(`  →  PLAN APO ${Math.round(alt)}`, 'ok');
      say('     raise apoapsis to that altitude first, then circularize there', 'dim');
      return;
    }
    head('MANEUVER · CHANGE PERIAPSIS');
    row('BURN AT', 'apoapsis, ' + fmtDist(r1 - b.R) + ' alt');
    row('NEW PERIAPSIS', fmtDist(alt));
    const v1 = vAtR(mu, r1, e.a), v2 = Math.sqrt(mu*(2/r1 - 2/(r1+r2)));
    const solP = solveBurn('AP', v2 >= v1 ? 'PRO' : 'RET', (oe) => oe.rp, r2);
    return quoteBurn((v2-v1)*1000, 'at apoapsis', D.tApo, solP);
  }

  if (sub === 'ESC' || sub === 'ESCAPE') {
    S.planName = 'ESCAPE ' + b.name; S.planDetail = 'leave ' + b.name + ' SOI';
    head('MANEUVER · ESCAPE ' + b.name);
    const vesc = Math.sqrt(2*mu/e.r);
    row('AT RADIUS', fmtDist(e.r));
    row('CURRENT V', fmtVel(e.v));
    row('ESCAPE V', fmtVel(vesc));
    if (e.e >= 1) { say('Already on an escape trajectory.', 'ok');
      row('SOI EXIT', fmtT(timeToSOIExit()) ); return; }
    row('CHEAPEST AT', 'periapsis — the Oberth effect makes speed there worth more');
    const vp = vAtR(mu, e.rp, e.a), vescp = Math.sqrt(2*mu/e.rp);
    const solE = solveBurn('PE', 'PRO', (oe) => oe.energy, 0);
    return quoteBurn((vescp - vp)*1000, 'at periapsis', D.tPeri, solE);
  }

  if (sub === 'XFER' || sub === 'TRANSFER') {
    const tk = A[1];
    if (!tk || !BODIES[tk]) return say('Usage: PLAN XFER <BODY>   e.g. PLAN XFER MOON', 'err');
    if (BODIES[tk].parent !== S.soi)
      return say(`${tk} does not orbit ${b.name}. Transfer from ${BODIES[tk].parent} instead — escape your current SOI first (PLAN ESC).`, 'err');
    const w = transferWindow(tk);
    head('MANEUVER · TRANSFER TO ' + tk);
    row('DEPART RADIUS', fmtDist(w.r1));
    row('ARRIVE RADIUS', fmtDist(w.r2));
    row('FLIGHT TIME', fmtT(w.tof));
    row('PHASE NOW', (w.phiNow*180/Math.PI).toFixed(1) + '°');
    row('PHASE NEEDED', (w.phiReq*180/Math.PI).toFixed(1) + '°  at ignition', 'key');
    row('WINDOW IN', isFinite(w.wait) ? fmtT(w.wait) : '——');
    if (e.e > 0.02) say('Your orbit is not circular — circularize first for a clean solution.', 'warn');
    say('');
    row('ΔV REQUIRED', fmtDV(Math.abs(w.dv1)) + '  ' + (w.dv1 >= 0 ? 'prograde' : 'retrograde'), 'key');
    if (Math.abs(w.dv1) > dvRemaining()) say('INSUFFICIENT PROPELLANT for this maneuver.', 'err');

    say('Solving the encounter…', 'dim');
    const sol = targetEncounter(tk);
    if (sol && sol.arrival && sol.arrival.entered && sol.arrival.periAlt > 0) {
      row('BURN TIME', sol.dur.toFixed(1) + ' s at full throttle');
      row('IGNITION', `T−${fmtT(sol.tIgn)}`);
      row('ARRIVAL', `${fmtT(sol.arrival.t - S.t)} from now`);
      row('ARRIVAL PERI', fmtDist(sol.arrival.periAlt) + ` over ${tk}`, 'ok');
      say('');
      S.solution = { name: 'TRANSFER TO ' + tk, dir: sol.mode, secs: sol.dur, node: 'T',
                     when: S.t + sol.tIgn, nodeLabel: `T+${sol.tIgn.toFixed(2)} s`,
                     dv: Math.abs(w.dv1), prop: sol.dur * (S.craft.thrust*1000/(S.craft.isp*G0)),
                     detail: `arrive ${fmtDist(sol.arrival.periAlt)} over ${tk}` };
      say(`  →  BURN ${sol.mode} ${sol.dur.toFixed(2)} AT T+${sol.tIgn.toFixed(2)}`, 'ok');
      say(`Solution integrated through the sphere-of-influence change. Aim point is offset from ${tk}'s centre — an unbiased transfer to its orbital radius is an impact trajectory.`, 'dim');
      say('Ignition time is significant to 0.01 s — arrival shifts roughly 20,000 km per second of error.', 'warn');
    } else {
      const bs = burnTimeFor(Math.abs(w.dv1));
      row('BURN TIME', bs.toFixed(1) + ' s at full throttle');
      say('');
      say(`  →  BURN ${w.dv1 >= 0 ? 'PRO' : 'RET'} ${bs.toFixed(1)} AT XFER ${tk}`, 'ok');
      if (sol && sol.arrival && !sol.arrival.entered)
        say(`No intercept found from this orbit — closest approach ${fmtDist(sol.arrival.miss)}. Circularize, then try again.`, 'warn');
      else
        say('Falling back to the analytic window. Expect a midcourse trim.', 'warn');
    }
    return;
  }

  if (sub === 'RDV' || sub === 'RENDEZVOUS') {
    const o = S.objects.find(x => x.id === 'STATION' && x.soi === S.soi);
    if (!o) return say('No station to rendezvous with here.', 'err');
    const se = elements(o.r, o.v, mu);
    head('RENDEZVOUS SOLUTION · STATION');
    row('YOUR ORBIT', `${fmtDist(e.rp-b.R)} × ${fmtDist(e.ra-b.R)}   T ${fmtT(e.period)}`);
    row('STATION ORBIT', `${fmtDist(se.rp-b.R)} × ${fmtDist(se.ra-b.R)}   T ${fmtT(se.period)}`);
    const thC = Math.atan2(S.r.y, S.r.x), thT = Math.atan2(o.r.y, o.r.x);
    const phi = normAngle((thT - thC) * e.dir);
    row('PHASE ANGLE', (phi*180/Math.PI).toFixed(1) + '°  station ahead of you');
    row('RANGE', fmtDist(V.len(V.sub(o.r, S.r))));
    row('CLOSING', fmtVel(-V.dot(V.unit(V.sub(o.r,S.r)), V.sub(o.v,S.v))));

    if (V.len(V.sub(o.r, S.r)) < 30) {
      say('');
      say('Inside 30 km — you are in proximity ops. Use DOCK for the approach page and TRANS to close.', 'ok');
      return;
    }
    if (e.e > 0.03) {
      say('');
      say('Circularize first — this solution assumes a circular departure.  PLAN CIRC AP', 'warn');
      return;
    }

    // Hohmann phasing: the station must sit exactly this far ahead at ignition
    const r1 = e.r, r2 = se.a, at = (r1 + r2)/2;
    const tof = Math.PI*Math.sqrt(at*at*at/mu);
    const ws = Math.sqrt(mu/(r2*r2*r2)), wc = Math.sqrt(mu/(r1*r1*r1));
    const phiReq = normAngle(Math.PI - ws*tof);
    const rel = ws - wc;
    let dphi = phiReq - phi;
    dphi = rel > 0 ? normAngle(dphi) : -normAngle(-dphi);
    const wait = Math.abs(rel) < 1e-14 ? Infinity : dphi/rel;
    const dv1 = (Math.sqrt(mu*(2/r1 - 1/at)) - e.v)*1000;
    const secs = burnTimeFor(Math.abs(dv1));

    say('');
    row('TRANSFER TIME', fmtT(tof));
    row('PHASE NEEDED', (phiReq*180/Math.PI).toFixed(1) + '°  at ignition', 'key');
    row('WINDOW IN', isFinite(wait) ? fmtT(wait) : '——', wait < 120 ? 'ok' : 'out');
    row('ΔV', fmtDV(Math.abs(dv1)) + '  ' + (dv1 >= 0 ? 'prograde' : 'retrograde'));
    row('BURN TIME', secs.toFixed(1) + ' s');
    say('');
    S.solution = { name: 'RENDEZVOUS', dir: dv1 >= 0 ? 'PRO' : 'RET', secs, node: 'T',
                   when: S.t + wait, nodeLabel: `T+${wait.toFixed(2)} s`, dv: Math.abs(dv1),
                   prop: secs * (S.craft.thrust*1000/(S.craft.isp*G0)),
                   detail: `transfer to ${fmtDist(se.a - b.R)}, then CIRC AP` };
    say(`  →  BURN ${dv1 >= 0 ? 'PRO' : 'RET'} ${secs.toFixed(2)} AT T+${wait.toFixed(2)}`, 'ok');
    say(`  then, half an orbit later:   PLAN CIRC AP`, 'ok');
    say('Phasing is flown from the lower orbit: shorter period, so the gap closes while coasting.', 'dim');
    return;
  }

  head('PLAN — onboard maneuver solver');
  say('PLAN CIRC AP|PE      circularize at an apsis', 'out');
  say('PLAN APO <km>        raise/lower apoapsis (burns at periapsis)', 'out');
  say('PLAN PERI <km>       raise/lower periapsis (burns at apoapsis)', 'out');
  say('PLAN ESC             escape the current sphere of influence', 'out');
  say('PLAN XFER <BODY>     Hohmann transfer + launch window', 'out');
  say('PLAN RDV             station rendezvous phasing', 'out');
  say('Each solution returns an executable BURN line.', 'dim');
}

function timeToSOIExit() {
  const b = soiBody(); if (!isFinite(b.soi)) return Infinity;
  let r = {...S.r}, v = {...S.v}, t = 0;
  for (let i = 0; i < 400; i++) {
    const out = propagate(r, v, b.mu, 60); r = out.r; v = out.v; t += 60;
    if (V.len(r) > b.soi) return t;
  }
  return Infinity;
}

/* ============================================================
   PROXIMITY OPS + RCS
   ============================================================ */
function rcsDV() {
  const m0 = craftMass(), m1 = m0 - S.craft.rcs;
  return m1 <= 0 ? 0 : S.craft.rcsIsp*G0*Math.log(m0/m1);
}

function cmdTrans(A) {
  const t = targetRel();
  const mode = A[0] || '';
  if (mode === 'ON' || mode === 'OFF') return say('RCS is always available while propellant remains. Use TRANS to translate.', 'sys');
  if (!t) return say('No target set. Try  TGT STATION.', 'err');
  if (S.dock.phase !== 'FREE') return say('MATED TO THE STATION — release the latches before translating.', 'err');
  // Inside the corridor the thruster frame is the docking axis, not the line
  // of sight to the station's centre: the two differ by the corridor angle,
  // and it is the axis that capture is judged against.
  const g = dockGeom();
  const onAxis = !!(g && g.ctrRange < 500);
  const los  = onAxis ? V.mul(g.axis, -1) : V.unit(t.r);
  const perp = onAxis ? g.lat : { x:-V.unit(t.r).y, y:V.unit(t.r).x };
  let dirv, dv;
  if (mode === 'NULL') { dirv = V.unit(t.v); dv = V.len(t.v)*1000; }
  else {
    dv = parseFloat(A[1]);
    if (!isFinite(dv) || dv <= 0) return say('Usage: TRANS <TGT|AWAY|PORT|STBD|PRO|RET> <m/s>', 'err');
    switch (mode) {
      case 'TGT': case 'FWD':  dirv = los; break;
      case 'AWAY': case 'AFT': dirv = V.mul(los,-1); break;
      case 'PORT': case 'LEFT':  dirv = perp; break;
      case 'STBD': case 'RIGHT': dirv = V.mul(perp,-1); break;
      case 'PRO': dirv = V.unit(S.v); break;
      case 'RET': dirv = V.mul(V.unit(S.v),-1); break;
      default: return say('Usage: TRANS <TGT|AWAY|PORT|STBD|PRO|RET|NULL> <m/s>', 'err');
    }
  }
  if (dv > rcsDV()) return say(`Only ${fmtDV(rcsDV())} of RCS remains.`, 'err');
  const used = rcsPulse(dirv, dv);
  say(`RCS pulse · ${fmtDV(dv)} ${mode.toLowerCase()}${onAxis ? ' (dock axis)' : ''}  (${used.toFixed(3)} kg)`, 'key');
  derive();
  const ng = dockGeom();
  if (ng && onAxis) say(`Axial ${fmtRange(ng.axial)}  closing ${fmtRate(ng.closing)}   lateral ${fmtRange(ng.lateral)} at ${fmtRate(ng.latRate)}`, 'out');
  else { const nt = targetRel();
    if (nt) say(`Range ${fmtDist(V.len(nt.r))}   closing ${fmtVel(-V.dot(V.unit(nt.r), nt.v))}`, 'out'); }
  checkObjectives();
}

/* ---- docking and the utility procedures ---------------------------------
   Every step below is one key with one precondition and one thing you can
   watch happen. The order is the real order: you cannot open a hatch onto
   vacuum, and the transfer pumps run off the station's bus.               */
function cmdDock(A) {
  const dk = S.dock, s = A[0] || '';
  const g = dockGeom();
  const no = (m) => say(m, 'err');

  switch (s) {
  case '': return gotoPage('DOCK');

  case 'AUTO': {
    if (dk.phase !== 'FREE') return no('Already captured.');
    if (!g) return no('No docking target. Try  TGT STATION.');
    if (S.mission && S.mission.noAuto) return no('AUTO DOCK is inhibited for this flight — fly the approach by hand.');
    dk.auto = !dk.auto; dk.autoT = 0;
    if (dk.auto) setAttMode('PAXS');
    return say(dk.auto ? 'AUTO DOCK ENGAGED · flying the corridor on RCS. Keep an eye on the budget.'
                       : 'AUTO DOCK DISENGAGED · manual translation.', dk.auto ? 'key' : 'sys');
  }

  case 'RETRACT': {
    if (dk.phase === 'RETRACT') return say('Ring already retracting.', 'sys');
    if (dk.phase !== 'SOFT') return no('Nothing captured to retract.');
    dk.phase = 'RETRACT';
    return say(`RING RETRACTING · pulling ${dk.misalign0.toFixed(1)}° of misalignment out of the interface.`, 'key');
  }

  case 'LATCH': {
    if (dk.phase === 'HARD') return say('Already hard docked.', 'sys');
    if (dk.phase !== 'RETRACTED') return no('The ring is not home — RETRACT first.');
    dk.phase = 'LATCHING'; dk.latching = true;
    return say('LATCHES DRIVING · 12 structural latches closing.', 'key');
  }

  case 'UNDOCK': case 'RELEASE': {
    if (dk.phase === 'FREE') return no('Not docked.');
    const o = dockTarget();
    const ax = o ? { x: Math.cos(Math.atan2(o.v.y,o.v.x) + Math.PI), y: Math.sin(Math.atan2(o.v.y,o.v.x) + Math.PI) } : null;
    S.dock = freshDock();
    S.att.mode = 'PAXS';
    if (ax) S.v = V.add(S.v, V.mul(ax, 0.1/1000));     // separation springs, 0.10 m/s
    say('UNDOCKED · hatch closed, utilities disconnected, latches open. Separation springs 0.10 m/s.', 'key');
    return;
  }

  /* --- vestibule and hatch --- */
  case 'EQUALISE': case 'EQ': case 'PRESS': {
    if (dk.phase !== 'HARD') return no('Hard dock required before the vestibule can be pressurised.');
    if (dk.vest.hatch) return no('The hatch is open — the vestibule is already at cabin pressure.');
    dk.vest.valve = !dk.vest.valve;
    // Aborting on the keypress, not a step later: the crew know at once.
    const killed = dk.vest.valve && dk.vest.check >= 0 && !dk.vest.leakOk;
    if (killed) dk.vest.check = -1;
    return say(dk.vest.valve
      ? 'EQUALISATION VALVE OPEN · vestibule pressurising, about 90 s to 101.3 kPa.' + (killed ? ' LEAK CHECK ABORTED.' : '')
      : 'EQUALISATION VALVE CLOSED.', killed ? 'warn' : 'key');
  }
  case 'LEAK': {
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (dk.vest.press < 100) return no(`Vestibule is at ${dk.vest.press.toFixed(1)} kPa — equalise to 100 kPa first.`);
    if (dk.vest.leakOk) return say('Leak check already passed.', 'sys');
    dk.vest.valve = false; dk.vest.check = 0;
    return say('LEAK CHECK RUNNING · valve closed, holding 60 s and watching for decay.', 'key');
  }
  case 'HATCH': {
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (dk.vest.hatch) { dk.vest.hatch = false; return say('HATCH CLOSED AND LOCKED.', 'key'); }
    if (!dk.vest.leakOk) return no('Leak check has not passed — that hatch stays shut.');
    dk.vest.hatch = true;
    return say('HATCH OPEN · the vestibule is yours. Air ducts can go through now.', 'ok');
  }

  /* --- electrical --- */
  case 'UMB': case 'UMBILICAL': {
    if (dk.phase !== 'HARD') return no('Hard dock required before the umbilical can be mated.');
    if (dk.pwr.tie) return no('Open the bus tie before demating the umbilical.');
    dk.pwr.umb = !dk.pwr.umb;
    return say(dk.pwr.umb ? 'UMBILICAL MATED · power and data connector engaged, tie open.'
                          : 'UMBILICAL DEMATED.', 'key');
  }
  case 'TIE': case 'BUS': {
    if (!dk.pwr.umb) return no('No umbilical — mate the connector first.');
    dk.pwr.tie = !dk.pwr.tie;
    derive();
    return say(dk.pwr.tie ? `BUS TIE CLOSED · station bus 120 V, ${(S.craft.stationSupply||2000)} W available. Data link up. Your battery is off the hook.`
                          : 'BUS TIE OPEN · back on internal power.', dk.pwr.tie ? 'ok' : 'warn');
  }

  /* --- ECLSS --- */
  case 'DUCT': {
    if (!dk.vest.hatch) return no('The air duct runs through the hatch — open it first.');
    if (dk.air.fan) return no('Stop the fan before pulling the duct.');
    dk.air.duct = !dk.air.duct;
    return say(dk.air.duct ? 'AIR DUCT INSTALLED · 200 mm trunk through the hatchway, fan off.'
                           : 'AIR DUCT REMOVED.', 'key');
  }
  case 'FAN': {
    if (!dk.air.duct) return no('No duct installed.');
    dk.air.fan = !dk.air.fan;
    return say(dk.air.fan ? 'CIRCULATION FAN RUNNING · 120 L/min. The station is breathing for you now.'
                          : 'CIRCULATION FAN STOPPED · back on your own O₂.', dk.air.fan ? 'ok' : 'warn');
  }

  /* --- propellant --- */
  case 'LINE': {
    if (dk.phase !== 'HARD') return no('Hard dock required.');
    if (dk.prop.xfer) return no('Stop the transfer first.');
    dk.prop.line = !dk.prop.line;
    if (!dk.prop.line) { dk.prop.purge = 0; dk.prop.purged = false; }
    return say(dk.prop.line ? 'TRANSFER LINE CONNECTED · fluid coupling mated, purging (30 s).'
                            : 'TRANSFER LINE DISCONNECTED.', 'key');
  }
  case 'XFER': case 'TRANSFER': {
    if (!dk.prop.purged) return no('The line is not purged — connect it and let the purge finish.');
    if (!dk.pwr.tie) return no('The transfer pumps run off the station bus — close the bus tie first.');
    if (dk.prop.xfer) { dk.prop.xfer = false; dk.prop.done = true;
      say(`TRANSFER STOPPED · ${dk.prop.moved.toFixed(1)} kg aboard.`, 'key'); checkObjectives(); return; }
    if (S.craft.fuel >= S.craft.fuelMax - 0.01 && S.craft.rcs >= S.craft.rcsMax - 0.01) {
      dk.prop.done = true; checkObjectives();
      return say('TANKS ALREADY FULL · coupling verified, nothing to transfer.', 'ok');
    }
    dk.prop.xfer = true;
    return say('TRANSFER RUNNING · 0.5 kg/s into the main tank, then RCS.', 'ok');
  }

  default: return no('Usage: DOCK AUTO|RETRACT|LATCH|UNDOCK · EQUALISE|LEAK|HATCH · UMB|TIE · DUCT|FAN · LINE|XFER');
  }
}
</script>

<script>
/* ============================================================
   MISSIONS
   ============================================================ */
function setOrbit(soi, periAlt, apoAlt, nuDeg, argpDeg) {
  const b = BODIES[soi];
  const rp = b.R + periAlt, ra = b.R + apoAlt;
  const a = (rp+ra)/2, ecc = (ra-rp)/(ra+rp);
  const p = a*(1-ecc*ecc);
  const nu = (nuDeg||0)*Math.PI/180, argp = (argpDeg||0)*Math.PI/180;
  const r = p/(1+ecc*Math.cos(nu)), th = argp + nu;
  const h = Math.sqrt(b.mu*p);
  const rhat = {x:Math.cos(th), y:Math.sin(th)};
  const that = {x:-Math.sin(th), y:Math.cos(th)};
  S.soi = soi;
  S.r = V.mul(rhat, r);
  S.v = V.add(V.mul(rhat, b.mu/h*ecc*Math.sin(nu)), V.mul(that, h/r));
}
function setHelio(periAU, apoAU, nuDeg, argpDeg) {
  setOrbit('SUN', periAU*AU - BODIES.SUN.R, apoAU*AU - BODIES.SUN.R, nuDeg, argpDeg);
}
function makeStation(soi, altKm, phaseDeg) {
  const b = BODIES[soi], r = b.R + altKm, th = phaseDeg*Math.PI/180;
  const sp = Math.sqrt(b.mu/r);
  return { id:'STATION', soi, r:{x:r*Math.cos(th), y:r*Math.sin(th)},
           v:{x:-sp*Math.sin(th), y:sp*Math.cos(th)} };
}
function rig(o) {
  Object.assign(S.craft, { name:'—', dry:2200, fuel:0, fuelMax:0, thrust:30, isp:311,
                           rcs:0, rcsMax:0, rcsIsp:220, crew:0, o2:0,
                           slewRate: 4 * Math.PI/180,      // rad/s maximum
                           slewAccel: 2 * Math.PI/180,     // rad/s^2
                           slewPower: 90 }, o);            // W drawn by the wheels while turning
  S.craft.fuelMax = o.fuel; S.craft.rcsMax = o.rcs || 0;
}

const MISSIONS = [
{
  id:1, code:'M-01', name:'ORBITAL INSERTION',
  brief:[
    'Second stage has shut down at {182 km}. You are on a ballistic arc: apoapsis {400 km}, periapsis 900 km below the surface.',
    'Left alone this vehicle comes straight back down. Orbit is not about going up — it is about going sideways fast enough that the ground curves away beneath you.',
    'Coast to apoapsis, then burn {prograde} to lift periapsis out of the planet.'],
  hint:'PLAN CIRC AP',
  setup(){ rig({name:'AURIGA-1', dry:2200, fuel:1800, thrust:30, isp:311, rcs:20});
    setOrbit('EARTH', -900, 400, 136, 30);
    S.power.battMax = 600; S.power.batt = 540; S.power.area = 14; },
  obj:[
    { text:'Raise periapsis above 150 km', check:(s,d)=> d.perAlt > 150 },
    { text:'Settle into a near-circular orbit (e < 0.05)', check:(s,d)=> d.e.e < 0.05 && d.perAlt > 150 },
  ]
},
{
  id:2, code:'M-02', name:'HIGH GROUND',
  brief:[
    'You are parked in a {200 km} circular orbit. Mission wants you at {1000 km}.',
    'A single long burn will not do it cleanly. The efficient move is a {Hohmann transfer}: burn prograde once to stretch apoapsis up to the target altitude, coast a half-orbit, then burn prograde again at apoapsis to pull periapsis up behind it.',
    'Two burns, half an orbit apart. Budget {440 m/s} for the pair.'],
  hint:'PLAN APO 1000  →  PLAN CIRC AP',
  setup(){ rig({name:'AURIGA-2', dry:2400, fuel:800, thrust:24, isp:311, rcs:20});
    setOrbit('EARTH', 200, 200, 0, 0);
    S.power.battMax = 600; S.power.batt = 600; S.power.area = 14; },
  obj:[
    { text:'Stretch apoapsis to 1000 km', check:(s,d)=> d.apoAlt > 950 && d.apoAlt < 1150 },
    { text:'Circularize there (periapsis above 950 km)', check:(s,d)=> d.perAlt > 950 && d.e.e < 0.03 },
  ]
},
{
  id:3, code:'M-03', name:'RENDEZVOUS & DOCK',
  brief:[
    'Station {CERES} holds a circular orbit at {400 km}. You are 100 km below it and trailing.',
    'Chasing directly does not work: thrusting toward the station raises your orbit, which {slows you down}. A lower orbit is a faster orbit — so you catch up by staying low, then climb once the phase angle is right.',
    'CERES keeps one face toward Earth and its docking port faces {aft}, so the approach runs up its velocity vector from behind. On that line you are in the same orbit as the station and you stay put for free.',
    'Capture is earned, not given: down the axis, inside {0.10 m} of centre, under {0.15 m/s}, nose within {4°}. Then retract the ring, close the latches, and connect air, power, ECLSS and propellant.',
    'This one is hand-flown — there is no AUTO DOCK on this vehicle. Your RCS holds about {26 m/s}.'],
  hint:'TGT STATION  →  PLAN RDV  →  HOLD DOCK',
  noAuto:true,
  setup(){ rig({name:'AURIGA-3', dry:2600, fuel:700, thrust:18, isp:311, rcs:40, rcsIsp:220, crew:2, o2:520});
    setOrbit('EARTH', 300, 300, 0, 0);
    S.objects = [ makeStation('EARTH', 400, 25) ];
    S.target = 'STATION';
    S.power.battMax = 900; S.power.batt = 900; S.power.area = 18; },
  obj:[
    { text:'Match orbits — range under 30 km', check:(s,d)=>{ const t=targetRel(); return t && V.len(t.r) < 30; } },
    { text:'Soft capture at the docking port', check:(s)=> s.dock.phase !== 'FREE' },
    { text:'Hard dock — ring retracted, 12 latches closed', check:(s)=> s.dock.phase === 'HARD' },
    { text:'Connect air, power, ECLSS and propellant', check:()=> utilitiesDone() },
  ]
},
{
  id:4, code:'M-04', name:'LUNAR FLYBY',
  brief:[
