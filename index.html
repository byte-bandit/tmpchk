function setOrbit(soi, periAlt, apoAlt, nuDeg, argpDeg) {
  const b = BODIES[soi];
  const rp = b.R + periAlt, ra = b.R + apoAlt;
  const a = (rp+ra)/2, ecc = (ra-rp)/(ra+rp);
  const p = a*(1-ecc*ecc);
  const nu = (nuDeg||0)*Math.PI/180, argp = (argpDeg||0)*Math.PI/180;
  const r = p/(1+ecc*Math.cos(nu)), th = argp + nu;
  const h = Math.sqrt(b.mu*p);
  const rhat = {x:Math.cos(th), y:Math.sin(th)};
  const that = {x:-Math.sin(th), y:Math.cos(th)};
  S.soi = soi;
  S.r = V.mul(rhat, r);
  S.v = V.add(V.mul(rhat, b.mu/h*ecc*Math.sin(nu)), V.mul(that, h/r));
}
function setHelio(periAU, apoAU, nuDeg, argpDeg) {
  setOrbit('SUN', periAU*AU - BODIES.SUN.R, apoAU*AU - BODIES.SUN.R, nuDeg, argpDeg);
}
function makeStation(soi, altKm, phaseDeg) {
  const b = BODIES[soi], r = b.R + altKm, th = phaseDeg*Math.PI/180;
  const sp = Math.sqrt(b.mu/r);
  return { id:'STATION', soi, r:{x:r*Math.cos(th), y:r*Math.sin(th)},
           v:{x:-sp*Math.sin(th), y:sp*Math.cos(th)} };
}
function rig(o) {

},
{

  brief:[
    'Same transfer as the flyby, but this time you stay.',
    'Arriving inside the Moon\'s sphere of influence you will be on a {hyperbolic} pass — faster than lunar escape velocity. Burn {retrograde} near closest approach to bleed off enough speed for the Moon to keep you.',
    'That is lunar orbit insertion. Miss it and you sail straight back out.'],
  hint:'Try:  PLAN XFER MOON  — then once captured,  PLAN CIRC PE',
  setup(){ rig({name:'SELENE-2', dry:3600, fuel:16000, thrust:110, isp:315, rcs:30, crew:3, o2:900});
    setOrbit('EARTH', 200, 200, 0, 200);

},
{
  id:6, code:'M-06', name:'TRANQUILLITY',
  brief:[
    'You are in a {100 km} circular orbit of the Moon with a lander beneath you. No atmosphere, no parachutes — every metre per second comes off the engine.',

},
{

function loadMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  if (!m) return say('No such mission.', 'err');
  S.t = 0; S.warp = 0; S.burn = null; S.sched = null; S.objects = [];
  S.target = null; S.status = 'flight'; S.att = 'PRO';
  S.completed = false; S.pauseAfterBurn = false;
  S.landingAllowed = false; S.thermLimit = 800;
  S.therm.hull = 20; S.ledger = { dvUsed:0, burns:0 };
  S.loads = { HEAT:true, SCI:false, COMM:true };
  S.flags = { lunarSOI:false, perihelionPassed:false };
  S.warnedPower = S.warnedTherm = S.warnedAtmo = false;
  m.setup();
  S.mission = m;
  S.objectives = m.obj.map(o => ({ ...o, done:false }));
  derive(); fitView();
  logEl.innerHTML = '';
  head(`${m.code} · ${m.name}`);
  m.brief.forEach(b => { say(b, 'out'); say(''); });
  if (S.objectives.length) {
    say('OBJECTIVES', 'hd');
    S.objectives.forEach((o,i) => say(`  ${i+1}. ${o.text}`, 'out'));
  }
  say('');
  say(m.hint || '', 'ok');
  say('Clock is HOLD. Type  WARP 10  to start time, or  STAT  for the flight display.', 'sys');
  saveProgress();
}

/* ---- objectives -------------------------------------------- */
function checkObjectives() {
  if (S.status === 'lost' || S.completed || !S.objectives.length) return;
  if (S.soi === 'MOON') S.flags.lunarSOI = true;
  if (S.soi === 'SUN' && D.e && D.e.r < D.e.rp*1.02 && D.e.e > 0.05) S.flags.perihelionPassed = true;
  let changed = false;
  for (const o of S.objectives) {
    if (o.done) continue;
    let ok = false;
    try { ok = !!o.check(S, D); } catch (err) { ok = false; }
    if (ok) { o.done = true; changed = true; say(`OBJECTIVE COMPLETE · ${o.text}`, 'ok'); }
  }
  if (changed && S.objectives.every(o => o.done) && !S.completed) {
    S.completed = true;
    // let a running burn finish — cutting the engine here would strand the vehicle
    // mid-maneuver on the very burn that met the objective
    if (S.burn) S.pauseAfterBurn = true; else S.warp = 0;
    say('', 'out');
    head('MISSION COMPLETE · ' + S.mission.code);
    row('ELAPSED', fmtMET(S.t));
    row('ΔV EXPENDED', fmtDV(S.ledger.dvUsed));
    row('BURNS', String(S.ledger.burns));
    row('PROP LEFT', S.craft.fuel.toFixed(1) + ' kg');
    say('');
    const nxt = MISSIONS.find(m => m.id === S.mission.id + 1);
    say(nxt ? `Next up: ${nxt.code} ${nxt.name}.  Type  MIS ${nxt.id}` : 'Every scripted mission is flown. Type MIS 0 for free flight.', 'sys');
    markComplete(S.mission.id);
  }
}
function cmdObj() {
  if (!S.mission) return say('No mission loaded. Type MIS.', 'err');
  head(S.mission.code + ' · OBJECTIVES');
  if (!S.objectives.length) return say('Free flight — no objectives.', 'sys');
  S.objectives.forEach((o,i) => say(`  ${o.done ? '✔' : '○'}  ${i+1}. ${o.text}`, o.done ? 'ok' : 'out'));
  say('');
  say(S.mission.hint || '', 'dim');
}
function cmdMis(A) {
  if (A[0] !== undefined && A[0] !== '') {
    const n = parseInt(A[0], 10);
    if (!isNaN(n) && MISSIONS.some(m => m.id === n)) return loadMission(n);
    return say('Usage: MIS <number>. Type MIS on its own for the list.', 'err');
  }
  head('MISSION ROSTER');
  const done = loadProgress();
  for (const m of MISSIONS) {
    const mark = done.includes(m.id) ? '✔' : ' ';
    const cur = S.mission && S.mission.id === m.id ? ' ◂ loaded' : '';
    say(`  ${mark} ${pad('MIS ' + m.id, 8)}${pad(m.code, 7)}${m.name}${cur}`,
        done.includes(m.id) ? 'ok' : 'out');
  }
  say('');
  say('Type  MIS 1  to fly one. They build on each other, so fly them in order.', 'sys');
}
</script>

<script>
/* ============================================================
   HELP
   ============================================================ */
function cmdHelp(topic) {
  if (topic === 'ORBIT' || topic === 'PHYSICS') {
    head('HOW ORBITS BEHAVE');
    say('An orbit is an ellipse with the planet at one focus. Two numbers describe its size and shape: {apoapsis} (the high point) and {periapsis} (the low point).');
    say('');
    say('The one rule worth memorising: {a burn changes the far side of your orbit, not where you are}.', 'key');
    say('  · Burn PRO at periapsis → apoapsis rises', 'out');
    say('  · Burn RET at periapsis → apoapsis falls', 'out');
    say('  · Burn PRO at apoapsis  → periapsis rises', 'out');
    say('  · Burn RET at apoapsis  → periapsis falls', 'out');
    say('');
    say('So circularizing means burning prograde at apoapsis until periapsis catches up. Raising your orbit takes two burns half an orbit apart — a Hohmann transfer.');
    say('');
    say('The counter-intuitive one: to catch something ahead of you in the same orbit, burn {retrograde}. You drop into a lower, faster orbit and gain on it. Thrusting toward it would raise you and slow you down.', 'warn');
    return;
  }
  if (topic === 'BURN') {
    head('BURNS');
    say('BURN <DIR> <SECONDS> [AT PE|AP|T+<s>]');
    say('  PRO   prograde — along your velocity, raises the opposite apsis', 'out');
    say('  RET   retrograde — against velocity, lowers the opposite apsis', 'out');
    say('  ROUT  radial out — away from the planet, rotates the orbit', 'out');
    say('  RIN   radial in — toward the planet', 'out');
    say('');
    say('BURN PRO 42            light the engine now for 42 seconds', 'out');
    say('BURN PRO 42 AT AP      arm it for the next apoapsis', 'out');
    say('BURN RET 15 AT T+600   arm it for ten minutes from now', 'out');
    say('BURN PRO 250 AT XFER MOON   arm it for the next transfer window', 'out');
    say('CANCEL                 shut down or disarm', 'out');
    say('');
    say('An armed burn ignites {half its duration early} so the impulse is centred on the node — that is how it is actually flown.', 'dim');
    say('Time warp drops to 10× automatically while the engine is lit.', 'dim');
    return;
  }
  if (topic === 'DOCK') {
    head('RENDEZVOUS & DOCKING');
    say('1. TGT STATION — set the target.');
    say('2. PLAN RDV — read the phase angle and orbit difference.');
    say('3. Stay in a lower orbit until the phase angle closes toward 0°.');
    say('4. Match the station\'s orbit: PLAN APO <its altitude>, then PLAN CIRC AP.');
    say('5. Inside 30 km the scope switches to proximity ops. Use DOCK for the approach page.');
    say('6. TRANS TGT / AWAY / PORT / STBD in tenths of a metre per second.');
    say('');
    say('Capture gate: {under 20 m, closing under 0.30 m/s, lateral under 0.10 m/s}.', 'key');
    say('TRANS NULL cancels all relative motion in one pulse — expensive but it saves a bad approach.', 'dim');
    return;
  }
  head('COMMAND REFERENCE');
  say('FLIGHT', 'hd');
  say(pad('STAT',22) + 'primary flight display', 'out');
  say(pad('NAV',22) + 'full orbital elements', 'out');
  say(pad('BURN <DIR> <SEC>',22) + 'light the engine  (HELP BURN)', 'out');
  say(pad('HOLD <DIR>',22) + 'set attitude hold', 'out');
  say(pad('CANCEL',22) + 'abort or disarm a burn', 'out');
  say(pad('WARP <n>',22) + 'time warp — 0 holds the clock', 'out');
  say(pad('TGT <BODY|STATION>',22) + 'set a target', 'out');
  say('PLANNING', 'hd');
  say(pad('PLAN',22) + 'the maneuver solver — start here', 'key');
  say(pad('PLAN CIRC AP|PE',22) + 'circularize at an apsis', 'out');
  say(pad('PLAN APO <km>',22) + 'raise or lower apoapsis', 'out');

  say('SUBSYSTEMS', 'hd');

  say(pad('LIFE',22) + 'crew and consumables', 'out');
  say(pad('DOCK · TRANS',22) + 'proximity ops  (HELP DOCK)', 'out');
  say('MISSION', 'hd');
  say(pad('MIS',22) + 'mission roster', 'out');
  say(pad('LOG',22) + 'objective status', 'out');
  say(pad('RESTART',22) + 'refly the current mission', 'out');
  say(pad('CLS',22) + 'clear the scratchpad', 'out');
  say('');

  say('HELP BURN · HELP DOCK', 'dim');
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
const KEY = 'deltav.progress.v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}
function markComplete(id) {
  try {
    const d = loadProgress();
    if (!d.includes(id)) { d.push(id); localStorage.setItem(KEY, JSON.stringify(d)); }
  } catch (e) { /* private browsing — progress is just not remembered */ }
}
function saveProgress() { /* roster state only; flight state is not resumed across loads */ }

/* ============================================================
   QUICK CHIPS
   ============================================================ */
const CHIPS = [
  ['STAT','STAT'], ['NAV','NAV'], ['PLAN','PLAN'], ['W×10','WARP 10'], ['W×100','WARP 100'],
  ['W×1k','WARP 1000'], ['HOLD','WARP 0'], ['PWR','PWR'], ['FUEL','FUEL'], ['LOG','LOG'],
  ['MIS','MIS'], ['HELP','HELP'],
];
const chipBar = document.getElementById('chips');
for (const [label, cmd] of CHIPS) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'chip'; b.textContent = label;
  if (cmd === 'PLAN' || cmd === 'HELP') b.classList.add('hot');
  b.addEventListener('click', () => { exec(cmd); document.getElementById('cmd').focus({preventScroll:true}); });
  chipBar.appendChild(b);
}

/* ============================================================
   INPUT
   ============================================================ */
const input = document.getElementById('cmd');
const history = []; let hIx = -1;
document.getElementById('entry').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const v = input.value;
  if (!v.trim()) return;
  history.push(v); hIx = history.length;
  input.value = '';
  try { exec(v); } catch (err) { say('Console fault: ' + err.message, 'err'); }
  derive(); updateHUD();
});
input.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowUp')   { ev.preventDefault(); if (hIx > 0) input.value = history[--hIx]; }
  if (ev.key === 'ArrowDown') { ev.preventDefault();
    if (hIx < history.length-1) input.value = history[++hIx]; else { hIx = history.length; input.value = ''; } }
});
document.getElementById('z-in').addEventListener('click',  () => { view.km /= 1.6; view.auto = false; });
document.getElementById('z-out').addEventListener('click', () => { view.km *= 1.6; view.auto = false; });
document.getElementById('z-fit').addEventListener('click', () => fitView());

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  const dtReal = Math.min((ts - last)/1000, 0.1);
  last = ts;
  if (S.status === 'flight' && S.warp > 0) advance(dtReal * S.warp);
  derive();
  updateHUD();
  draw();
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(restored) {
  document.getElementById('veil').classList.add('hidden');
  resize();
  if (!S.mission) {
    loadMission(1);
    const done = loadProgress();
    if (done.length) say(`Flight record found — ${done.length} mission${done.length>1?'s':''} already flown. Type MIS for the roster.`, 'sys');
  }
  requestAnimationFrame(frame);
  if (window.matchMedia('(min-width: 860px)').matches) input.focus({preventScroll:true});
}
document.getElementById('boot').addEventListener('click', () => boot());

/* keep open viewers' flight state across a republish */
try {
  window.claude?.hot?.snapshot?.(() => ({
    t:S.t, soi:S.soi, r:S.r, v:S.v, mission:S.mission?.id, craft:S.craft,
    power:S.power, therm:S.therm, objectives:S.objectives.map(o=>o.done), booted:!document.getElementById('veil').classList.contains('hidden'),
  }));
} catch (e) {}

resize();
derive();
updateHUD();
draw();
</script>
