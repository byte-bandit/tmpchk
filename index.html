<title>Delta-V Flight Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --void:#070A10;
  --panel:#0E141D;
  --panel-2:#131B26;
  --rule:#1E2937;
  --rule-soft:#161F2B;
  --amber:#F2A33C;
  --amber-dim:#9A6A2A;
  --cyan:#3FA9C9;
  --cyan-dim:#2B7A94;
  --cyan-deep:#1C4C5C;
  --slate:#7C8BA1;
  --slate-dim:#4A566A;
  --nominal:#4FD1A5;
  --caution:#E8C04A;
  --critical:#E4553C;
  --ink:#DCE4EE;
  --f-disp:'Chakra Petch','DIN Alternate','Helvetica Neue',sans-serif;
  --f-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);
  font-family:var(--f-mono);font-size:13px;line-height:1.45;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;
}
#app{
  height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-left)) 6px max(10px,env(safe-area-inset-right));
  gap:8px;max-width:1400px;margin:0 auto;width:100%;
}

/* ---------- status rail ---------- */
.rail{
  display:flex;align-items:stretch;gap:0;
  border-bottom:1px solid var(--rule);
  padding-block:7px 6px;flex:0 0 auto;
  font-family:var(--f-disp);
}
.rail-cell{display:flex;flex-direction:column;justify-content:center;padding-right:11px;min-width:0;overflow:hidden}
.rail-cell + .rail-cell{padding-left:11px;border-left:1px solid var(--rule-soft)}
.rail-k{font-size:8.5px;letter-spacing:.14em;color:var(--slate-dim);text-transform:uppercase;white-space:nowrap}
.rail-v{font-family:var(--f-mono);font-size:14px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.rail-v.small{font-size:12px}
.rail-spacer{flex:1 1 auto;min-width:4px}
.lamp{
  align-self:center;flex:0 0 auto;max-width:42vw;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-disp);font-size:9px;font-weight:700;
  letter-spacing:.12em;padding:4px 8px;border:1px solid;border-radius:2px;white-space:nowrap;
}
.lamp.ok{color:var(--nominal);border-color:#1E5A48;background:#0B1F1A}
.lamp.caution{color:var(--caution);border-color:#5C4B15;background:#1F1A08;animation:pulse 1.4s ease-in-out infinite}
.lamp.crit{color:var(--critical);border-color:#6B2418;background:#1F0D0A;animation:pulse .7s steps(2,end) infinite}
.warprow{display:flex;align-items:center;gap:5px}
.wbtn{
  flex:0 0 auto;width:21px;height:21px;background:#0B121B;border:1px solid var(--rule);
  color:var(--slate);font-family:var(--f-mono);font-size:13px;line-height:1;border-radius:2px;
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
}
.wbtn:active{background:var(--panel-2);color:var(--amber)}
.railbtn{
  align-self:center;flex:0 0 auto;margin-left:7px;background:#0B121B;
  border:1px solid var(--rule);color:var(--slate);font-family:var(--f-disp);
  font-size:8.5px;font-weight:700;letter-spacing:.11em;padding:9px 9px;
  border-radius:2px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;
}
.railbtn:active,.railbtn:focus-visible{background:var(--panel-2);color:var(--amber);border-color:var(--amber-dim);outline:none}

@media (max-width:600px){
  .rail-cell{padding-right:7px}
  .rail-cell + .rail-cell{padding-left:7px}
  .rail-k{font-size:7.5px;letter-spacing:.1em}
  .rail-v{font-size:12px}
  .rail-v.small{font-size:11px}
  #cell-dv{display:none}
  .lamp{font-size:8px;padding:3px 6px;letter-spacing:.07em;max-width:30vw}
  #cell-ref{display:none}                 /* the CDU title already names the reference */
  .wbtn{width:19px;height:19px;font-size:12px}
  .railbtn{font-size:8px;padding:8px 7px;margin-left:5px;letter-spacing:.08em}
}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.lamp{animation:none!important}}

/* ---------- main split ---------- */
.deck{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
@media (min-width:860px){
  .deck{flex-direction:row}
  .deck > .col-a{flex:1 1 52%;min-width:0;display:flex;flex-direction:column;gap:8px}
  .deck > .col-b{flex:1 1 48%;min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
}
.col-a{display:flex;flex-direction:column;gap:8px;min-height:0;flex:0 0 auto}
.col-b{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1 1 auto}

/* ---------- plot ---------- */
.scope{
  position:relative;background:#060B12;border:1px solid var(--rule);
  flex:0 0 auto;height:34dvh;min-height:180px;overflow:hidden;
}
@media (min-width:860px){.scope{flex:1 1 auto;height:auto;min-height:280px}}
.scope canvas{display:block;width:100%;height:100%;touch-action:none}
.scope-tag{
  position:absolute;top:6px;left:8px;font-family:var(--f-disp);font-size:8.5px;
  letter-spacing:.16em;color:var(--cyan-deep);text-transform:uppercase;pointer-events:none;
}
.scope-scale{
  position:absolute;bottom:6px;right:8px;font-size:9px;color:var(--slate-dim);
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.scope-zoom{position:absolute;bottom:6px;left:8px;display:flex;gap:4px}
.zbtn{
  width:26px;height:26px;background:#0B121B;border:1px solid var(--rule);color:var(--slate);
  font-family:var(--f-mono);font-size:13px;line-height:1;cursor:pointer;border-radius:2px;padding:0;
}
.zbtn:active{background:var(--panel-2);color:var(--amber)}

/* ---------- readout grid ---------- */
.readout{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule-soft);
  border:1px solid var(--rule);flex:0 0 auto;
}
.ro{background:var(--panel);padding:6px 8px 7px;min-width:0}
.ro-k{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.13em;color:var(--slate-dim);text-transform:uppercase}
  .ro-v{font-size:13.5px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.ro-u{font-size:9px;color:var(--slate-dim);font-weight:400;margin-left:2px}
.ro.warn .ro-v{color:var(--caution)}
.ro.bad .ro-v{color:var(--critical)}

/* ---------- CDU: paged control & display unit ----------
   Layout follows the Airbus MCDU: a title line carrying the page number, six
   label/data row pairs split left and right, line-select keys flanking each
   row, and a scratchpad line at the bottom that carries both typed entry and
   system messages. Small type for labels, large for data.                  */
.cdu{
  flex:1 1 auto;display:flex;flex-direction:column;min-height:0;
  background:var(--panel);border:1px solid var(--rule);
}
.cdu-title{
  display:flex;align-items:center;gap:8px;padding:5px 8px;flex:0 0 auto;
  border-bottom:1px solid var(--rule-soft);
}
.cdu-t{
  font-family:var(--f-disp);font-size:10.5px;font-weight:600;letter-spacing:.15em;
  color:var(--cyan);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cdu-sub{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.1em;color:var(--slate-dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdu-pg{margin-left:auto;font-size:9px;color:var(--slate-dim);font-variant-numeric:tabular-nums;flex:0 0 auto}
.slew{
  flex:0 0 auto;width:24px;height:22px;background:#0B121B;border:1px solid var(--rule);
  color:var(--slate);font-size:12px;line-height:1;border-radius:2px;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;
}
.slew:disabled{opacity:.3;cursor:default}
.slew:active:not(:disabled){background:var(--panel-2);color:var(--amber)}

/* Flex rather than grid: a grid's 1fr column is measured at max-content while
   row heights are computed, so wrapped text reports one line and then overflows
   its track. Flex resolves the width first, so a wrapped row sizes correctly. */
.cdu-body{
  display:flex;flex-direction:column;gap:3px;padding:3px;
  flex:1 1 auto;min-height:150px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.rowgrp{display:flex;align-items:stretch;gap:3px;min-width:0}
.rowgrp > .crow{flex:1 1 auto;min-width:0}
.rowgrp > .lsk{flex:0 0 22px;align-self:stretch}
.cdu-body::-webkit-scrollbar{width:3px}
.cdu-body::-webkit-scrollbar-thumb{background:var(--rule)}
.lsk{
  width:22px;min-height:30px;
  background:#0C131C;border:1px solid var(--rule);border-radius:2px;
  color:#2B3444;font-size:10px;line-height:1;cursor:default;padding:0;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;
}
.lsk.on{color:var(--cyan);border-color:#25404E;background:#0E1A22;cursor:pointer}
.lsk.on:active{background:#15303C;color:var(--amber)}
.lsk.go{color:var(--caution);border-color:#4A3B12;background:#1A1608}
.lsk.go:active{background:#2A2410}

.crow{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0;min-height:30px;
  align-items:center;padding:3px 5px;border-bottom:1px solid #111925;
}
.crow.full{grid-template-columns:minmax(0,1fr)}
.crow.bare{border-bottom:0}
.fld{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.fld.right{text-align:right}
.flab{
  font-family:var(--f-disp);font-size:7.5px;letter-spacing:.13em;color:var(--slate-dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;
}
.fval{
  font-size:12.5px;font-weight:500;color:var(--amber);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;letter-spacing:-.01em;
}
/* free text: wraps over as many display lines as it needs */
.fval.wrap{
  white-space:pre-wrap;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;
  line-height:1.45;letter-spacing:0;font-variant-numeric:normal;
}
.fval.body{font-size:12px;color:var(--ink);font-weight:400}
.fval.sel{color:var(--cyan)}
.fval.go{color:var(--caution)}
.fval.ok{color:var(--nominal)}
.fval.bad{color:var(--critical)}
.fval.dim{color:var(--slate-dim)}
.fld.tap{cursor:pointer}

/* ---------- scratchpad line ---------- */
.entry{
  display:flex;align-items:center;flex:0 0 auto;position:relative;
  border-top:1px solid var(--rule);background:#0A101A;
}
.entry .caret{padding:0 6px 0 8px;color:var(--cyan);font-weight:700;flex:0 0 auto}
#cmd{
  flex:1 1 auto;min-width:0;background:transparent;border:0;outline:none;color:var(--amber);
  font-family:var(--f-mono);font-size:16px;font-weight:500;padding:10px 0;letter-spacing:.02em;
}
#cmd::placeholder{color:#313C4E;font-weight:400}
.spmsg{
  position:absolute;left:22px;right:96px;top:50%;transform:translateY(-50%);
  font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
}
.spmsg.info{color:var(--slate)}
.spmsg.ok{color:var(--nominal)}
.spmsg.warn{color:var(--caution)}
.spmsg.err{color:var(--critical)}
.entry button{
  flex:0 0 auto;background:transparent;border:0;border-left:1px solid var(--rule);
  font-family:var(--f-disp);font-size:10px;font-weight:700;letter-spacing:.12em;
  padding:12px 9px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#clr{color:var(--slate)}
#go{color:var(--cyan)}
.entry button:active{background:var(--panel-2);color:var(--amber)}

/* ---------- function keys: page selection only ---------- */
.pagekeys{
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.pk{
  min-width:0;background:#111925;border:1px solid var(--rule);color:var(--slate);
  font-family:var(--f-disp);font-size:9.5px;font-weight:600;letter-spacing:.06em;
  padding:7px 2px;border-radius:2px;cursor:pointer;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:center;
  -webkit-tap-highlight-color:transparent;
}
.pk:active{background:#1B2534;color:var(--amber)}
.pk.cur{color:var(--amber);border-color:var(--amber-dim);background:#191A14}
button:focus-visible,input:focus-visible{outline:1px solid var(--amber);outline-offset:-1px}

/* ---------- boot veil ---------- */
#veil{
  position:fixed;inset:0;background:var(--void);z-index:30;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;
}
#veil h1{font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:.2em;
  color:var(--amber);margin:0;text-align:center;text-wrap:balance}
#veil p{color:var(--slate);font-size:12px;margin:0;text-align:center;max-width:34ch}
#veil button{
  background:#111925;border:1px solid var(--amber-dim);color:var(--amber);font-family:var(--f-disp);
  font-size:13px;font-weight:700;letter-spacing:.16em;padding:12px 26px;border-radius:2px;cursor:pointer;
}
#veil button:active{background:#1B2534}
.hidden{display:none!important}
</style>

<div id="app">
  <div class="rail" id="rail">
    <div class="rail-cell"><span class="rail-k">MET</span><span class="rail-v" id="r-met">000:00:00:00</span></div>
    <div class="rail-cell"><span class="rail-k">Warp</span><span class="warprow"><button class="wbtn" id="w-dn" type="button" aria-label="Slower">−</button><span class="rail-v" id="r-warp">1×</span><button class="wbtn" id="w-up" type="button" aria-label="Faster">+</button></span></div>
    <div class="rail-cell" id="cell-ref"><span class="rail-k">Ref</span><span class="rail-v small" id="r-soi">EARTH</span></div>
    <div class="rail-cell" id="cell-dv"><span class="rail-k">ΔV Rem</span><span class="rail-v small" id="r-dv">0</span></div>
    <div class="rail-spacer"></div>
    <div class="lamp ok" id="r-lamp">NOMINAL</div>
    <button class="railbtn" id="fs" type="button" aria-label="Toggle fullscreen">FULL</button>
  </div>

  <div class="deck">
    <div class="col-a">
      <div class="scope">
        <canvas id="scope"></canvas>
        <div class="scope-tag" id="scope-tag">ORBITAL PLOT · EARTH</div>
        <div class="scope-zoom">
          <button class="zbtn" id="z-out" aria-label="Zoom out">−</button>
          <button class="zbtn" id="z-in" aria-label="Zoom in">+</button>
          <button class="zbtn" id="z-fit" aria-label="Fit view">⊡</button>
        </div>
        <div class="scope-scale" id="scope-scale">—</div>
      </div>
      <div class="readout" id="readout">
        <div class="ro"><div class="ro-k">Alt</div><div class="ro-v" id="d-alt">—</div></div>
        <div class="ro"><div class="ro-k">Vel</div><div class="ro-v" id="d-vel">—</div></div>
        <div class="ro"><div class="ro-k" id="k-apo">Apo</div><div class="ro-v" id="d-apo">—</div></div>
        <div class="ro"><div class="ro-k" id="k-tapo">T−Apo</div><div class="ro-v" id="d-tapo">—</div></div>
        <div class="ro"><div class="ro-k" id="k-per">Peri</div><div class="ro-v" id="d-per">—</div></div>
        <div class="ro"><div class="ro-k" id="k-tper">T−Peri</div><div class="ro-v" id="d-tper">—</div></div>
        <div class="ro"><div class="ro-k">Ecc</div><div class="ro-v" id="d-ecc">—</div></div>
        <div class="ro"><div class="ro-k">Period</div><div class="ro-v" id="d-prd">—</div></div>
      </div>
    </div>

    <div class="col-b">
      <div class="cdu">
        <div class="cdu-title">
          <span class="cdu-t" id="cdu-t">ORBIT</span>
          <span class="cdu-sub" id="cdu-sub"></span>
          <span class="cdu-pg" id="cdu-pg">1/1</span>
          <button class="slew" id="pg-prev" type="button" aria-label="Previous page">‹</button>
          <button class="slew" id="pg-next" type="button" aria-label="Next page">›</button>
        </div>
        <div class="cdu-body" id="cdu-body"></div>
        <form class="entry" id="entry" autocomplete="off">
          <span class="caret">›</span>
          <input id="cmd" name="cmd" type="text" placeholder="" autocomplete="off"
                 autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="send">
          <span class="spmsg info" id="spmsg"></span>
          <button id="clr" type="button">CLR</button>
          <button id="go" type="submit">EXEC</button>
        </form>
      </div>
      <div class="pagekeys" id="pagekeys"></div>
    </div>
  </div>
</div>

<div id="veil">
  <h1>DELTA-V</h1>
  <p>Orbital flight console. Patched-conic guidance, navigation and control.</p>
  <button id="boot" type="button">POWER ON</button>
</div>

<script>
"use strict";
/* ============================================================
   DELTA-V — orbital flight console
   Planar patched-conic simulation. Units: km, km/s, s, kg.
   ============================================================ */

const G0 = 9.80665;            // m/s^2
const TAU = Math.PI * 2;
const AU = 149597870.7;        // km

/* ---- celestial bodies -------------------------------------
   `a` / `period` describe a circular orbit about `parent`.
   `soi` is the sphere-of-influence radius used for conic patching.

   `atmo` is the atmospheric interface: the altitude in km above which there is
   no air at all. It was only ever a caution threshold; it is now also the hard
   boundary of the drag model, and that is deliberate. Below it the trajectory
   has to be integrated numerically, because drag is not conservative and the
   exact Kepler propagation no longer applies. Above it nothing changes, to the
   bit — which is what keeps every flown mission where it was.

   `rho0` is sea-level (surface) density in kg/m^3 and `hScale` the scale
   height in km, for rho = rho0 exp(-h/H). `rot` is the body's rotation rate in
   rad/s: it gives a pad its free eastward velocity, and it is what the air
   moves at, so a vehicle sitting on the ground feels no wind.              */
const BODIES = {
  SUN:   { name:'SUN',   mu:1.32712440018e11, R:696340, parent:null,   color:'#F2A33C', soi:Infinity },
  EARTH: { name:'EARTH', mu:398600.4418, R:6371,   parent:'SUN',   a:AU,          period:3.15581e7, phase0:1.10, soi:924000,  color:'#3FA9C9', atmo:140,
           rho0:1.225, hScale:8.5,  rot:7.2921159e-5, ocean:true },
  MOON:  { name:'MOON',  mu:4902.800,    R:1737.4, parent:'EARTH', a:384400,      period:2.360591e6, phase0:0.40, soi:66100,  color:'#8A93A3', rot:2.6617e-6 },
  VENUS: { name:'VENUS', mu:324858.6,    R:6051.8, parent:'SUN',   a:0.72333*AU,  period:1.94141e7, phase0:4.10, soi:616000,  color:'#D8B26A', atmo:250,
           rho0:65.0,  hScale:15.9, rot:-2.9924e-7 },
  MARS:  { name:'MARS',  mu:42828.37,    R:3389.5, parent:'SUN',   a:1.52366*AU,  period:5.93554e7, phase0:4.6407, soi:577000,  color:'#C2603F', atmo:110,
           rho0:0.020, hScale:11.1, rot:7.088e-5 },
};

/* ---- atmosphere -------------------------------------------
   Exponential and isothermal: cheap, and within a factor of two of the real
   thing everywhere it matters. Both functions return exactly zero above the
   interface and for a body with no air, so every call site can add their
   contribution unconditionally and change nothing in vacuum.               */
function airDensity(b, altKm) {                 // kg/m^3
  if (!b.rho0 || !(altKm < b.atmo)) return 0;
  return b.rho0 * Math.exp(-Math.max(0, altKm) / b.hScale);
}
/** Ambient pressure as a fraction of the body's surface pressure, 0..1. */
function airPressure(b, altKm) {
  if (!b.rho0 || !(altKm < b.atmo)) return 0;
  return Math.exp(-Math.max(0, altKm) / b.hScale);
}
/** Surface gravity of a body, m/s². What a vehicle standing on it weighs
 *  against. Earth returns 9.8196 — its own number, not the G0 constant. */
const surfaceG = (b) => b.mu / (b.R * b.R) * 1000;

const CHILDREN = {};
for (const k in BODIES) {
  const p = BODIES[k].parent;
  if (p) (CHILDREN[p] = CHILDREN[p] || []).push(k);
  else CHILDREN[k] = CHILDREN[k] || [];
}

/* ---- small vector helpers --------------------------------- */
const V = {
  add:(a,b)=>({x:a.x+b.x, y:a.y+b.y}),
  sub:(a,b)=>({x:a.x-b.x, y:a.y-b.y}),
  mul:(a,s)=>({x:a.x*s, y:a.y*s}),
  dot:(a,b)=>a.x*b.x + a.y*b.y,
  crs:(a,b)=>a.x*b.y - a.y*b.x,
  len:a=>Math.hypot(a.x,a.y),
  unit:a=>{const m=Math.hypot(a.x,a.y); return m<1e-12?{x:0,y:0}:{x:a.x/m,y:a.y/m};},
  rot:(a,t)=>({x:a.x*Math.cos(t)-a.y*Math.sin(t), y:a.x*Math.sin(t)+a.y*Math.cos(t)}),
};

/* ---- body ephemeris (circular, coplanar) ------------------- */
function bodyStateInParent(key, t) {
  const b = BODIES[key];
  if (!b.parent) return { r:{x:0,y:0}, v:{x:0,y:0} };
  const th = b.phase0 + TAU * t / b.period;
  const sp = TAU * b.a / b.period;
  return { r:{x:b.a*Math.cos(th), y:b.a*Math.sin(th)},
           v:{x:-sp*Math.sin(th),  y: sp*Math.cos(th)} };
}
/** State of `key` expressed in the frame centred on `frame`. */
function absState(k, t) {
  let r = {x:0,y:0}, v = {x:0,y:0}, c = k;
  while (BODIES[c].parent) {
    const s = bodyStateInParent(c, t);
    r = V.add(r, s.r); v = V.add(v, s.v);
    c = BODIES[c].parent;
  }
  return { r, v };
}
function bodyStateIn(frame, key, t) {
  if (frame === key) return { r:{x:0,y:0}, v:{x:0,y:0} };
  const A = absState(key, t), B = absState(frame, t);
  return { r:V.sub(A.r, B.r), v:V.sub(A.v, B.v) };
}

/* ---- Stumpff functions ------------------------------------- */
function stumpffC(z){
  if (z > 1e-8)  { const s=Math.sqrt(z);  return (1-Math.cos(s))/z; }
  if (z < -1e-8) { const s=Math.sqrt(-z); return (Math.cosh(s)-1)/(-z); }
  return 0.5 - z/24 + z*z/720;
}
function stumpffS(z){
  if (z > 1e-8)  { const s=Math.sqrt(z);  return (s-Math.sin(s))/(s*s*s); }
  if (z < -1e-8) { const s=Math.sqrt(-z); return (Math.sinh(s)-s)/(s*s*s); }
  return 1/6 - z/120 + z*z/5040;
}

/* ---- universal-variable two-body propagation ---------------
   Exact for ellipse, parabola and hyperbola alike, which is what
   lets time warp jump hours in a single step without drift.

   ONE step, and it says whether it worked. Newton's method on the universal
   anomaly is not globally convergent: on a strongly hyperbolic arc it can walk
   away from the root instead of toward it, and the iteration then ends on a
   finite number that is not a solution of anything. Measured, on the arrival
   hyperbola at Mars' sphere of influence (e = 1.7165, periapsis 4,470 km,
   starting 468,228 km out), a single step of 1,764 s returns |r| = 2.39e9 km
   where the truth is 4.635e5 km, with the orbital energy off by 100%. A step
   of 1,000 s is exact to 1e-9 km and one of 3,529 s to 1e-10; the divergence
   sits in a band and depends on the starting radius as much as on dt, which is
   why it looks like a warp-dependent coin toss from the outside.

   A finite wrong answer is worse than no answer, because nothing downstream
   can tell. So the residual is checked and handed back. `propagate` is what
   turns a failure into a correct result.                                   */
const KEPLER_TOL = 1e-9;       // on |F| relative to the step's own scale
function keplerStep(r0v, v0v, mu, dt) {
  const r0 = V.len(r0v), v0 = V.len(v0v);
  const vr0 = V.dot(r0v, v0v) / r0;
  const alpha = 2/r0 - v0*v0/mu;           // 1/a
  const sq = Math.sqrt(mu);

  let x;
  if (alpha > 1e-10) {                      // ellipse
    x = sq * dt * alpha;
  } else if (alpha < -1e-10) {              // hyperbola
    const a = 1/alpha;
    x = Math.sign(dt) * Math.sqrt(-a) * Math.log(
      (-2*mu*alpha*dt) /
      (V.dot(r0v,v0v) + Math.sign(dt)*Math.sqrt(-mu*a)*(1 - r0*alpha)) );
    if (!isFinite(x)) x = Math.sign(dt) * Math.sqrt(-a);
  } else {                                  // near-parabolic
    x = sq * dt / r0;
  }

  for (let i = 0; i < 80; i++) {
    const z = alpha*x*x, C = stumpffC(z), S = stumpffS(z);
    const F  = r0*vr0/sq*x*x*C + (1-alpha*r0)*x*x*x*S + r0*x - sq*dt;
    const dF = r0*vr0/sq*x*(1 - alpha*x*x*S) + (1-alpha*r0)*x*x*C + r0;
    if (Math.abs(dF) < 1e-14) break;
    const d = F/dF;
    x -= d;
    if (Math.abs(d) < 1e-9) break;
  }

  const z = alpha*x*x, C = stumpffC(z), S = stumpffS(z);
  // The residual of the very equation Newton was solving, measured against the
  // size of the terms that make it up. Scaling by those terms rather than by a
  // fixed number is what makes one tolerance work for a 6,771 km parking orbit
  // and a 228,000,000 km heliocentric cruise alike.
  const F     = r0*vr0/sq*x*x*C + (1-alpha*r0)*x*x*x*S + r0*x - sq*dt;
  const scale = Math.max(Math.abs(sq*dt), Math.abs(r0*x),
                         Math.abs(r0*vr0/sq*x*x*C), Math.abs((1-alpha*r0)*x*x*x*S), 1e-30);
  const f = 1 - x*x/r0*C;
  const g = dt - x*x*x/sq*S;
  const R = V.add(V.mul(r0v,f), V.mul(v0v,g));
  const rm = V.len(R);
  const fd = sq/(rm*r0) * (alpha*x*x*x*S - x);
  const gd = 1 - x*x/rm*C;
  const Vv = V.add(V.mul(r0v,fd), V.mul(v0v,gd));
  const good = isFinite(R.x) && isFinite(R.y) && isFinite(Vv.x) && isFinite(Vv.y)
            && isFinite(F) && Math.abs(F) <= KEPLER_TOL * scale;
  return { r:R, v:Vv, ok:good };
}

/** Propagate, and never hand back a step that did not converge.
    Sub-stepping is the fallback because the failure is in Newton's starting
    guess, not in the physics: halve the interval and each half starts from a
    better guess. Measured on the Mars flyby, every failure in the band clears
    at two sub-steps, and the loop is capped so a pathological case ends as the
    old code did — with the state unchanged — rather than hanging. */
const KEPLER_SPLIT_MAX = 4096;
let keplerSplits = 0;          // how often the fallback has been needed
function propagate(r0v, v0v, mu, dt) {
  if (dt === 0) return { r:{...r0v}, v:{...v0v} };
  const one = keplerStep(r0v, v0v, mu, dt);
  if (one.ok) return { r:one.r, v:one.v };
  for (let n = 2; n <= KEPLER_SPLIT_MAX; n *= 2) {
    const h = dt/n;
    let r = {...r0v}, v = {...v0v}, bad = false;
    for (let i = 0; i < n; i++) {
      const p = keplerStep(r, v, mu, h);
      if (!p.ok) { bad = true; break; }
      r = p.r; v = p.v;
    }
    if (!bad) { keplerSplits++; return { r, v }; }
  }
  return { r:{...r0v}, v:{...v0v} };
}

/* ---- orbital elements from a state vector ------------------ */
function elements(r0v, v0v, mu) {
  const r = V.len(r0v), v = V.len(v0v);
  const h = V.crs(r0v, v0v);                       // scalar in-plane
  const en = v*v/2 - mu/r;
  const a  = Math.abs(en) < 1e-12 ? Infinity : -mu/(2*en);
  const evx = ((v*v - mu/r)*r0v.x - V.dot(r0v,v0v)*v0v.x)/mu;
  const evy = ((v*v - mu/r)*r0v.y - V.dot(r0v,v0v)*v0v.y)/mu;
  const e  = Math.hypot(evx, evy);
  const argp = Math.atan2(evy, evx);
  const dir = h >= 0 ? 1 : -1;
  // true anomaly: angle from the eccentricity vector to r, measured along motion
  const nu = normAngle(dir * (Math.atan2(r0v.y, r0v.x) - argp));
  const p  = h*h/mu;
  const rp = (e < 1) || a < 0 ? a*(1-e) : p/(1+e);
  const ra = e < 1 ? a*(1+e) : Infinity;
  const period = e < 1 && a > 0 ? TAU*Math.sqrt(a*a*a/mu) : Infinity;
  return { r, v, h, a, e, argp, dir, nu, rp, ra, period, energy:en, p,
           vr: V.dot(r0v,v0v)/r };
}
function normAngle(x){ x %= TAU; return x < 0 ? x + TAU : x; }

/* ---- time until next periapsis / apoapsis ------------------ */
function timeToAnomaly(el, mu, targetNu) {
  if (!(el.e < 1) || !(el.a > 0)) return Infinity;
  const M = (nu) => {
    const E = 2*Math.atan2(Math.sqrt(1-el.e)*Math.sin(nu/2), Math.sqrt(1+el.e)*Math.cos(nu/2));
    return E - el.e*Math.sin(E);
  };
  const n = Math.sqrt(mu/(el.a*el.a*el.a));
  let dM = normAngle(M(targetNu) - M(el.nu));
  return dM / n;
}
/**
 * Time to the next periapsis. Handles hyperbolic arcs too — which is the whole
 * point, because every interplanetary arrival is hyperbolic and the capture
 * burn has to be scheduled at its periapsis.
 */
function tToPeri(el, mu) {
  if (el.e < 1 && el.a > 0) return timeToAnomaly(el, mu, 0);
  if (el.e > 1) {
    let nu = el.nu > Math.PI ? el.nu - TAU : el.nu;      // signed, -π..π
    const k = Math.sqrt((el.e - 1)/(el.e + 1)) * Math.tan(nu/2);
    if (Math.abs(k) >= 1) return Infinity;               // beyond the asymptote
    const H = 2 * Math.atanh(k);
    const M = el.e * Math.sinh(H) - H;
    const n = Math.sqrt(mu / Math.pow(-el.a, 3));
    const dt = -M / n;                                   // M < 0 inbound
    return dt > 1e-9 ? dt : Infinity;
  }
  return Infinity;
}
const tToApo = (el,mu) => timeToAnomaly(el, mu, Math.PI);

/* ---- circular / escape speeds ------------------------------ */
const vCirc = (mu,r) => Math.sqrt(mu/r);
const vAtR  = (mu,r,a) => Math.sqrt(Math.max(0, mu*(2/r - 1/a)));
</script>

<script>
/* ============================================================

   ============================================================ */
const SHIELD_LOAD = 90e6;      // J/m² the ablator can absorb before it is gone
const SHIELD_RATE = 420e3;     // W/m² it cannot take for an instant

const S = {
  t: 0, soi: 'EARTH', r:{x:0,y:0}, v:{x:0,y:0},
  warp: 1, paused: true,
  att: 'PRO', burn: null, sched: null,
  target: null, objects: [],
  mission: null, objectives: [], status: 'idle',
  craft: { name:'—', dry:2200, fuel:0, fuelMax:0, thrust:0, isp:311,

  away: null, landed: false, surf: null,

/* ---- coming home -------------------------------------------------------
   Two numbers make an entry corridor, and neither of them is hull temperature.
   Measured across the whole flyable band of deorbit burns, the hull reading

   nothing about how hard the entry was, and it belongs to M-09 anyway, which
   uses it for a bus limit at 180 °C.

   What does discriminate, measured from the 400 km station orbit:
     - TOTAL HEAT LOAD, 143.7 MJ/m² aiming at 138 km down to 25.4 at −1500 km.
       Shallow is worse: you skim, exit, come round and pay again every lap.
     - PEAK HEATING RATE, 310 kW/m² shallow up to 561 steep. Steep is worse.
   So the shield carries a budget it spends and a rate it cannot survive, and
   between them sits a corridor about 73 m/s of deorbit ΔV wide.             */
function freshShield() {
  return { fitted:false, load:0, cap:SHIELD_LOAD, rateLimit:SHIELD_RATE,
           rate:0, peak:0, gone:false, warned:0 };
}

/* Chutes are drag area and nothing more exotic: they multiply `cda`, which
   already routes through the RK4 integrator because `inAtmosphere()` sends it
   there. The envelope is the interesting part, and it is measured.

   is subsonic and sitting on its terminal velocity — so a q gate DOWN THERE
   can never be broken and would be dead code. Altitude arms the chute; q is
   only ever the tear-away. The mains' 0.80 kPa ceiling is the one that makes
   the drogue compulsory: without it the vehicle is still at 1.86 kPa passing

const CHUTES = {
  DROGUE: { label:'DROGUE', arm: 25, area: 110,  qTear: 3000, infl: 4 },
  MAIN:   { label:'MAINS',  arm: 6,  area: 1100, qTear: 800,  infl: 8 },
};
function freshChutes() {
  return { DROGUE: { state:'STOWED', t:0 }, MAIN: { state:'STOWED', t:0 } };
}
/** Drag area the canopies are adding right now, m². Zero unless one is out. */
function chuteArea() {
  let a = 0;
  for (const id in CHUTES) {
    const c = S.chute[id];
    if (!c || c.state !== 'OUT') continue;
    a += CHUTES[id].area * Math.min(1, c.t / CHUTES[id].infl);   // inflating takes time
  }

}

/* ---- docking state ----------------------------------------------------
   `phase` walks FREE → SOFT → RETRACT → RETRACTED → LATCHING → HARD, and the
   four utility groups hang off a hard dock. Everything here is plain state
   the pages read; nothing is derived on the fly. */
function freshDock() {
  return {
    phase: 'FREE', leg: null,
    misalign: 0, misalign0: 0, sign: 1, offset: 0,
    ring: 0, latches: 0, latching: false,
    auto: false, autoT: 0, attempts: 0, bounces: 0, passed: false,
    vest: { valve:false, press:0, check:-1, decay:0, leak:0, verdict:null, leakOk:false, hatch:false },
    reseats: 0,
    pwr:  { umb:false, tie:false },
    air:  { duct:false, fan:false },
    prop: { line:false, purge:0, purged:false, xfer:false, moved:0, done:false },

    // open hatch the air duct does. `moving` is OUT (delivering) or IN

    cargo: { moving:null, out:0, in:0, done:false },

/* ---- systems: the cold-start dependency graph --------------------------
   Every mission used to boot with everything already running. Now each system
   has prerequisites, a warm-up and a power draw, and a mission declares which
   of them it starts with. A warm mission is one that starts with all of them
   ON — the two ends of one mechanism, so there is exactly one code path and a
   warm vehicle is just a cold start that is already finished.

   Per system: OFF → START (counting its warm-up) → ON, or FAULT if its supply
   is pulled out from under it. `draw` is watts on the bus once ON.

   The draws below ITEMISE the old model; they do not add to it. The bus load
   of a warm vehicle used to be a flat 120 W "avionics floor" plus 140 W of
   heaters and 80 W of transmitter, and it still is: the five systems that draw
   anything sum to exactly that 120 W on a crewed vehicle, and to 95 W on one
   with no life support to run. A warm mission's power margin therefore does
   not move by a single watt.

   That constraint is not fussiness. The first version of this gave every new
   system a realistic-looking draw, which took a warm crewed vehicle from 340 W
   to 555 W — and M-05 promptly died on the way to the Moon. Its translunar
   coast passes through three and a half hours of Earth's shadow, which 1800 Wh

const BUS_FLOOR   = 0.02;     // fraction of the pack the main bus may not draw below

const SYSTEMS = [
  { id:'BATT',  name:'BATTERY',           tag:'BATT', needs:[],       warm:0,          draw:0,
    note:'Mechanical tie. Needs nothing, and nothing works without it.' },
  { id:'BUS',   name:'MAIN BUS',          tag:'BUS',  needs:['BATT'], warm:8,          draw:10,
    note:'Distribution contactors. Everything else hangs off this.' },
  { id:'AVIO',  name:'AVIONICS',          tag:'AVIO', needs:['BUS'],  warm:45,         draw:45,
    note:'Flight computer and navigation. No avionics, no numbers.' },
  { id:'ARRAY', name:'SOLAR ARRAY',       tag:'ARRY', needs:['BUS'],  warm:75,         draw:0, run:60,
    note:'Deployment motors. Stowed arrays generate nothing, sunlit or not.' },
  { id:'THERM', name:'THERMAL LOOP',      tag:'THRM', needs:['BUS'],  warm:25,         draw:0,
    note:'Coolant pumps and heaters.' },
  { id:'ECLSS', name:'LIFE SUPPORT',      tag:'ECLS', needs:['BUS'],  warm:40,         draw:25, crew:true,
    note:'Cabin loop and CO₂ scrubbers. Off, the crew are on emergency oxygen.' },
  { id:'ATT',   name:'ATTITUDE CONTROL',  tag:'ATT',  needs:['AVIO'], warm:20,         draw:0,
    note:'Reaction wheels. Draws only while the vehicle is turning.' },
  { id:'GNC',   name:'GUIDANCE PLATFORM', tag:'GNC',  needs:['ATT'],  warm:ALIGN_TIME, draw:30,
    note:'Inertial platform. Aligns only while the vehicle is held steady.' },
  { id:'PRESS', name:'PROPULSION',        tag:'PRSS', needs:['AVIO'], warm:50,         draw:10,
    note:'Tank pressurisation. Unpressurised, neither the engine nor RCS fires.' },
  { id:'COMM',  name:'TRANSMITTER',       tag:'COMM', needs:['AVIO'], warm:30,         draw:0,
    note:'S-band transmitter and its amplifier.' },
];

for (const d of SYSTEMS) SYSDEF[d.id] = d;
const SYSIDS = SYSTEMS.map(d => d.id);

/** Is this system fitted to this vehicle at all? (No crew, no life support.) */
const sysFitted = (id) => !(SYSDEF[id].crew && !S.craft.crew);
/** Running and usable. Anything that asks "can I do this yet" asks this. */
const sysOn = (id) => !!(S.sys[id] && S.sys[id].state === 'ON');

function sysBlocker(id) {
  for (const n of SYSDEF[id].needs) if (!sysOn(n)) return n;
  return null;
}

/** Put every system into a named state. `on` is the list that starts running;
 *  omitted means all of them, which is how every warm mission boots. */
function sysBoot(on) {
  const all = on === undefined;
  const set = new Set(all ? SYSIDS : on);
  S.sys = {}; S.pwrUp = false; S.aligning = false;
  for (const d of SYSTEMS) {
    const live = sysFitted(d.id) && set.has(d.id);
    S.sys[d.id] = { state: live ? 'ON' : 'OFF', t: live ? d.warm : 0,
                    drift: live ? 0 : ALIGN_DRIFT };
  }
}

/** Begin a start-up. Returns a refusal string, or null if it took. */
function sysStart(id) {
  const d = SYSDEF[id];
  if (!d) return `No system "${id}".`;
  if (!sysFitted(id)) return `${d.name} is not fitted to this vehicle.`;
  const s = S.sys[id];
  if (s.state === 'ON') return `${d.name} is already running.`;
  if (s.state === 'START') return `${d.name} is already starting.`;
  const block = sysBlocker(id);
  if (block) return `${d.name} needs ${SYSDEF[block].name} first — it has no supply until that is running.`;
  s.state = d.warm > 0 ? 'START' : 'ON'; s.t = 0;
  if (id === 'GNC') { s.drift = ALIGN_DRIFT; s.disturbed = false; S.aligning = true; }
  return null;

/** Shut a system down, and everything standing on it. */
function sysStop(id, why) {
  const s = S.sys[id];
  if (!s || s.state === 'OFF') return;
  s.state = 'OFF'; s.t = 0;
  if (id === 'GNC') { s.drift = ALIGN_DRIFT; S.aligning = false; }
  for (const d of SYSTEMS) if (d.needs.includes(id) && sysState(d.id) !== 'OFF') sysStop(d.id, why);

/** The bus collapses. Everything downstream of the battery drops, and the
 *  guidance platform loses its alignment with it — which is the real cost of
 *  switching on more than the battery can carry. */
function tripBus() {
  if (sysState('BUS') === 'OFF') return;

  for (const id of SYSIDS) if (id !== 'BATT') sysStop(id);
  S.pwrUp = false;

  // the main bus was never allowed to spend. It is what a separate essential
  // battery would be, and it is the reason a collapse is expensive rather than
  // terminal: a vehicle that flattened itself with the arrays still stowed can
  // always close the bus again and get them out. Twenty-five watts of bus and
  // sixty of deployment motors run for a quarter of an hour on it; deployment
  // takes seventy-five seconds.
  S.power.batt = Math.max(S.power.batt, S.power.battMax * BUS_FLOOR);
  say('BUS TRIP · battery collapsed under the load. Every system downstream of the battery has dropped'
      + (lost ? ', and the guidance platform has lost its alignment.' : '.')
      + ' Shed what you do not need, get the arrays into sunlight, and bring it back up.', 'err');

/** Warm-ups, alignment and the auto power-up sequence.
 *
 *  Every one of these is a countdown, not a controller, so it settles exactly
 *  inside whatever chunk advance() hands it — there is nothing here to diverge
 *  at the Kepler chunk scale. advance() still bounds the chunk while anything
 *  is starting, so a warm-up is not charged a hundred seconds of draw for a
 *  forty-five second start. Warm missions have nothing starting, so that bound
 *  never applies to them. */
function stepSys(dt) {
  for (const d of SYSTEMS) {
    const s = S.sys[d.id];
    if (!s || s.state !== 'START') continue;
    const block = sysBlocker(d.id);
    if (block) { sysStop(d.id); say(`${d.name} DROPPED · ${SYSDEF[block].name} is no longer running.`, 'warn'); continue; }
    if (d.id === 'GNC') {
      // A platform aligns against a steady vehicle. Turn while it is working
      // and you push it back — the drift climbs and you watch it climb.
      if (S.att.slewing) {
        s.t = Math.max(0, s.t - dt * 3);
        if (!s.disturbed) { s.disturbed = true;
          say('PLATFORM DISTURBED · the vehicle is turning under the alignment. Watch the drift climb — hold the attitude steady and it will settle again.', 'warn'); }
      } else { s.t += dt; s.disturbed = false; }
      s.drift = ALIGN_DRIFT * Math.exp(-5.5 * s.t / d.warm);
      if (s.t >= d.warm) {
        s.t = d.warm; s.drift = 0; s.state = 'ON'; S.aligning = false;
        say(`GUIDANCE PLATFORM ALIGNED · residual drift under ${ALIGN_OK.toFixed(2)} °/h. Attitude hold and the engine are available.`, 'ok');
      }
      continue;
    }
    s.t += dt;
    if (s.t >= d.warm) { s.t = d.warm; s.state = 'ON'; say(`${d.name} ON LINE.`, 'ok'); }
  }
  // Auto sequence: start whatever is legal next. It takes the full time — this
  // is a convenience for a second flight, not a way to skip the first one.
  if (S.pwrUp) {
    let left = false;
    for (const d of SYSTEMS) {
      if (!sysFitted(d.id)) continue;
      const st = sysState(d.id);
      if (st === 'ON') continue;
      left = true;
      if (st === 'OFF' && !sysBlocker(d.id)) sysStart(d.id);
    }
    if (!left) { S.pwrUp = false; say('POWER-UP SEQUENCE COMPLETE · all systems on line.', 'ok'); }
  }
}

/** Push an alignment in progress back by `secs` of settling. Thruster firings
 *  and slews both do it; the drift on the page climbs and you watch it climb. */
function disturbAlign(secs, why) {
  const s = S.sys.GNC;
  if (!s || s.state !== 'START' || !(secs > 0)) return;
  s.t = Math.max(0, s.t - secs);
  s.drift = ALIGN_DRIFT * Math.exp(-5.5 * s.t / ALIGN_TIME);
  say(`PLATFORM DISTURBED · ${why} with the alignment running. Residual drift back up to ${s.drift.toFixed(2)} °/h, ${fmtT(ALIGN_TIME - s.t)} to go.`, 'warn');
}

sysBoot();     // nothing is loaded yet; a warm vehicle is the resting state

/** Seconds of alignment left, or 0. Projected the way the leak check is. */
function alignLeft() {
  const s = S.sys.GNC;
  if (!s || s.state !== 'START') return 0;
  return Math.max(0, ALIGN_TIME - s.t);
}

/* Cargo is mass like any other mass. It rides in `craftMass` beside the
   propellant, so every formula that already weighed the vehicle — the solver,
   the ΔV remaining, the thrust-to-weight, the ascent — feels it without being
   told about it. It defaults to 0 and `x + 0 === x` exactly, which is why a
   vehicle carrying none flies bit-for-bit as it did before this existed. */
const craftMass = () => S.craft.dry + S.craft.fuel + S.craft.rcs + (S.craft.cargo || 0);
const soiBody = () => BODIES[S.soi];

/* ---- throttle, ambient pressure and the engine it feeds -----------------
   Three things can now scale the engine: the throttle, the stage that is
   lit, and the air pressure around the nozzle. All three collapse to nothing
   on a vehicle that declares none of them:
     - `S.throttle` is 1 unless somebody set it, and x*1 === x exactly;
     - `thrustSL`/`ispSL` exist only on a stage built to fly through air, so
       everything else returns its own `thrust` and `isp` untouched;
     - above the atmospheric interface the pressure fraction is exactly 0,
       which is where every shipped mission burns.
   That is why the arrival geometry of nine flown missions does not move.   */
function ambientFrac() {
  const b = soiBody();
  if (!b.rho0) return 0;
  return airPressure(b, V.len(S.r) - b.R);
}
/** Engine thrust right now, kN — stage, throttle and back-pressure included. */
function curThrust() {
  const c = S.craft;
  const t = c.thrustSL != null ? c.thrustSL + (c.thrust - c.thrustSL) * (1 - ambientFrac()) : c.thrust;
  return t * S.throttle;
}
/** Specific impulse right now, s. A first stage loses ~10% of it at the pad. */
function curIsp() {
  const c = S.craft;
  return c.ispSL != null ? c.ispSL + (c.isp - c.ispSL) * (1 - ambientFrac()) : c.isp;
}
/** Propellant flow at the current throttle, kg/s. */
const curFlow = () => curThrust() * 1000 / (curIsp() * G0);

const dvRemaining = () => {
  const m0 = craftMass(), m1 = m0 - S.craft.fuel;
  return m1 <= 0 ? 0 : S.craft.isp * G0 * Math.log(m0/m1);   // m/s
};

/* ---- staging ------------------------------------------------------------
   A stack is a list of stages, each with its own dry mass, propellant, thrust
   and Isp; `payload` is what is left when the last of them is gone. Only the
   lit stage's numbers live in `S.craft`, so every existing formula — mass,
   flow, ΔV remaining, the solver — reads what it always read. The mass of the
   stages still above the lit one is carried in `S.craft.dry`, which is exactly
   what they are from the lit engine's point of view: dead weight.

   Vehicles without a stack have `stages` undefined and never touch any of it. */
function loadStage(i) {
  const c = S.craft, st = c.stages[i];
  let upper = 0;
  for (let k = i + 1; k < c.stages.length; k++) upper += c.stages[k].dry + c.stages[k].fuel;
  c.stageIx = i;
  c.dry = c.payload + st.dry + upper;
  // A stage's capacity is its load unless it says otherwise. Only a spacecraft
  // built to be filled in orbit says otherwise, so every launch stage — and
  // every vehicle that shipped before the depot existed — is unchanged.
  c.fuel = st.fuel; c.fuelMax = st.fuelMax != null ? st.fuelMax : st.fuel;
  c.thrust = st.thrust; c.isp = st.isp;
  c.thrustSL = st.thrustSL != null ? st.thrustSL : null;
  c.ispSL = st.ispSL != null ? st.ispSL : null;
  c.cda = st.cda != null ? st.cda : c.cdaPayload;
  c.qMax = st.qMax != null ? st.qMax : Infinity;
  c.stageName = st.name;
}
/** Jettison the lit stage. Whatever is left in its tanks goes with it. */
function jettisonStage() {
  const c = S.craft;
  if (!c.stages || c.stageIx == null) return 'This vehicle has no stages to drop.';
  if (c.stageIx >= c.stages.length - 1) return 'Last stage — this is the spacecraft itself.';
  const spent = c.stages[c.stageIx];
  const lost = spent.dry + Math.max(0, c.fuel);
  // Staging in the middle of an ascent is one event, not two: separation and
  // the next ignition. The first stage is usually already dry when the player
  // presses the key — the cutoff is what tells them to — so "still ascending"
  // cannot mean "the engine is still lit"; it means the ascent is not over.
  // Anywhere else this is just jettison, and nothing lights.
  const ascending = !!(S.burn && S.burn.ascent) || !!(S.pad && S.pad.lifted && !S.pad.meco);
  c.stages[c.stageIx].fuel = 0;
  if (S.burn) endBurn(ascending ? 'STAGING' : 'MECO — staging', 'key');
  loadStage(c.stageIx + 1);
  S.ledger.stages = (S.ledger.stages || 0) + 1;
  say(`STAGE SEPARATION · ${spent.name} away, ${lost.toFixed(0)} kg gone. `
    + `${c.stageName} is live: ${(curThrust()*1000).toFixed(0)} N on ${craftMass().toFixed(0)} kg.`, 'key');
  if (ascending && c.fuel > 0 && !c.stages[c.stageIx].spacecraft) {
    S.burn = { dir: 'INRT', left: Infinity, total: Infinity, ascent: true };
    say('SECOND STAGE IGNITION · guidance still has the pitch program.', 'key');
  }
  return null;
}

/* ---- drag ---------------------------------------------------------------
   F = ½ ρ v² Cd·A, opposing the velocity RELATIVE TO THE AIR. The air turns
   with the body, which is not a detail: a vehicle standing on the pad is doing
   465 m/s in the inertial frame this simulation works in, and charging it with
   465 m/s of wind would be nonsense.                                        */
const ZEROV = { x:0, y:0 };
/** Velocity relative to the co-rotating atmosphere, km/s. */
function airRelative(rv, vv, b) {
  const w = b.rot || 0;
  return { x: vv.x + w * rv.y, y: vv.y - w * rv.x };
}
/** Drag acceleration in km/s², or exactly zero where there is no air. */
function dragAcc(rv, vv, mass) {
  const b = soiBody();
  const rho = airDensity(b, V.len(rv) - b.R);
  if (rho <= 0) return ZEROV;
  // The canopies are part of the drag area while they are out and add exactly
  // zero while they are stowed, which is every vehicle that shipped before.
  const cda = (S.craft.cda || 0) + chuteArea();
  if (cda <= 0) return ZEROV;
  const rel = airRelative(rv, vv, b);
  const vm = V.len(rel);
  if (vm <= 1e-12) return ZEROV;
  const vms = vm * 1000;
  const a = 0.5 * rho * vms * vms * cda / Math.max(mass, 1);     // m/s²
  return V.mul(rel, -a / 1000 / vm);                              // km/s², along -v̂
}
/** Dynamic pressure on the vehicle right now, Pa. Zero in vacuum. */
function dynPressure() {
  const b = soiBody();
  const rho = airDensity(b, V.len(S.r) - b.R);
  if (rho <= 0) return 0;
  const vms = V.len(airRelative(S.r, S.v, b)) * 1000;
  return 0.5 * rho * vms * vms;
}
/** True while the vehicle is inside an atmosphere, where Kepler does not hold. */
function inAtmosphere() {
  const b = soiBody();
  return !!b.rho0 && (V.len(S.r) - b.R) < b.atmo;
}
const el = () => elements(S.r, S.v, soiBody().mu);

/* ---- derived telemetry, recomputed each frame -------------- */
let D = {};
function derive() {
  const b = soiBody(), e = el();
  const alt = e.r - b.R;
  const sunR = absState(S.soi, S.t).r;                    // body position w.r.t. Sun
  const craftSun = V.add(sunR, S.r);
  const dSun = Math.max(1, V.len(craftSun));
  const flux = 1361 * (AU/dSun)**2;                       // W/m^2

  // eclipse: craft on the far side of its primary from the Sun, inside the shadow cylinder
  let ecl = false;
  if (S.soi !== 'SUN') {
    const toSun = V.unit(V.mul(sunR, -1));                // body -> Sun
    const along = V.dot(S.r, toSun);
    const perp  = Math.abs(V.crs(S.r, toSun));
    ecl = along < 0 && perp < b.R;
  }
  // Stowed arrays generate nothing, sunlit or not — deployment is a step in
  // the power-up, not scenery. Nor does anything come through a fairing: on
  // the pad and all the way up, the battery is the only source there is.
  const gen = (ecl || S.fairing || !sysOn('ARRAY')) ? 0 : flux * S.power.area * S.power.eff;
  // Tied to the station, its bus carries the vehicle and the battery stops
  // working. This is the visible payoff of the power hookup.
  const tie = S.dock.pwr.tie ? (S.craft.stationSupply || 2000) : 0;
  S.power.tie = tie;
  // The bus load is now whatever is actually running. The three switched loads
  // that existed before keep their exact draws and hang off their equipment:
  // a warm vehicle still carries 120 W of avionics, 140 W of heaters and 80 W
  // of transmitter, plus the systems this item added.
  let load = 0;
  for (const d of SYSTEMS) {
    const st = sysState(d.id);
    if (st === 'ON') load += d.draw;
    else if (st === 'START') load += (d.run != null ? d.run : d.draw);
  }
  if (sysOn('THERM') && S.loads.HEAT) load += 140;
  if (sysOn('COMM')  && S.loads.COMM) load += 80;
  if (sysOn('BUS')   && S.loads.SCI)  load += 210;
  if (S.burn) load += 60;
  if (S.att.slewing) load += S.craft.slewPower || 90;   // reaction wheels
  S.power.gen = gen; S.power.load = load;

  const earth = absState('EARTH', S.t).r;
  const dEarth = V.len(V.sub(V.add(sunR, S.r), earth));
  const q = dynPressure();
  return D = {
    e, b, alt, dSun, flux, ecl, gen, load, tie,
    q, rho: airDensity(b, alt),
    // airspeed is what drag and heating see: the air turns with the planet
    vAir: V.len(airRelative(S.r, S.v, b)),
    twr: craftMass() > 0 ? curThrust() * 1000 / (craftMass() * G0) : 0,
    pitch: S.pad ? currentPitch() : null,
    dEarth, lightTime: dEarth / 299792.458,
    apoAlt: e.ra === Infinity ? Infinity : e.ra - b.R,
    perAlt: e.rp - b.R,
    tPeri: tToPeri(e, b.mu), tApo: tToApo(e, b.mu),
    dv: dvRemaining(),
    escape: e.e >= 1,
  };
}

/* ---- life support ------------------------------------------
   Scrubbing CO₂ and making oxygen are two different jobs, and conflating them
   is why a tank used to be the thing that limited a flight.

   A lithium hydroxide canister takes CO₂ out of the air and produces no oxygen
   at all. That is Apollo, and it is why Apollo still carried tanks. What this
   vehicle carries is the other kind: a REGENERATIVE loop — electrolysis of
   water for oxygen, with the CO₂ reduced to recover the oxygen bound up in it
   and give the water back. It does not consume a stored gas. It consumes
   POWER, and it is fitted to every crewed vehicle in the game, because every
   crewed vehicle in the game is meant to be able to go somewhere.

   So the tank stops being the clock on the mission and becomes what it is on a
   real spacecraft: a reserve. It is spent when the loop is not running — off,
   or the bus tripped, or still warming up — and it is spent on cycling the
   vestibule. Which means the oxygen clock only starts when the POWER stops,
   and a bus trip three years from home is a different kind of frightening than
   a number that was always counting down anyway.

   The open-loop rate is unchanged at four crew-hours an hour. Without the loop
   there is no scrubbing either, so cabin air has to be flushed and replaced
   rather than cleaned — the reserve goes four times faster than the crew
   actually breathe. Nothing about a shipped mission's emergency got easier. */
const ECLSS_OPEN_RATE = 4;     // crew-hours of reserve per crew per hour, loop down
/** True while the regenerative loop is closed and the tank is not being touched. */
function eclssClosed() { return sysOn('ECLSS'); }
/** Crew-hours of reserve spent per crew per hour, right now. */
function o2Rate() { return S.dock.air.fan ? 0 : (eclssClosed() ? 0 : ECLSS_OPEN_RATE); }

/* ---- power / thermal integration --------------------------- */
/** Effective nose radius, m. Bluntness is what a heat shield buys you. */
const HEAT_NOSE = 4;
function stepSystems(dt) {
  const net = (S.power.gen + S.power.tie - S.power.load) * dt / 3600;   // Wh
  S.power.batt = Math.max(0, Math.min(S.power.battMax, S.power.batt + net));
  // Draw more than the battery can carry and the bus lets go. This is the one
  // genuine failure in the power-up; everything else simply refuses.
  //
  // The main bus cannot draw the pack below a protected reserve — which is why
  // a collapse is expensive rather than terminal. Without it a vehicle that
  // flattened its battery with the arrays still stowed could never deploy
  // them, and "nothing is unrecoverable" would stop being true.
  if (S.power.batt <= 0 && net < 0) tripBus();
  stepSys(dt);
  // Breathing costs nothing while the loop is closed and nothing while the
  // station's air is ducted through the hatch. It costs the reserve the moment
  // either stops — which is what makes ECLSS part of the power-up rather than
  // just another switch, and what ties the crew's survival to the bus.
  if (S.craft.crew && !S.dock.air.fan) {
    S.craft.o2 = Math.max(0, S.craft.o2 - S.craft.crew * o2Rate() * dt / 3600);
  }
  // radiative equilibrium, relaxed
  let eq = Math.pow(Math.max(D.flux,1) * 0.28 / (4 * 5.670374e-8 * 0.85), 0.25) - 273.15;
  let tau = 5400;
  // Air does what sunlight cannot. Convective heating at the stagnation point
  // goes as sqrt(rho)·v³ (Sutton-Graves), which is why entry speed matters so
  // much more than entry density: half the speed is an eighth of the heating.
  // The hull follows it on a minute's time constant rather than an hour and a
  // half — an entry is over in five minutes, and a lag of 5400 s would let a
  // vehicle sail through a fireball without noticing it.
  //
  // In vacuum q is exactly zero, this whole block is skipped, and the line
  // below is the arithmetic that was here before, unchanged.
  // A launch vehicle climbs inside a fairing, and the fairing is the thing
  // that gets hot: it is thrown away before it matters. That is the whole
  // asymmetry between going up and coming down — on the way up the vehicle is
  // shielded and the air is behind it in four minutes; on the way down it is
  // bare, and this is what kills it.
  const sh = S.shield;
  if (D.q > 0 && D.rho > 0 && !S.fairing) {
    const vms = D.vAir * 1000;
    const qdot = 1.7415e-4 * Math.sqrt(D.rho / HEAT_NOSE) * vms * vms * vms;    // W/m²
    // The shield spends itself absorbing this. `checkHazards` is what judges
    // the two limits; this is only the accounting, so a lost flight and a
    // survived one are decided in exactly one place.
    if (sh.fitted) {
      sh.rate = qdot;
      if (qdot > sh.peak) sh.peak = qdot;
      if (!sh.gone) sh.load += qdot * dt;
    }
    // An intact shield is what the hull is hiding behind. Once it is gone the
    // vehicle is bare and the arithmetic below is the arithmetic that has
    // always been here — which is how burning through kills you.
    if (!(sh.fitted && !sh.gone)) {
      const aero = Math.pow(qdot / (0.85 * 5.670374e-8), 0.25) - 273.15;
      if (aero > eq) { eq = aero; tau = 45; }
    }
  } else if (sh.fitted) sh.rate = 0;
  const k = 1 - Math.exp(-dt / tau);
  S.therm.hull += (eq - S.therm.hull) * k;
  stepChutes(dt);
}

/* ---- the canopies -------------------------------------------------------
   A chute takes seconds to inflate and pulls harder the further it opens, so
   `chuteArea` ramps it in. Two things can go wrong and both are real: too much
   dynamic pressure tears it off the risers, and too little altitude leaves it
   still inflating when the water arrives.                                   */
function stepChutes(dt) {
  for (const id in CHUTES) {
    const c = S.chute[id], def = CHUTES[id];
    if (!c || c.state !== 'OUT') continue;
    c.t += dt;
    if (D.q > def.qTear) {
      c.state = 'TORN';
      say(`${def.label} TORN AWAY · ${(D.q/1000).toFixed(2)} kPa against a ${(def.qTear/1000).toFixed(2)} kPa limit. `
        + (id === 'MAIN' ? 'The mains will not take the airstream this high — the drogue is what slows you enough to stream them.'
                         : 'Too fast, too early. That canopy is gone.'), 'err');
    }
  }
}
/** Stream a canopy, or say exactly why not. Returns null when it deployed. */
function deployChute(id) {
  const def = CHUTES[id], c = S.chute[id];
  if (!def) return 'No such canopy.';
  if (c.state === 'OUT') return `${def.label} already streamed.`;
  if (c.state === 'TORN') return `${def.label} were torn away — there is nothing left to stream.`;
  const b = soiBody();
  if (!b.rho0) return `No air to inflate a canopy in — ${b.name} has no atmosphere.`;
  // The canopies ride up under the fairing, which is also why a vehicle
  // standing on the pad — at zero altitude, well inside every arming gate —
  // cannot stream one.
  if (S.fairing) return `${def.label} are stowed behind the fairing.`;
  const alt = V.len(S.r) - b.R;
  if (alt > def.arm) return `${def.label} ARMED BELOW ${def.arm} km — you are at ${alt.toFixed(1)} km.`;
  c.state = 'OUT'; c.t = 0;
  say(`${def.label} STREAMED at ${alt.toFixed(1)} km, ${(D.q/1000).toFixed(2)} kPa. `
    + `Full ${def.area} m² in ${def.infl} s; they come off above ${(def.qTear/1000).toFixed(2)} kPa.`, 'key');
  return null;
}

/* ---- thrust ------------------------------------------------ */
/* ---- attitude ------------------------------------------------------------
   The vehicle no longer points wherever the trajectory says. `mode` names a
   reference the autopilot chases; the nose slews toward it at a finite rate and
   spends RCS propellant doing so. Thrust comes out of the nose, so a burn that
   is commanded before the vehicle has turned simply waits.            */

/** The inertial heading `mode` currently asks for, in radians. */
function commandedTheta(mode) {
  const m = mode || S.att.mode;
  const ang = (v) => Math.atan2(v.y, v.x);
  switch (m) {
    case 'PRO':  return ang(S.v);
    case 'RET':  return ang(S.v) + Math.PI;
    case 'ROUT': return ang(S.r);
    case 'RIN':  return ang(S.r) + Math.PI;
    case 'TGT':  { const t = targetRel(); return t ? ang(t.r) : S.att.theta; }
    case 'ATGT': { const t = targetRel(); return t ? ang(t.r) + Math.PI : S.att.theta; }
    // Down the station's docking axis, nose-first into its port. The station
    // holds an Earth-facing attitude, so this reference turns at orbital rate
    // — 0.065°/s, which the autopilot tracks without noticing.
    case 'PAXS': { const g = dockGeom(); return g ? g.axisAngle + Math.PI : S.att.theta; }
    case 'INRT': return S.att.inertial;
    case 'FREE': return S.att.theta;
    default:     return ang(S.v);
  }
}
/** Signed shortest angle from a to b, in (-π, π]. */
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d <= -Math.PI) d += TAU; return d; }
/** Pointing error against the commanded attitude, radians. */
const attError = () => Math.abs(angDiff(S.att.theta, commandedTheta()));
const ALIGN_TOL = 0.5 * Math.PI/180;      // 0.5° counts as pointed

/** Seconds to slew `ang` radians from rest under a trapezoidal rate profile. */
function slewTime(ang, maxRate, accel) {
  ang = Math.abs(ang);
  const dAcc = maxRate * maxRate / (2 * accel);
  return ang <= 2 * dAcc ? 2 * Math.sqrt(ang / accel)
                         : 2 * (maxRate / accel) + (ang - 2 * dAcc) / maxRate;
}

/** Slew the vehicle toward its commanded attitude, charging RCS for the turn.
 *
 *  Note the sub-stepping. advance() hands this the Kepler chunk, which is
 *  deliberately coarse while coasting — hundreds of seconds. Integrating a
 *  bang-bang controller at that step diverges rather than converges, so when
 *  the whole slew fits inside the chunk it is settled analytically, and only a
 *  slew that outlasts the chunk is integrated. */
function stepAttitude(dt) {
  const a = S.att, c = S.craft;
  // Mated to a station the vehicle has no attitude of its own — the interface
  // holds it. stepDock places it each step.
  if (S.dock.phase !== 'FREE') { a.rate = 0; a.slewing = false; return; }
  // No wheels, no attitude control at all.
  //
  // Note that the platform is NOT checked here. Without an aligned platform
  // nothing can command a new reference — HOLD is refused and a cold vehicle
  // boots in FREE — but the wheels themselves still turn the vehicle, so an
  // autopilot that was already chasing a reference when the bus dropped goes
  // on chasing it the moment the wheels come back. That turning is exactly
  // what fouls the re-alignment that follows a bus trip, and HOLD FREE is the
  // way to stop it. Gating the wheels on the platform here would make that
  // interaction unreachable and the alignment impossible to disturb.
  if (!sysOn('ATT')) { a.rate = 0; a.slewing = false; return; }
  if (a.mode === 'FREE' || dt <= 0) { a.rate = 0; a.slewing = false; return; }
  const maxRate = c.slewRate || 4*Math.PI/180;
  const accel   = c.slewAccel || 2*Math.PI/180;
  // Turning is done on reaction wheels, which draw power rather than mass.
  // This is both what real spacecraft do and the only version that leaves the
  // vehicle's mass untouched: spending even 0.25 kg of propellant to turn
  // changes the injection by ~0.05 m/s, which over a 259-day transfer to Mars
  // is a 550,000 km miss.
  if (S.power.batt <= 0 && D.gen < D.load) { a.rate = 0; a.slewing = false; return; }

  const err0 = angDiff(a.theta, commandedTheta());
  const need = slewTime(err0, maxRate, accel) + Math.abs(a.rate) / accel;
  if (dt >= need) {                                    // settles within this chunk
    a.slewing = Math.abs(err0) > ALIGN_TOL;
    a.theta = commandedTheta();
    a.rate = 0;
    return;
  }
  a.slewing = true;
  const h = Math.min(0.25, dt);
  for (let t = 0; t < dt - 1e-9; t += h) {
    const step = Math.min(h, dt - t);
    const err = angDiff(a.theta, commandedTheta());
    const brake = (a.rate * a.rate) / (2 * accel);
    const want = Math.abs(err) <= brake ? 0
      : Math.sign(err) * Math.min(maxRate, Math.sqrt(2 * accel * Math.abs(err)));
    const dvr = want - a.rate;
    a.rate += Math.sign(dvr) * Math.min(Math.abs(dvr), accel * step);
    a.theta = normAngle(a.theta + a.rate * step);
  }
  // Snap once inside tolerance so thrust is exactly along the commanded
  // reference: a tracking lag would quietly shift every tested trajectory.
  if (Math.abs(angDiff(a.theta, commandedTheta())) < ALIGN_TOL) {
    a.theta = commandedTheta(); a.rate = 0; a.slewing = false;
  }
}

/** Thrust comes out of the nose. */
function thrustDir() {
  return { x: Math.cos(S.att.theta), y: Math.sin(S.att.theta) };
}

/* ---- docking ------------------------------------------------------------
   Both vehicles carry a port on a mast, so the nose angle and the port's
   position are coupled: a 10° misalignment swings this vehicle's port 0.43 m
   sideways. That coupling is the whole reason alignment matters — without a
   mast, pointing would be cosmetic.

   The station holds an Earth-facing attitude (nose along its velocity) and
   its port faces aft. So the approach runs up the velocity vector from
   behind, and a vehicle sitting on that line is in the SAME orbit as the
   station: it stays there for free. An inertially-fixed station would sweep
   its corridor a full turn every 92 minutes, which is not a corridor at all.  */
const PORT_ARM = 0.0025;        // km — this vehicle's port, 2.5 m ahead of the CoM
const PORT_ARM_STN = 0.006;     // km — the station's port, 6 m out from its centre
const DOCK_ENV = {
  closeClean: 0.10, closeMax: 0.15,       // m/s  closing at contact
  latClean:   0.10, latMax:   0.25,       // m    port-to-port miss distance
  rateClean:  0.02, rateMax:  0.05,       // m/s  lateral rate at contact
  alignClean: 4,    alignMax: 10,         // deg  nose vs the docking axis
  structure:  1.0,                        // m    beyond this you miss the ring entirely
};

/** The station this vehicle can dock with, or null. */
function dockTarget() {
  if (S.target !== 'STATION') return null;
  return S.objects.find(x => x.id === 'STATION' && x.soi === S.soi) || null;
}

/** Everything the approach is flown on, in metres and m/s.
 *
 *  `axial` is distance out along the station's port axis — zero is contact.
 *  `lateral` is the signed miss distance across it. `align` is the one angle
 *  this flat world has: there is no separate roll. */
function dockGeom() {
  const o = dockTarget();
  if (!o) return null;
  const stTheta = Math.atan2(o.v.y, o.v.x);            // station nose, along its velocity
  const axisAngle = stTheta + Math.PI;                 // its port faces aft
  const axis = { x: Math.cos(axisAngle), y: Math.sin(axisAngle) };
  const lat  = { x: -axis.y, y: axis.x };
  const wS = V.crs(o.r, o.v) / V.dot(o.r, o.r);        // Earth-facing ⇒ turns at orbital rate
  const armS = V.mul(axis, PORT_ARM_STN);
  const Ps = V.add(o.r, armS);
  const Vs = V.add(o.v, V.mul({ x:-armS.y, y:armS.x }, wS));
  const nose = { x: Math.cos(S.att.theta), y: Math.sin(S.att.theta) };
  const armC = V.mul(nose, PORT_ARM);
  const Pc = V.add(S.r, armC);
  const Vc = V.add(S.v, V.mul({ x:-armC.y, y:armC.x }, S.att.rate));
  const d = V.sub(Pc, Ps), dv = V.sub(Vc, Vs);
  const aKm = V.dot(d, axis), lKm = V.dot(d, lat);
  // Rates are taken in the PORT's frame, not an inertial one. The corridor
  // turns with the station at orbital rate, so a vehicle holding a constant
  // inertial velocity slides across it at wS × range — 0.013 m/s ten metres
  // out, most of the clean lateral-rate budget. Reported inertially, the
  // lateral rate does not match the lateral offset it is meant to be moving,
  // and capture would be judged against a rate the interface never sees.
  return {
    obj: o, axis, lat, axisAngle, stTheta, wS,
    axial: aKm * 1000, lateral: lKm * 1000,
    closing: -(V.dot(dv, axis) + wS * lKm) * 1000,
    latRate:  (V.dot(dv, lat)  - wS * aKm) * 1000,
    align: angDiff(S.att.theta, stTheta) * 180/Math.PI,
    corridor: Math.atan2(Math.abs(lKm), Math.max(aKm, 1e-12)) * 180/Math.PI,
    range: V.len(d) * 1000,
    ctrRange: V.len(V.sub(o.r, S.r)) * 1000,
  };
}

/** Spend RCS along a unit direction. The one place relative velocity changes. */
function rcsPulse(dirUnit, dvMs) {
  if (!(dvMs > 0)) return 0;
  const m0 = craftMass();
  const used = Math.min(S.craft.rcs, m0 * (1 - Math.exp(-dvMs/(S.craft.rcsIsp*G0))));
  S.craft.rcs = Math.max(0, S.craft.rcs - used);
  S.v = V.add(S.v, V.mul(dirUnit, dvMs/1000));
  return used;
}

/** Hold the vehicle on the interface. While mated it has no trajectory of its
 *  own — the station's structure carries it, so it is placed, not propagated. */
function mateToPort() {
  const o = dockTarget(); if (!o) return;
  const dk = S.dock;
  const stTheta = Math.atan2(o.v.y, o.v.x);
  S.att.theta = normAngle(stTheta + dk.sign * dk.misalign * Math.PI/180);
  S.att.rate = 0; S.att.slewing = false;
  const axis = { x: Math.cos(stTheta + Math.PI), y: Math.sin(stTheta + Math.PI) };
  const nose = { x: Math.cos(S.att.theta), y: Math.sin(S.att.theta) };
  S.r = V.sub(V.add(o.r, V.mul(axis, PORT_ARM_STN)), V.mul(nose, PORT_ARM));
  S.v = { x:o.v.x, y:o.v.y };
}

/** Come off the ring. Nothing is destroyed — the cost is propellant and time. */
function dockBounce(g, why) {
  S.dock.bounces++;
  S.v = V.add(S.v, V.mul(g.axis, g.closing * 1.5 / 1000));    // reflect at e = 0.5
  say(`NO CAPTURE — ${why}. Bounced off at ${(g.closing*0.5).toFixed(2)} m/s. Back off, re-centre and fly it again.`, 'err');
}

/** Resolve a contact: clean capture, crooked capture, or a bounce. */
function dockContact(g) {
  const dk = S.dock;
  dk.attempts++;
  const al = Math.abs(g.align), off = Math.abs(g.lateral), lr = Math.abs(g.latRate);
  const why = g.closing > DOCK_ENV.closeMax ? `closing ${g.closing.toFixed(2)} m/s, limit ${DOCK_ENV.closeMax.toFixed(2)}`
    : lr  > DOCK_ENV.rateMax  ? `lateral rate ${lr.toFixed(3)} m/s, limit ${DOCK_ENV.rateMax.toFixed(2)}`
    : off > DOCK_ENV.latMax   ? `${off.toFixed(2)} m off centre, limit ${DOCK_ENV.latMax.toFixed(2)} m`
    : al  > DOCK_ENV.alignMax ? `${al.toFixed(1)}° off axis, limit ${DOCK_ENV.alignMax.toFixed(0)}°`
    : null;
  if (why) return dockBounce(g, why);

  dk.phase = 'SOFT';
  dk.sign = g.align >= 0 ? 1 : -1;
  dk.misalign = dk.misalign0 = al;
  dk.offset = off;
  dk.ring = 0; dk.latches = 0; dk.latching = false; dk.auto = false;
  S.att.mode = 'FREE';
  mateToPort();
  const clean = al <= DOCK_ENV.alignClean && off <= DOCK_ENV.latClean
             && g.closing <= DOCK_ENV.closeClean && lr <= DOCK_ENV.rateClean;
  if (clean) say(`SOFT CAPTURE · clean · ${g.closing.toFixed(2)} m/s, ${off.toFixed(2)} m off centre, ${al.toFixed(1)}° off axis. Retract the ring.`, 'ok');
  else say(`SOFT CAPTURE · CROOKED · ${al.toFixed(1)}° off axis, ${off.toFixed(2)} m off centre. The latches will not close on that — retract the ring to pull it straight.`, 'warn');
  checkObjectives();
}

/* ---- the vestibule seal -------------------------------------------------
   A vestibule that leaks is one that seated badly, so the seal is decided when
   the LATCHES CLOSE, not when the check is run — re-running a check on a bad
   seal fails again, and the only fix is to re-seat the interface. A crooked
   capture seats badly far more often, which is what ties the quality of the
   approach to the work that follows it.

   Stated failure rate: 1 in 6 after a clean capture, rising to 1 in 2 at the
   10° alignment limit. A failed seal loses 0.30-1.20 kPa/min against a 0.20 kPa
   limit over the hold, so it is visible in the Δ within about fifteen seconds —
   the reading is there to be read, and an attentive crew re-seats early rather
   than waiting out the full minute. */
const LEAK_HOLD = 60;        // s — the hold
const LEAK_LIMIT = 0.20;     // kPa lost over the hold before the seal is rejected
function rollSeal(misalignAtCapture) {
  const risk = Math.min(0.5, 1/6 + (misalignAtCapture || 0) * 0.033);
  return Math.random() < risk ? 0.30 + Math.random() * 0.90     // kPa/min — will fail
                              : 0.005 + Math.random() * 0.10;   // kPa/min — will pass
}

/** Air, power, ECLSS and propellant are all connected. */
const utilitiesDone = () => {
  const d = S.dock;
  return d.phase === 'HARD' && d.vest.hatch && d.pwr.tie && d.air.fan && d.prop.done;
};

/** One integration step of everything docking: contact, the ring, the latches
 *  and the utility procedures. Runs after the world has moved. */
function stepDock(dt) {
  const dk = S.dock;

  if (dk.phase === 'FREE') {
    const g = dockGeom();
    if (!g) { dk.leg = null; return; }
    // The approach leg is carried in state whether or not the autopilot is
    // flying, so a hand-flown approach gets the same call on the DOCK page.
    if (g.ctrRange < 500) dk.leg = dockLeg(g, dk.leg); else dk.leg = null;
    if (g.axial > 0.5) dk.passed = false;
    // Only judge a contact when the vehicle has actually gone by the port.
    // Without the range guard, a rendezvous that arrives ahead of the station
    // crosses the port PLANE tens of kilometres out and is told it flew past.
    if (g.axial <= 0 && g.closing > 0 && !dk.passed && g.ctrRange < 20) {
      if (Math.abs(g.lateral) > DOCK_ENV.structure) {
        dk.passed = true;
        say(`PAST THE PORT — ${Math.abs(g.lateral).toFixed(2)} m wide of the ring, no contact. Back off along the axis and re-centre.`, 'warn');
      } else dockContact(g);
    }
    return;
  }

  // Mated. The interface carries the vehicle; place it on the station.
  mateToPort();

  if (dk.phase === 'RETRACT') {
    // A crooked interface takes longer to pull straight — that is the cost of
    // a sloppy capture, and it is paid in time, not in wreckage.
    dk.ring = Math.min(1, dk.ring + dt / (20 + dk.misalign0 * 6));
    dk.misalign = dk.misalign0 * (1 - dk.ring);
    if (dk.ring >= 1) {
      dk.misalign = 0; dk.phase = 'RETRACTED';
      say('RING RETRACTED · interface aligned 0.0°, hard-dock ready. Close the latches.', 'ok');
    }
  } else if (dk.phase === 'LATCHING') {
    dk.latches = Math.min(12, dk.latches + dt * 0.5);
    if (dk.latches >= 12) {
      dk.latches = 12; dk.latching = false; dk.phase = 'HARD';
      // How well it seated is settled here, and the crew find out at the leak check.
      dk.vest.leak = rollSeal(dk.misalign0);
      say('HARD DOCK · 12 of 12 structural latches closed. The vestibule is sealed but empty — equalise it before opening a hatch.', 'ok');
      checkObjectives();
    }
  }

  if (dk.phase !== 'HARD') return;

  const ve = dk.vest;
  if (ve.valve && ve.press < 101.3) ve.press = Math.min(101.3, ve.press + 101.3 * dt / 90);
  // The seal always leaks a little; a bad one leaks a lot. With the valve open
  // the supply outruns it either way, which is why it only shows on the hold.
  if (!ve.valve && !ve.hatch && ve.press > 0) {
    const lost = Math.min(ve.press, ve.leak * dt / 60);
    ve.press -= lost;
    if (ve.check >= 0 && !ve.verdict) ve.decay += lost;
  }
  if (ve.check >= 0 && !ve.verdict) {
    if (ve.valve) { ve.check = -1; ve.decay = 0; say('LEAK CHECK ABORTED — the equalisation valve reopened.', 'warn'); }
    else {
      ve.check += dt;
      if (ve.check >= LEAK_HOLD) {
        ve.check = LEAK_HOLD;
        if (ve.decay <= LEAK_LIMIT) {
          ve.verdict = 'PASS'; ve.leakOk = true;
          say(`LEAK CHECK PASSED · ${ve.decay.toFixed(2)} kPa lost in ${LEAK_HOLD} s, limit ${LEAK_LIMIT.toFixed(2)}. The hatch may be opened.`, 'ok');
        } else {
          ve.verdict = 'FAIL';
          say(`LEAK CHECK FAILED · ${ve.decay.toFixed(2)} kPa lost in ${LEAK_HOLD} s, limit ${LEAK_LIMIT.toFixed(2)}. That seal did not seat — RE-SEAT the interface and run it again. Re-running the check on the same seal will fail again.`, 'err');
        }
      }
    }
  }
  const pr = dk.prop;
  if (pr.line && !pr.purged) {
    pr.purge = Math.min(30, pr.purge + dt);
    if (pr.purge >= 30) { pr.purged = true; say('TRANSFER LINE PURGED · ready to flow.', 'ok'); }
  }
  if (pr.xfer) {
    if (!dk.pwr.tie) { pr.xfer = false; say('TRANSFER STOPPED — the pumps lost the station bus.', 'warn'); }
    else {
      // A station with a DEPOT has a finite quantity aboard and taking it all
      // leaves nothing behind. A station without one is a bottomless tap, which
      // is what every mission before this assumed and still gets.
      const rate = S.depot && S.depot.rate ? S.depot.rate : 0.5;      // kg/s
      let q = rate * dt;
      if (S.depot) q = Math.min(q, S.depot.prop);
      const had = q;
      const mainRoom = Math.max(0, S.craft.fuelMax - S.craft.fuel);
      const take = Math.min(q, mainRoom); S.craft.fuel += take; q -= take;
      const rcsRoom = Math.max(0, S.craft.rcsMax - S.craft.rcs);
      const take2 = Math.min(q, rcsRoom); S.craft.rcs += take2; q -= take2;
      pr.moved += take + take2;
      if (S.depot) S.depot.prop = Math.max(0, S.depot.prop - (take + take2));
      if (S.depot && S.depot.prop <= 1e-9 && q <= 0) {
        pr.xfer = false; pr.done = true;
        say(`DEPOT DRY · ${pr.moved.toFixed(0)} kg aboard and ${S.depot.name || 'the depot'} has nothing left to give. `
          + `${S.craft.fuel.toFixed(0)} of ${S.craft.fuelMax.toFixed(0)} kg in the main tank. `
          + `Whatever you fly from here, you fly on that.`, 'warn');
      }
      else if (q > 0 && had > 0) { pr.xfer = false; pr.done = true; say(`TRANSFER COMPLETE · ${pr.moved.toFixed(1)} kg aboard, tanks full.`, 'ok'); }
    }
  }
  stepCargo(dt);
  if (utilitiesDone()) checkObjectives();
}

/* ---- cargo across the hatch --------------------------------------------
   The same shape as the propellant transfer that is already here: one
   precondition, one rate, one number to watch, one way to stop. The
   difference is that this one moves the vehicle's MASS, so the ΔV remaining
   on the FUEL page falls while you unload and the next burn costs
   differently. That is the whole point of it.                             */
const CARGO_RATE = 4;          // kg/s through the hatchway
function stepCargo(dt) {
  const ck = S.dock.cargo, mf = S.manifest;
  if (!ck.moving) return;
  if (!S.dock.vest.hatch) {
    ck.moving = null;
    return say('CARGO TRANSFER STOPPED — the hatch closed.', 'warn');
  }
  let q = CARGO_RATE * dt;
  if (ck.moving === 'OUT') {
    const left = Math.max(0, (mf ? mf.deliver : S.craft.cargo) - ck.out);
    const take = Math.min(q, left, S.craft.cargo);
    S.craft.cargo -= take; ck.out += take;
    if (take < q - 1e-9) {
      ck.moving = null;
      say(`DELIVERY COMPLETE · ${ck.out.toFixed(0)} kg off the vehicle. `
        + `${craftMass().toFixed(0)} kg all up now, ${fmtDV(dvRemaining())} in the tanks.`, 'ok');
      cargoCheckDone();
    }
  } else {
    const left = Math.max(0, (mf ? mf.collect : 0) - ck.in);
    const room = Math.max(0, (S.craft.cargoMax || 0) - S.craft.cargo);
    const take = Math.min(q, left, room);
    S.craft.cargo += take; ck.in += take;
    if (take < q - 1e-9) {
      ck.moving = null;
      if (room <= 1e-9 && left > 1e-9)
        say(`HOLD FULL · ${ck.in.toFixed(0)} kg aboard and no room for the rest.`, 'warn');
      else say(`RETURN LOAD ABOARD · ${ck.in.toFixed(0)} kg. `
        + `${craftMass().toFixed(0)} kg all up, ${fmtDV(dvRemaining())} left. Every burn home costs more now.`, 'ok');
      cargoCheckDone();
    }
  }
}
function cargoCheckDone() {
  const ck = S.dock.cargo, mf = S.manifest;
  if (!mf) return;
  if (ck.out >= mf.deliver - 1e-6 && ck.in >= mf.collect - 1e-6) {
    ck.done = true;
    say('MANIFEST COMPLETE · delivery off, return load aboard.', 'ok');
  }
  checkObjectives();
}

/* ---- approach guidance --------------------------------------------------
   Exposed as a plain function of the relative state so the same law can fly
   the vehicle (AUTO DOCK) and be driven step by step by a test. It returns
   the commands it would issue; it changes nothing itself.                  */
const DOCK_HOLD = 35;      // m — the hold point on the axis, where the approach starts
const DOCK_STAND = 40;     // m — how far to the side to sit while repositioning
const LEGNAME = { CLEAR:'MOVE CLEAR', BEHIND:'GO ASTERN', CENTRE:'CENTRE UP',
                  CLOSING:'CLOSE IN', CORRIDOR:'IN THE CORRIDOR', CONTACT:'FINAL' };

/** Is the vehicle on the corridor well enough to just fly it in?
 *  The hold point matters for ACQUIRING the axis, not for being on it: a
 *  vehicle already centred ten metres out is in the corridor, not out of it. */
const onCorridor = (g) => g.axial > 1 && Math.abs(g.lateral) <= Math.max(6, g.axial * 0.25);

/** Which leg of the approach applies, given the leg already being flown.
 *
 *  The sequence latches. Deciding afresh every step chatters: a leg's exit
 *  test and the next leg's target disagree by a metre or two, orbital drift
 *  carries the vehicle back across the boundary, and the controller flips
 *  between a 0.8 m/s command and a 0 m/s command until the tanks are dry.
 *  Once a leg is entered it is flown until its own target is reached. */
